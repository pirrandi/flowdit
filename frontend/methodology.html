<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Methodologies</title>
<link rel="stylesheet" href="css/main.css?v=9">
<link rel="stylesheet" href="css/transitions.css?v=3">
<link rel="expect" href="#fd-document-end" blocking="render">
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js?v=3"></script>
</head>
<body>

<div id="loading-overlay" class="ovl-shell"><div class="skel-wrap"><div class="skel-stats"><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div></div><div class="skel-block skel-tall"></div><div class="skel-block skel-tall"></div></div></div>
<nav class="sidenav" id="sidenav"></nav>
<header class="topbar" id="topbar"></header>

<div class="workarea">
  <main class="main" style="padding:0;display:flex;overflow:hidden">
    <!-- Left: methodology library -->
    <div class="method-library">
      <div class="method-library-header">
        <span style="font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--t3)">Library</span>
        <button class="btn btn-prim" style="padding:3px 9px;font-size:10px" onclick="openCreateMethodModal()">+ New</button>
      </div>
      <div id="method-list"></div>
    </div>

    <!-- Right: runner -->
    <div style="flex:1;overflow-y:auto;padding:22px 28px 80px">
      <div class="page-header" style="padding-bottom:0;border-bottom:none">
        <div>
          <div class="page-title">Methodologies</div>
          <div class="page-subtitle">// custom checklists · reusable across projects</div>
        </div>
      </div>
      <div id="method-runner" style="padding:0 0 32px">
        <div class="empty-state" style="padding:48px 0">
          <div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fd-icon"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12" /><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /></svg></div>
          <div class="empty-title">Select a methodology</div>
          <div class="empty-sub">Choose from your library on the left or create a new one</div>
        </div>
      </div>
    </div>
  </main>

  <aside class="activity-col">
    <div class="activity-header">
      <span class="activity-title">Activity</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="live-badge"></div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--t3)">live</span>
      </div>
    </div>
    <div class="activity-list" id="activity-list"><div class="activity-empty">No activity yet</div></div>
  </aside>
</div>

<!-- Create/Edit Methodology Modal -->
<div class="modal-overlay" id="method-modal">
  <div class="modal" style="max-width:640px;max-height:85vh;display:flex;flex-direction:column">
    <div class="modal-title" id="method-modal-title">New Methodology</div>

    <div style="overflow-y:auto;flex:1;padding-right:4px">
      <div class="form-group">
        <label class="form-label">Name *</label>
        <input type="text" class="form-input" id="modal-method-name" placeholder="e.g. API Security Review, Mobile Pentest...">
      </div>
      <div class="form-group">
        <label class="form-label">Description <span style="color:var(--t3);font-weight:400">(optional)</span></label>
        <textarea class="form-input note-textarea" id="modal-method-desc" placeholder="When to use this methodology, scope..."></textarea>
      </div>
      <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer;font-size:12px;color:var(--t2)">
        <input type="checkbox" id="modal-method-shared">
        Share with team <span style="color:var(--t3);font-weight:400">(visible to all project members)</span>
      </label>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div class="form-label" style="margin:0">Tests</div>
        <button class="btn-add-row" style="font-size:11px" onclick="addMethodTestRow()">+ Add test</button>
      </div>
      <div id="method-tests-editor" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>

    <div class="form-error" id="method-modal-error"></div>
    <div class="modal-footer" style="margin-top:12px">
      <button class="btn-secondary" onclick="closeMethodModal()">Cancel</button>
      <button class="btn-save" id="method-modal-save" onclick="saveMethodology()">Save</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/config.js?v=3"></script>
<script src="js/data.js?v=3"></script>
<script src="js/services/state.js?v=3"></script>
<script src="js/services/api.js?v=4"></script>
<script src="js/services/ws.js?v=3"></script>
<script src="js/services/icons.js?v=3"></script>
<script src="js/services/utils.js?v=4"></script>
<script src="js/components/csel.js?v=3"></script>
<script src="js/components/activity.js?v=3"></script>
<script src="js/views/methodology.js?v=3"></script>
<script src="js/components/notifications.js?v=4"></script>
<script src="js/page.js?v=5"></script>
<script>
function pageInit() {
  renderMethodologyList();
}
bootPage('methodology');
</script>
<!-- End-of-document marker for <link rel="expect" blocking="render"> (see css/transitions.css). -->
<div id="fd-document-end" hidden></div>
</body>
</html>
