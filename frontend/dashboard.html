<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowdit — Dashboard</title>
<link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js"></script>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh">

<div id="loading-overlay"><div class="spinner"></div><div class="spinner-text">// loading...</div></div>
<div class="sidenav" id="sidenav"></div>
<div class="app-main">
<div class="topbar slim" id="topbar"></div>

<div style="display:flex;flex:1;overflow:hidden;min-height:0">

  <div class="main-content">
    <div class="page-header">
      <div style="flex:1">
        <div class="page-title">Dashboard</div>
        <div class="page-subtitle" id="dash-subtitle">// overview</div>
      </div>
      <div class="page-actions">
        <button class="btn-secondary" onclick="window.location.href='projects.html'" style="padding:5px 12px;font-size:12px">← Projects</button>
        <button class="btn-accent" onclick="openNewProjectModal()" style="padding:5px 12px;font-size:12px">+ New Project</button>
      </div>
    </div>

    <div id="dash-main" style="padding-bottom:32px"></div>
  </div>

  <div class="activity-panel">
    <div class="activity-header">
      <span class="activity-title">Activity</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="live-badge"></div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">live</span>
      </div>
    </div>
    <div class="activity-list" id="activity-list"><div class="activity-empty">No activity yet</div></div>
  </div>
</div>

<!-- New Project Modal -->
<div class="modal-overlay" id="project-modal">
  <div class="modal">
    <div class="modal-title">New Project</div>
    <div class="form-group"><label class="form-label">Project Name</label><input type="text" class="form-input" id="proj-name" placeholder="Client Corp — Q3 Pentest"></div>
    <div class="form-group"><label class="form-label">Target / Scope</label><input type="text" class="form-input" id="proj-target" placeholder="https://target.com"></div>
    <div class="form-group"><label class="form-label">Description</label><textarea class="form-input note-textarea" id="proj-desc" placeholder="Scope, objectives..."></textarea></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="document.getElementById('project-modal').classList.remove('open')">Cancel</button>
      <button class="btn-save" id="proj-save-btn" onclick="saveProject()">Create</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/services/state.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/ws.js"></script>
<script src="js/services/utils.js"></script>
<script src="js/components/activity.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/page.js"></script>
<script>
  function pageInit() {
    if (state.currentProject) {
      document.getElementById('dash-subtitle').textContent = `// ${state.currentProject.name}`;
    }
    updateDashboard();
  }

  bootPage('dashboard');
</script>
</div>
</body>
</html>
