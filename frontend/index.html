<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowdit — Login</title>
<link rel="stylesheet" href="css/main.css">
<script>window.FLOWDIT_API='http://localhost:4000/api'; window.FLOWDIT_WS='ws://localhost:4000/ws';</script>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="spinner-text">// initializing...</div>
</div>

<div id="login-screen" style="display:none;min-height:100vh;align-items:center;justify-content:center;position:relative;overflow:hidden">
  <div class="login-bg-grid"></div>
  <div class="login-glow"></div>
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🎯</div>
      <span class="logo-text">Flowdit</span>
    </div>
    <div class="login-tagline">// collaborative pentest tracker</div>
    <div class="tab-row">
      <button class="tab-btn active" onclick="switchAuthTab('login',this)">Login</button>
      <button class="tab-btn"        onclick="switchAuthTab('register',this)">Register</button>
    </div>
    <div id="login-form">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" class="form-input" id="login-user" placeholder="h4ck3r" autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="login-pass" placeholder="••••••••"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="form-error" id="login-error"></div>
      <button class="btn-primary" id="login-btn" onclick="doLogin()">Access Terminal</button>
    </div>
    <div id="register-form" style="display:none">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-input" id="reg-user" placeholder="your_handle">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="reg-email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="reg-pass" placeholder="min. 8 chars">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-input" id="reg-pass2" placeholder="••••••••"
          onkeydown="if(event.key==='Enter')doRegister()">
      </div>
      <div class="form-error" id="reg-error"></div>
      <button class="btn-primary" id="reg-btn" onclick="doRegister()">Create Account</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="js/services/state.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/utils.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
