<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowdit — Login</title>
<link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js"></script>
</head>
<body>

<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="spinner-text">// initializing...</div>
</div>

<div id="login-screen" style="display:none;min-height:100vh;align-items:center;justify-content:center;overflow:hidden">
  <div class="login-bg-grid"></div>
  <div class="login-glow"></div>
  <div class="login-card">
    <div class="login-logo">
      <img src="img/flowdit-logo.png" class="login-logo-img" alt="Flowdit">
      <span class="logo-text">Flowdit</span>
    </div>
    <div class="login-tagline">// collaborative pentest tracker</div>
    <div class="tab-row">
      <button class="tab-btn active" onclick="switchAuthTab('login',this)">Login</button>
      <button class="tab-btn"        onclick="switchAuthTab('register',this)">Register</button>
    </div>
    <div id="login-form">
      <div class="form-group">
        <label class="form-label">Username or Email</label>
        <input type="text" class="form-input" id="login-user" placeholder="h4ck3r" autocomplete="username"
          oninput="onLoginIdentifierChange()" onblur="checkSsoForIdentifier()">
      </div>
      <div id="login-sso-cta" style="display:none;margin-bottom:14px">
        <button class="btn-primary" id="login-sso-btn" onclick="continueWithSso()"></button>
      </div>
      <div id="login-pass-group" class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="login-pass" placeholder="••••••••"
          onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <div class="form-error" id="login-error"></div>
      <button class="btn-primary" id="login-btn" onclick="doLogin()">Access Terminal</button>
    </div>
    <div id="register-form" style="display:none">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" class="form-input" id="reg-user" placeholder="your_handle">
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" class="form-input" id="reg-email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" id="reg-pass" placeholder="min. 8 chars">
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-input" id="reg-pass2" placeholder="••••••••"
          onkeydown="if(event.key==='Enter')doRegister()">
      </div>
      <div class="form-error" id="reg-error"></div>
      <button class="btn-primary" id="reg-btn" onclick="doRegister()">Create Account</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>
<script src="js/services/state.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/icons.js"></script>
<script src="js/services/utils.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
