<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team</title>
<link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js"></script>
</head>
<body>

<div id="loading-overlay" class="ovl-shell"><div class="skel-wrap"><div class="skel-stats"><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div></div><div class="skel-block skel-tall"></div><div class="skel-block skel-tall"></div></div></div>
<nav class="sidenav" id="sidenav"></nav>
<header class="topbar" id="topbar"></header>

<div class="workarea">
  <main class="main">
    <div id="view-members"></div>
  </main>

  <aside class="activity-col">
    <div class="activity-header">
      <span class="activity-title">Activity</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="live-badge"></div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--t3)">live</span>
      </div>
    </div>
    <div class="activity-list" id="activity-list"><div class="activity-empty">No activity yet</div></div>
  </aside>
</div>

<!-- Generate Invite Modal -->
<div class="modal-overlay" id="invite-modal">
  <div class="modal" style="max-width:440px">
    <div class="modal-title">Generate Invite Code</div>
    <div class="form-group">
      <label class="form-label">Role</label>
      <div style="display:flex;gap:8px" id="invite-role-btns">
        <button class="invite-role-btn active" data-role="editor" onclick="selectInviteRole('editor')">Editor</button>
        <button class="invite-role-btn" data-role="pentester" onclick="selectInviteRole('pentester')">Pentester</button>
        <button class="invite-role-btn" data-role="viewer" onclick="selectInviteRole('viewer')">Viewer</button>
      </div>
      <div style="font-family:var(--mono);font-size:10px;color:var(--t3);margin-top:6px" id="invite-role-hint">
        Can create findings, update methodology and manage the project.
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Label <span style="color:var(--t3);font-weight:400">(optional)</span></label>
      <input type="text" class="form-input" id="invite-label" placeholder="e.g. Alice, External Auditor…">
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="document.getElementById('invite-modal').classList.remove('open')">Cancel</button>
      <button class="btn-save" id="invite-save-btn" onclick="submitCreateInvite()">Generate & Copy</button>
    </div>
  </div>
</div>

<!-- New Project Modal -->
<div class="modal-overlay" id="project-modal">
  <div class="modal">
    <div class="modal-title">New Project</div>
    <div class="form-group"><label class="form-label">Project Name</label><input type="text" class="form-input" id="proj-name" placeholder="Client Corp — Q3 Pentest"></div>
    <div class="form-group"><label class="form-label">Target / Scope</label><input type="text" class="form-input" id="proj-target" placeholder="https://target.com"></div>
    <div class="form-group"><label class="form-label">Description</label><textarea class="form-input note-textarea" id="proj-desc" placeholder="Scope, objectives..."></textarea></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="document.getElementById('project-modal').classList.remove('open')">Cancel</button>
      <button class="btn-save" id="proj-save-btn" onclick="saveProject()">Create</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/services/state.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/ws.js"></script>
<script src="js/services/icons.js"></script>
<script src="js/services/utils.js"></script>
<script src="js/components/activity.js"></script>
<script src="js/views/members.js"></script>
<script src="js/page.js"></script>
<script>
  function pageInit() {
    renderMembers();
  }

  document.getElementById('invite-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
  });

  bootPage('members');
</script>
</body>
</html>
