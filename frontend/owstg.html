<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OWASP WSTG</title>
<link rel="stylesheet" href="css/main.css?v=9">
<link rel="stylesheet" href="css/transitions.css?v=3">
<link rel="expect" href="#fd-document-end" blocking="render">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js?v=3"></script>
</head>
<body>

<div id="loading-overlay" class="ovl-shell"><div class="skel-wrap"><div class="skel-stats"><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div></div><div class="skel-block skel-tall"></div><div class="skel-block skel-tall"></div></div></div>
<nav class="sidenav" id="sidenav"></nav>
<header class="topbar" id="topbar"></header>

<div class="workarea">
  <main class="main" style="padding:0;display:flex;overflow:hidden">
    <div class="sidebar" id="sidebar" style="width:220px;flex-shrink:0;border-right:1px solid var(--b1);overflow-y:auto;background:var(--bg1)"></div>
    <div style="flex:1;overflow-y:auto;padding:22px 28px 80px">
      <div class="page-header">
        <div>
          <div class="page-title">OWASP WSTG</div>
          <div class="page-subtitle">// 109 tests · 12 categories</div>
        </div>
      </div>
      <div class="filter-row" id="wstg-filters">
        <button class="filter-chip active" onclick="filterWSTG('all',this)">All</button>
        <button class="filter-chip" onclick="filterWSTG('pending',this)">Pending</button>
        <button class="filter-chip" onclick="filterWSTG('completed',this)">Completed</button>
        <button class="filter-chip" onclick="filterWSTG('failed',this)">Vuln Found</button>
        <button class="filter-chip" onclick="filterWSTG('na',this)">N/A</button>
      </div>
      <div id="wstg-content"></div>
    </div>
  </main>

  <aside class="activity-col">
    <div class="activity-header">
      <span class="activity-title">Activity</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="live-badge"></div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--t3)">live</span>
      </div>
    </div>
    <div class="activity-list" id="activity-list"><div class="activity-empty">No activity yet</div></div>
  </aside>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js?v=3"></script>
<script src="js/services/state.js?v=3"></script>
<script src="js/services/api.js?v=4"></script>
<script src="js/services/ws.js?v=3"></script>
<script src="js/services/icons.js?v=3"></script>
<script src="js/services/utils.js?v=4"></script>
<script src="js/components/csel.js?v=3"></script>
<script src="js/components/activity.js?v=3"></script>
<script src="js/views/wstg.js?v=3"></script>
<script src="js/components/notifications.js?v=4"></script>
<script src="js/page.js?v=5"></script>
<script>
  function pageInit() {
    // Sidebar: WSTG categories
    let html = '<div class="nav-group-label">Categories</div>';
    WSTG_DATA.forEach(cat => {
      const t = cat.tests.length;
      const reviewed = cat.tests.filter(test => !!state.wstgProgress[test.id]?.status).length;
      const p = t ? Math.round(reviewed/t*100) : 0;
      html += `<div class="nav-item" onclick="scrollToCat('${cat.id}')">
        <span class="nav-item-label">${esc(cat.name)}</span>
        <span class="nav-item-count">${reviewed}/${t}</span>
      </div>`;
    });
    document.getElementById('sidebar').innerHTML = html;
    renderWSTG();

    // Update topbar progress
    let reviewed=0, total=0;
    WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
      total++;
      if (state.wstgProgress[t.id]?.status) reviewed++;
    }));
    updateTopbarProgress(reviewed, total);
  }

  bootPage('wstg');
</script>
<!-- End-of-document marker for <link rel="expect" blocking="render"> (see css/transitions.css). -->
<div id="fd-document-end" hidden></div>
</body>
</html>
