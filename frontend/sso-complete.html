<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing in...</title>
<link rel="stylesheet" href="css/main.css?v=9">
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<script src="js/config.js?v=3"></script>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div><div class="spinner-text">// completing sign-in...</div></div>

<script src="js/services/state.js?v=3"></script>
<script src="js/services/api.js?v=4"></script>
<script>
(async () => {
  const code = new URLSearchParams(window.location.search).get('xchg');
  if (!code) { window.location.href = '/?ssoError=' + encodeURIComponent('Missing sign-in code'); return; }
  try {
    const data = await api.auth.sso.exchange(code);
    api.auth.setTokens(data.accessToken, data.refreshToken);
    localStorage.setItem('fd_user', JSON.stringify(data.user));
    window.location.href = 'projects';
  } catch (e) {
    window.location.href = '/?ssoError=' + encodeURIComponent(e.message || 'Sign-in failed');
  }
})();
</script>
</body>
</html>
