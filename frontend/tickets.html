<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowdit — Client Queries</title>
<link rel="stylesheet" href="css/main.css">
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js"></script>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh">

<div id="loading-overlay"><div class="spinner"></div><div class="spinner-text">// loading...</div></div>
<div class="sidenav" id="sidenav"></div>
<div class="app-main">
<div class="topbar slim" id="topbar"></div>

<div style="display:flex;flex:1;overflow:hidden;min-height:0">
  <div class="main-content">
    <div class="page-header">
      <div style="flex:1">
        <div class="page-title">Client Queries</div>
        <div class="page-subtitle" id="tickets-subtitle">// client questions and follow-ups</div>
      </div>
      <div class="page-actions" id="tickets-filters"></div>
    </div>
    <div id="tickets-main" style="padding-bottom:32px"></div>
  </div>

  <div class="activity-panel">
    <div class="activity-header">
      <span class="activity-title">Activity</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="live-badge"></div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">live</span>
      </div>
    </div>
    <div class="activity-list" id="activity-list"><div class="activity-empty">No activity yet</div></div>
  </div>
</div>
</div>

<!-- Ticket Detail Modal -->
<div class="modal-overlay" id="ticket-modal">
  <div class="modal" style="max-width:580px;width:100%;display:flex;flex-direction:column;max-height:80vh">
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;flex-shrink:0">
      <div style="flex:1;min-width:0">
        <div class="modal-title" id="ticket-modal-title" style="margin:0 0 6px"></div>
        <div id="ticket-modal-meta" style="font-family:var(--mono);font-size:10px;color:var(--text3)"></div>
      </div>
      <div id="ticket-modal-status-btns" style="display:flex;gap:6px;flex-shrink:0;align-items:center"></div>
      <button class="btn-icon" onclick="closeTicketModal()" style="font-size:16px;flex-shrink:0">✕</button>
    </div>
    <div id="ticket-modal-desc" style="font-size:13px;color:var(--text2);margin-bottom:14px;white-space:pre-wrap;line-height:1.6;flex-shrink:0"></div>
    <div id="ticket-modal-thread" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:14px;padding-right:4px;min-height:0"></div>
    <div style="display:flex;gap:8px;flex-shrink:0;border-top:1px solid var(--border);padding-top:12px">
      <textarea id="ticket-reply-input" class="form-input note-textarea" placeholder="Write a reply... (Ctrl+Enter to send)" style="flex:1;min-height:60px;resize:none"
        onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey))submitTicketReply()"></textarea>
      <button class="btn-save" onclick="submitTicketReply()" style="align-self:flex-end;padding:8px 16px">Send</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/services/state.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/ws.js"></script>
<script src="js/services/utils.js"></script>
<script src="js/components/activity.js"></script>
<script src="js/views/tickets.js"></script>
<script src="js/page.js"></script>
<script>
  function pageInit() { renderTickets(); }
  bootPage('tickets');
</script>
</div>
</body>
</html>
