<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Queries</title>
<link rel="stylesheet" href="css/main.css">
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js"></script>
</head>
<body>

<div id="loading-overlay" class="ovl-shell"><div class="skel-wrap"><div class="skel-stats"><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div></div><div class="skel-block skel-tall"></div><div class="skel-block skel-tall"></div></div></div>
<nav class="sidenav" id="sidenav"></nav>
<header class="topbar" id="topbar"></header>

<div class="workarea">
  <main class="main">
    <div class="page-header">
      <div style="flex:1">
        <div class="page-title">Client Queries</div>
        <div class="page-subtitle" id="tickets-subtitle">// client questions and follow-ups</div>
      </div>
      <div class="page-actions" id="tickets-filters"></div>
    </div>
    <div id="tickets-main" style="padding-bottom:32px"></div>
  </main>

  <aside class="activity-col">
    <div class="activity-header">
      <span class="activity-title">Activity</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="live-badge"></div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--t3)">live</span>
      </div>
    </div>
    <div class="activity-list" id="activity-list"><div class="activity-empty">No activity yet</div></div>
  </aside>
</div>

<!-- Ticket Detail Modal -->
<div class="modal-overlay" id="ticket-modal">
  <div class="modal" style="max-width:580px;width:100%;display:flex;flex-direction:column;max-height:80vh">
    <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;flex-shrink:0">
      <div style="flex:1;min-width:0">
        <div class="modal-title" id="ticket-modal-title" style="margin:0 0 6px"></div>
        <div id="ticket-modal-meta" style="font-family:var(--mono);font-size:10px;color:var(--t3)"></div>
      </div>
      <div id="ticket-modal-status-btns" style="display:flex;gap:6px;flex-shrink:0;align-items:center"></div>
      <button class="btn-icon" onclick="closeTicketModal()" style="flex-shrink:0"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fd-icon"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg></button>
    </div>
    <div id="ticket-modal-desc" style="font-size:13px;color:var(--t2);margin-bottom:14px;white-space:pre-wrap;line-height:1.6;flex-shrink:0"></div>
    <div id="ticket-modal-thread" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:14px;padding-right:4px;min-height:0"></div>
    <div id="ticket-reply-readonly" style="display:none;flex-shrink:0;border-top:1px solid var(--b1);padding-top:12px;font-family:var(--mono);font-size:11px;color:var(--t3)">
      Solo lectura — responder al cliente corresponde al Owner o a un Editor.
    </div>
    <div id="ticket-reply-box" style="display:flex;gap:8px;flex-shrink:0;border-top:1px solid var(--b1);padding-top:12px">
      <textarea id="ticket-reply-input" class="form-input note-textarea" placeholder="Write a reply... (Ctrl+Enter to send)" style="flex:1;min-height:60px;resize:none"
        onkeydown="if(event.key==='Enter'&&(event.ctrlKey||event.metaKey))submitTicketReply()"></textarea>
      <button class="btn-save" onclick="submitTicketReply()" style="align-self:flex-end;padding:8px 16px">Send</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/services/state.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/ws.js"></script>
<script src="js/services/icons.js"></script>
<script src="js/services/utils.js"></script>
<script src="js/components/activity.js"></script>
<script src="js/views/tickets.js"></script>
<script src="js/page.js"></script>
<script>
  function pageInit() { renderTickets(); }
  bootPage('tickets');
</script>
</body>
</html>
