<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowdit — PortSwigger</title>
<link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js"></script>
</head>
<body>

<div id="loading-overlay" class="ovl-shell"><div class="skel-wrap"><div class="skel-stats"><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div></div><div class="skel-block skel-tall"></div><div class="skel-block skel-tall"></div></div></div>
<nav class="sidenav" id="sidenav"></nav>
<header class="topbar" id="topbar"></header>

<div class="workarea">
  <main class="main" style="padding:0;display:flex;overflow:hidden">
    <div class="sidebar" id="sidebar" style="width:220px;flex-shrink:0;border-right:1px solid var(--b1);overflow-y:auto;background:var(--bg1)"></div>

    <div style="flex:1;overflow-y:auto;padding:22px 28px 80px">
      <div class="page-header">
        <div style="flex:1">
          <div class="page-title">PortSwigger Academy</div>
          <div class="page-subtitle" id="ps-subtitle">// loading...</div>
          <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
            <div style="flex:1;height:4px;background:var(--b1);overflow:hidden">
              <div id="ps-progress-bar" style="height:100%;background:var(--c-info);transition:width .4s ease;width:0%"></div>
            </div>
            <span id="ps-progress-pct" style="font-family:var(--mono);font-size:12px;font-weight:700;color:var(--c-info);min-width:36px;text-align:right">0%</span>
            <span id="ps-progress-count" style="font-family:var(--mono);font-size:11px;color:var(--t3)">0 / 250</span>
          </div>
        </div>
      </div>
      <div class="filter-row" id="ps-filters">
        <button class="filter-chip active" onclick="filterPS('all',this)">All</button>
        <button class="filter-chip diff-Apprentice"   onclick="filterPS('Apprentice',this)">Apprentice</button>
        <button class="filter-chip diff-Practitioner" onclick="filterPS('Practitioner',this)">Practitioner</button>
        <button class="filter-chip diff-Expert"       onclick="filterPS('Expert',this)">Expert</button>
        <button class="filter-chip" onclick="filterPS('done',this)">Done</button>
        <button class="filter-chip" onclick="filterPS('pending',this)">Pending</button>
      </div>
      <div id="ps-content"></div>
    </div>
  </main>

  <aside class="activity-col">
    <div class="activity-header">
      <span class="activity-title">Activity</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="live-badge"></div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--t3)">live</span>
      </div>
    </div>
    <div class="activity-list" id="activity-list"><div class="activity-empty">No activity yet</div></div>
  </aside>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/services/state.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/ws.js"></script>
<script src="js/services/icons.js"></script>
<script src="js/services/utils.js"></script>
<script src="js/components/activity.js"></script>
<script src="js/views/portswigger.js"></script>
<script src="js/page.js"></script>
<script>
  function updatePSProgress() {
    let done = 0, total = 0;
    PS_DATA.forEach(cat => cat.labs.forEach((_, i) => {
      total++;
      if (_psLabDone(`${cat.id}_${i}`)) done++;
    }));
    const pct = total ? Math.round(done / total * 100) : 0;
    const bar     = document.getElementById('ps-progress-bar');
    const pctEl   = document.getElementById('ps-progress-pct');
    const countEl = document.getElementById('ps-progress-count');
    if (bar)     bar.style.width     = `${pct}%`;
    if (pctEl)   pctEl.textContent   = `${pct}%`;
    if (countEl) countEl.textContent = `${done} / ${total}`;
  }

  function pageInit() {
    const totalLabs = PS_DATA.reduce((sum, cat) => sum + cat.labs.length, 0);
    const sub = document.getElementById('ps-subtitle');
    if (sub) sub.textContent = `// ${totalLabs} labs · ${PS_DATA.length} categories`;
    document.getElementById('ps-progress-count').textContent = `0 / ${totalLabs}`;
    let html = '<div class="nav-group-label">Categories</div>';
    PS_DATA.forEach(cat => {
      const t = cat.labs.length;
      const d = cat.labs.filter((_, i) => _psLabDone(`${cat.id}_${i}`)).length;
      html += `<div class="nav-item" onclick="scrollToPS('${cat.id}')">
        <span class="nav-item-label">${esc(cat.name)}</span>
        <span class="nav-item-count">${d}/${t}</span>
      </div>`;
    });
    document.getElementById('sidebar').innerHTML = html;
    renderPS();
    updatePSProgress();
    refreshTopbarProgress();
  }

  bootPage('portswigger');
</script>
</body>
</html>
