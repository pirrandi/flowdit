<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowdit — PortSwigger</title>
<link rel="stylesheet" href="css/main.css">
<script>window.FLOWDIT_API='http://localhost:4000/api'; window.FLOWDIT_WS='ws://localhost:4000/ws';</script>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh">

<div id="loading-overlay"><div class="spinner"></div><div class="spinner-text">// loading...</div></div>
<div class="topbar" id="topbar"></div>

<div style="display:flex;flex:1;overflow:hidden">
  <div class="sidebar" id="sidebar"></div>

  <div class="main-content">
    <div class="page-header">
      <div style="flex:1">
        <div class="page-title">PortSwigger Academy</div>
        <div class="page-subtitle">// 268 labs · 31 categories</div>
        <div style="margin-top:10px;display:flex;align-items:center;gap:10px">
          <div style="flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden">
            <div id="ps-progress-bar" style="height:100%;background:linear-gradient(90deg,var(--blue),#60a5fa);border-radius:3px;transition:width .4s ease;width:0%"></div>
          </div>
          <span id="ps-progress-pct" style="font-family:var(--mono);font-size:12px;font-weight:700;color:var(--blue);min-width:36px;text-align:right">0%</span>
          <span id="ps-progress-count" style="font-family:var(--mono);font-size:11px;color:var(--text3)">0 / 268</span>
        </div>
      </div>
    </div>
    <div class="filter-row" id="ps-filters">
      <button class="filter-chip active" onclick="filterPS('all',this)">All</button>
      <button class="filter-chip diff-Apprentice"   onclick="filterPS('Apprentice',this)">Apprentice</button>
      <button class="filter-chip diff-Practitioner" onclick="filterPS('Practitioner',this)">Practitioner</button>
      <button class="filter-chip diff-Expert"       onclick="filterPS('Expert',this)">Expert</button>
      <button class="filter-chip" onclick="filterPS('done',this)">Done</button>
      <button class="filter-chip" onclick="filterPS('pending',this)">Pending</button>
    </div>
    <div id="ps-content"></div>
  </div>

  <div class="activity-panel">
    <div class="activity-header">
      <span class="activity-title">Activity</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="live-badge"></div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">live</span>
      </div>
    </div>
    <div class="activity-list" id="activity-list"><div class="activity-empty">No activity yet</div></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/services/state.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/ws.js"></script>
<script src="js/services/utils.js"></script>
<script src="js/components/activity.js"></script>
<script src="js/views/portswigger.js"></script>
<script src="js/page.js"></script>
<script>
  function updatePSProgress() {
    let done = 0, total = 0;
    PS_DATA.forEach(cat => cat.labs.forEach((_, i) => {
      total++;
      if (_psLabDone(`${cat.id}_${i}`)) done++;
    }));
    const pct = total ? Math.round(done / total * 100) : 0;
    const bar     = document.getElementById('ps-progress-bar');
    const pctEl   = document.getElementById('ps-progress-pct');
    const countEl = document.getElementById('ps-progress-count');
    if (bar)     bar.style.width     = `${pct}%`;
    if (pctEl)   pctEl.textContent   = `${pct}%`;
    if (countEl) countEl.textContent = `${done} / ${total}`;
  }

  function pageInit() {
    let html = '<div class="sidebar-section-label">Categories</div>';
    PS_DATA.forEach(cat => {
      const t = cat.labs.length;
      const d = cat.labs.filter((_, i) => _psLabDone(`${cat.id}_${i}`)).length;
      html += `<div class="sidebar-item" onclick="scrollToPS('${cat.id}')">
        <span class="sidebar-item-text">${esc(cat.name)}</span>
        <span class="sidebar-item-badge">${d}/${t}</span>
      </div>`;
    });
    document.getElementById('sidebar').innerHTML = html;
    renderPS();
    updatePSProgress();
    refreshTopbarProgress();
  }

  bootPage('portswigger');
</script>
</body>
</html>
