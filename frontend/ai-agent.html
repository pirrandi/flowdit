<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agent</title>
<link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  /* Layout tipo consola — sin scroll de página, el transcript scrollea
     adentro. Mismo patrón que whiteboard.html. */
  .workarea { overflow: hidden; }
  .main.scan-main { padding: 0 !important; overflow: hidden !important; display: flex; flex-direction: column; }
  .scan-main .page-header { padding: 18px 24px 14px; flex-shrink: 0; }
  .scan-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 24px 18px; gap: 10px; }

  .scan-status-badge { font-family: var(--mono); font-size: 10px; padding: 3px 9px; border-radius: 999px; letter-spacing: .03em; text-transform: uppercase; border: 1px solid transparent; }
  .scan-status-badge.idle       { color: var(--t3); background: var(--bg3); border-color: var(--b1); }
  .scan-status-badge.running    { color: #4ade80; background: rgba(74,222,128,.12); border-color: rgba(74,222,128,.3); }
  .scan-status-badge.waiting_approval { color: var(--a); background: rgba(245,158,11,.15); border-color: rgba(245,158,11,.35); }
  .scan-status-badge.paused     { color: var(--t2); background: var(--bg3); border-color: var(--b1); }
  .scan-status-badge.error      { color: var(--c-crit); background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.3); }
  .scan-status-badge.completed  { color: var(--c-low); background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.25); }

  .scan-context { flex-shrink: 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--b1); border-radius: var(--r); font-family: var(--mono); font-size: 11px; color: var(--t3); }
  .scan-context strong { color: var(--t1); font-weight: 600; }

  /* Picker de sesiones — antes un <select> nativo sin ningún estilo propio
     (feo, reportado). Reusa exactamente el mismo patrón que .user-dropdown/
     .dropdown-item del menú de usuario (page.js) en vez de inventar uno
     nuevo, para que combine con el resto de la app. */
  .scan-session-picker { position: relative; margin-left: auto; }
  .scan-session-trigger {
    display: flex; align-items: center; gap: 7px;
    background: var(--bg3); border: 1px solid var(--b1); border-radius: var(--r-sm);
    padding: 4px 8px; font-family: var(--mono); font-size: 11px; color: var(--t1);
    cursor: pointer; transition: border-color .15s;
  }
  .scan-session-trigger:hover { border-color: var(--b2); }
  .scan-session-dropdown { min-width: 340px; max-height: 380px; overflow-y: auto; }
  .scan-session-row { display: flex; align-items: center; gap: 2px; }
  .scan-session-row .dropdown-item { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: var(--mono); min-width: 0; }
  .scan-session-row.active .dropdown-item { color: var(--t1); background: var(--bg3); }
  .scan-session-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; overflow: hidden; }
  .scan-session-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scan-session-meta { font-size: 9px; color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .scan-session-rename, .scan-session-delete {
    flex-shrink: 0; background: none; border: none; color: var(--t3); cursor: pointer;
    padding: 5px 7px; border-radius: var(--r-sm); display: flex; transition: background .1s, color .1s;
  }
  .scan-session-rename:hover { background: var(--bg3); color: var(--t1); }
  .scan-session-delete:hover { background: var(--c-crit-bg); color: var(--c-crit); }
  .scan-session-status { font-size: 9px; padding: 1px 6px; border-radius: 999px; flex-shrink: 0; }
  .scan-session-status.idle,.scan-session-status.paused { color: var(--t3); background: var(--bg2); }
  .scan-session-status.running { color: #4ade80; background: rgba(74,222,128,.12); }
  .scan-session-status.waiting_approval { color: var(--a); background: rgba(245,158,11,.15); }
  .scan-session-status.error { color: var(--c-crit); background: rgba(239,68,68,.12); }
  .scan-session-status.completed { color: var(--c-low); background: rgba(34,197,94,.1); }
  .scan-session-search {
    width: 100%; box-sizing: border-box; margin: 2px 0 4px; padding: 5px 8px;
    background: var(--bg); border: 1px solid var(--b1); border-radius: var(--r-sm);
    font-family: var(--mono); font-size: 11px; color: var(--t1);
  }
  .scan-session-search:focus { outline: none; border-color: var(--b2); }
  .scan-session-name-input {
    flex: 1; box-sizing: border-box; padding: 5px 8px; margin: 1px 0;
    background: var(--bg); border: 1px solid var(--a); border-radius: var(--r-sm);
    font-family: var(--mono); font-size: 12px; color: var(--t1);
  }
  .scan-session-name-input:focus { outline: none; }

  /* Tira de threads — solo visible con multi-agente (>1 thread). Da la
     visibilidad de "qué está haciendo cada agente" que antes no existía:
     todo vivía mezclado en una sola lista lineal sin distinción. */
  .scan-threads { flex-shrink: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .scan-thread-chip { font-family: var(--mono); font-size: 10px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--b1); background: var(--bg2); color: var(--t2); display: flex; align-items: center; gap: 5px; }
  .scan-thread-chip .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; background: var(--t3); }
  .scan-thread-chip.running .dot     { background: #4ade80; animation: scan-pulse 1.4s ease-in-out infinite; }
  .scan-thread-chip.waiting_approval .dot { background: var(--a); }
  .scan-thread-chip.completed .dot   { background: var(--c-low); }
  .scan-thread-chip.error .dot       { background: var(--c-crit); }

  .scan-transcript { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; }

  .scan-empty { margin: auto; max-width: 480px; text-align: center; padding: 30px 20px; }
  .scan-empty .form-group { text-align: left; }

  .scan-line { text-align: center; font-family: var(--mono); font-size: 10.5px; color: var(--t3); padding: 2px 0; }
  .scan-line.err { color: var(--c-crit); }
  .scan-line.warn { color: var(--a); }
  .scan-cost-cap-raise { display: inline-flex; align-items: center; gap: 6px; margin-left: 10px; vertical-align: middle; }
  .scan-cost-cap-input { width: 70px; font-family: var(--mono); font-size: 10.5px; background: var(--bg2); border: 1px solid var(--b1); border-radius: var(--r-sm); color: var(--t1); padding: 3px 6px; }
  .scan-cost-cap-btn { font-family: var(--mono); font-size: 10.5px; background: transparent; border: 1px solid var(--a); color: var(--a); border-radius: var(--r-sm); padding: 3px 8px; cursor: pointer; }
  .scan-cost-cap-btn:hover { background: rgba(245,158,11,.1); }
  .scan-cost-cap-btn:disabled { opacity: .5; cursor: default; }

  /* align-items:flex-start (no center) — con el <details> abierto y su JSON
     largo adentro, la fila crece mucho y "center" empujaba el tier-badge y
     el check al medio de todo ese alto en vez de dejarlos pegados arriba,
     al lado del nombre (reportado: "el ticket verde se corre al centro"). */
  .scan-tool { display: flex; align-items: flex-start; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--t2); padding: 6px 10px; background: var(--bg2); border: 1px solid var(--b1); border-radius: var(--r-sm); }
  .scan-tool .tier-badge { font-size: 9px; padding: 1px 6px; border-radius: 999px; background: var(--bg3); color: var(--t3); flex-shrink: 0; cursor: help; }
  .scan-tool details { flex: 1; min-width: 0; }
  .scan-tool summary { cursor: pointer; }
  /* Estado por fila — reemplaza el sufijo de texto "— ejecutando..." que
     era fácil de no notar. Punto pulsando mientras no hay resultado, check
     verde apenas llega. */
  .scan-tool-spinner { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; flex-shrink: 0; animation: scan-pulse 1.4s ease-in-out infinite; }
  .scan-tool-done { color: var(--c-low); flex-shrink: 0; }
  @keyframes scan-pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  .scan-tool pre { margin: 6px 0 0; font-size: 10.5px; white-space: pre-wrap; word-break: break-all; color: var(--t3); max-height: 220px; overflow-y: auto; }

  .scan-msg { display: flex; flex-direction: column; gap: 4px; max-width: 80%; }
  .scan-msg.user { align-self: flex-end; align-items: flex-end; }
  .scan-msg.assistant { align-self: flex-start; max-width: 94%; } /* los reportes del agente son largos — 80% quedaba angosto y forzaba mucho wrap */
  .scan-msg .who { font-family: var(--mono); font-size: 9.5px; color: var(--t3); text-transform: uppercase; letter-spacing: .04em; }
  .scan-msg .bubble { padding: 10px 14px; border-radius: var(--r); font-size: 13px; line-height: 1.6; }
  .scan-msg.user .bubble { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.25); color: var(--t1); }
  .scan-msg.assistant .bubble { background: var(--bg2); border: 1px solid var(--b1); color: var(--t1); }
  .scan-msg .bubble p:first-child, .scan-msg .bubble h1:first-child, .scan-msg .bubble h2:first-child, .scan-msg .bubble h3:first-child { margin-top: 0; }
  .scan-msg .bubble p:last-child, .scan-msg .bubble ul:last-child, .scan-msg .bubble ol:last-child { margin-bottom: 0; }
  /* marked no tenía NINGÚN estilo propio para headers/listas acá — heredaba
     el default del navegador (tamaños/márgenes inconsistentes con el resto
     de la app, "se ve raro" reportado). Tipografía propia, escalada para
     convivir dentro de una burbuja de chat, no una página entera. */
  .scan-msg .bubble h1, .scan-msg .bubble h2, .scan-msg .bubble h3 {
    font-size: 13px; font-weight: 700; color: var(--t1); letter-spacing: .01em;
    margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--b1);
  }
  .scan-msg .bubble strong { color: var(--t1); font-weight: 700; }
  .scan-msg .bubble ul, .scan-msg .bubble ol { margin: 6px 0; padding-left: 19px; }
  .scan-msg .bubble li { margin: 4px 0; }
  .scan-msg .bubble li::marker { color: var(--t3); }
  .scan-msg .bubble li > p { margin: 0; display: inline; } /* listas con párrafo interno (marked) no deben saltar de línea de más */
  .scan-msg .bubble hr { border: none; border-top: 1px solid var(--b1); margin: 12px 0; }
  .scan-msg .bubble a { color: var(--a); text-decoration: underline; text-underline-offset: 2px; }
  .scan-msg .bubble code { font-family: var(--mono); font-size: 11.5px; background: var(--bg3); padding: 1px 5px; border-radius: 3px; color: var(--a); word-break: break-all; }
  .scan-msg .bubble pre { background: var(--bg3); padding: 8px 10px; border-radius: var(--r-sm); overflow-x: auto; margin: 8px 0; }
  .scan-msg .bubble pre code { background: none; padding: 0; color: inherit; }

  /* Burbuja de "escribiendo..." — pedido explícito: animación en el chat
     mismo que indique que la IA está formulando la respuesta. */
  .scan-typing-dots { display: flex; align-items: center; gap: 4px; padding: 13px 14px; }
  .scan-typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--t3); animation: scan-typing-bounce 1.2s ease-in-out infinite; }
  .scan-typing-dots span:nth-child(2) { animation-delay: .15s; }
  .scan-typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes scan-typing-bounce { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  .scan-gate { border: 1px solid rgba(245,158,11,.4); background: rgba(245,158,11,.06); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .scan-gate .scan-gate-head { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--a); }
  .scan-gate pre { margin: 0; font-size: 11px; white-space: pre-wrap; word-break: break-all; background: var(--bg3); padding: 8px; border-radius: var(--r-sm); max-height: 260px; overflow-y: auto; }
  .scan-gate-actions { display: flex; gap: 8px; }
  .scan-gate-resolved { font-family: var(--mono); font-size: 11px; color: var(--t3); }
  .scan-gate-resolved.accepted { color: var(--c-low); }
  .scan-gate-resolved.rejected { color: var(--c-crit); }

  /* Tarjeta de hallazgo propuesto/actualizado — reemplaza el JSON.stringify
     crudo que se mostraba antes (ilegible, sobre todo los http_proofs con
     los \n escapados). Se usa dentro de .scan-gate, así que hereda su fondo/
     borde — acá solo va la tipografía y el layout del contenido. */
  .scan-finding-card { display: flex; flex-direction: column; gap: 8px; }
  .scan-finding-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .scan-finding-head strong { font-size: 12.5px; color: var(--t1); }
  .scan-finding-tag { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: var(--bg3); color: var(--t3); }
  .scan-finding-desc { margin: 0; font-size: 11.5px; line-height: 1.5; color: var(--t2); }
  .scan-finding-remediation summary { cursor: pointer; font-size: 11px; color: var(--t3); list-style: none; }
  .scan-finding-remediation summary::-webkit-details-marker { display: none; }
  .scan-finding-remediation summary::before { content: '▸ '; }
  .scan-finding-remediation[open] summary::before { content: '▾ '; }
  .scan-finding-remediation p { margin: 6px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--t2); }
  .scan-finding-meta { font-family: var(--mono); font-size: 10px; color: var(--t3); }
  .scan-finding-proofs { display: flex; flex-direction: column; gap: 6px; }
  .scan-proof-item { background: var(--bg3); border: 1px solid var(--b1); border-radius: var(--r-sm); padding: 6px 10px; }
  .scan-proof-item summary { cursor: pointer; font-family: var(--mono); font-size: 10.5px; color: var(--t2); list-style: none; }
  .scan-proof-item summary::-webkit-details-marker { display: none; }
  .scan-proof-item summary::before { content: '▸ '; }
  .scan-proof-item[open] summary::before { content: '▾ '; }
  .scan-proof-item pre { margin: 8px 0 0; font-family: var(--mono); font-size: 10.5px; white-space: pre-wrap; word-break: break-all; color: var(--t2); background: var(--bg2); padding: 8px; border-radius: var(--r-sm); max-height: 240px; overflow-y: auto; }
  .scan-proof-item pre + pre { margin-top: 6px; }

  /* Vista simple/avanzada — pedido explícito: la vista simple resume en
     tarjetas clickeables (puertos/endpoints/subdominios/hallazgos/para
     revisar) en vez de mostrar cada tool call individual; la avanzada
     sigue siendo el transcript crudo de siempre, sin cambios. */
  .scan-view-toggle { flex-shrink: 0; display: flex; gap: 6px; align-items: center; }

  /* Indicador de actividad en vivo — pedido explícito: "sería bueno que
     haya algún icono moviéndose... algo más visual, con un mensaje breve
     de lo que está haciendo la IA". Solo en Resumen — en Detalle cada tool
     call ya se ve una por una, sería redundante. */
  .scan-live-activity {
    flex-shrink: 0; display: flex; align-items: center; gap: 9px;
    padding: 8px 14px; background: rgba(74,222,128,.06); border: 1px solid rgba(74,222,128,.25);
    border-radius: var(--r); font-family: var(--mono); font-size: 11.5px; color: var(--c-low);
  }
  .scan-live-activity.waiting { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.3); color: var(--a); }
  .scan-live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-low); flex-shrink: 0; animation: livePulse 1.2s ease-in-out infinite; }
  .scan-live-activity.waiting .scan-live-dot { background: var(--a); animation: none; } /* esperándote a vos, no "trabajando" — sin pulso */
  .scan-live-text { color: var(--t1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* max-height: sin esto, el panel de highlights (chips + detalle expandido)
     competía por altura en la misma columna flex que #scan-transcript —
     reportado: el box del transcript "se achica" al abrir Resumen, y cambia
     de tamaño según cuánto contenido tenga highlights en cada momento. Con
     un techo fijo + su propio scroll interno, esa diferencia queda acotada
     y constante en vez de variable. */
  .scan-highlights { flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 220px; }
  .scan-hl-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .scan-hl-chip {
    display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11.5px;
    padding: 7px 12px; background: var(--bg2); border: 1px solid var(--b1); border-radius: var(--r);
    cursor: pointer; color: var(--t2); transition: border-color .15s, color .15s;
  }
  .scan-hl-chip:hover { border-color: var(--b2); color: var(--t1); }
  .scan-hl-chip.expanded { border-color: var(--a); color: var(--t1); }
  .scan-hl-chip .scan-hl-count { background: var(--bg3); color: var(--t1); padding: 1px 8px; border-radius: 999px; font-weight: 600; }
  .scan-hl-chip.review .scan-hl-count    { background: rgba(245,158,11,.15); color: var(--a); }
  .scan-hl-chip.findings .scan-hl-count  { background: rgba(239,68,68,.12); color: var(--c-crit); }
  .scan-hl-detail { background: var(--bg2); border: 1px solid var(--b1); border-radius: var(--r); padding: 4px 12px; max-height: 320px; overflow-y: auto; }
  .scan-hl-detail-item, .scan-hl-item summary { padding: 8px 0; border-bottom: 1px solid var(--b1); font-family: var(--mono); font-size: 11px; color: var(--t2); display: flex; justify-content: space-between; gap: 10px; }
  .scan-hl-detail-item:last-child, .scan-hl-item:last-child summary { border-bottom: none; }
  .scan-hl-detail-item .val, .scan-hl-item .val { color: var(--t1); text-align: right; word-break: break-all; flex-shrink: 0; }
  .scan-hl-detail-item span:first-child, .scan-hl-item summary span:first-child { word-break: break-all; }
  .scan-highlights-empty { text-align: center; padding: 24px; font-family: var(--mono); font-size: 11.5px; color: var(--t3); }
  /* Items expandibles — pedido explícito: "al hacer click se muestre la
     respuesta también, y el código de respuesta" — antes solo se veía
     label+value, sin forma de ver el body/error real detrás. */
  .scan-hl-item summary { cursor: pointer; list-style: none; }
  .scan-hl-item summary::-webkit-details-marker { display: none; }
  .scan-hl-item-meta { font-family: var(--mono); font-size: 10.5px; color: var(--t3); padding: 4px 0; }
  .scan-hl-item-error { font-family: var(--mono); font-size: 10.5px; color: var(--c-crit); padding: 4px 0; }
  .scan-hl-item pre { font-family: var(--mono); font-size: 10.5px; color: var(--t2); background: var(--bg3); padding: 8px; border-radius: var(--r-sm); white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; margin: 4px 0 8px; }
  .scan-hl-warning { display: flex; align-items: flex-start; gap: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--a); background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.3); border-radius: var(--r-sm); padding: 8px 10px; margin: 6px 0; }

  .scan-input-row { flex-shrink: 0; display: flex; gap: 8px; align-items: flex-end; }
  .scan-input-row textarea { flex: 1; resize: none; font-family: inherit; font-size: 13px; padding: 9px 12px; background: var(--bg2); border: 1px solid var(--b1); border-radius: var(--r); color: var(--t1); max-height: 120px; }
  /* Sin esto quedaba el outline nativo del navegador al hacer foco (celeste/
     blanco, reportado como "feo, no pega con el diseño") — nunca se le
     definió un :focus propio, a diferencia de .form-input (main.css). */
  .scan-input-row textarea:focus { outline: none; border-color: rgba(245,158,11,.45); }
  .scan-input-row textarea:disabled { opacity: .5; }

  /* Toggle de idioma ES/EN — pedido explícito: "quiero que esté en spanish,
     o bueno... demos la opción de configurar tanto en spanish como
     english". Acotado a esta página (ver ai-agent.js AI_I18N/t()), no un
     i18n de toda la app. */
  .scan-lang-toggle { display: flex; gap: 2px; background: var(--bg3); border: 1px solid var(--b1); border-radius: var(--r-sm); padding: 2px; }
  .scan-lang-btn { font-family: var(--mono); font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 3px; border: none; background: none; color: var(--t3); cursor: pointer; transition: background .12s, color .12s; }
  .scan-lang-btn:hover { color: var(--t1); }
  .scan-lang-btn.active { background: var(--bg2); color: var(--t1); }
</style>
</head>
<body>

<div id="loading-overlay" class="ovl-shell"><div class="skel-wrap"><div class="skel-block skel-tall"></div><div class="skel-block skel-tall"></div></div></div>
<nav class="sidenav" id="sidenav"></nav>
<header class="topbar" id="topbar"></header>

<div class="workarea">
  <main class="main scan-main">
    <div class="page-header">
      <div>
        <div class="page-title">AI Agent</div>
        <div class="page-subtitle" id="scan-subtitle" data-i18n="subtitle">// scanner de pentest autónomo — conectado con este proyecto</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="scan-lang-toggle" id="scan-lang-toggle"></div>
        <div id="scan-controls-top" style="display:flex;gap:8px;align-items:center"></div>
      </div>
    </div>

    <div class="scan-body">
      <div class="scan-context" id="scan-context"></div>
      <div class="scan-view-toggle" id="scan-view-toggle" style="display:none"></div>
      <div class="scan-live-activity" id="scan-live-activity" style="display:none"></div>
      <div class="scan-highlights" id="scan-highlights" style="display:none"></div>
      <div class="scan-threads" id="scan-threads" style="display:none"></div>
      <div class="scan-transcript" id="scan-transcript"></div>
      <div class="scan-input-row" id="scan-input-row" style="display:none">
        <textarea id="scan-chat-input" rows="1" data-i18n-placeholder="chatPlaceholder" placeholder="Hablale al agente — preguntale algo o dale una instrucción..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();scanSendMessage();}"></textarea>
        <button class="btn btn-prim" onclick="scanSendMessage()"><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fd-icon"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></svg> <span data-i18n="send">Enviar</span></button>
      </div>
    </div>
  </main>

  <aside class="activity-col">
    <div class="activity-header">
      <span class="activity-title">Activity</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="live-badge"></div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--t3)">live</span>
      </div>
    </div>
    <div class="activity-list" id="activity-list"><div class="activity-empty">No activity yet</div></div>
  </aside>
</div>

<!-- Modal liviano para "Editar y agregar" — a propósito NO es el mismo
     markup que #vuln-modal en vulns.html (ese vive solo en esa página);
     reusa las mismas clases .modal-*/.form-* globales y pega contra el
     mismo POST /vulns, con resolve_ai_session_id/resolve_ai_call_id. -->
<div class="modal-overlay" id="scan-finding-modal">
  <div class="modal" style="max-width:520px">
    <div class="modal-title" data-i18n="editFindingTitle">Editar hallazgo propuesto</div>
    <div class="form-group" style="margin:0">
      <label class="form-label" data-i18n="labelName">Name *</label>
      <input type="text" class="form-input" id="sf-name">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="form-group"><label class="form-label" data-i18n="labelCategory">Category</label><input type="text" class="form-input" id="sf-cat"></div>
      <div class="form-group">
        <label class="form-label" data-i18n="labelSeverity">Severity</label>
        <select class="form-input" id="sf-sev">
          <option value="critical">Critical</option><option value="high">High</option>
          <option value="medium">Medium</option><option value="low">Low</option><option value="info">Info</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label class="form-label" data-i18n="labelDescription">Description</label><textarea class="form-input note-textarea" id="sf-desc" style="min-height:80px"></textarea></div>
    <div class="form-group"><label class="form-label" data-i18n="labelRemediation">Remediation</label><textarea class="form-input note-textarea" id="sf-rem" style="min-height:80px"></textarea></div>
    <div class="form-group" style="margin-bottom:0"><label class="form-label" data-i18n="labelCwe">CWE <span style="color:var(--t3);font-weight:400">(optional)</span></label><input type="text" class="form-input" id="sf-cwe"></div>
    <div class="form-error" id="sf-error"></div>
    <div class="modal-footer">
      <span style="font-family:var(--mono);font-size:10px;color:var(--t3)" data-i18n="createdViaEndpoint">Se crea vía el mismo endpoint que "Add Vulnerability"</span>
      <div style="display:flex;gap:8px">
        <button class="btn-secondary" onclick="closeScanFindingModal()" data-i18n="cancel">Cancel</button>
        <button class="btn-save" id="sf-save-btn" onclick="saveScanFinding()" data-i18n="addFinding">Add Finding</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirmación de borrado de sesión — mismo patrón que #scan-finding-modal
     (clases .modal-*/.btn-danger globales). Ni siquiera "Eliminar proyecto"
     en Settings tiene un modal propio hoy (usa confirm() nativo) — este es
     el primero de la app, acotado a esta página por ahora. -->
<div class="modal-overlay" id="scan-delete-confirm-modal">
  <div class="modal" style="max-width:420px">
    <div class="modal-title" data-i18n="deleteSessionLabel">Borrar sesión</div>
    <p style="font-family:var(--mono);font-size:12px;color:var(--t2);line-height:1.6;margin:0 0 16px" id="scan-delete-confirm-text"></p>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeScanDeleteConfirm()" data-i18n="cancel">Cancelar</button>
      <button class="btn-danger" onclick="confirmScanDeleteSession()" data-i18n="deleteSessionLabel">Borrar sesión</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/services/state.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/ws.js"></script>
<script src="js/services/icons.js"></script>
<script src="js/services/utils.js"></script>
<script src="js/components/activity.js"></script>
<script src="js/views/ai-agent.js"></script>
<script src="js/page.js"></script>
<script>
  function pageInit() { initAiAgent(); }
  bootPage('ai-agent');
</script>
</body>
</html>
