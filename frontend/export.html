<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Export Report</title>
<link rel="stylesheet" href="css/main.css?v=9">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js?v=3"></script>
<style>
/* ── Report editor shell: page head + outline · preview · inspector ── */
/* .exp-editor / .export-controls / .no-print are hidden for print and by the
   headless PDF render (routes/export.js); .exp-inner and .exp-preview are
   reset to plain blocks there. Keep those class names on these panes. */
.rpt-main { padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:0; }
.exp-layout { display:flex;flex:1;overflow:hidden;min-height:0; }
.exp-editor { display:flex;flex-direction:column;min-height:0;background:var(--bg1); }
.exp-outline { width:264px;flex-shrink:0;border-right:1px solid var(--b1); }
.exp-inspector { width:344px;flex-shrink:0;border-left:1px solid var(--b1);overflow-y:auto; }
.exp-inner { flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg); }
.exp-preview { flex:1;overflow-y:auto;min-height:0;padding:28px 32px; }

.exp-root .btn { height:28px;box-sizing:border-box;white-space:nowrap; }
.exp-root .btn:disabled { opacity:.45;cursor:not-allowed; }
.exp-root .btn.btn-icon { width:28px;padding:0;justify-content:center;background:var(--bg3);border:1px solid var(--b2);color:var(--t2); }
.exp-root .btn.btn-icon:hover:not(:disabled) { background:var(--bg4);color:var(--t1);border-color:var(--b3); }
.exp-root .btn-ghost.btn-icon { background:transparent!important;border-color:transparent!important; }
.exp-root .btn-ghost.btn-icon:hover:not(:disabled) { background:var(--bg2)!important; }
.exp-root .btn-accent { padding:0 10px;font-size:11px; }
.exp-root .btn-danger { background:transparent;border-color:rgba(239,68,68,.35);color:#f87171; }
.exp-root .btn-danger:hover { background:rgba(239,68,68,.12);border-color:#ef4444;color:#f87171; }
.exp-root .form-input { padding:7px 10px;font-family:var(--mono);box-sizing:border-box; }
.exp-root select.form-input { height:32px;padding:0 8px;cursor:pointer; }
.exp-root textarea.form-input { line-height:1.55;resize:vertical;font-size:11.5px; }
.exp-root .tab-row { margin-bottom:0; }
.exp-root .tab-btn { flex:none;height:24px;padding:0 10px;font-size:11px;color:var(--t2); }
.exp-root .tab-btn:hover { color:var(--t1); }
.exp-root .tab-btn.active { background:var(--bg1);color:var(--t1);box-shadow:inset 0 -2px 0 var(--a); }
.exp-root button:focus-visible,.exp-root input:focus-visible,.exp-root select:focus-visible,.exp-root textarea:focus-visible { outline:2px solid var(--a);outline-offset:1px; }

/* Page head */
.exp-head { flex-shrink:0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding:14px 20px 12px;border-bottom:1px solid var(--b1);background:var(--bg); }
.exp-eyebrow { font-size:9px;color:var(--t3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.exp-h1 { margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.15;color:var(--t1); }
.exp-save { display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--t3);white-space:nowrap; }
.exp-save .insp-link { font-size:10px;color:#f87171; }
.exp-save-dot { width:6px;height:6px;border-radius:50%;background:#22c55e;flex-shrink:0; }
.exp-save.is-pending .exp-save-dot { background:var(--a); }
.exp-save.is-local .exp-save-dot { background:#60a5fa; }
.exp-save.is-error { color:#f87171; }
.exp-save.is-error .exp-save-dot { background:#ef4444; }
.exp-head-ctrls { display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px; }
.exp-head .form-label { margin-bottom:4px; }
.exp-vsep { width:1px;height:28px;background:var(--b1); }
.exp-menu-wrap { position:relative; }
.exp-menu { position:absolute;z-index:300;right:0;top:calc(100% + 4px);background:var(--bg2);border:1px solid var(--b2);border-radius:2px;box-shadow:0 4px 24px rgba(0,0,0,.4);padding:4px;display:none;max-width:calc(100vw - 32px); }
.exp-menu.open { display:block; }
.exp-menu-item { width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 10px;background:none;border:0;border-radius:1px;color:var(--t1);text-align:left;font-size:11.5px;cursor:pointer; }
.exp-menu-item:hover { background:var(--bg3); }
.exp-menu-help { font-size:10px;color:var(--t3); }
.exp-role-banner { padding:7px 20px;background:rgba(96,165,250,.08);border-bottom:1px solid rgba(96,165,250,.25);color:#93c5fd;font-size:11px;flex-shrink:0; }

/* Outline */
.ol-head { padding:12px 12px 8px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--b1); }
.ol-title { display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3); }
.ol-title .btn { height:22px;padding:0 8px;font-size:10px;letter-spacing:0;text-transform:none; }
.ol-grid2 { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px; }
.ol-grid2 .btn { justify-content:center; }
.ol-grid2 .btn.active { background:var(--a-dim);border-color:rgba(245,158,11,.3);color:var(--a); }
.ol-search { font-size:11px!important;padding:6px 9px!important; }
.ol-banner { display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;background:var(--a-dim);border:1px solid rgba(245,158,11,.3);border-radius:2px;color:var(--a);font-size:11px;font-weight:600;text-align:left;cursor:pointer; }
.ol-banner:hover { border-color:var(--a); }
.ol-banner.is-free { flex-direction:column;align-items:stretch;gap:6px;background:rgba(96,165,250,.08);border-color:rgba(96,165,250,.3);color:#93c5fd;font-weight:400;font-size:10.5px;line-height:1.45;cursor:default; }
.ol-banner.is-free .btn { height:24px;font-size:10px;justify-content:center; }
.ol-scroll { flex:1;overflow-y:auto;min-height:0;padding:4px 0 12px; }
.ol-list { list-style:none;margin:0;padding:0; }
.ol-list.is-free { opacity:.55; }
.ol-row { display:flex;align-items:center;border-left:2px solid transparent;transition:background .08s,border-color .08s; }
.ol-row:hover,.ol-row.is-hover { background:var(--bg2);border-left-color:var(--b3); }
.ol-row.is-sel { background:var(--a-dim);border-left-color:var(--a); }
.ol-row.drag-over { box-shadow:inset 0 2px 0 var(--a); }
.ol-sel { flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:7px;min-height:28px;padding:3px 6px 3px calc(12px + var(--d,0) * 14px);background:none;border:0;text-align:left;font-size:12px;color:var(--t2);cursor:pointer; }
.ol-row.is-child .ol-sel { font-size:11px; }
.ol-row.is-sel .ol-sel,.ol-row:hover .ol-sel { color:var(--t1); }
.ol-row.is-off .ol-sel { color:var(--t4); }
.ol-row.is-off .ol-label { text-decoration:line-through; }
.ol-num { font-size:10px;color:var(--t3);min-width:20px;flex-shrink:0;font-variant-numeric:tabular-nums; }
.ol-label { flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.ol-dot { width:6px;height:6px;border-radius:50%;flex-shrink:0; }
.ol-pb { font-size:10px;color:var(--t3);flex-shrink:0; }
.ol-tag { font-size:8.5px;font-weight:700;letter-spacing:.08em;padding:1px 5px;border-radius:1px;background:var(--bg3);color:var(--t3);flex-shrink:0;text-decoration:none; }
.ol-tag.is-preset,.ol-tag.is-claude { background:var(--a-dim);color:var(--a); }
.ol-ib { width:22px;height:24px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;border-radius:2px;color:var(--t3);flex-shrink:0;cursor:pointer;padding:0; }
.ol-ib:hover:not(:disabled) { background:var(--bg3);color:var(--t1); }
.ol-ib:disabled { opacity:.3;cursor:not-allowed; }
.ol-ib.is-eye { width:26px;margin-right:4px; }
.ol-empty { padding:12px 14px;color:var(--t3);font-size:11px; }

/* Preview toolbar */
.exp-pv-bar { flex-shrink:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;min-height:40px;box-sizing:border-box;padding:6px 14px;border-bottom:1px solid var(--b1);background:var(--bg); }
.exp-pv-label { font-size:10px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase; }
.exp-pv-chip { font-size:10px;padding:2px 7px;border-radius:1px;background:rgba(96,165,250,.14);color:#93c5fd; }
.exp-pv-bar .tab-row.is-prop { background:var(--a-dim); }
.exp-pv-bar .btn.btn-icon { width:26px;height:26px; }

/* Inspector */
.insp-head { padding:14px 16px 12px;border-bottom:1px solid var(--b1); }
.insp-kicker { font-size:9px;color:var(--t3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px; }
.insp-title { font-size:13px;font-weight:700;line-height:1.35;color:var(--t1);word-break:break-word; }
.insp-state { margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:10.5px;color:var(--t3); }
.insp-chip { font-size:9px;font-weight:700;letter-spacing:.08em;padding:2px 6px;border-radius:1px;background:var(--bg3);color:var(--t2); }
.insp-chip.is-on { background:rgba(34,197,94,.12);color:#4ade80; }
.insp-chip.is-preset { background:var(--a-dim);color:var(--a); }
.insp-body { padding:14px 16px 28px;display:flex;flex-direction:column;gap:18px;font-size:11.5px; }
.insp-body:empty { display:none; }
.insp-sh { display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);padding:2px 0 7px;border-bottom:1px solid var(--b1);margin-bottom:10px; }
.insp-sh .insp-sh-note { text-transform:none;letter-spacing:0;font-weight:400;color:var(--t3); }
.insp-grid2 { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px; }
.insp-grid-ts { display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;align-items:end; }
.insp-col { display:flex;flex-direction:column;gap:10px; }
.insp-chk { display:flex;align-items:center;gap:8px;min-height:26px;font-size:11.5px;color:var(--t2);cursor:pointer; }
.insp-chk input[type=radio] { accent-color:var(--a);margin:0; }
.insp-help { font-size:10.5px;color:var(--t3);line-height:1.55; }
.insp-text { color:var(--t2);line-height:1.6; }
.insp-link { padding:0;background:none;border:0;color:var(--a);font-size:inherit;text-decoration:underline;cursor:pointer; }
.insp-lblrow { display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px; }
.insp-lblrow .form-label { margin:0; }
.insp-lblrow .btn { height:22px;padding:0 6px;font-size:10px; }
.insp-tools { display:flex;gap:4px;align-items:center; }
.insp-tools .tab-row { padding:2px; }
.insp-tools .tab-btn { height:20px;font-size:10px; }
.insp-tools .btn.btn-icon { width:24px;height:24px; }
.insp-change { padding:10px;border:1px solid rgba(249,115,22,.3);border-left:2px solid #f97316;border-radius:2px;background:rgba(249,115,22,.04); }
.insp-change .insp-sh { color:#fdba74;border-bottom-color:rgba(249,115,22,.2); }
.insp-subrow { display:flex;align-items:center;gap:2px;padding-left:8px;background:var(--bg2);border:1px solid var(--b1);border-radius:2px; }
.insp-subrow-btn { flex:1 1 auto;min-width:0;height:28px;background:none;border:0;text-align:left;color:var(--t1);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer; }
.insp-subrow.is-off .insp-subrow-btn { color:var(--t4);text-decoration:line-through; }
.insp-subrow .btn { height:24px;font-size:10px; }
.insp-swatch { width:22px;height:22px;border-radius:2px;border:0;cursor:pointer;padding:0;outline-offset:2px; }
.insp-swatch[aria-checked="true"] { outline:2px solid var(--t1); }
.insp-zone { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px; }
.insp-zone-col { display:flex;flex-direction:column;gap:5px;padding:6px;min-width:0;background:var(--bg2);border:1px solid var(--b1);border-radius:2px; }
.insp-zone-col .tab-row { padding:1px; }
.insp-zone-col .tab-btn { flex:1 1 0;height:20px;padding:0;font-size:10px; }
.insp-zone-col .form-input { padding:4px 6px;font-size:10px; }
.insp-zone-col img { height:22px;max-width:100%;object-fit:contain;border-radius:2px;border:1px solid var(--b1);align-self:flex-start; }
.insp-wstg { padding:8px;background:var(--bg2);border:1px solid var(--b1);border-left:2px solid #ef4444;border-radius:2px;display:flex;flex-direction:column;gap:6px; }
.insp-md-warn { margin-bottom:6px;padding:6px 8px;border:1px solid rgba(245,158,11,.3);border-radius:2px;background:rgba(245,158,11,.06);color:var(--t2);font-size:10.5px;line-height:1.5; }
.insp-prop { border:1px solid rgba(245,158,11,.35);border-radius:2px;background:rgba(245,158,11,.05); }
.insp-prop-head { display:flex;align-items:center;gap:8px;padding:7px 6px 7px 10px;border-bottom:1px solid rgba(245,158,11,.2);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--a); }
.insp-prop-head .pos { margin-left:auto;font-weight:400;letter-spacing:0;color:var(--t3); }
.insp-prop-head .btn.btn-icon { width:22px;height:22px; }
.insp-prop-body { padding:10px;display:flex;flex-direction:column;gap:10px; }
.insp-prop-body .md-body { color:var(--t1);line-height:1.55; }
.insp-prop-actions { display:flex;flex-wrap:wrap;gap:4px; }
.insp-prop-actions .btn { justify-content:center; }
.insp-prop-note { padding:6px 8px;border-radius:2px;font-size:10.5px;line-height:1.5;background:var(--bg2);color:var(--t2); }
.insp-prop-note.is-bad { background:rgba(239,68,68,.08);color:#fca5a5; }
.insp-tpl-list { list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px; }
.insp-tpl-item { display:flex;align-items:center;gap:6px;padding:9px 10px;background:var(--bg2);border:1px solid var(--b1);border-radius:2px; }
.exp-root .rich-editor { font-size:12px; }

/* Preview ↔ outline sync. Screen only: never in print, never in the PDF. */
@media screen {
  #report-preview [data-node-id] { scroll-margin-top:16px;border-radius:3px;cursor:pointer;transition:outline-color .1s; }
  #report-preview [data-node-id].rpt-is-hover { outline:1px dashed rgba(245,158,11,.7);outline-offset:4px; }
  #report-preview [data-node-id].rpt-is-sel { outline:2px solid #f59e0b;outline-offset:4px; }
  .rpt-pv-band { margin:0 0 12px;padding:5px 9px;background:#fff7e6;border:1px solid #f3c56b;border-radius:4px;font-family:var(--mono);font-size:10.5px;color:#7a4b00; }
  .rpt-ghost { margin:24px 0;padding:10px 12px;border:1px dashed var(--b3);border-radius:4px;color:var(--t3);font-family:var(--mono);font-size:11px;background:var(--bg2); }
}

/* Narrow screens: the panes stack and the page scrolls. (screen only: the
   headless PDF render is 794px wide and must keep the print layout.) */
@media screen and (max-width: 1180px) {
  .exp-outline { width:224px; }
  .exp-inspector { width:300px; }
  .exp-preview { padding:20px 18px; }
}
@media screen and (max-width: 900px) {
  .rpt-main { display:block;overflow-x:hidden;overflow-y:auto; }
  .exp-head { padding:12px 16px; }
  .exp-layout { display:block;overflow:visible; }
  .exp-outline,.exp-inspector { width:auto;border:0;border-bottom:1px solid var(--b1);overflow:visible; }
  .ol-scroll { max-height:45vh; }
  .exp-inner { border-bottom:1px solid var(--b1); }
  .exp-preview { max-height:72vh;overflow-x:auto;padding:16px; }
  .exp-head-ctrls { gap:10px; }
  .exp-head-ctrls #export-scope { width:140px!important; }
}

.exp-field-label { font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-bottom:3px; }
.exp-sub-label { font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin:12px 0 6px;padding-top:10px;border-top:1px solid var(--b1); }
.exp-textarea {
  width:100%;background:var(--bg);border:1px solid var(--b1);border-radius:5px;
  color:var(--t1);font-size:11px;font-family:inherit;padding:7px 9px;
  resize:vertical;min-height:60px;line-height:1.5;box-sizing:border-box;
}
.exp-textarea:focus { outline:none;border-color:var(--a); }
.exp-textarea.rem { border-color:var(--c-low)44; }
.exp-textarea.rem:focus { border-color:var(--c-low); }
.exp-saved-dot { width:6px;height:6px;border-radius:50%;background:var(--c-low);margin-left:auto;opacity:0;transition:opacity .3s; }
.exp-saved-dot.show { opacity:1; }

/* Evidence picker in editor */
.exp-evidence-row { display:flex;align-items:center;gap:6px;margin-bottom:4px;padding:5px 7px;
  background:var(--bg);border:1px solid var(--b1);border-radius:5px; }
.exp-evidence-thumb { width:36px;height:28px;object-fit:cover;border-radius:3px;flex-shrink:0; }
.exp-evidence-name { flex:1;font-family:var(--mono);font-size:10px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }

/* Toggle checkboxes */
.exp-opt { display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--t2);cursor:pointer;padding:3px 0; }
.exp-opt input[type="checkbox"] {
  appearance:none;-webkit-appearance:none;
  width:13px;height:13px;border:1px solid var(--b2);border-radius:3px;
  background:var(--bg3);cursor:pointer;position:relative;flex-shrink:0;
  transition:background .12s,border-color .12s;
}
.exp-opt input[type="checkbox"]:checked { background:var(--a);border-color:var(--a); }
.exp-opt input[type="checkbox"]:checked::after {
  content:'';position:absolute;left:3px;top:1px;width:4px;height:7px;
  border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg);
}
.exp-opt input[type="checkbox"]:hover:not(:checked) { border-color:var(--a);background:rgba(124,58,237,.1); }
.exp-opt input[type="radio"] {
  appearance:none;-webkit-appearance:none;
  width:13px;height:13px;border:1px solid var(--b2);border-radius:50%;
  background:var(--bg3);cursor:pointer;position:relative;flex-shrink:0;
  transition:background .12s,border-color .12s;
}
.exp-opt input[type="radio"]:checked { border-color:var(--a); }
.exp-opt input[type="radio"]:checked::after {
  content:'';position:absolute;left:3px;top:3px;width:5px;height:5px;
  border-radius:50%;background:var(--a);
}
.exp-opt input[type="radio"]:hover:not(:checked) { border-color:var(--a);background:rgba(124,58,237,.1); }

/* ── Report base ─────────────────────────────────────────────────── */
.rpt { font-family:var(--rpt-font,'Inter',system-ui,sans-serif);color:var(--t1);line-height:1.7; }
.rpt h1 { font-size:28px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em; }
.rpt h2 { font-size:var(--rpt-h2-size,13px);font-weight:700;margin:40px 0 16px;color:var(--t2);
          text-transform:uppercase;letter-spacing:.1em;
          border-bottom:1px solid var(--b1);padding-bottom:10px;display:flex;align-items:center;gap:8px; }
.rpt h2::before { content:'';display:inline-block;width:3px;height:14px;border-radius:2px;background:var(--a);flex-shrink:0; }
.rpt h3 { font-size:13px;font-weight:700;margin:22px 0 10px; }
.rpt-sub-title { font-size:var(--rpt-h3-size,11px)!important;font-weight:700;margin:28px 0 12px;color:var(--t3);
                 text-transform:uppercase;letter-spacing:.09em;
                 border-bottom:1px solid var(--b1)88;padding-bottom:7px;display:flex;align-items:center;gap:7px; }
.rpt-sub-title::before { content:'';display:inline-block;width:2px;height:10px;border-radius:2px;background:var(--a);opacity:.55;flex-shrink:0; }
.rpt-sec-desc { margin-bottom:16px!important; }
.rpt p  { margin:4px 0 10px;color:var(--t2);font-size:var(--rpt-base-size,13px); }

/* ── Cover / header ──────────────────────────────────────────────── */
.rpt-cover { margin-bottom:40px; }
.rpt-cover-bar { height:3px;border-radius:0;background:var(--a);margin-bottom:32px; }
.rpt-cover-labels { display:flex;align-items:center;gap:10px;margin-bottom:12px; }
.rpt-cover-type { font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--a);border:1px solid rgba(124,58,237,.27);border-radius:3px;padding:3px 9px; }
.rpt-cover-conf { font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--c-crit);border:1px solid var(--c-crit)44;border-radius:3px;padding:3px 9px; }
/* ── Cover metadata table (replaces grid of cards) ───────────────── */
.rpt-cover-meta { margin-top:28px;border-top:1px solid var(--b1); }
.rpt-cover-meta-row { display:flex;border-bottom:1px solid var(--b1)66;padding:10px 0;gap:0; }
.rpt-cover-meta-cell { flex:1;display:flex;gap:14px;align-items:baseline;padding:0 16px 0 0; }
.rpt-cover-meta-cell + .rpt-cover-meta-cell { border-left:1px solid var(--b1)44;padding-left:16px;padding-right:0; }
.rpt-cover-meta-label { font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--t3);white-space:nowrap;min-width:100px;flex-shrink:0; }
.rpt-cover-meta-val { font-size:13px;font-weight:500;color:var(--t1);line-height:1.4; }
/* ── TOC links ───────────────────────────────────────────────────── */
.rpt-toc-item a { color:var(--t2);text-decoration:none;border-bottom:1px solid transparent;transition:color .15s,border-color .15s; }
.rpt-toc-item a:hover { color:var(--a);border-bottom-color:rgba(124,58,237,.27); }

/* ── Summary cards ───────────────────────────────────────────────── */
.rpt-summary { display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 16px; }
.rpt-summary-card { flex:1;min-width:80px;border-radius:9px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden; }
.rpt-summary-card::after { content:'';position:absolute;right:-8px;bottom:-8px;width:50px;height:50px;border-radius:50%;opacity:.12;background:currentColor; }
.rpt-summary-card .rpt-count { font-size:28px;font-weight:800;line-height:1; }
.rpt-summary-card .rpt-label { font-size:9px;text-transform:uppercase;letter-spacing:.1em;opacity:.75;font-family:var(--mono);margin-top:2px; }
.card-critical{background:#ef444418;border:1px solid #ef444440;color:#ef4444;}
.card-high    {background:#f9731618;border:1px solid #f9731640;color:#f97316;}
.card-medium  {background:#eab30818;border:1px solid #eab30840;color:#eab308;}
.card-low     {background:#05966918;border:1px solid #05966940;color:#059669;}
.card-info    {background:#6b728018;border:1px solid #6b728040;color:#9ca3af;}
.card-wstg    {background:var(--bg3);border:1px solid var(--b1);color:var(--c-low);}

/* ── Overall risk banner (executive) ─────────────────────────────── */
.rpt-risk-banner { display:flex;align-items:center;gap:18px;border-radius:10px;padding:16px 20px;margin:0 0 18px; }
.rpt-risk-banner-label { font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;opacity:.75; }
.rpt-risk-banner-level { font-size:21px;font-weight:800;line-height:1.15;white-space:nowrap; }
.rpt-risk-banner-text  { font-size:12px;line-height:1.55;flex:1;opacity:.92; }

/* ── Risk distribution bar ───────────────────────────────────────── */
.rpt-risk-wrap { margin:4px 0 24px; }
.rpt-risk-bar  { display:flex;height:7px;border-radius:4px;overflow:hidden;gap:2px; }
.rpt-risk-seg  { height:100%;border-radius:2px;transition:width .3s; }
.rpt-risk-critical { background:#ef4444; }
.rpt-risk-high     { background:#f97316; }
.rpt-risk-medium   { background:#eab308; }
.rpt-risk-low      { background:#059669; }
.rpt-risk-info     { background:#6b7280; }
.rpt-risk-legend   { display:flex;gap:14px;margin-top:8px;flex-wrap:wrap; }
.rpt-risk-legend-item { display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--t3); }
.rpt-risk-legend-dot { width:7px;height:7px;border-radius:50%;flex-shrink:0; }

/* ── Findings overview table ─────────────────────────────────────── */
.rpt-cell { display:flex;align-items:center;min-height:20px; }
.rpt-table { width:100%;border-collapse:separate;border-spacing:0;font-size:12px;margin:10px 0; }
.rpt-table th { text-align:left;padding:9px 12px;background:var(--bg3);font-family:var(--mono);
  font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);border-bottom:1px solid var(--b1); }
.rpt-table td { padding:7px 12px;border-bottom:1px solid var(--b1);color:var(--t2);vertical-align:top; }
.rpt-table tr:last-child td { border-bottom:none; }
.rpt-table tr:hover td { background:var(--bg2); }
.rpt-table td.num { text-align:center;font-family:var(--mono);font-weight:600; }
.rpt-table td.vuln-found { color:var(--c-crit);font-weight:700; }
.rpt-progress-cell { display:flex;align-items:center;gap:8px; }
.rpt-mini-bar { flex:1;height:4px;background:var(--b1);border-radius:2px;overflow:hidden; }
.rpt-mini-fill { height:100%;background:var(--c-low);border-radius:2px; }

/* ── Vulnerability cards ─────────────────────────────────────────── */
.rpt-vuln { border:1px solid var(--b1);border-radius:8px;margin-bottom:14px;overflow:hidden;page-break-inside:avoid; }
.rpt-vuln-critical { border-left:4px solid #ef4444!important; }
.rpt-vuln-high     { border-left:4px solid #f97316!important; }
.rpt-vuln-medium   { border-left:4px solid #eab308!important; }
.rpt-vuln-low      { border-left:4px solid #059669!important; }
.rpt-vuln-info     { border-left:4px solid #6b7280!important; }
.rpt-vuln-header { display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg2); }
.rpt-vuln-name { font-weight:600;font-size:13px;flex:1; }
.rpt-vuln-cat  { font-family:var(--mono);font-size:10px;color:var(--t3); }
.rpt-vuln-status { font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;white-space:nowrap; }
.rpt-status-done { color:var(--c-low);background:var(--c-low)18;border:1px solid var(--c-low)30; }
.rpt-status-fail { color:var(--c-crit);background:var(--c-crit)18;border:1px solid var(--c-crit)30; }
.rpt-status-pending { color:var(--t3);background:var(--bg3);border:1px solid var(--b1); }
.rpt-status-remediated { color:var(--c-med);background:var(--c-med)18;border:1px solid var(--c-med)30; }
.rpt-status-not_remediated { color:var(--c-crit);background:var(--c-crit)18;border:1px solid var(--c-crit)30; }
.rpt-status-verified_closed { color:var(--c-low);background:var(--c-low)18;border:1px solid var(--c-low)30; }
.rpt-status-open { color:var(--t3);background:var(--bg3);border:1px solid var(--b1); }
.rpt-field { padding:10px 14px;border-top:1px solid var(--b1); }
.rpt-field-label { font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--t3);margin-bottom:5px; }
.rpt-field-val  { font-size:12px;color:var(--t2);line-height:1.6; }
.rpt-field-rem  { font-size:12px;color:var(--c-low);line-height:1.6; }
.rpt-field-retest { background:var(--c-med)0d;border:1px solid var(--c-med)30;border-left:3px solid var(--c-med);border-radius:6px;padding:10px 14px;margin:10px 14px 0 22px; }
.rpt-field-retest .rpt-field-label { color:var(--c-med); }
.rpt-code { background:var(--bg);border-radius:5px;padding:8px 10px;font-family:var(--mono);font-size:11px;color:var(--t2);line-height:1.6;border:1px solid var(--b1);white-space:pre-wrap;word-break:break-all; }
.rpt-divider { border:none;border-top:1px solid var(--b1);margin:32px 0; }

/* ── WSTG vuln items ─────────────────────────────────────────────── */
.rpt-wstg-vuln { padding:11px 14px;border:1px solid var(--b1);border-left:4px solid var(--c-crit);border-radius:6px;margin-bottom:8px;background:var(--bg2); }

/* ── Evidence ────────────────────────────────────────────────────── */
.rpt-evidence-grid { display:flex;flex-direction:column;gap:12px;margin-top:6px; }
.rpt-evidence-img { max-width:100%;max-height:600px;border-radius:6px;border:1px solid var(--b1);object-fit:contain;display:block; }

/* ── Findings index table (before details) ───────────────────────── */
.rpt-idx-num  { width:52px;font-family:var(--mono);color:var(--t3);white-space:nowrap; }
.rpt-idx-sev  { width:90px; }
.rpt-idx-status { width:100px; }

@page { size: A4 portrait; margin:0; }

@media print {
  :root {
    /* Legacy variable names (kept for compatibility) */
    --text:    #111111;
    --text2:   #333333;
    --text3:   #666666;
    --surface: #f9f9f9;
    --border:  #e0e0e0;
    --border2: #d0d0d0;
    --green:   #15803d;
    --red:     #b91c1c;
    --accent:  #6d28d9;
    --accent2: #22d3a3;
    --blue:    #1d4ed8;
    --mono:    'JetBrains Mono', monospace;
    /* Signal design system variables — override dark theme for print */
    --bg:  #ffffff;
    --bg1: #ffffff;
    --bg2: #f8f8fa;
    --bg3: #f0f0f4;
    --bg4: #e8e8ee;
    --b1:  #e0e0e8;
    --b2:  #ccccda;
    --t1:  #0d0d14;
    --t2:  #3a3a4a;
    --t3:  #666677;
    --t4:  #9898aa;
  }
  * { -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important; }

  /* ── Hide UI chrome ─────────────────────────────────── */
  .topbar,.sidenav,.sidebar,.exp-editor,.export-controls,
  .no-print,.toast-container,#loading-overlay { display:none!important; }

  /* ── Page header / footer — real thead/tfoot repeating on every page ── */
  .rpt-ph:not(.enabled),.rpt-pf:not(.enabled) { display:none!important; }
  .rpt-ph.enabled,.rpt-pf.enabled {
    position:static!important;max-width:none;margin:0;
    background:#fff!important;border:none!important;border-radius:0!important;
  }
  .rpt-phw-head,.rpt-phw-foot { display:none!important; }
  #rpt-ph-wrap.ph-active .rpt-phw-head { display:table-header-group!important; }
  #rpt-ph-wrap.pf-active .rpt-phw-foot { display:table-footer-group!important; }
  /* Remove top/bottom padding from body cell when header/footer are active */
  #rpt-ph-wrap.ph-active > tbody > tr > td { padding-top:0!important; }
  #rpt-ph-wrap.pf-active > tbody > tr > td { padding-bottom:0!important; }
  .rpt-pf-pgnum-screen { display:none!important; }
  .rpt-pf-pgnum-wrap::after { content:attr(data-pre) counter(page);font-family:monospace;font-size:10px;color:#666; }

  /* ── Reset layout — prevent clipping ────────────────── */
  html,body { display:block!important;background:#fff!important;margin:0!important;padding:0!important;height:auto!important;overflow:visible!important;width:210mm!important;max-width:210mm!important;min-width:0!important; }
  .workarea,.main { display:block!important;margin:0!important;padding:0!important;width:100%!important;max-width:100%!important;height:auto!important;overflow:visible!important; }
  .exp-layout  { display:block!important;overflow:visible!important;height:auto!important; }
  .exp-inner   { display:block!important;overflow:visible!important;height:auto!important;min-height:0!important;margin:0!important;padding:0!important;border:0!important; }
  .exp-preview { display:block!important;overflow:visible!important;padding:0!important;width:100%!important;height:auto!important; }
  #report-preview { max-width:100%!important;margin:0!important; }

  /* ── URL / long text wrapping ───────────────────────── */
  .rpt-cover-cell-val, .rpt-field-val, .rpt-code, .rpt-table td {
    word-break:break-all!important;overflow-wrap:break-word!important;
  }

  /* ── Cover page ────────────────────────────────────────────────── */
  .rpt-cover-page { page-break-after:always;break-after:page;min-height:0;margin-bottom:0; }

  /* ── Page-break rules ───────────────────────────────── */
  .rpt-vuln      { page-break-inside:avoid;break-inside:avoid; }
  .rpt-wstg-vuln { page-break-inside:avoid;break-inside:avoid; }
  .rpt-summary   { page-break-inside:avoid;break-inside:avoid; }
  .rpt-cover-grid{ page-break-inside:avoid;break-inside:avoid; }
  .rpt h2 { page-break-after:avoid;break-after:avoid; }
  .rpt h3,.rpt-sub-title { page-break-after:avoid;break-after:avoid; }
  .rpt-table { page-break-inside:auto;border-collapse:separate!important;border-spacing:0!important; }
  .rpt-table tr { page-break-inside:avoid;break-inside:avoid; }
  .rpt-table, .rpt-risk-class { border-collapse:separate!important;border-spacing:0!important; }
  .rpt-table td, .rpt-table th,
  .rpt-risk-class td, .rpt-risk-class th { display:table-cell!important;vertical-align:top!important;padding:10px 12px!important; }

  /* ── Base text ──────────────────────────────────────── */
  .rpt { color:#111!important; }
  .rpt p, .rpt-field-val  { color:#333!important; }
  .rpt h2 { color:#444!important;border-color:#ccc!important; }
  .rpt h2::before { background:#666!important; }
  .rpt h3 { color:#222!important; }
  .rpt-sub-title { color:#555!important;border-bottom-color:#ccc!important; }
  .rpt-sub-title::before { background:#888!important; }
  .rpt-cover-meta { border-color:#ddd!important; }
  .rpt-cover-meta-row { border-color:#e0e0e0!important; }
  .rpt-cover-meta-cell { border-color:#e0e0e0!important; }
  .rpt-cover-meta-label { color:#888!important; }
  .rpt-cover-meta-val   { color:#111!important; }
  .rpt-cover-type { color:#3b82f6!important;border-color:#3b82f644!important; }
  .rpt-cover-conf { color:#ef4444!important;border-color:#ef444444!important; }
  .rpt-cover-bar  { background:var(--a)!important; }
  .rpt-cover-page-bar  { background:var(--a)!important; }
  .rpt-cover-page-type { color:#3b82f6!important;border-color:#3b82f644!important; }
  .rpt-cover-page-h1   { color:#111!important; }
  .rpt-cover-page-client { color:#666!important; }
  .rpt-cover-logo-ph   { color:#6d28d9!important;background:#ede9fe!important;border-color:#c4b5fd!important; }

  /* ── Severity colours (keep in print) ───────────────── */
  .sev-critical,.sev-badge.sev-critical { background:#fef2f2!important;color:#b91c1c!important;border-color:#fca5a5!important; }
  .sev-high,    .sev-badge.sev-high     { background:#fff7ed!important;color:#c2410c!important;border-color:#fdba74!important; }
  .sev-medium,  .sev-badge.sev-medium   { background:#fefce8!important;color:#92400e!important;border-color:#fde68a!important; }
  .sev-low,     .sev-badge.sev-low      { background:#f0fdf4!important;color:#15803d!important;border-color:#86efac!important; }
  .sev-info,    .sev-badge.sev-info     { background:#f9fafb!important;color:#374151!important;border-color:#d1d5db!important; }

  .card-critical { background:#fef2f2!important;border-color:#fca5a5!important;color:#b91c1c!important; }
  .card-high     { background:#fff7ed!important;border-color:#fdba74!important;color:#c2410c!important; }
  .card-medium   { background:#fefce8!important;border-color:#fde68a!important;color:#92400e!important; }
  .card-low      { background:#f0fdf4!important;border-color:#86efac!important;color:#15803d!important; }
  .card-info     { background:#f9fafb!important;border-color:#d1d5db!important;color:#374151!important; }
  .card-wstg     { background:#f0fdf4!important;border-color:#86efac!important;color:#15803d!important; }

  /* ── Vuln card coloured borders (keep in print) ──────── */
  .rpt-vuln          { border-color:#ddd!important;overflow:visible!important; }
  .rpt-vuln-critical { border-left:4px solid #ef4444!important; }
  .rpt-vuln-high     { border-left:4px solid #f97316!important; }
  .rpt-vuln-medium   { border-left:4px solid #eab308!important; }
  .rpt-vuln-low      { border-left:4px solid #059669!important; }
  .rpt-vuln-info     { border-left:4px solid #6b7280!important; }
  .rpt-vuln-header   { background:#f9f9f9!important; }
  .rpt-vuln-name     { color:#111!important; }
  .rpt-vuln-cat      { color:#666!important; }
  .rpt-vuln-status   { background:#f0f0f0!important;border-color:#ddd!important;color:#444!important; }

  /* ── Other elements ─────────────────────────────────── */
  .rpt-field-label { color:#888!important; }
  .rpt-field-rem   { color:#155724!important; }
  .rpt-field-val   { color:#333!important; }
  .rpt-field-retest { background:#fffbeb!important;border-color:#fde68a!important;color:#92400e!important; }
  .rpt-field-retest .rpt-field-label { color:#92400e!important; }
  .rpt-code        { background:#f4f4f4!important;color:#333!important;border-color:#ddd!important; }
  .rpt-wstg-vuln   { background:#fafafa!important;border-color:#ddd!important;border-left-color:#ef4444!important; }
  .rpt-table th    { background:#f5f5f5!important;color:#666!important;border-color:#ddd!important; }
  .rpt-table th    { padding:9px 12px!important; }
  .rpt-table td    { color:#333!important;border-color:#eee!important;vertical-align:middle!important;padding:9px 12px!important; }
  .rpt-table tr:hover td { background:transparent!important; }
  .rpt-mini-fill   { background:#555!important; }
  .rpt-mini-bar    { background:#ddd!important; }
  .rpt-divider     { border-color:#ddd!important; }
  .rpt-risk-bar    { gap:2px; }
  .rpt-risk-legend-item { color:#555!important; }
  .rpt-status-done { background:#f0fdf4!important;color:#15803d!important;border-color:#86efac!important; }
  .rpt-status-fail { background:#fef2f2!important;color:#b91c1c!important;border-color:#fca5a5!important; }
  .rpt-status-remediated      { background:#fffbeb!important;color:#b45309!important;border-color:#fde68a!important; }
  .rpt-status-not_remediated  { background:#fef2f2!important;color:#b91c1c!important;border-color:#fca5a5!important; }
  .rpt-status-verified_closed { background:#f0fdf4!important;color:#15803d!important;border-color:#86efac!important; }
  .rpt-status-open            { background:#f0f0f0!important;color:#444!important;border-color:#ddd!important; }
.rpt-toc { background:#f7f7f7!important;border-color:#ddd!important; }
  .rpt-risk-class th { background:#f5f5f5!important;color:#666!important;border-color:#ddd!important; }
  .rpt-risk-class th { padding:9px 12px!important; }
  .rpt-risk-class td { color:#333!important;border-color:#eee!important;vertical-align:middle!important;padding:9px 12px!important; }
}


/* ── Report meta editor inputs ───────────────────────────────────── */
.exp-input { width:100%;background:var(--bg);border:1px solid var(--b1);border-radius:5px;color:var(--t1);font-size:11px;font-family:inherit;padding:5px 8px;box-sizing:border-box; }
.exp-input:focus { outline:none;border-color:var(--a); }
.exp-meta-row { display:flex;flex-direction:column;gap:3px;margin-bottom:8px; }

/* ── TOC ─────────────────────────────────────────────────────────── */
.rpt-toc { background:var(--bg2);border:1px solid var(--b1);border-radius:8px;padding:16px 20px;margin:0 0 28px; }
.rpt-toc-title { font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--t3);margin-bottom:10px; }
.rpt-toc-item { font-size:13px;color:var(--t2);padding:3px 0;display:flex;gap:8px; }
.rpt-toc-item.rpt-toc-sub { font-size:11px;padding:1px 0 1px 22px;color:var(--t3); }
.rpt-toc-num { font-family:var(--mono);font-size:11px;color:var(--t3);min-width:22px; }
.rpt-toc-item.rpt-toc-sub .rpt-toc-num { min-width:32px; }

/* ── Prose sections ──────────────────────────────────────────────── */
.rpt-prose { font-size:var(--rpt-base-size,13px);color:var(--t2);line-height:1.7;margin:6px 0 20px; }
.rpt-prose h2 { font-size:15px;font-weight:700;margin:16px 0 6px;color:var(--t1);border:none;text-transform:none;letter-spacing:0;padding:0; }
.rpt-prose h2::before { display:none; }
.rpt-prose h3 { font-size:13px;font-weight:700;margin:12px 0 5px;color:var(--t1); }
.rpt-prose ul,.rpt-prose ol { padding-left:20px;margin:5px 0; }
.rpt-prose li { margin:3px 0; }
.rpt-prose a { color:var(--a);text-decoration:underline; }
.rpt-prose blockquote { border-left:3px solid var(--a);margin:8px 0;padding:4px 12px;color:var(--t2);font-style:italic; }
.rpt-prose pre { background:var(--bg3);border:1px solid var(--b1);border-radius:5px;padding:10px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;margin:8px 0; }

/* ── Rich text editor ────────────────────────────────────────────── */
.rich-tb { display:flex;align-items:center;gap:1px;padding:4px 6px;background:var(--bg3);border:1px solid var(--b1);border-radius:5px 5px 0 0;flex-wrap:wrap;gap:2px; }
.rich-tb-btn { background:none;border:1px solid transparent;border-radius:3px;cursor:pointer;color:var(--t2);font-size:11px;padding:2px 5px;line-height:1.5;min-width:24px;height:24px;text-align:center;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:1px; }
.rich-tb-btn .fd-icon { vertical-align:0; }
.rich-tb-caret { opacity:.55;margin-left:-1px; }
.rich-tb-btn:hover { background:var(--bg);border-color:var(--b1); }
.rich-tb-btn.active { background:var(--a)18;border-color:var(--a)55;color:var(--a); }
.rich-tb-sep { width:1px;height:13px;background:var(--b1);margin:0 2px;flex-shrink:0; }
.rich-editor { min-height:80px;max-height:280px;overflow-y:auto;padding:8px 10px;background:var(--bg);border:1px solid var(--b1);border-top:none;border-radius:0 0 5px 5px;color:var(--t1);font-size:13px;line-height:1.7;outline:none;word-break:break-word; }
.rich-editor:focus { border-color:var(--a); }
.rich-editor h2 { font-size:15px;font-weight:700;margin:10px 0 4px; }
.rich-editor h3 { font-size:13px;font-weight:700;margin:8px 0 3px; }
.rich-editor h4 { font-size:12px;font-weight:700;margin:6px 0 3px;text-transform:uppercase;letter-spacing:.05em;color:var(--t3); }
.rich-editor ul,.rich-editor ol { padding-left:20px;margin:4px 0; }
.rich-editor li { margin:2px 0; }
.rich-editor a { color:#7c3aed;text-decoration:underline; }
.rich-editor blockquote { border-left:3px solid var(--a);margin:6px 0;padding:3px 10px;color:var(--t3);font-style:italic; }
.rich-editor pre { background:var(--bg3);border:1px solid var(--b1);border-radius:4px;padding:7px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;margin:5px 0; }
.rich-editor table { border-collapse:collapse;width:100%;margin:6px 0; }
.rich-editor th { background:var(--bg3);font-weight:600;font-size:11px;padding:5px 9px;border:1px solid var(--b2);text-align:left; }
.rich-editor td { padding:5px 9px;border:1px solid var(--b2);font-size:12px;vertical-align:top; }
.rich-editor hr { border:none;border-top:1px solid var(--b1);margin:10px 0; }
.rich-editor img { max-width:100%;border-radius:4px;margin:4px 0;display:block; }

/* ── Table grid picker ───────────────────────────────────────────── */
.rich-tg { display:grid;grid-template-columns:repeat(8,16px);gap:2px; }
.rich-tc { width:16px;height:16px;border:1px solid var(--b2);border-radius:2px;cursor:pointer;transition:background .08s,border-color .08s; }
.rich-tc.active { background:var(--a)55;border-color:var(--a); }
.rich-tc:hover  { background:var(--a)33;border-color:var(--a); }
.rich-tg-label  { font-family:var(--mono);font-size:10px;color:var(--a);text-align:center;margin-top:6px;min-height:14px;letter-spacing:.04em; }
.rich-tiny-input { width:44px;background:var(--bg);border:1px solid var(--b1);border-radius:4px;padding:3px 5px;color:var(--t1);font-family:var(--mono);font-size:11px;outline:none;text-align:center; }
.rich-tiny-input:focus { border-color:var(--a); }
/* ── Font-size input ─────────────────────────────────────────────── */
.rich-fs-input { width:38px;height:22px;background:var(--bg3);border:1px solid var(--b1);border-radius:3px;color:var(--t2);font-family:var(--mono);font-size:10px;padding:1px 4px;outline:none;text-align:center;-moz-appearance:textfield; }
.rich-fs-input:focus { border-color:var(--a); }
.rich-fs-input::-webkit-inner-spin-button,.rich-fs-input::-webkit-outer-spin-button { -webkit-appearance:none; }
/* ── Context toolbars (table / image) ────────────────────────────── */
.rich-ctx-tb { position:fixed;z-index:9500;background:var(--bg2);border:1px solid var(--b1);border-radius:6px;padding:3px 4px;display:none;align-items:center;gap:2px;box-shadow:0 4px 20px rgba(0,0,0,.4);pointer-events:all; }
.rich-ctx-lbl { font-family:var(--mono);font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:0 3px 0 1px; }
.rich-ctx-pos { font-family:var(--mono);font-size:10px;font-weight:600;color:var(--a);padding:0 5px;white-space:nowrap; }
.rich-tb-btn:disabled { opacity:.3;cursor:not-allowed; }
.rich-tb-btn:disabled:hover { background:none;border-color:transparent; }
/* Bands sit above the modal (9000) but below the context toolbar (9500). */
.rich-tbl-hl { position:fixed;z-index:9400;pointer-events:none;display:none;background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.40);border-radius:2px; }
/* ── Active section edit button ──────────────────────────────────── */
.sec-btn.active { color:var(--a)!important;border-color:var(--a)55!important;background:var(--a)10!important; }
.rich-color-wrap { position:relative;display:inline-flex; }
.rich-color-palette { position:fixed;top:0;left:0;background:var(--bg2);border:1px solid var(--b1);border-radius:6px;padding:7px;display:none;flex-wrap:wrap;gap:3px;z-index:9600;box-shadow:0 6px 20px rgba(0,0,0,.25);width:140px; }
.rich-color-palette.open { display:flex; }
/* Table picker stacks its grid/label/controls — don't let shrink-to-fit
   spread them across a row now that the palette is position:fixed. */
.rich-color-palette.rich-tp { flex-direction:column;align-items:stretch;width:auto;padding:10px; }
.rich-sw { width:18px;height:18px;border-radius:3px;cursor:pointer;border:1px solid rgba(128,128,128,.2);flex-shrink:0;transition:transform .1s; }
.rich-sw:hover { transform:scale(1.25);z-index:1;position:relative; }

/* ── Risk classification table ───────────────────────────────────── */
.rpt-risk-class { width:100%;border-collapse:separate;border-spacing:0;font-size:12px;margin:10px 0 24px; }
.rpt-risk-class th { text-align:left;padding:9px 12px;background:var(--bg3);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--t3);border-bottom:1px solid var(--b1); }
.rpt-risk-class td { padding:7px 12px;border-bottom:1px solid var(--b1);color:var(--t2);vertical-align:top; }
.rpt-risk-class tr:last-child td { border-bottom:none; }


/* ── Cover page (full dedicated first page) ──────────────────────── */
.rpt-cover-page { display:flex;flex-direction:column;min-height:88vh;margin-bottom:60px; }
.rpt-cover-page-bar { height:4px;background:var(--a);flex-shrink:0; }
.rpt-cover-page-body { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px 40px;gap:36px;text-align:center; }
.rpt-cover-logo-wrap { display:flex;align-items:center;justify-content:center; }
.rpt-cover-logo-ph { width:96px;height:96px;border-radius:16px;background:rgba(124,58,237,.09);border:2px solid rgba(124,58,237,.2);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--a); }
.rpt-cover-title-block { display:flex;flex-direction:column;align-items:center;gap:14px; }
.rpt-cover-page-type { font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--a);border:1px solid rgba(124,58,237,.27);border-radius:3px;padding:4px 14px; }
.rpt-cover-page-h1 { font-size:36px;font-weight:800;letter-spacing:-.03em;color:var(--t1);margin:0;line-height:1.1; }
.rpt-cover-page-client { font-size:15px;color:var(--t3);font-style:italic; }
.rpt-cover-page-footer { padding:0 40px 40px;flex-shrink:0; }

/* ── Free Edit modal ─────────────────────────────────────────────── */
.fe-modal { position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px); }
.fe-modal-inner { background:var(--bg2);border:1px solid var(--b1);border-radius:10px;display:flex;flex-direction:column;width:100%;max-width:900px;height:100%;max-height:calc(100vh - 48px);overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.4);transition:max-width .2s ease; }
.fe-modal-inner.split { max-width:1440px; }
.fe-body { flex:1;display:flex;overflow:hidden;min-height:0; }
#fe-preview { flex:1;overflow-y:auto;padding:32px 40px;border-left:1px solid var(--b1);background:var(--bg);display:none; }
#fe-preview.open { display:block; }

/* ── Small buttons (rich-text modals, templates) ─────────────────── */
.sec-btn { background:none;border:1px solid var(--b1);border-radius:3px;cursor:pointer;color:var(--t3);font-size:10px;padding:2px 5px;line-height:1.5;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;gap:4px; }
.sec-btn .fd-icon, .sec-drag .fd-icon, .btn-remove .fd-icon { vertical-align:0; }
.sec-drag, .btn-remove { display:inline-flex;align-items:center;justify-content:center; }
.sec-btn:hover { color:var(--t1);border-color:var(--t3);background:var(--bg3); }
.sec-btn.del:hover { color:var(--c-crit);border-color:var(--c-crit)55;background:var(--c-crit)08; }
/* ── Section numbering prefix (rendered in the report) ── */
.sec-num-prefix { color:var(--t3);font-weight:400;margin-right:3px; }

/* ── Rich editor interaction cursors ─────────────────────────────── */
.rich-editor td,.rich-editor th { cursor:cell; }
.rich-editor td:hover,.rich-editor th:hover { background:var(--a)0e!important; }
.rich-editor img { cursor:pointer;transition:outline .1s; }
.rich-editor img:hover { outline:2px solid var(--a)88;border-radius:2px; }

/* ── Watermark ───────────────────────────────────────────────────── */
/* The element is deliberately EMPTY: the mark is painted as an SVG background
   image (see applyWatermark). A real text node here ended up in the PDF's text
   layer, so selecting a paragraph in the exported file dragged "CONFIDENTIAL"
   into the clipboard along with it. A background image has nothing to select.
   --wm-screen / --wm-print are set inline by applyWatermark. */
#rpt-watermark {
  display:none;pointer-events:none;user-select:none;
  background-repeat:no-repeat;background-position:center;background-size:contain;
  z-index:9999;
}
#rpt-watermark.wm-on { display:block; }
/* screen: absolute inside exp-preview so it doesn't cover the editor panel */
@media screen {
  #rpt-watermark.wm-on {
    position:absolute;top:50%;left:50%;
    width:620px;height:620px;transform:translate(-50%,-50%);
    background-image:var(--wm-screen);opacity:.07;
  }
}
/* print: fixed so it repeats on every page */
@media print {
  #rpt-watermark.wm-on {
    position:fixed!important;top:50%!important;left:50%!important;
    width:19cm!important;height:19cm!important;
    transform:translate(-50%,-50%)!important;
    background-image:var(--wm-print)!important;opacity:.09!important;
    print-color-adjust:exact!important;-webkit-print-color-adjust:exact!important;
  }
}

/* ── Screen-only: proper full-height independent scroll ──────────── */
@media screen {
  body { height:100vh!important;overflow:hidden; }
  .workarea { overflow:hidden;min-height:0; }
  /* Reset table wrapper to block so screen preview looks normal */
  #rpt-ph-wrap { display:block;width:100%; }
  #rpt-ph-wrap > thead, #rpt-ph-wrap > tfoot, #rpt-ph-wrap > tbody { display:block;border:none; }
  #rpt-ph-wrap > thead > tr, #rpt-ph-wrap > tfoot > tr, #rpt-ph-wrap > tbody > tr { display:block;border:none; }
  #rpt-ph-wrap > thead > tr > td, #rpt-ph-wrap > tfoot > tr > td, #rpt-ph-wrap > tbody > tr > td { display:block;border:none;padding:0 !important; }
}

/* ── Page header / footer ────────────────────────────────────────── */
.rpt-ph, .rpt-pf {
  display:none;max-width:720px;margin:0 auto;
  padding:7px 12px;align-items:center;gap:10px;
  background:var(--bg3);border-radius:5px;
  font-size:11px;color:var(--t2);font-family:inherit;
}
.rpt-ph.enabled,.rpt-pf.enabled { display:flex; }
.rpt-ph { margin-bottom:20px; }
.rpt-pf { margin-top:20px; }
.rpt-ph-logo { height:26px;width:auto;flex-shrink:0;border-radius:3px;vertical-align:middle; }
.rpt-ph-l,.rpt-ph-c,.rpt-ph-r { flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.rpt-ph-c { text-align:center; }
.rpt-ph-r { text-align:right; }
.rpt-pf-pgnum-screen { font-family:var(--mono);font-size:10px;color:var(--t3); }
</style>
</head>
<body>

<div id="loading-overlay" class="ovl-shell"><div class="skel-wrap"><div class="skel-stats"><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div></div><div class="skel-block skel-tall"></div><div class="skel-block skel-tall"></div></div></div>
<nav class="sidenav" id="sidenav"></nav>
<header class="topbar" id="topbar"></header>
<div class="workarea no-activity">
<main class="main rpt-main exp-root">

    <!-- Page head (screen only: .export-controls is hidden for print and in the headless PDF) -->
    <div class="export-controls exp-head no-print">
      <div style="min-width:0">
        <div class="exp-eyebrow"><span id="export-project-name">—</span> · Informe<span id="exp-eyebrow-ver"></span></div>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <h1 class="exp-h1">Report</h1>
          <span id="rpt-save-status" class="exp-save" role="status"><span class="exp-save-dot" aria-hidden="true"></span><span id="rpt-save-text">cargando…</span></span>
        </div>
      </div>

      <div class="exp-head-ctrls">
        <div>
          <label for="export-scope" class="form-label">Alcance</label>
          <!-- #export-scope and #report-type are also driven by the headless PDF
               render (value + change event): keep both ids and the change handler. -->
          <select id="export-scope" class="form-input" style="width:160px;height:28px;font-size:11px" onchange="setReportScope(this.value)">
            <option value="all">Informe completo</option>
            <option value="vulns">Solo hallazgos</option>
            <option value="wstg">Solo WSTG</option>
          </select>
        </div>
        <div>
          <span class="form-label" id="rtype-label">Tipo</span>
          <div class="tab-row" role="group" aria-labelledby="rtype-label" id="rtype-seg">
            <button type="button" class="tab-btn" data-rtype="technical" aria-pressed="false" onclick="setReportType('technical')" title="Informe técnico completo, con el detalle de cada hallazgo">Técnico</button>
            <button type="button" class="tab-btn" data-rtype="executive" aria-pressed="false" onclick="setReportType('executive')" title="Para la gerencia: riesgo general, matriz y hoja de ruta">Ejecutivo</button>
            <button type="button" class="tab-btn" data-rtype="retest" aria-pressed="false" onclick="setReportType('retest')" title="Estado de remediación de cada hallazgo">Retest</button>
          </div>
          <select id="report-type" hidden data-native aria-hidden="true" tabindex="-1" onchange="setReportType(this.value)">
            <option value="technical">Técnico</option>
            <option value="executive">Ejecutivo</option>
            <option value="retest">Retest</option>
          </select>
        </div>
        <div class="exp-vsep" aria-hidden="true"></div>
        <div style="display:flex;gap:4px">
          <button type="button" id="btn-undo" class="btn btn-icon" onclick="rptUndo()" aria-label="Deshacer" title="Nada para deshacer" disabled data-icon="undo-2" data-icon-size="14"></button>
          <button type="button" id="btn-redo" class="btn btn-icon" onclick="rptRedo()" aria-label="Rehacer" title="Nada para rehacer" disabled data-icon="redo-2" data-icon-size="14"></button>
          <div class="exp-menu-wrap">
            <button type="button" id="btn-more" class="btn btn-icon" onclick="toggleExpMenu('more')" aria-label="Más acciones" aria-haspopup="menu" aria-expanded="false">⋯</button>
            <div class="exp-menu" id="exp-menu-more" role="menu" style="width:260px">
              <button type="button" role="menuitem" class="exp-menu-item" onclick="closeExpMenus();copyMarkdown()"><span>Copiar Markdown</span><span class="exp-menu-help">El informe como texto, al portapapeles</span></button>
              <button type="button" role="menuitem" class="exp-menu-item" id="btn-free-edit" onclick="closeExpMenus();confirmFreeEdit()"><span>Edición libre</span><span class="exp-menu-help">Editar el informe completo en Markdown</span></button>
              <button type="button" role="menuitem" class="exp-menu-item" onclick="closeExpMenus();window.print()"><span>Imprimir</span><span class="exp-menu-help">Diálogo de impresión del navegador (Ctrl+P)</span></button>
            </div>
          </div>
        </div>
        <!-- Actions (lead only — replaced by a note for other roles in pageInit) -->
        <div id="export-actions" style="display:flex;gap:4px;align-items:flex-end">
          <button type="button" class="btn" onclick="exportDocx()" title="Word con estilos nativos, para editarlo a mano" data-icon="download" data-icon-size="13">Word</button>
          <div class="exp-menu-wrap">
            <button type="button" id="btn-export-menu" class="btn btn-accent" onclick="toggleExpMenu('export')" aria-haspopup="true" aria-expanded="false">Export PDF ▾</button>
            <div class="exp-menu" id="exp-menu-export" style="width:290px;padding:12px">
              <div style="display:flex;flex-direction:column;gap:10px">
                <div>
                  <label for="pdf-password-input" class="form-label">Contraseña del PDF <span style="text-transform:none;letter-spacing:0">(opcional)</span></label>
                  <div style="display:flex;gap:4px">
                    <input id="pdf-password-input" class="form-input" type="password" autocomplete="new-password" placeholder="Sin contraseña" style="flex:1 1 auto;min-width:0" oninput="setRptMeta('pdfPassword',this.value)">
                    <button type="button" class="btn" style="height:32px" onclick="togglePdfPasswordVisible(this)">ver</button>
                  </div>
                </div>
                <button type="button" class="btn btn-prim" style="height:32px;justify-content:center" onclick="exportPdf()">Generar PDF</button>
                <div class="insp-help">PDF renderizado en el servidor · igual en todos los dispositivos. El Word sale con estilos nativos para editarlo a mano.</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="rpt-role-banner" class="exp-role-banner no-print" role="status" hidden></div>

    <!-- Workspace: outline · preview · inspector -->
    <div class="exp-layout">

      <!-- Outline -->
      <nav class="exp-editor exp-outline no-print" id="exp-outline" aria-label="Estructura del documento">
        <div class="ol-head">
          <div class="ol-title">
            <span>Documento</span>
            <button type="button" class="btn" onclick="secAddCustom()" title="Agregar una sección de texto en blanco al final">+ Sección</button>
          </div>
          <div class="ol-grid2">
            <button type="button" class="btn" id="ol-style-btn" onclick="selectNode('style')">Estilo y página</button>
            <button type="button" class="btn" onclick="openTemplatesModal()">Plantillas</button>
          </div>
          <label for="ol-q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Buscar en el documento</label>
          <input id="ol-q" class="form-input ol-search" type="search" placeholder="Buscar sección o hallazgo…" oninput="setOutlineQuery(this.value)">
          <div id="ol-banners" style="display:flex;flex-direction:column;gap:6px"></div>
        </div>
        <div class="ol-scroll" id="ol-scroll">
          <ul class="ol-list" id="ol-list"></ul>
        </div>
      </nav>

      <!-- Preview (center). .exp-inner / .exp-preview are reset to plain blocks for print. -->
      <div class="exp-inner">
        <div class="exp-pv-bar no-print" id="exp-pv-bar"></div>
        <div class="exp-preview" style="position:relative">
          <div id="rpt-watermark" class="rpt-watermark"></div>
          <table id="rpt-ph-wrap" style="width:100%;border-collapse:collapse;border:none">
            <thead class="rpt-phw-head">
              <tr><td style="padding:0.5cm 2cm 0.2cm"><div id="rpt-ph" class="rpt-ph"></div></td></tr>
            </thead>
            <tfoot class="rpt-phw-foot">
              <tr><td style="padding:0.2cm 2cm 0.4cm"><div id="rpt-pf" class="rpt-pf"></div></td></tr>
            </tfoot>
            <tbody>
              <tr><td style="padding:1.8cm 2cm;vertical-align:top">
                <div id="report-preview" class="rpt" style="max-width:720px;margin:0 auto"></div>
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Inspector -->
      <aside class="exp-editor exp-inspector no-print" id="exp-inspector" aria-label="Inspector"></aside>
    </div>

</main>
</div>

<!-- Table context toolbar -->
<div id="rich-ctx-table" class="rich-ctx-tb no-print">
  <span class="rich-ctx-pos" id="rich-tbl-pos">R1·C1</span>
  <span class="rich-tb-sep"></span>
  <span class="rich-ctx-lbl">Row</span>
  <button class="rich-tb-btn" onclick="richTableAddRow('above')" title="Insert row above"   data-icon="arrow-up"   data-icon-size="14"></button>
  <button class="rich-tb-btn" onclick="richTableAddRow('below')" title="Insert row below"   data-icon="arrow-down" data-icon-size="14"></button>
  <button class="rich-tb-btn" id="rich-tbl-delrow" onclick="richTableDelRow()" title="Delete this row" data-icon="trash-2" data-icon-size="14"></button>
  <span class="rich-tb-sep"></span>
  <span class="rich-ctx-lbl">Col</span>
  <button class="rich-tb-btn" onclick="richTableAddCol('left')"  title="Insert column left"  data-icon="arrow-left"  data-icon-size="14"></button>
  <button class="rich-tb-btn" onclick="richTableAddCol('right')" title="Insert column right" data-icon="arrow-right" data-icon-size="14"></button>
  <button class="rich-tb-btn" id="rich-tbl-delcol" onclick="richTableDelCol()" title="Delete this column" data-icon="trash-2" data-icon-size="14"></button>
  <span class="rich-tb-sep"></span>
  <button class="rich-tb-btn" style="color:var(--c-crit)" onclick="richTableDelete()" title="Delete entire table" data-icon="trash-2" data-icon-size="14"></button>
</div>
<!-- Row / column highlight bands. Overlays, never DOM inside the editor, so
     the active-cell feedback can't leak into the saved report HTML. -->
<div id="rich-tbl-hl-row" class="rich-tbl-hl no-print"></div>
<div id="rich-tbl-hl-col" class="rich-tbl-hl no-print"></div>

// ── Styled markdown renderer (uses .rpt CSS classes) ─────────────
function renderMdStyled(raw) {
  if (!raw) return '';
  const _e = s => typeof s==='string' ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
  function inline(text) {
    const parts = []; const re = /`([^`]+)`/g; let last = 0, m;
    function applyBoldItalic(t) {
      return _e(t).replace(/\*\*([^*<>]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*<>]+)\*/g,'<em>$1</em>');
    }
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parts.push(applyBoldItalic(text.slice(last, m.index)));
      parts.push(`<code style="font-family:var(--mono);font-size:11px;background:var(--bg3);padding:1px 5px;border-radius:3px">${_e(m[1])}</code>`);
      last = m.index + m[0].length;
    }
    if (last < text.length) parts.push(applyBoldItalic(text.slice(last)));
    return parts.join('');
  }
  function flushTable(rows, out) {
    if (!rows.length) return;
    const [head, , ...body] = rows;
    const cols = head.split('|').slice(1,-1).map(c => c.trim());
    out.push(`<table class="rpt-table" style="margin:10px 0"><thead><tr>${cols.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>`);
    body.forEach(row => {
      const cells = row.split('|').slice(1,-1).map(c => c.trim());
      out.push(`<tr>${cols.map((_,i)=>`<td>${inline(cells[i]||'')}</td>`).join('')}</tr>`);
    });
    out.push('</tbody></table>');
  }
  const lines = raw.split('\n'), out = [];
  let inCode=false, codeLines=[], tableRows=[], inList=false;
  function endList() { if (inList) { out.push('</ul>'); inList=false; } }
  function endTable() { if (tableRows.length) { flushTable(tableRows, out); tableRows=[]; } }
  for (const line of lines) {
    if (!inCode && line.startsWith('```')) { endList(); endTable(); inCode=true; codeLines=[]; continue; }
    if (inCode) {
      if (line.startsWith('```')) { inCode=false; out.push(`<pre class="rpt-code" style="margin:8px 0"><code>${_e(codeLines.join('\n'))}</code></pre>`); codeLines=[]; }
      else codeLines.push(line);
      continue;
    }
    if (/^\|.+\|/.test(line)) { endList(); tableRows.push(line); continue; }
    endTable();
    if (line.startsWith('#### ')) { endList(); out.push(`<h3 style="font-size:12px;font-weight:700;margin:18px 0 8px;color:var(--t1)">${inline(line.slice(5))}</h3>`); continue; }
    if (line.startsWith('### '))  { endList(); out.push(`<h3>${inline(line.slice(4))}</h3>`); continue; }
    if (line.startsWith('## '))   { endList(); out.push(`<h2>${inline(line.slice(3))}</h2>`); continue; }
    if (line.startsWith('# '))    { endList(); out.push(`<h1 style="font-size:26px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em">${inline(line.slice(2))}</h1>`); continue; }
    if (/^[-*] /.test(line)) {
      if (!inList) { out.push('<ul style="padding-left:18px;margin:6px 0">'); inList=true; }
      out.push(`<li style="color:var(--t2);font-size:13px;line-height:1.7;margin:2px 0">${inline(line.slice(2))}</li>`);
      continue;
    }
    endList();
    if (line.trim() === '') { out.push('<div style="height:8px"></div>'); continue; }
    out.push(`<p>${inline(line)}</p>`);
  }
  endList(); endTable();
  if (inCode) out.push(`<pre class="rpt-code"><code>${_e(codeLines.join('\n'))}</code></pre>`);
  return out.join('');
}

let _freeEditMd  = null;
let _feSaveTimer = null;

function toggleFeSplit() {
  const pane  = document.getElementById('fe-preview');

function _persistFreeEdit() {
  clearTimeout(_feSaveTimer);
  if (_freeEditMd === null) return;
  const d = getReportData();
  d.freeEditMd = _freeEditMd;
  if (d.meta) delete d.meta.freeEditMdArchive;   // it is the active copy now
  saveReportData(d, false);
}

function closeFreeEdit() {
  // Keep _freeEditMd — the report renders from it; the outline shows a banner.
  if (_freeEditMd !== null) _persistFreeEdit();
  document.getElementById('fe-modal')?.remove();
  buildEditor();
  buildReport();
}

}
