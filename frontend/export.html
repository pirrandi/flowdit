            if (showRetest && remStatus !== 'open') {
              html += `<div class="rpt-field rpt-field-retest">
                <div class="rpt-field-label">Retest</div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:${v.retest_notes?'6px':'0'}">
                  <span class="rpt-vuln-status rpt-status-${remStatus}">${esc(remLabel)}</span>
                  ${v.retest_date ? `<span style="font-family:var(--mono);font-size:11px;color:var(--t3)">${esc(v.retest_date)}</span>` : ''}
                </div>
                ${v.retest_notes ? `<div class="rpt-field-val">${renderMd(v.retest_notes)}</div>` : ''}
              </div>`;
            }
            if (showEvid && evid.length) {
              html += `<div class="rpt-field"><div class="rpt-field-label">Evidencia</div><div class="rpt-evidence-grid">`;
              evid.forEach(img => { html += `<div style="break-inside:avoid;page-break-inside:avoid"><img src="${img.data}" class="rpt-evidence-img"></div>`; });
              html += '</div></div>';
            }
            const httpProofs = (Array.isArray(v.http_proofs) ? v.http_proofs : []).filter(p => p.include !== false);
            if (httpProofs.length) {
              html += `<div class="rpt-field"><div class="rpt-field-label">HTTP Proofs (${httpProofs.length})</div>`;
              httpProofs.forEach((proof, idx) => {
                const label = proof.method ? `${esc(proof.method)} — Proof #${idx+1}` : `Proof #${idx+1}`;
                html += `<div style="margin-bottom:10px;page-break-inside:avoid;break-inside:avoid">
                  <div style="font-family:var(--mono);font-size:10px;font-weight:700;color:var(--t3);margin-bottom:4px">${label}</div>`;
                const _numCode = t => { const ls=t.split('\n'),p=String(ls.length).length; return ls.map((l,i)=>`<span style="display:block;white-space:pre-wrap;word-break:break-all"><span style="display:inline-block;min-width:${p+1}ch;padding-right:8px;margin-right:8px;border-right:1px solid #ddd;color:#999;user-select:none;text-align:right">${i+1}</span>${esc(l)}</span>`).join(''); };
                if (proof.request?.trim()) html += `<div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">Request</div><pre class="rpt-code" style="font-size:10px;line-height:1.6;padding:8px 0;white-space:normal">${_numCode(proof.request)}</pre>`;
                if (proof.response?.trim()) html += `<div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin:6px 0 3px">Response</div><pre class="rpt-code" style="font-size:10px;line-height:1.6;padding:8px 0;white-space:normal">${_numCode(proof.response)}</pre>`;
                if (proof.annotation?.trim()) html += `<div style="margin-top:8px;padding:6px 10px;background:rgba(124,58,237,.06);border-left:2px solid var(--a);border-radius:0 4px 4px 0;font-size:11px;line-height:1.6">${renderMd(proof.annotation)}</div>`;
                html += `</div>`;
              });
              html += '</div>';
            }
            html += '</div></div>';
          });
        });
        html += _ce;
        html += _subsHtml(sec, _secNum);
        break sectionBody;
      }

      // ── Retest Findings ─────────────────────────────────────────────
      if (sec.type === 'retest-findings' && scope !== 'wstg' && vulns.length && reportType === 'retest') {
        _secNum++;
        const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
        md('## Hallazgos — Estado de Retest');
        html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}`;
        SEV_ORDER.forEach(sev => {
          if (!bySev[sev].length) return;
          html += `<div style="display:flex;align-items:center;gap:8px;margin:22px 0 10px;page-break-after:avoid;break-after:avoid">
            <span class="sev-badge sev-${sev}" style="font-size:11px;padding:3px 10px;width:auto;white-space:nowrap">${SEV_LABEL[sev]}</span>
            <span style="font-family:var(--mono);font-size:11px;color:var(--t3)">${bySev[sev].length} hallazgo${bySev[sev].length>1?'s':''}</span>
            <div style="flex:1;height:1px;background:var(--b1);margin-left:4px"></div>
          </div>`;
          bySev[sev].forEach(v => {
            const edit      = _localEdits[v.id] || {};
            const isRich    = !!edit._richHtml;
            const desc      = edit.description || v.description || '';
            const remStatus = v.remediation_status || 'open';
            const remLabel  = REM_LABEL[remStatus] || remStatus;
            const num       = vulnNumMap[v.id];
            const evid      = edit.evidence || v.evidence || [];
            const evidOriginal = edit.hideOriginalEvidence ? [] : evid.filter(img => (img.phase||'original') === 'original');
            const evidRetest   = evid.filter(img => img.phase === 'retest');
            md(`### ${num} — ${v.name}`);
            md(`**Severidad:** ${SEV_LABEL[sev]}  ·  **Estado:** ${remLabel}${v.retest_date ? `  ·  **Fecha de retest:** ${v.retest_date}` : ''}`);
            if (desc) { md(''); md(isRich && edit.description ? edit.description.replace(/<[^>]+>/g,' ') : desc); }
            if (v.retest_notes) { md(''); md('**Notas de Retest**'); md(v.retest_notes); }
            md('');
            html += `<div class="rpt-vuln rpt-vuln-${sev}" data-node-id="${esc(`vuln:${v.id}`)}">
              <div class="rpt-vuln-header" style="flex-direction:column;align-items:stretch;gap:5px">
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="sev-badge sev-${sev}" style="flex-shrink:0">${SEV_LABEL[sev]}</span>
                  <span style="font-family:var(--mono);font-size:11px;font-weight:800;color:var(--t3);flex-shrink:0">${num}</span>
                  <div class="rpt-vuln-name">${esc(v.name)}</div>
                </div>
                <div style="padding-left:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                  <span class="rpt-vuln-status rpt-status-${remStatus}">${esc(remLabel)}</span>
                  ${v.retest_date ? `<span style="font-family:var(--mono);font-size:10px;color:var(--t3)">${esc(v.retest_date)}</span>` : ''}
                </div>
              </div><div>`;
            if (desc) html += `<div class="rpt-field"><div class="rpt-field-label">Descripción</div><div class="rpt-field-val">${isRich && edit.description ? edit.description : renderMd(desc)}</div></div>`;
            if (v.retest_notes) html += `<div class="rpt-field rpt-field-retest"><div class="rpt-field-label">Notas de Retest</div><div class="rpt-field-val">${renderMd(v.retest_notes)}</div></div>`;
            if (evidOriginal.length) html += `<div class="rpt-field"><div class="rpt-field-label">Evidencia Original</div><div class="rpt-evidence-grid">${evidOriginal.map(img=>`<div style="break-inside:avoid;page-break-inside:avoid"><img src="${img.data}" class="rpt-evidence-img"></div>`).join('')}</div></div>`;
            if (evidRetest.length) html += `<div class="rpt-field"><div class="rpt-field-label">Evidencia de Retest</div><div class="rpt-evidence-grid">${evidRetest.map(img=>`<div style="break-inside:avoid;page-break-inside:avoid"><img src="${img.data}" class="rpt-evidence-img"></div>`).join('')}</div></div>`;
            html += '</div></div>';
          });
        });
        html += _ce;
        html += _subsHtml(sec, _secNum);
        break sectionBody;
      }

      // ── Matriz de Riesgo ──────────────────────────────────────────
      if (sec.type === 'risk-matrix' && scope !== 'wstg' && vulns.length) {
        _secNum++;
        const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
        md('## Matriz de Riesgo');

        // Build cell map: [impact][prob] = [numId, ...] — exclude info severity
        const matrixVulns = vulns.filter(v => (v.severity||'medium') !== 'info');
        const cellVulns  = {};
        const riskCounts = { bajo:0, medio:0, alto:0, critico:0 };
        matrixVulns.forEach(v => {
          const impact = IMPACT_MAP[v.severity||'medium'];
          const prob   = getEdit(v.id).probability ?? 3;
          const risk   = RISK_CELL[impact-1][prob-1];
          const key    = `${impact}_${prob}`;
          if (!cellVulns[key]) cellVulns[key] = [];
          cellVulns[key].push(vulnNumMap[v.id]);
          riskCounts[risk]++;
        });

        const totalV = matrixVulns.length;
        md(`Se identificaron ${totalV} hallazgo${totalV!==1?'s':''} representados en la matriz según probabilidad e impacto.`);
        md('');

        _tocPush(sec, `rpt-sec-${sec.id}`);
        html += `<h2 id="rpt-sec-${sec.id}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}`;
        html += `<p style="font-size:12px;color:var(--t2);margin:0 0 20px">Se identificaron <strong>${totalV}</strong> hallazgo${totalV!==1?'s':''} representados en la matriz según probabilidad e impacto.</p>`;

        // Matrix table
        const LB = '1px solid var(--b1)'; // light border
        html += `<div style="display:flex;align-items:stretch;gap:0;margin-bottom:24px;max-width:600px">`;
        // Vertical "Impacto" label
        html += `<div style="display:flex;align-items:center;justify-content:center;width:24px;flex-shrink:0;background:var(--bg2);border:${LB};border-right:none">
          <span style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:700;color:var(--t1);letter-spacing:.1em">IMPACTO</span></div>`;
        html += `<table style="border-collapse:collapse;flex:1">`;

        // Rows: Crítico(4), Alto(3), Medio(2), Bajo(1)

// Screen-side refresh after every preview render: selection/hover marks on
// the blocks, outline states (they follow the data being edited), toolbar.
function _afterPreviewRender() {
  if (window.FLOWDIT_SNAPSHOT) return;
  try {
    _paintPreviewMarks();
    renderOutline();
    renderPreviewBar();
    _syncHead();
  } catch (e) { console.warn('[export] editor refresh error:', e); }
}

// Print layout helpers — flag prevents double-execution when both manual call and beforeprint fire
const _printSaved = [];
let _printActive = false;
let _printSuspended = false;

function _prepareForPrint() {
  if (_printActive) return;
  _printActive = true;
  // What prints is the report, not the "Con propuesta" preview or a ghost.
  if (_lastPreviewKey !== '|') { _pvSuspend++; _printSuspended = true; try { buildReport(); } catch {} }
  _printSaved.length = 0;
  ['.sidenav','#sidenav','.topbar','#topbar','.exp-editor','.export-controls','.no-print','.toast-container','#loading-overlay']
    .forEach(sel => document.querySelectorAll(sel).forEach(el => {
      _printSaved.push([el, el.getAttribute('style') || '']);
      el.style.setProperty('display', 'none', 'important');
    }));
  _printSaved.push([document.body, document.body.getAttribute('style') || '']);
  ['display','margin','padding','overflow'].forEach(p =>
    document.body.style.setProperty(p, p==='display'?'block':p==='overflow'?'visible':'0', 'important'));
  ['.app-main','.exp-outer','.exp-inner','.exp-layout'].forEach(sel => {
    const el = document.querySelector(sel); if (!el) return;
    _printSaved.push([el, el.getAttribute('style') || '']);
    ['display','margin','padding','overflow','height'].forEach(p =>
      el.style.setProperty(p, p==='display'?'block':p==='overflow'?'visible':p==='height'?'auto':'0', 'important'));
    el.style.setProperty('width', '100%', 'important');
  });
  const prev = document.querySelector('.exp-preview');
  if (prev) {
    _printSaved.push([prev, prev.getAttribute('style') || '']);
    ['display','padding','overflow','height'].forEach(p =>
      prev.style.setProperty(p, p==='display'?'block':p==='overflow'?'visible':p==='height'?'auto':'0', 'important'));
    prev.style.setProperty('width', '100%', 'important');
  }
}

function _restoreAfterPrint() {
  if (!_printActive) return;
  _printActive = false;
  if (_printSuspended) { _printSuspended = false; _pvSuspend--; try { buildReport(); } catch {} }
  _printSaved.forEach(([el, style]) => el.setAttribute('style', style));
  _printSaved.length = 0;
}

// Ctrl+P fallback
window.addEventListener('beforeprint', _prepareForPrint);
window.addEventListener('afterprint', _restoreAfterPrint);

async function exportPdf() {
  const m = getReportData().meta;
  const password = m.pdfPassword?.trim();

  const btn = document.querySelector('[onclick="exportPdf()"]');
  const origText = btn.innerHTML;
  btn.textContent = 'Generating…';
  btn.disabled = true;

  try {
    const token      = localStorage.getItem('fd_access');
    const filename   = m.coverTitle || state.currentProject?.name || 'report';
    const pid        = state.currentProject?.id;
    const rptKey     = `fd_rpt_${pid}`;
    const rptData    = localStorage.getItem(rptKey);
    const pageUrl    = window.location.href;
    const scope      = document.getElementById('export-scope')?.value || 'all';
    const reportType = document.getElementById('report-type')?.value || 'technical';

    const res = await fetch(`${window.FLOWDIT_API || '/api'}/export/pdf`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
      body: JSON.stringify({ pageUrl, projectId: pid, token, rptKey, rptData, password, filename, scope, reportType }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast(err.error || 'PDF generation failed', 'error');
      return;
    }

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `${filename}.pdf`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('PDF downloaded', 'success');
  } catch (e) {
    showToast('PDF generation failed: ' + e.message, 'error');
  } finally {
    btn.innerHTML = origText;
    btn.disabled = false;
  }
}

async function pageInit() {
  // Exporting and the report builder are client-facing (owner/editor only;
  // the server answers 403 to a pentester). Hide the export actions and keep
  // builder edits local instead of letting every save bounce off the API.
  if (!window.FLOWDIT_SNAPSHOT && !canActForClient()) {
    _rptSyncBlocked = true;
    const actions = document.getElementById('export-actions');
    if (actions) actions.innerHTML = `<span style="font-size:10px;color:var(--t3);max-width:200px;line-height:1.4;align-self:center">Exportar el informe corresponde al Owner o a un Editor</span>`;
  }
  // Pull the server copies BEFORE anything reads localStorage: getReportData()
  // and the finding hydration in buildEditor() both take localStorage as their
  // input, so the server state has to land there first.
  await Promise.all([
    loadAllTargetDetails(),
    pullReportConfig(),
    loadTemplates(),
  ]);
  const d = getReportData();
  // Scope and type are part of the report data (meta.reportScope/reportType).
  _syncScopeTypeControls(d.meta);
  applyReportFont(d.meta?.font);
  applyBaseFontSize(d.meta?.baseFontSize);
  applyReportAccent(d.meta?.accentColor);
  applyWatermark(d.meta);
  applyTitleSizes(d.meta?.h2Size, d.meta?.h3Size);   // was only applied after the first edit
  if (d.freeEditMd) _freeEditMd = d.freeEditMd; // restore persisted free edit
  _initEditorEvents();
  try { buildEditor(); } catch(e) { console.warn('[export] buildEditor error:', e); }
  loadReportProposals();
  try { buildPageLayout(); } catch(e) {}
  try { buildReport(); } catch(e) { console.warn('[export] buildReport error:', e); }
  setTimeout(() => { try { buildReport(); } catch(e) {} }, 0);
  renderSaveStatus();
}

bootPage('export');
</script>
</body>
</html>
