async function loadAllTargetDetails() {
  const pid = state.currentProject?.id;
  if (!pid || !state.targets?.length) return;
  await Promise.all(state.targets.map(async t => {
    try {
      const [ports, endpoints] = await Promise.all([
        api.targets.listPorts(pid, t.id).catch(() => []),
        api.targets.listEndpoints(pid, t.id).catch(() => []),
      ]);
      _targetFull[t.id] = { ports, endpoints };
    } catch {}
  }));
}

function getEdit(id) {
  if (!_localEdits[id]) _localEdits[id] = { description:'', remediation:'', evidence:[] };
  return _localEdits[id];
}

// ── Autosave timers ───────────────────────────────────────────────
const _saveTimers = {};

function scheduleVulnSave(vulnId) {
  clearTimeout(_saveTimers[vulnId]);
  _saveTimers[vulnId] = setTimeout(async () => {
    const e = _localEdits[vulnId] || {};
    try {
      const updated = await api.vulns.update(state.currentProject.id, vulnId, {
        description: e.description || '',
        remediation: e.remediation || '',
        evidence:    e.evidence    || [],
      });
      const v = state.customVulns.find(x => x.id === vulnId);
      if (v) Object.assign(v, updated);
      flashSaved(vulnId);
      buildReport();
    } catch {}
  }, 900);
}

function scheduleWSTGSave(testId) {
  clearTimeout(_saveTimers[testId]);
  _saveTimers[testId] = setTimeout(async () => {
    const e = _localEdits[testId] || {};
    try {
      await api.wstg.saveReport(state.currentProject.id, testId, e.description||'', e.remediation||'');
      if (state.wstgProgress[testId]) {
        state.wstgProgress[testId].description = e.description||'';
        state.wstgProgress[testId].remediation = e.remediation||'';
      }
      flashSaved(testId);
      buildReport();
    } catch {}
  }, 900);
}

function flashSaved(id) {
  const dot = document.getElementById(`saved-${id}`);
  if (!dot) return;
  dot.classList.add('show');
  setTimeout(() => dot.classList.remove('show'), 1500);
}

// ── Evidence handling ─────────────────────────────────────────────
function pickEvidence(id, isWSTG) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.onchange = () => {
    const files = Array.from(input.files);
    let done = 0;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        getEdit(id).evidence.push({ name: file.name, data: e.target.result });
        done++;
        if (done === files.length) {
          renderEvidenceList(id, isWSTG);
          if (!isWSTG) scheduleVulnSave(id);
        }
      };
      reader.readAsDataURL(file);
    });
  };
  input.click();
}

function removeEvidence(id, idx, isWSTG) {
  getEdit(id).evidence.splice(idx, 1);
  renderEvidenceList(id, isWSTG);
  if (!isWSTG) scheduleVulnSave(id);
}

function renderEvidenceList(id, isWSTG) {
  const container = document.getElementById(`evid-list-${id}`);
  if (!container) return;
  const evid = getEdit(id).evidence;
  container.innerHTML = evid.length
    ? evid.map((img, i) => `
        <div class="exp-evidence-row">
          <img src="${img.data}" class="exp-evidence-thumb">
          <span class="exp-evidence-name">${esc(img.name||'image')}</span>
          <button class="btn-remove" onclick="removeEvidence('${id}',${i},${isWSTG})">✕</button>
        </div>`).join('')
    : `<div style="font-family:var(--mono);font-size:10px;color:var(--text3)">No images</div>`;
  buildReport();
}

// ── Editor section collapse state ────────────────────────────────
const _secOpen = { 'templates': false, 'cover': true, 'info': false, 'layout': false, 'sections': true };

function toggleEditorSection(hdr) {
  const key  = hdr.dataset.sec;
  const body = document.getElementById(`esec-${key}`);
  if (!body) return;
  _secOpen[key] = !_secOpen[key];
  hdr.classList.toggle('collapsed', !_secOpen[key]);
  body.style.display = _secOpen[key] ? '' : 'none';
}

function uploadCoverLogo(input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => { setRptMeta('coverLogoBase64', e.target.result); buildEditor(); };
  reader.readAsDataURL(file);
}

// ── Build editor panel ────────────────────────────────────────────
function buildEditor() {
  const scope  = document.getElementById('export-scope')?.value || 'all';
  const vulns  = state.customVulns || [];
  const bySev  = {};
  SEV_ORDER.forEach(s => bySev[s] = vulns.filter(v => (v.severity||'medium') === s));

  const failedTests = [];
  if (scope !== 'vulns') {
    WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
      if (state.wstgProgress[t.id]?.status === 'fail')
        failedTests.push({ cat: cat.name, test: t, prog: state.wstgProgress[t.id] });
    }));
  }

  let html = buildSectionList();

  // ── Custom vulns section ──────────────────────────────────────
  if (scope !== 'wstg' && vulns.length) {
    html += editorSection('custom-vulns', '🛠 Custom Vulnerabilities', true, () => {
      let inner = '';
      SEV_ORDER.forEach(sev => {
        bySev[sev].forEach(v => {
          // Prime local edits from saved state
          if (!_localEdits[v.id]) {
            _localEdits[v.id] = {
              description: v.description || '',
              remediation: v.remediation || '',
              evidence:    v.evidence    || [],
            };
          }
          inner += findingEditor(v.id, v.name, v.severity, false);
        });
      });
      return inner;
    });
  }

  // ── WSTG vulns found ─────────────────────────────────────────
  if (scope !== 'vulns' && failedTests.length) {
    html += editorSection('wstg-vulns', '⚠ WSTG — Vulns Found', true, () => {
      let inner = '';
      failedTests.forEach(({ test, prog }) => {
        const id = test.id;
        if (!_localEdits[id]) {
          _localEdits[id] = {
            description: prog?.description || '',
            remediation: prog?.remediation || '',
            evidence:    [],
          };
        }
        inner += findingEditor(id, `${id} — ${test.name}`, null, true);
      });
      return inner;
    });
  }

  if (!html) html = `<div style="padding:20px 14px;font-family:var(--mono);font-size:11px;color:var(--text3)">No findings to edit for this scope.</div>`;

  document.getElementById('editor-panel').innerHTML = html;
  // Restore evidence lists
  vulns.forEach(v => renderEvidenceList(v.id, false));
  failedTests.forEach(({ test }) => renderEvidenceList(test.id, true));
}

function editorSection(id, title, startOpen, contentFn) {
  return `<div class="exp-section">
    <div class="exp-section-header ${startOpen?'open':''}" onclick="toggleSectionPanel('${id}',this)">
      <span>${title}</span>
      <span class="chevron">▶</span>
    </div>
    <div class="exp-section-body ${startOpen?'open':''}" id="esec-${id}">
      ${contentFn()}
    </div>
  </div>`;
}

function findingEditor(id, name, sev, isWSTG) {
  const sevBadge = sev ? `<span class="sev-badge sev-${sev}" style="font-size:9px;padding:1px 5px">${SEV_LABEL[sev]}</span>` : '';
  return `<div class="exp-finding">
    <div class="exp-finding-header" onclick="toggleFinding('${id}')">
      ${sevBadge}
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px" title="${esc(name)}">${esc(name)}</span>
      <div class="exp-saved-dot" id="saved-${id}"></div>
    </div>
    <div class="exp-finding-body" id="fbody-${id}">
      <div>
        <div class="exp-field-label">Description</div>
        <textarea class="exp-textarea" id="edesc-${id}" placeholder="What is this vulnerability and why does it matter..."
          oninput="getEdit('${id}').description=this.value;${isWSTG?`scheduleWSTGSave('${id}')`:`scheduleVulnSave('${id}')`}"
        >${esc(getEdit(id).description)}</textarea>
      </div>
      <div>
        <div class="exp-field-label">Remediation</div>
        <textarea class="exp-textarea rem" id="erem-${id}" placeholder="How to fix or mitigate this vulnerability..."
          oninput="getEdit('${id}').remediation=this.value;${isWSTG?`scheduleWSTGSave('${id}')`:`scheduleVulnSave('${id}')`}"
        >${esc(getEdit(id).remediation)}</textarea>
      </div>
      ${!isWSTG ? `<div>
        <div class="exp-field-label">Evidence</div>
        <div id="evid-list-${id}"></div>
        <button class="btn-add-row" style="margin-top:5px;font-size:10px" onclick="pickEvidence('${id}',false)">+ Attach image</button>
      </div>` : ''}
    </div>
  </div>`;
}

function toggleSectionPanel(id, header) {
  header.classList.toggle('open');
  document.getElementById(`esec-${id}`)?.classList.toggle('open');
}

function toggleFinding(id) {
  document.getElementById(`fbody-${id}`)?.classList.toggle('open');
}

// ── Build preview ─────────────────────────────────────────────────
let _mdLines = [];
function opt(id) { return document.getElementById(id)?.checked ?? true; }

function buildReport() {
  const p          = state.currentProject;
  const scope      = document.getElementById('export-scope')?.value || 'all';
  const reportType = document.getElementById('report-type')?.value || 'technical';
  if (!p) return;

  if (_freeEditMd !== null) {
    document.getElementById('report-preview').innerHTML = renderMdStyled(_freeEditMd);
    document.getElementById('export-project-name').textContent = p.name;
    return;
  }

  _mdLines = [];
  const showDesc  = opt('opt-desc');
  const showRem   = opt('opt-rem');
  const showPay   = opt('opt-pay');
  const showNotes = opt('opt-notes');
  const showEvid  = opt('opt-evid');

  const data     = getReportData();
  const m        = data.meta;
  const cf       = m.coverFields || {};
  const sections = data.sections || DEFAULT_SECTIONS.map(s=>({...s}));

  const date  = new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'long', year:'numeric' });
  const vulns = state.customVulns || [];
  const bySev = {};
  SEV_ORDER.forEach(s => bySev[s] = vulns.filter(v => (v.severity||'medium') === s));

  let wDone=0, wFail=0, wTotal=0;
  WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
    wTotal++;
    const s = state.wstgProgress[t.id]?.status;
    if (s==='done') wDone++;
    if (s==='fail') wFail++;
  }));
  const wTested = wDone + wFail;
  const wPct    = wTotal ? Math.round(wTested/wTotal*100) : 0;

  const md = (...a) => _mdLines.push(a.join(' '));
  let html = '';

  // ── Cover (always rendered) ───────────────────────────────────────
  md(`# ${p.name} — Security Assessment Report`);
  md(`**Date:** ${date}${p.target ? `  ·  **Target:** ${p.target}` : ''}`);
  if (m.preparedBy)   md(`**Prepared by:** ${m.preparedBy}`);
  if (m.organization) md(`**Organization:** ${m.organization}`);
  if (m.version)      md(`**Version:** ${m.version}`);
  md(`**Classification:** ${m.classification||'Confidential'}`);
  md('');

  const _coverMeta = [];
  if (cf.date          !== false)                      _coverMeta.push({ label:'Date',           val:date });
  if (cf.target        !== false && p.target)          _coverMeta.push({ label:'Target',          val:p.target });
  if (cf.preparedBy    !== false && m.preparedBy)      _coverMeta.push({ label:'Prepared By',     val:m.preparedBy });
  if (cf.organization  !== false && m.organization)    _coverMeta.push({ label:'Organization',    val:m.organization });
  if (cf.scope         !== false && p.description)     _coverMeta.push({ label:'Scope',           val:p.description });
  if (cf.version       !== false && m.version)         _coverMeta.push({ label:'Version',         val:m.version });
  if (cf.totalFindings !== false && scope!=='wstg')    _coverMeta.push({ label:'Total Findings',  val:String(vulns.length) });
  if (cf.wstgCoverage  !== false && scope!=='vulns')   _coverMeta.push({ label:'WSTG Coverage',   val:`${wPct}% (${wTested}/${wTotal})` });

  let _metaHtml = '<div class="rpt-cover-meta">';
  for (let i = 0; i < _coverMeta.length; i += 2) {
    _metaHtml += '<div class="rpt-cover-meta-row">';
    [_coverMeta[i], _coverMeta[i+1]].forEach(item => {
      if (!item) { _metaHtml += '<div class="rpt-cover-meta-cell"></div>'; return; }
      _metaHtml += `<div class="rpt-cover-meta-cell"><span class="rpt-cover-meta-label">${item.label}</span><span class="rpt-cover-meta-val">${esc(item.val)}</span></div>`;
    });
    _metaHtml += '</div>';
  }
  _metaHtml += '</div>';

  const _logoUrl = m.coverLogoBase64 || m.clientLogoUrl || p.logo_url || null;
  const _logoBg  = m.coverLogoBg || p.logo_bg || 'light';
  const _coverTitle    = m.coverTitle    || p.name || '';
  const _coverSubtitle = m.coverSubtitle || '';
  const _coverType     = m.coverTypeLabel || 'Security Assessment Report';
  html += `<div class="rpt-cover-page">
    <div class="rpt-cover-page-bar"></div>
    <div class="rpt-cover-page-body">
      <div class="rpt-cover-logo-wrap">
        ${_logoUrl
          ? (() => {
              const lbg   = _logoBg === 'dark' ? '#1e1e1e' : _logoBg === 'transparent' ? 'transparent' : '#fff';
              const lbord = _logoBg === 'transparent' ? 'none' : `1px solid ${_logoBg === 'dark' ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.09)'}`;
              const lpad  = _logoBg === 'transparent' ? '0' : '24px 40px';
              return `<div style="background:${lbg};border:${lbord};border-radius:${_logoBg==='transparent'?'0':'14px'};padding:${lpad};display:flex;align-items:center;justify-content:center"><img src="${esc(_logoUrl)}" style="height:100px;max-width:300px;object-fit:contain" alt="Logo"></div>`;
            })()
          : `<div class="rpt-cover-logo-ph">${esc((_coverTitle||'?')[0].toUpperCase())}</div>`}
      </div>
      <div class="rpt-cover-title-block">
        <span class="rpt-cover-page-type">${esc(_coverType)}</span>
        <h1 class="rpt-cover-page-h1">${esc(_coverTitle)}</h1>
        ${_coverSubtitle ? `<div class="rpt-cover-page-client" style="font-style:normal;font-size:16px;color:var(--text2)">${esc(_coverSubtitle)}</div>` : ''}
        ${m.clientName ? `<div class="rpt-cover-page-client">${esc(m.clientName)}</div>` : ''}
        <span class="rpt-cover-conf">${esc(m.classification||'Confidential')}</span>
      </div>
    </div>
    <div class="rpt-cover-page-footer">${_metaHtml}</div>
  </div>`;

  // ── TOC (derived from visible sections) ───────────────────────────
  const visibleSections = sections.filter(s => s.visible);
  const _tocItems = [];
  const PROSE_TYPES = new Set(['custom']);
  visibleSections.forEach(sec => {
    const sid = `rpt-sec-${sec.id}`;
    if (PROSE_TYPES.has(sec.type)) {
      if (sec.content) _tocItems.push({ title:sec.title, id:sid });
    } else if (sec.type === 'exec-summary' && scope !== 'wstg') {
      _tocItems.push({ title:sec.title, id:sid });
    } else if (sec.type === 'findings-index' && scope !== 'wstg' && vulns.length) {
      _tocItems.push({ title:sec.title, id:sid });
    } else if (sec.type === 'wstg' && scope !== 'vulns') {
      _tocItems.push({ title:sec.title, id:sid });
    } else if (sec.type === 'detailed-findings' && scope !== 'wstg' && vulns.length && reportType === 'technical') {
      _tocItems.push({ title:sec.title, id:sid });
    } else if (sec.type === 'targets' && state.targets?.length) {
      _tocItems.push({ title:sec.title, id:sid });
    } else if (sec.type === 'risk-table') {
      _tocItems.push({ title:sec.title, id:sid });
    }
  });

  if (m.showToc && _tocItems.length) {
    md('## Table of Contents');
    _tocItems.forEach((t, i) => md(`${i+1}. ${t.title}`));
    md('');
    html += `<div class="rpt-toc">
      <div class="rpt-toc-title">Table of Contents</div>
      ${_tocItems.map((t, i) => `<div class="rpt-toc-item"><span class="rpt-toc-num">${i+1}.</span><a href="#${t.id}">${esc(t.title)}</a></div>`).join('')}
    </div>`;
  }

  // ── Sections in user-defined order ────────────────────────────────
  for (const sec of visibleSections) {
    const secId = `rpt-sec-${sec.id}`;
    const _pb   = sec.pageBreak ? 'page-break-before:always;break-before:page;' : '';
    const _fs   = sec.fontSize  ? `font-size:${sec.fontSize}px;` : '';

    // ── Prose / custom ────────────────────────────────────────────
    if (PROSE_TYPES.has(sec.type)) {
      if (!sec.content) continue;
      md(`## ${sec.title}`); md(sec.content); md('');
      html += `<h2 id="${secId}" style="${_pb}">${esc(sec.title)}</h2><div class="rpt-prose" style="${_fs}">${_secContentHtml(sec.content)}</div>`;
      continue;
    }

    // ── Executive Summary ─────────────────────────────────────────
    if (sec.type === 'exec-summary' && scope !== 'wstg') {
      if (vulns.length) {
        md('## Executive Summary'); md('|Severity|Count|'); md('|--------|-----|');
        SEV_ORDER.forEach(s => { if(bySev[s].length) md(`|${SEV_EMOJI[s]} ${SEV_LABEL[s]}|${bySev[s].length}|`); });
        md('');
        html += `<h2 id="${secId}" style="${_pb}${_fs}">${esc(sec.title)}</h2><div class="rpt-summary">`;
        SEV_ORDER.forEach(s => {
          if (!bySev[s].length) return;
          html += `<div class="rpt-summary-card card-${s}"><div class="rpt-count">${bySev[s].length}</div><div class="rpt-label">${SEV_LABEL[s]}</div></div>`;
        });
        if (scope==='all') html += `<div class="rpt-summary-card card-wstg"><div class="rpt-count">${wPct}%</div><div class="rpt-label">WSTG</div></div>`;
        html += '</div>';
        html += `<div class="rpt-risk-wrap"><div class="rpt-risk-bar">`;
        SEV_ORDER.forEach(s => {
          if (!bySev[s].length) return;
          html += `<div class="rpt-risk-seg rpt-risk-${s}" style="width:${Math.round(bySev[s].length/vulns.length*100)}%" title="${SEV_LABEL[s]}: ${bySev[s].length}"></div>`;
        });
        html += `</div><div class="rpt-risk-legend">`;
        SEV_ORDER.forEach(s => {
          if (!bySev[s].length) return;
          const colors = {critical:'#ef4444',high:'#f97316',medium:'#eab308',low:'#059669',info:'#6b7280'};
          html += `<div class="rpt-risk-legend-item"><div class="rpt-risk-legend-dot" style="background:${colors[s]}"></div>${SEV_LABEL[s]} (${bySev[s].length})</div>`;
        });
        html += `</div></div>`;
      } else {
        html += `<h2 id="${secId}" style="${_pb}${_fs}">${esc(sec.title)}</h2><p style="color:var(--text3);font-style:italic">No custom findings recorded for this project.</p>`;
      }
      continue;
    }

    // ── Findings Index ────────────────────────────────────────────
    if (sec.type === 'findings-index' && scope !== 'wstg' && vulns.length) {
      md('## Findings Index'); md('| # | Severity | Vulnerability | Category | Status |'); md('|---|----------|---------------|----------|--------|');
      html += `<h2 id="${secId}" style="${_pb}${_fs}">${esc(sec.title)}</h2>
        <table class="rpt-table" style="${_fs}"><thead><tr>
          <th class="rpt-idx-num">#</th><th class="rpt-idx-sev">Severity</th>
          <th>Vulnerability</th><th>Category</th><th class="rpt-idx-status">Status</th>
        </tr></thead><tbody>`;
      let idx = 1;
      SEV_ORDER.forEach(sev => {
        bySev[sev].forEach(v => {
          const sl = v.status==='done'?'Confirmed':v.status==='fail'?'Reproduced':'Pending';
          md(`| ${idx} | ${SEV_LABEL[sev]} | ${v.name} | ${v.category||'Custom'} | ${sl} |`);
          html += `<tr>
            <td class="num" style="color:var(--text3)"><div class="rpt-cell">${idx++}</div></td>
            <td><div class="rpt-cell"><span class="sev-badge sev-${sev}">${SEV_LABEL[sev]}</span></div></td>
            <td style="font-weight:600;color:var(--text)"><div class="rpt-cell">${esc(v.name)}</div></td>
            <td style="font-family:var(--mono);font-size:11px"><div class="rpt-cell">${esc(v.category||'Custom')}</div></td>
            <td><div class="rpt-cell"><span class="rpt-vuln-status rpt-status-${v.status||'pending'}">${sl}</span></div></td>
          </tr>`;
        });
      });
      md('');
      html += '</tbody></table>';
      continue;
    }

    // ── OWASP WSTG ───────────────────────────────────────────────
    if (sec.type === 'wstg' && scope !== 'vulns') {
      md('## OWASP WSTG Progress');
      md(`**Overall:** ${wTested}/${wTotal} (${wPct}%) · **Passed:** ${wDone} · **Vuln Found:** ${wFail}`); md('');
      html += `<h2 id="${secId}" style="${_pb}${_fs}">${esc(sec.title)}</h2>
        <p style="${_fs}"><strong>${wTested}/${wTotal}</strong> tests completed &nbsp;·&nbsp;
          <strong style="color:var(--green)">${wDone} passed</strong> &nbsp;·&nbsp;
          <strong style="color:var(--red)">${wFail} vuln found</strong></p>
        <table class="rpt-table"><thead><tr>
          <th>Category</th><th style="text-align:center">Tested</th>
          <th style="text-align:center">Total</th><th style="text-align:center">Vulns</th>
          <th style="min-width:100px">Progress</th>
        </tr></thead><tbody>`;
      WSTG_DATA.forEach(cat => {
        const t = cat.tests.length;
        const d = cat.tests.filter(x=>state.wstgProgress[x.id]?.status==='done').length;
        const f = cat.tests.filter(x=>state.wstgProgress[x.id]?.status==='fail').length;
        if (!d&&!f) return;
        const pct = t?Math.round((d+f)/t*100):0;
        html += `<tr><td>${esc(cat.name)}</td><td class="num">${d+f}</td><td class="num">${t}</td>
          <td class="num ${f?'vuln-found':''}">${f||'—'}</td>
          <td><div class="rpt-progress-cell"><div class="rpt-mini-bar"><div class="rpt-mini-fill" style="width:${pct}%"></div></div>
            <span style="font-family:var(--mono);font-size:10px;color:var(--text3);min-width:30px">${pct}%</span></div></td></tr>`;
      });
      html += '</tbody></table>';
      const failedWSTG = [];
      WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
        if (state.wstgProgress[t.id]?.status==='fail') failedWSTG.push({ cat:cat.name, test:t, prog:state.wstgProgress[t.id] });
      }));
      if (failedWSTG.length && reportType === 'technical') {
        md(`### Vulnerabilities Found (${failedWSTG.length})`);
        html += `<h3 style="margin-top:24px">Vulnerabilities Found <span style="font-family:var(--mono);font-size:11px;font-weight:400;color:var(--red);margin-left:6px">${failedWSTG.length} issue${failedWSTG.length>1?'s':''}</span></h3>`;
        failedWSTG.forEach(({ cat, test, prog }) => {
          const edit = _localEdits[test.id] || {};
          const desc = edit.description || prog?.description || '';
          const rem  = edit.remediation || prog?.remediation || '';
          const targetHost = prog?.target_id ? (state.targets||[]).find(t=>t.id===prog.target_id)?.host : null;
          md(`#### ${test.id} — ${test.name}`);
          md(`**Category:** ${cat}${targetHost ? `  ·  **Target:** ${targetHost}` : ''}`);
          if (showDesc && desc) { md('**Description**'); md(desc); }
          if (showRem  && rem)  { md('**Remediation**'); md(rem); }
          if (showNotes && prog?.note) { md('**Notes**'); md(prog.note); }
          md('');
          html += `<div class="rpt-wstg-vuln">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <span style="font-family:var(--mono);font-size:10px;font-weight:700;color:var(--red);background:var(--red)18;border:1px solid var(--red)30;border-radius:3px;padding:2px 6px">${esc(test.id)}</span>
              <span style="font-weight:600;font-size:13px;color:var(--text)">${esc(test.name)}</span>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:${desc||rem?'8px':'0'}">
              <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">📁 ${esc(cat)}</span>
              ${targetHost ? `<span style="font-family:var(--mono);font-size:10px;color:var(--accent)">🎯 ${esc(targetHost)}</span>` : ''}
            </div>
            ${showDesc&&desc?`<div class="rpt-field-label" style="margin-top:4px">Description</div><div class="rpt-field-val">${renderMd(desc)}</div>`:''}
            ${showRem&&rem?`<div class="rpt-field-label">Remediation</div><div class="rpt-field-rem">${renderMd(rem)}</div>`:''}
            ${showNotes&&prog?.note?`<div style="margin-top:6px;font-size:11px;color:var(--text3);font-style:italic">${esc(prog.note)}</div>`:''}
          </div>`;
        });
      }
      html += '<hr class="rpt-divider">';
      continue;
    }

    // ── Detailed Findings ─────────────────────────────────────────
    if (sec.type === 'detailed-findings' && scope !== 'wstg' && vulns.length && reportType === 'technical') {
      md('## Detailed Findings');
      html += `<h2 id="${secId}" style="${_pb}${_fs}">${esc(sec.title)}</h2>`;
      SEV_ORDER.forEach(sev => {
        if (!bySev[sev].length) return;
        html += `<div style="display:flex;align-items:center;gap:8px;margin:22px 0 10px">
          <span class="sev-badge sev-${sev}" style="font-size:11px;padding:3px 10px;width:auto;white-space:nowrap">${SEV_LABEL[sev]}</span>
          <span style="font-family:var(--mono);font-size:11px;color:var(--text3)">${bySev[sev].length} finding${bySev[sev].length>1?'s':''}</span>
          <div style="flex:1;height:1px;background:var(--border);margin-left:4px"></div>
        </div>`;
        bySev[sev].forEach(v => {
          const edit = _localEdits[v.id] || {};
          const desc = edit.description || v.description || '';
          const rem  = edit.remediation || v.remediation || '';
          const evid = edit.evidence    || v.evidence    || [];
          const sl   = v.status==='done'?'Confirmed':v.status==='fail'?'Reproduced':'Pending';
          md(`### [${SEV_LABEL[sev]}] ${v.name}`);
          if (v.category)    md(`**Category:** ${v.category}`);
          if (v.target_host) md(`**Target:** ${v.target_host}`);
          if (v.cvss_score != null) md(`**CVSS:** ${(+v.cvss_score).toFixed(1)}`);
          md(`**Status:** ${sl}`);
          if (showDesc && desc) { md(''); md('**Description**'); md(desc); }
          if (showPay  && (v.payloads||[]).length) { md(''); md('**Payloads**'); v.payloads.forEach(p => md('```\n' + p + '\n```')); }
          if (showNotes && v.notes) { md(''); md('**Notes**'); md(v.notes); }
          if (showRem  && rem)  { md(''); md('**Remediation**'); md(rem); }
          md('');
          html += `<div class="rpt-vuln rpt-vuln-${sev}">
            <div class="rpt-vuln-header" style="${v.target_host?'flex-direction:column;align-items:stretch;gap:5px':''}">
              <div style="display:flex;align-items:center;gap:10px">
                <span class="sev-badge sev-${sev}">${SEV_LABEL[sev]}</span>
                ${v.cvss_score != null ? (()=>{ const sc={critical:'#dc2626',high:'#f97316',medium:'#f59e0b',low:'#059669',info:'#64748b'}[sev]||'#64748b'; return `<span style="font-family:var(--mono);font-size:11px;font-weight:700;color:${sc};background:${sc}18;border:1px solid ${sc}33;border-radius:4px;padding:2px 7px;flex-shrink:0">CVSS ${(+v.cvss_score).toFixed(1)}</span>`; })() : ''}
                <div class="rpt-vuln-name">${esc(v.name)}</div>
                ${v.category ? `<span class="rpt-vuln-cat">${esc(v.category)}</span>` : ''}
                <span class="rpt-vuln-status rpt-status-${v.status||'pending'}">${sl}</span>
              </div>
              ${v.target_host ? `<div style="font-family:var(--mono);font-size:10px;color:var(--accent);word-break:break-all;padding-left:2px">🎯 ${esc(v.target_host)}</div>` : ''}
            </div><div>`;
          if (showDesc && desc) html += `<div class="rpt-field"><div class="rpt-field-label">Description</div><div class="rpt-field-val">${renderMd(desc)}</div></div>`;
          if (showPay  && (v.payloads||[]).length) html += `<div class="rpt-field"><div class="rpt-field-label">Payloads</div>${v.payloads.map(p=>`<div class="rpt-code" style="margin-bottom:4px">${esc(p)}</div>`).join('')}</div>`;
          if ((v.items||[]).length) html += `<div class="rpt-field"><div class="rpt-field-label">Checklist</div><div>${v.items.map((item,i)=>`<div style="font-size:12px;color:var(--text2);padding:2px 0">${v.checked_items?.[i]?'✅':'☐'} ${esc(item)}</div>`).join('')}</div></div>`;
          if (showNotes && v.notes) html += `<div class="rpt-field"><div class="rpt-field-label">Notes</div><div class="rpt-field-val">${esc(v.notes)}</div></div>`;
          if (showRem && rem) html += `<div class="rpt-field"><div class="rpt-field-label">Remediation</div><div class="rpt-field-rem">${renderMd(rem)}</div></div>`;
          if (showEvid && evid.length) {
            html += `<div class="rpt-field"><div class="rpt-field-label">Evidence</div><div class="rpt-evidence-grid">`;
            evid.forEach(img => { html += `<div><img src="${img.data}" class="rpt-evidence-img"><div class="rpt-evidence-cap">${esc(img.name||'')}</div></div>`; });
            html += '</div></div>';
          }
          html += '</div></div>';
        });
      });
      continue;
    }

    // ── Targets ───────────────────────────────────────────────────
    if (sec.type === 'targets' && state.targets?.length) {
      md('## Scope — Targets'); md('| Host | Type | Status | Notes |'); md('|------|------|--------|-------|');
      state.targets.forEach(t => {
        md(`| ${t.host} | ${t.type||'—'} | ${t.status||'pending'} | ${t.notes||''} |`);
        const td = _targetFull[t.id] || {};
        if (td.ports?.length) md(`**Open ports:** ${td.ports.map(p => `${p.port}/${p.protocol||'tcp'} (${p.service||'?'})`).join(', ')}`);
      });
      md('');
      html += `<h2 id="${secId}" style="${_pb}${_fs}">${esc(sec.title)}</h2>`;
      if (reportType === 'executive') {
        html += `<table class="rpt-table"><thead><tr><th>Host</th><th>Type</th><th>Status</th><th>Notes</th></tr></thead><tbody>`;
        state.targets.forEach(t => {
          html += `<tr>
            <td style="font-family:var(--mono);font-weight:600"><div class="rpt-cell">${esc(t.host)}</div></td>
            <td style="font-family:var(--mono);font-size:11px;color:var(--text3)"><div class="rpt-cell">${esc(t.type||'—')}</div></td>
            <td><div class="rpt-cell"><span class="rpt-vuln-status rpt-status-${t.status||'pending'}">${esc(t.status||'pending')}</span></div></td>
            <td style="font-size:12px;color:var(--text3);white-space:pre-wrap"><div class="rpt-cell">${esc(t.notes||'')}</div></td>
          </tr>`;
        });
        html += '</tbody></table>';
      } else {
        state.targets.forEach(t => {
          const td = _targetFull[t.id] || {};
          const ports = td.ports || [], endpoints = td.endpoints || [];
          html += `<div class="rpt-vuln" style="margin-bottom:12px">
            <div class="rpt-vuln-header">
              <span style="font-family:var(--mono);font-size:12px;font-weight:700">${esc(t.host)}</span>
              ${t.type ? `<span style="font-family:var(--mono);font-size:10px;color:var(--text3)">${esc(t.type)}</span>` : ''}
              <span style="margin-left:auto"><span class="rpt-vuln-status rpt-status-${t.status||'pending'}">${esc(t.status||'pending')}</span></span>
            </div>`;
          if (t.notes) html += `<div class="rpt-field"><div class="rpt-field-label">Notes</div><div class="rpt-field-val" style="white-space:pre-wrap">${esc(t.notes)}</div></div>`;
          if (ports.length) {
            html += `<div class="rpt-field"><div class="rpt-field-label">Open Ports (${ports.length})</div>
              <table class="rpt-table" style="margin:6px 0"><thead><tr><th>Port</th><th>Protocol</th><th>State</th><th>Service</th><th>Version</th></tr></thead><tbody>`;
            ports.forEach(port => {
              html += `<tr>
                <td class="num" style="font-weight:700">${port.port}</td>
                <td style="font-family:var(--mono);font-size:11px">${esc(port.protocol||'tcp')}</td>
                <td style="font-family:var(--mono);font-size:11px">${esc(port.state||'open')}</td>
                <td>${esc(port.service||'—')}</td>
                <td style="font-family:var(--mono);font-size:10px;color:var(--text3)">${esc(port.version||'')}</td>
              </tr>`;
            });
            html += '</tbody></table></div>';
          }
          if (endpoints.length) {
            html += `<div class="rpt-field"><div class="rpt-field-label">Endpoints (${endpoints.length})</div>
              <table class="rpt-table" style="margin:6px 0"><thead><tr><th>Method</th><th>Path</th><th>Status</th><th>Notes</th></tr></thead><tbody>`;
            endpoints.forEach(ep => {
              html += `<tr>
                <td style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent)">${esc(ep.method||'GET')}</td>
                <td style="font-family:var(--mono);font-size:11px">${esc(ep.path||'')}</td>
                <td style="font-family:var(--mono);font-size:10px;color:var(--text3)">${esc(ep.status_code||'')}</td>
                <td style="font-size:11px;color:var(--text3);white-space:pre-wrap">${esc(ep.notes||'')}</td>
              </tr>`;
            });
            html += '</tbody></table></div>';
          }
          html += '</div>';
        });
      }
      continue;
    }

    // ── Risk Classification ───────────────────────────────────────
    if (sec.type === 'risk-table') {
      md('## Risk Classification'); md('| Rating | CVSS Score | Description |'); md('|--------|------------|-------------|');
      md('| Critical | 9.0 – 10.0 | Immediate risk... |'); md('| High | 7.0 – 8.9 | Significant vulnerability... |');
      md('| Medium | 4.0 – 6.9 | Moderate risk... |'); md('| Low | 0.1 – 3.9 | Minor issues... |');
      md('| Info | N/A | Informational finding... |'); md('');
      html += `<h2 id="${secId}" style="${_pb}${_fs}">${esc(sec.title)}</h2>
        <table class="rpt-risk-class" style="${_fs}">
          <thead><tr><th>Rating</th><th>CVSS Score</th><th>Description</th></tr></thead>
          <tbody>
            <tr><td><div class="rpt-cell"><span class="sev-badge sev-critical">Critical</span></div></td><td style="font-family:var(--mono)"><div class="rpt-cell">9.0 – 10.0</div></td><td><div class="rpt-cell">Immediate risk of exploitation with potential for complete system compromise or significant data breach. Requires urgent remediation.</div></td></tr>
            <tr><td><div class="rpt-cell"><span class="sev-badge sev-high">High</span></div></td><td style="font-family:var(--mono)"><div class="rpt-cell">7.0 – 8.9</div></td><td><div class="rpt-cell">Significant vulnerability that could allow unauthorized access or major service disruption. Should be addressed as a priority.</div></td></tr>
            <tr><td><div class="rpt-cell"><span class="sev-badge sev-medium">Medium</span></div></td><td style="font-family:var(--mono)"><div class="rpt-cell">4.0 – 6.9</div></td><td><div class="rpt-cell">Moderate risk that may be exploited under certain conditions. Remediation recommended in the short term.</div></td></tr>
            <tr><td><div class="rpt-cell"><span class="sev-badge sev-low">Low</span></div></td><td style="font-family:var(--mono)"><div class="rpt-cell">0.1 – 3.9</div></td><td><div class="rpt-cell">Minor issues with limited impact. Should be addressed as part of routine security maintenance.</div></td></tr>
            <tr><td><div class="rpt-cell"><span class="sev-badge sev-info">Info</span></div></td><td style="font-family:var(--mono)"><div class="rpt-cell">N/A</div></td><td><div class="rpt-cell">Informational findings with no direct security impact. Useful for hardening and best practice alignment.</div></td></tr>
          </tbody>
        </table>`;
      continue;
    }
  }

  // ── Methodology Progress (technical, always appended) ─────────────
  if (reportType === 'technical' && scope !== 'wstg') {
    const activeMethods = Object.entries(state.activeMethodProgress || {});
    if (activeMethods.length) {
      html += `<h2>Methodology Progress</h2>`;
      activeMethods.forEach(([, meth]) => {
        const tests = meth.tests || [];
        html += `<div style="border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden">
          <div style="display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg2)">
            <div style="font-weight:600;font-size:13px;flex:1">${esc(meth.name)}</div>
            <div style="font-family:var(--mono);font-size:11px;color:var(--green)">${meth.done} done</div>
            ${meth.fail ? `<div style="font-family:var(--mono);font-size:11px;color:var(--red)">${meth.fail} fail</div>` : ''}
            <div style="font-family:var(--mono);font-size:11px;color:var(--text3)">${meth.total} total</div>
          </div>
          <div style="padding:10px 14px">
            <div style="display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--border);gap:2px;margin-bottom:8px">
              ${meth.done ? `<div style="width:${Math.round(meth.done/meth.total*100)}%;background:var(--green);border-radius:2px"></div>` : ''}
              ${meth.fail ? `<div style="width:${Math.round(meth.fail/meth.total*100)}%;background:var(--red);border-radius:2px"></div>` : ''}
            </div>
            ${tests.filter(t => t.status === 'fail').length ? `
              <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Failed checks (${tests.filter(t=>t.status==='fail').length})</div>
              <div style="display:flex;flex-wrap:wrap;gap:4px">
                ${tests.map((t,i) => t.status==='fail' ? `<span style="font-family:var(--mono);font-size:10px;background:var(--red)18;border:1px solid var(--red)30;color:var(--red);border-radius:3px;padding:2px 6px">#${i+1}</span>` : '').filter(Boolean).join('')}
              </div>` : ''}
          </div>
        </div>`;
      });
    }
  }

  document.getElementById('report-preview').innerHTML = html;
  document.getElementById('export-project-name').textContent = p.name;
  buildPageLayout();
}

async function exportPdf() {
  const m = getReportData().meta;
  const password = m.pdfPassword?.trim();

  if (!password) {
    window.print();
    return;
  }

  const btn = document.querySelector('[onclick="exportPdf()"]');
  const origText = btn.textContent;
  btn.textContent = 'Generating…';
  btn.disabled = true;

  try {
    const token   = localStorage.getItem('fd_access');
    const pageUrl = window.location.href;
    const pid     = state.currentProject?.id;
    const rptKey  = `fd_rpt_${pid}`;
    const rptData = localStorage.getItem(rptKey);

    const res = await fetch(`${window.FLOWDIT_API || 'http://localhost:4000/api'}/export/pdf`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
      body: JSON.stringify({ pageUrl, token, password, rptKey, rptData }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast(err.error || 'PDF generation failed', 'error');
      return;
    }

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `${m.coverTitle || state.currentProject?.name || 'report'}.pdf`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('PDF downloaded', 'success');
  } catch (e) {
    showToast('PDF generation failed: ' + e.message, 'error');
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
}

function copyMarkdown() {
  const text = _freeEditMd ?? (_mdLines.join('\n') || (buildReport(), _mdLines.join('\n')));
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => showToast('📋 Markdown copied!', 'success'));
}

async function pageInit() {
  await loadAllTargetDetails();
  const d = getReportData();
  applyReportFont(d.meta?.font);
  applyBaseFontSize(d.meta?.baseFontSize);
  applyReportAccent(d.meta?.accentColor);
  applyWatermark(d.meta);
  if (d.freeEditMd) _freeEditMd = d.freeEditMd; // restore persisted free edit
  buildEditor();
  buildReport();
  buildPageLayout();
}

bootPage('export');
</script>
