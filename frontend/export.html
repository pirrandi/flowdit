// ── Table picker helpers ───────────────────────────────────────────
function richTableHover(palPfx, row, col) {
  for (let r = 1; r <= 8; r++)
    for (let c = 1; c <= 8; c++)
      document.getElementById(`${palPfx}-tc-${r}-${c}`)?.classList.toggle('active', r <= row && c <= col);
  const lbl = document.getElementById(`${palPfx}-tl`);
  if (lbl) lbl.textContent = `${row} × ${col} table`;
  const ri = document.getElementById(`${palPfx}-trows`);
  const ci = document.getElementById(`${palPfx}-tcols`);
  if (ri) ri.value = row;
  if (ci) ci.value = col;
}

function richTableHoverReset(palPfx) {
  for (let r = 1; r <= 8; r++)
    for (let c = 1; c <= 8; c++)
      document.getElementById(`${palPfx}-tc-${r}-${c}`)?.classList.remove('active');
  const lbl = document.getElementById(`${palPfx}-tl`);
  if (lbl) lbl.textContent = 'hover to select size';
}

function richTableInsert(editorId, palPfx, rows, cols) {
  document.querySelectorAll('.rich-color-palette').forEach(el => el.classList.remove('open'));
  _insertTable(editorId, rows, cols);
}

function richTableCustom(editorId, palPfx) {
  const rows = Math.max(1, parseInt(document.getElementById(`${palPfx}-trows`)?.value) || 3);
  const cols = Math.max(1, parseInt(document.getElementById(`${palPfx}-tcols`)?.value) || 3);
  document.querySelectorAll('.rich-color-palette').forEach(el => el.classList.remove('open'));
  _insertTable(editorId, rows, cols);
}

function _insertTable(editorId, rows, cols) {
  document.getElementById(editorId)?.focus();
  const th = n => `<th style="border:1px solid var(--b2,#555);padding:6px 10px;background:var(--bg3,#2a2a2a);font-weight:600;font-size:11px;text-align:left">Header ${n}</th>`;
  const td = ()  => `<td style="border:1px solid var(--b2,#555);padding:6px 10px;font-size:12px"> </td>`;
  const headerRow = Array.from({length:cols},(_,i)=>th(i+1)).join('');
  const bodyRows  = Array.from({length:rows},()=>`<tr>${Array.from({length:cols},td).join('')}</tr>`).join('');
  const html = `<table class="rpt-table" style="border-collapse:collapse;width:100%;margin:8px 0">
    <thead><tr>${headerRow}</tr></thead>
    <tbody>${bodyRows}</tbody>
  </table><p></p>`;
  document.execCommand('insertHTML', false, html);
}

// ── Font size ─────────────────────────────────────────────────────
function richSetFontSize(editorId, size) {
  if (!size) return;
  document.getElementById(editorId)?.focus();
  document.execCommand('fontSize', false, '7');
  document.getElementById(editorId)?.querySelectorAll('font[size="7"]').forEach(f => {
    const span = document.createElement('span');
    span.style.fontSize = size + 'px';
    while (f.firstChild) span.appendChild(f.firstChild);
    f.replaceWith(span);
  });
}

// ── Image insertion ───────────────────────────────────────────────
function richInsertImage(editorId) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById(editorId)?.focus();
      document.execCommand('insertHTML', false,
        `<img src="${e.target.result}" style="max-width:100%;border-radius:4px;margin:4px 0;display:block" alt="${esc(file.name)}">`);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function richInsertHR(editorId) {
  document.getElementById(editorId)?.focus();
  document.execCommand('insertHTML', false,
    '<hr style="border:none;border-top:1px solid var(--b1);margin:12px 0"><p></p>');
}

// ── Context toolbar state ─────────────────────────────────────────
let _rctxCell = null, _rctxImg = null, _rctxEditorId = null;

function _positionCtxTb(tbId, anchor) {
  const tb = document.getElementById(tbId);
  if (!tb || !anchor) return;
  const r   = anchor.getBoundingClientRect();
  const tbH = 38;
  const top = r.top > tbH + 8 ? r.top - tbH - 4 : r.bottom + 4;
  tb.style.top  = Math.max(4, Math.min(top, window.innerHeight - tbH - 4)) + 'px';
  tb.style.left = Math.max(4, Math.min(r.left, window.innerWidth - 480)) + 'px';
  tb.style.display = 'flex';
}

function _hideCtxTb(tbId) {
  const tb = document.getElementById(tbId);
  if (tb) tb.style.display = 'none';
}

function _hideAllCtxTb() {
  _hideCtxTb('rich-ctx-table');
  _hideCtxTb('rich-ctx-img');
  _rctxCell = null; _rctxImg = null;
}

// Hide context toolbars when any scroll container moves (toolbars are fixed, content moves)
document.addEventListener('scroll', e => {
  if (e.target.closest?.('.rich-color-palette, .rich-ctx-tb')) return;
  _hideAllCtxTb();
}, true);

// Global click handler — show/hide context toolbars
document.addEventListener('click', e => {
  if (e.target.closest('#rich-ctx-table, #rich-ctx-img')) return; // toolbar itself

  const cell = e.target.closest('td, th');
  const img  = e.target.tagName === 'IMG' ? e.target : null;

  // Table cell inside a rich editor?
  if (cell?.closest('.rich-editor')) {
    _rctxCell     = cell;
    _rctxEditorId = cell.closest('.rich-editor').id;
    _positionCtxTb('rich-ctx-table', cell.closest('table'));
    _hideCtxTb('rich-ctx-img');
    // sync custom px input if image toolbar was open
    return;
  }

  // Image inside a rich editor?
  if (img?.closest('.rich-editor')) {
    _rctxImg      = img;
    _rctxEditorId = img.closest('.rich-editor').id;
    const pxInput = document.getElementById('rich-img-w-input');
    if (pxInput) pxInput.value = Math.round(img.getBoundingClientRect().width) || '';
    _positionCtxTb('rich-ctx-img', img);
    _hideCtxTb('rich-ctx-table');
    return;
  }

  _hideCtxTb('rich-ctx-table');
  _hideCtxTb('rich-ctx-img');
  _rctxCell = null; _rctxImg = null;
});

// ── Table operations ──────────────────────────────────────────────
function _richEditorInputEvent() {
  const ed = document.getElementById(_rctxEditorId);
  ed?.dispatchEvent(new Event('input', { bubbles: true }));
}

function richTableAddRow() {
  if (!_rctxCell) return;
  const row   = _rctxCell.closest('tr');
  const table = row?.closest('table');
  if (!row || !table) return;
  const cols = table.querySelector('tr')?.cells.length || 1;
  const tr   = document.createElement('tr');
  for (let i = 0; i < cols; i++) {
    const td = document.createElement('td');
    td.style.cssText = 'border:1px solid var(--b2,#555);padding:6px 10px;font-size:12px';
    td.innerHTML = ' ';
    tr.appendChild(td);
  }
  // If clicked from header row, insert as first body row; otherwise after current row
  if (row.closest('thead')) {
    const tbody = table.querySelector('tbody') || table.createTBody();
    tbody.insertBefore(tr, tbody.firstChild);
  } else {
    row.parentNode.insertBefore(tr, row.nextSibling);
  }
  _positionCtxTb('rich-ctx-table', table);
  _richEditorInputEvent();
}

function richTableAddCol() {
  if (!_rctxCell) return;
  const table   = _rctxCell.closest('table');
  if (!table) return;
  const colIdx  = _rctxCell.cellIndex;
  table.querySelectorAll('tr').forEach(row => {
    const isHead = !!row.closest('thead');
    const cell   = document.createElement(isHead ? 'th' : 'td');
    cell.style.cssText = isHead
      ? 'border:1px solid var(--b2,#555);padding:6px 10px;background:var(--bg3,#2a2a2a);font-weight:600;font-size:11px;text-align:left'
      : 'border:1px solid var(--b2,#555);padding:6px 10px;font-size:12px';
    cell.innerHTML = isHead ? 'Header' : ' ';
    const ref = row.cells[colIdx + 1] || null;
    row.insertBefore(cell, ref);
  });
  _positionCtxTb('rich-ctx-table', table);
  _richEditorInputEvent();
}

function richTableDelRow() {
  if (!_rctxCell) return;
  const row   = _rctxCell.closest('tr');
  const table = row?.closest('table');
  if (!row || !table) return;
  if (table.querySelectorAll('tbody tr').length <= 1) return; // keep at least 1 body row
  row.remove();
  _rctxCell = null;
  _hideCtxTb('rich-ctx-table');
  _richEditorInputEvent();
}

function richTableDelCol() {
  if (!_rctxCell) return;
  const table  = _rctxCell.closest('table');
  if (!table) return;
  const colIdx = _rctxCell.cellIndex;
  if ((table.querySelector('tr')?.cells.length || 0) <= 1) return; // keep at least 1 col
  table.querySelectorAll('tr').forEach(row => { row.cells[colIdx]?.remove(); });
  _rctxCell = null;
  _hideCtxTb('rich-ctx-table');
  _richEditorInputEvent();
}

function richTableDelete() {
  if (!_rctxCell) return;
  _rctxCell.closest('table')?.remove();
  _rctxCell = null;
  _hideCtxTb('rich-ctx-table');
  _richEditorInputEvent();
}

// ── Image operations ──────────────────────────────────────────────
function richImgWidth(pct) {
  if (!_rctxImg) return;
  _rctxImg.style.width    = pct + '%';
  _rctxImg.style.maxWidth = '100%';
  _rctxImg.removeAttribute('width');
  _positionCtxTb('rich-ctx-img', _rctxImg);
  _richEditorInputEvent();
}

function richImgWidthPx(val) {
  const px = parseInt(val);
  if (!_rctxImg || !px || px < 20) return;
  _rctxImg.style.width    = Math.min(px, 2000) + 'px';
  _rctxImg.style.maxWidth = '100%';
  _rctxImg.removeAttribute('width');
  _positionCtxTb('rich-ctx-img', _rctxImg);
  _richEditorInputEvent();
}

function richImgAlign(align) {
  if (!_rctxImg) return;
  if (align === 'left')   { _rctxImg.style.float = 'left';  _rctxImg.style.margin = '4px 12px 4px 0'; }
  if (align === 'right')  { _rctxImg.style.float = 'right'; _rctxImg.style.margin = '4px 0 4px 12px'; }
  if (align === 'center') { _rctxImg.style.float = 'none';  _rctxImg.style.margin = '8px auto'; _rctxImg.style.display = 'block'; }
  _positionCtxTb('rich-ctx-img', _rctxImg);
  _richEditorInputEvent();
}

function richImgDelete() {
  if (!_rctxImg) return;
  _rctxImg.remove();
  _rctxImg = null;
  _hideCtxTb('rich-ctx-img');
  _richEditorInputEvent();
}

// Detect if content is already HTML or plain markdown
function _secContentHtml(content) {
  if (!content) return '';
  return /<[a-zA-Z][\s\S]*?>/.test(content) ? content : renderMd(content);
}

// ── Rich editor expanded modal ────────────────────────────────────
function openRichModal(secId, defaultSplit = false, field = 'content') {
  if (document.getElementById('rich-modal')) return;
  const d = getReportData();
  const sec = d.sections.find(s => s.id === secId);
  if (!sec) return;
  const title = sec.title;
  const content = _secContentHtml(field === 'description' ? sec.description : sec.content);

  const modal = document.createElement('div');
  modal.id = 'rich-modal';
  modal.className = 'fe-modal no-print';
  modal.innerHTML = `
    <div class="fe-modal-inner" id="rich-modal-inner">
      <div style="padding:8px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--bg3)">
        <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--t2)">${esc(title)}</span>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button id="rich-modal-split-btn" class="btn-secondary" style="padding:4px 11px;font-size:11px" onclick="richModalToggleSplit('${secId}')">◫ Split</button>
          <button class="btn-accent" style="padding:4px 11px;font-size:11px" onclick="closeRichModal('${secId}')">← Close</button>
        </div>
      </div>
      <div class="fe-body">
        <div style="flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden">
          ${_richToolbar(`rich-modal-ed-${secId}`, `rpal-modal-${secId}`)}
          <div class="rich-editor" contenteditable="true" id="rich-modal-ed-${secId}"
            style="flex:1;max-height:none;border-radius:0;border-left:none;border-right:none;border-bottom:none;border-top:1px solid var(--b1)"
            oninput="richModalInput('${secId}',this.innerHTML,'${field}')">${content}</div>
        </div>
        <div id="rich-modal-preview-${secId}" style="flex:1;overflow-y:auto;padding:32px 40px;border-left:1px solid var(--b1);background:var(--bg);display:none">
          <div class="rpt" style="max-width:640px;margin:0 auto">
            <div class="rpt-prose" id="rich-modal-pv-content-${secId}">${content}</div>
          </div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById(`rich-modal-ed-${secId}`)?.focus();
  if (defaultSplit) setTimeout(() => richModalToggleSplit(secId), 50);
}

function richModalInput(secId, html, field = 'content') {
  if (field === 'description') secUpdateDesc(secId, html);
  else secUpdateContent(secId, html);
  // sync inline editor
  const inline = document.getElementById(field === 'description' ? `rich-desc-${secId}` : `rich-${secId}`);
  if (inline) inline.innerHTML = html;
  // sync split preview
  const pv = document.getElementById(`rich-modal-pv-content-${secId}`);
  if (pv && document.getElementById(`rich-modal-preview-${secId}`)?.style.display !== 'none') pv.innerHTML = html;
}

function richModalToggleSplit(secId) {
  const pane  = document.getElementById(`rich-modal-preview-${secId}`);
  const inner = document.getElementById('rich-modal-inner');
  const btn   = document.getElementById('rich-modal-split-btn');
  if (!pane) return;
  const open = pane.style.display === 'none' || pane.style.display === '';
  pane.style.display = open ? 'block' : 'none';
  inner.classList.toggle('split', open);
  btn.textContent = open ? '▣ Editor only' : '◫ Split';
  if (open) {
    const html = document.getElementById(`rich-modal-ed-${secId}`)?.innerHTML || '';
    const pv = document.getElementById(`rich-modal-pv-content-${secId}`);
    if (pv) pv.innerHTML = html;
  }
}

function closeRichModal(secId) {
  // Sync modal content back to inline editor
  const modalHtml = document.getElementById(`rich-modal-ed-${secId}`)?.innerHTML;
  if (modalHtml !== undefined) {
    const inline = document.getElementById(`rich-${secId}`);
    if (inline) inline.innerHTML = modalHtml;
    secUpdateContent(secId, modalHtml);
  }
  document.getElementById('rich-modal')?.remove();
}

// ── Subsection full-view modal ────────────────────────────────────
function openRichModalSub(secId, subId) {
  if (document.getElementById('rich-modal')) return;
  const d   = getReportData();
  const sec = d.sections.find(s => s.id === secId);
  const sub = sec?.children?.find(c => c.id === subId);
  if (!sub) return;
  const content = _secContentHtml(sub.content);
  const modal = document.createElement('div');
  modal.id = 'rich-modal';
  modal.className = 'fe-modal no-print';
  modal.innerHTML = `
    <div class="fe-modal-inner" id="rich-modal-inner">
      <div style="padding:8px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--bg3)">
        <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--t2)">${esc(sub.title)}</span>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button id="rich-modal-split-btn" class="btn-secondary" style="padding:4px 11px;font-size:11px" onclick="richSubModalToggleSplit('${subId}')">◫ Split</button>
          <button class="btn-accent" style="padding:4px 11px;font-size:11px" onclick="closeRichModalSub('${secId}','${subId}')">← Close</button>
        </div>
      </div>
      <div class="fe-body">
        <div style="flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden">
          ${_richToolbar(`rich-modal-sub-ed-${subId}`, `rpal-sub-modal-${subId}`)}
          <div class="rich-editor" contenteditable="true" id="rich-modal-sub-ed-${subId}"
            style="flex:1;max-height:none;border-radius:0;border-left:none;border-right:none;border-bottom:none;border-top:1px solid var(--b1)"
            oninput="richSubModalInput('${secId}','${subId}',this.innerHTML)">${content}</div>
        </div>
        <div id="rich-sub-modal-preview-${subId}" style="flex:1;overflow-y:auto;padding:32px 40px;border-left:1px solid var(--b1);background:var(--bg);display:none">
          <div class="rpt" style="max-width:640px;margin:0 auto">
            <div class="rpt-prose" id="rich-sub-modal-pv-${subId}">${content}</div>
          </div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById(`rich-modal-sub-ed-${subId}`)?.focus();
}

function richSubModalInput(secId, subId, html) {
  secUpdateSubContent(secId, subId, html);
  const inline = document.getElementById(`rich-${subId}`);
  if (inline) inline.innerHTML = html;
  const pv = document.getElementById(`rich-sub-modal-pv-${subId}`);
  if (pv && document.getElementById(`rich-sub-modal-preview-${subId}`)?.style.display !== 'none') pv.innerHTML = html;
}

function richSubModalToggleSplit(subId) {
  const pane  = document.getElementById(`rich-sub-modal-preview-${subId}`);
  const inner = document.getElementById('rich-modal-inner');
  const btn   = document.getElementById('rich-modal-split-btn');
  if (!pane) return;
  const open = pane.style.display === 'none' || pane.style.display === '';
  pane.style.display = open ? 'block' : 'none';
  inner.classList.toggle('split', open);
  btn.textContent = open ? '▣ Editor only' : '◫ Split';
  if (open) {
    const el = document.querySelector(`#rich-modal-inner .rich-editor`);
    const pv = document.getElementById(`rich-sub-modal-pv-${subId}`);
    if (pv && el) pv.innerHTML = el.innerHTML;
  }
}

function closeRichModalSub(secId, subId) {
  const modalHtml = document.getElementById(`rich-modal-sub-ed-${subId}`)?.innerHTML;
  if (modalHtml !== undefined) {
    secUpdateSubContent(secId, subId, modalHtml);
    const inline = document.getElementById(`rich-${subId}`);
    if (inline) inline.innerHTML = modalHtml;
  }
  document.getElementById('rich-modal')?.remove();
}

// Close color palettes when clicking outside
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.rich-color-wrap'))
    document.querySelectorAll('.rich-color-palette').forEach(el => el.classList.remove('open'));
});

// ── Build a single section item HTML ─────────────────────────────
function buildSecItem(sec) {
  const PROSE    = new Set(['custom']);
  const isCustom = sec.type === 'custom';
  const hasEditor = PROSE.has(sec.type);

  let html = `<div class="sec-item" id="sec-item-${sec.id}"
    draggable="true"
    ondragstart="secDragStart(event,'${sec.id}')"
    ondragend="secDragEnd()"
    ondragover="secDragOver(event,'${sec.id}')"
    ondrop="secDrop(event,'${sec.id}')">
    <div class="sec-row">
      <span class="sec-drag" title="Drag to reorder" onmousedown="secDragHandleDown()">⠿</span>
      <button class="sec-eye ${sec.visible?'':'off'}" id="sec-eye-${sec.id}"
        onclick="secToggleVisible('${sec.id}')" title="${sec.visible?'Hide':'Show'}"><span class="sec-eye-dot"></span></button>
      <div class="sec-title-wrap">
        <div class="sec-title ${sec.visible?'':'sec-dim'}" id="sec-title-${sec.id}">${esc(sec.title)}</div>
      </div>
      <button class="sec-btn sec-pb-btn ${sec.pageBreak?'sec-pb-on':''}" id="sec-pb-${sec.id}"
        title="${sec.pageBreak?'Remove page break':'Start on new page'}"
        onclick="secTogglePageBreak('${sec.id}')">⏎</button>
      <button class="sec-btn" onclick="openRichModal('${sec.id}',true,${isCustom?`'content'`:`'description'`})" title="Full editor">⤢</button>
      <button class="sec-btn" id="sec-edit-btn-${sec.id}" onclick="secToggleEdit('${sec.id}')" title="Inline edit">✎</button>
      ${isCustom ? `<button class="sec-btn del" onclick="secDelete('${sec.id}')">✕</button>` : ''}
    </div>`;

  html += `<div class="sec-edit-body" id="sec-edit-${sec.id}">`;

  html += `<div class="exp-meta-row" style="margin-bottom:6px">
    <div class="exp-field-label">Section Title</div>
    <input class="exp-input" id="sec-title-input-${sec.id}" value="${esc(sec.title)}"
      oninput="secUpdateTitle('${sec.id}',this.value)">
  </div>`;

  html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
    <div class="exp-field-label" style="margin:0;min-width:58px">Font Size</div>
    <select class="exp-input" style="width:76px;font-size:10px" onchange="secUpdateFontSize('${sec.id}',this.value)">
      ${['','11','12','13','14','15','16'].map(s=>`<option value="${s}" ${String(sec.fontSize||'')==s?'selected':''}>${s?s+'px':'auto'}</option>`).join('')}
    </select>
  </div>`;

  if (isCustom) {
    html += _richToolbar(sec.id);
    html += `<div class="rich-editor" contenteditable="true" id="rich-${sec.id}"
      oninput="secUpdateContent('${sec.id}',this.innerHTML)">${_secContentHtml(sec.content)}</div>`;
  } else {
    html += `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div class="exp-field-label" style="margin:0">Intro text</div>
      ${sec.type === 'exec-summary' ? `<button class="ai-btn" id="ai-exec-btn" onclick="aiExecSummary('${sec.id}')" title="Generate executive summary from findings">✦ Generate</button>` : ''}
      ${sec.type === 'remediation-roadmap' ? `<button class="ai-btn" id="ai-roadmap-btn" onclick="aiRoadmapActions('${sec.id}')" title="Generate action items for every finding missing one">✦ Generate All</button>` : ''}
    </div>`;
    html += _richToolbar('desc-'+sec.id, 'desc-'+sec.id);
    html += `<div class="rich-editor" contenteditable="true" id="rich-desc-${sec.id}"
      oninput="secUpdateDesc('${sec.id}',this.innerHTML)">${_secContentHtml(sec.description)}</div>`;
  }

  html += `</div>`;

  // ── Findings options (detailed-findings only) ──
  if (sec.type === 'detailed-findings') {
    html += `<div style="padding:4px 14px 8px;border-top:1px dashed var(--b1)55">
      <div class="exp-field-label" style="margin-bottom:4px;font-size:9px;text-transform:uppercase;letter-spacing:.06em">Include in findings</div>
      <div style="display:flex;flex-wrap:wrap;gap:2px 10px">
        <label class="exp-opt"><input type="checkbox" id="opt-desc"  checked onchange="buildReport()"> Description</label>
        <label class="exp-opt"><input type="checkbox" id="opt-rem"   checked onchange="buildReport()"> Remediation</label>
        <label class="exp-opt"><input type="checkbox" id="opt-pay"   checked onchange="buildReport()"> Payloads</label>
        <label class="exp-opt"><input type="checkbox" id="opt-notes"        onchange="buildReport()"> Notes</label>
        <label class="exp-opt"><input type="checkbox" id="opt-evid"  checked onchange="buildReport()"> Evidence</label>
      </div>
    </div>`;
  }

  // ── Subsections ──
  const children = sec.children || [];
  html += `<div class="sec-sub-list" id="sec-sub-list-${sec.id}">`;
  children.forEach(sub => { html += _buildSubItem(sec.id, sub); });
  html += `<div class="sec-sub-add">
    <button class="sec-btn" onclick="secAddSub('${sec.id}')" style="font-size:9px">+ Subsection</button>
  </div>`;
  html += `</div>`;

  html += `</div>`;
  return html;
}

// ── Report Templates ──────────────────────────────────────────────
const TPL_KEY = 'fd_report_templates';

function getTemplates() {
  try { return JSON.parse(localStorage.getItem(TPL_KEY) || '[]'); } catch { return []; }
}
function _saveTemplates(list) { localStorage.setItem(TPL_KEY, JSON.stringify(list)); }

function saveTemplate() {
  const input = document.getElementById('tpl-name-input');
  const name = input?.value.trim();
  if (!name) { input?.focus(); return; }
  const d = getReportData();
  const tpl = { name, created: new Date().toISOString().slice(0,10), meta: d.meta, sections: d.sections };
  const list = getTemplates();
  list.unshift(tpl);
  _saveTemplates(list);
  if (input) input.value = '';
  buildEditor();
}

function loadTemplate(idx) {
  const tpl = getTemplates()[idx];
  if (!tpl) return;
  if (!confirm(`Load template "${tpl.name}"? This will overwrite the current report configuration.`)) return;
  const d = getReportData();
  d.meta = { ...tpl.meta };
  d.sections = tpl.sections.map(s => ({ ...s }));
  saveReportData(d);
  buildEditor();
}

function deleteTemplate(idx) {
  const list = getTemplates();
  if (!list[idx]) return;
  if (!confirm(`Delete template "${list[idx].name}"?`)) return;
  list.splice(idx, 1);
  _saveTemplates(list);
  buildEditor();
}

function exportTemplate(idx) {
  const tpl = getTemplates()[idx];
  if (!tpl) return;
  const blob = new Blob([JSON.stringify(tpl, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${tpl.name.replace(/\s+/g,'-').toLowerCase()}-template.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importTemplateFile(input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const tpl = JSON.parse(e.target.result);
      if (!tpl.meta || !tpl.sections) { alert('Invalid template file.'); return; }
      if (!tpl.name) tpl.name = file.name.replace(/\.json$/i,'');
      if (!tpl.created) tpl.created = new Date().toISOString().slice(0,10);
      const list = getTemplates();
      list.unshift(tpl);
      _saveTemplates(list);
      buildEditor();
    } catch { alert('Could not parse template file.'); }
  };
  reader.readAsText(file);
  input.value = '';
}

function _renderTemplatesSection(_sh) {
  const list = getTemplates();
  let inner = `
    <div style="display:flex;gap:5px;margin-bottom:8px">
      <input id="tpl-name-input" class="exp-input" placeholder="Template name…" style="flex:1"
        onkeydown="if(event.key==='Enter')saveTemplate()">
      <button class="sec-btn" onclick="saveTemplate()" style="flex-shrink:0;white-space:nowrap">Save current</button>
    </div>
    <label class="sec-btn" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-bottom:${list.length?'8':'0'}px">
      ↑ Import .json<input type="file" accept=".json,application/json" style="display:none" onchange="importTemplateFile(this)">
    </label>`;

  if (list.length) {
    inner += `<div style="display:flex;flex-direction:column;gap:4px">`;
    list.forEach((tpl, i) => {
      inner += `<div style="display:flex;align-items:center;gap:4px;padding:5px 7px;background:var(--bg);border:1px solid var(--b1);border-radius:5px">
        <div style="flex:1;min-width:0">
          <div style="font-size:11px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(tpl.name)}</div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--t3)">${tpl.created||''} · ${tpl.sections?.length||0} sections</div>
        </div>
        <button class="sec-btn" onclick="loadTemplate(${i})" title="Load">↓ Load</button>
        <button class="sec-btn" onclick="exportTemplate(${i})" title="Export JSON">↓ .json</button>
        <button class="sec-btn del" onclick="deleteTemplate(${i})" title="Delete">✕</button>
      </div>`;
    });
    inner += `</div>`;
  } else {
    inner += `<div style="font-family:var(--mono);font-size:10px;color:var(--t3);padding:4px 0">No saved templates.</div>`;
  }
  return inner;
}

async function loadAllTargetDetails() {
  const pid = state.currentProject?.id;
  if (!pid || !state.targets?.length) return;
  await Promise.all(state.targets.map(async t => {
    try {
      const [ports, endpoints] = await Promise.all([
        api.targets.listPorts(pid, t.id).catch(() => []),
        api.targets.listEndpoints(pid, t.id).catch(() => []),
      ]);
      _targetFull[t.id] = { ports, endpoints };
    } catch {}
  }));
}

function getEdit(id) {
  if (!_localEdits[id]) _localEdits[id] = { description:'', remediation:'', notes:'', businessImpact:'', execAction:'', evidence:[], _richHtml:false };
  if (!Array.isArray(_localEdits[id].evidence)) _localEdits[id].evidence = [];
  return _localEdits[id];
}

// Persiste el impacto de negocio (texto plano) en localStorage del reporte (no en la DB)
function saveVulnBizImpact(id, value) {
  getEdit(id).businessImpact = value;
  const d = getReportData();
  if (!d.vulnEdits) d.vulnEdits = {};
  if (!d.vulnEdits[id]) d.vulnEdits[id] = {};
  d.vulnEdits[id].businessImpact = value;
  saveReportData(d, false);
}

// Persiste la acción recomendada (Hoja de Ruta, texto plano) en localStorage del reporte (no en la DB)
function saveVulnExecAction(id, value) {
  getEdit(id).execAction = value;
  const d = getReportData();

  if (!d.vulnEdits[id]) d.vulnEdits[id] = {};
  d.vulnEdits[id].execAction = value;

}

// ── Autosave timers ───────────────────────────────────────────────
const _saveTimers = {};

function scheduleVulnSave(vulnId) {
  clearTimeout(_saveTimers[vulnId]);
  _saveTimers[vulnId] = setTimeout(async () => {
    const e = _localEdits[vulnId] || {};
    try {
      const updated = await api.vulns.update(state.currentProject.id, vulnId, {
        notes:    e.notes    ?? '',
        evidence: e.evidence || [],
      });
      const v = state.customVulns.find(x => x.id === vulnId);
      if (v) Object.assign(v, updated);
      flashSaved(vulnId);
    } catch {}
  }, 900);
}

function setProbability(id, val) {
  getEdit(id).probability = +val;
  const d = getReportData();
  if (!d.vulnEdits) d.vulnEdits = {};
  if (!d.vulnEdits[id]) d.vulnEdits[id] = {};
  d.vulnEdits[id].probability = +val;
  saveReportData(d, false);
  buildReport();
}

function saveVulnEdit(id, field, html) {
  getEdit(id)[field]    = html;
  getEdit(id)._richHtml = true;
  const d = getReportData();
  if (!d.vulnEdits) d.vulnEdits = {};
  if (!d.vulnEdits[id]) d.vulnEdits[id] = {};
  d.vulnEdits[id][field]    = html;
  d.vulnEdits[id]._richHtml = true;
  saveReportData(d, false);
  buildReport();
}

function syncVulnFieldInline(id, field, html) {
  const inline = document.getElementById(`vfield-inline-${id}-${field}`);

function richVulnModalToggleSplit(id, field) {
  const pane  = document.getElementById(`vfield-modal-preview-${id}-${field}`);
  const inner = document.getElementById('rich-modal-inner');
  const btn   = document.getElementById('rich-modal-split-btn');
  if (!pane) return;
  const open = pane.style.display === 'none' || pane.style.display === '';
  pane.style.display = open ? 'block' : 'none';
  inner.classList.toggle('split', open);
  btn.textContent = open ? '▣ Editor only' : '◫ Split';
  if (open) {
    const html = document.getElementById(`vfield-modal-ed-${id}-${field}`)?.innerHTML || '';
    const pv = document.getElementById(`vfield-modal-pv-${id}-${field}`);
    if (pv) pv.innerHTML = html;
  }
}

function closeVulnFieldModal(id, field) {
  const modalHtml = document.getElementById(`vfield-modal-ed-${id}-${field}`)?.innerHTML;
  if (modalHtml !== undefined) saveVulnEdit(id, field, modalHtml);
  document.getElementById('rich-modal')?.remove();
}

function scheduleWSTGSave(testId) {
  clearTimeout(_saveTimers[testId]);
  _saveTimers[testId] = setTimeout(async () => {
    const e = _localEdits[testId] || {};
    try {
      await api.wstg.saveReport(state.currentProject.id, testId, e.description||'', e.remediation||'');
      if (state.wstgProgress[testId]) {
        state.wstgProgress[testId].description = e.description||'';
        state.wstgProgress[testId].remediation = e.remediation||'';
      }
      flashSaved(testId);
      buildReport();
    } catch {}
  }, 900);
}

function flashSaved(id) {
  const dot = document.getElementById(`saved-${id}`);
  if (!dot) return;
  dot.classList.add('show');
  setTimeout(() => dot.classList.remove('show'), 1500);
}

// ── Evidence handling ─────────────────────────────────────────────
function pickEvidence(id, isWSTG) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.onchange = () => {
    const files = Array.from(input.files);
    let done = 0;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        getEdit(id).evidence.push({ name: file.name, data: e.target.result });
        done++;
        if (done === files.length) {
          renderEvidenceList(id, isWSTG);
          if (!isWSTG) scheduleVulnSave(id);
        }
      };
      reader.readAsDataURL(file);
    });
  };
  input.click();
}

function removeEvidence(id, idx, isWSTG) {
  getEdit(id).evidence.splice(idx, 1);
  renderEvidenceList(id, isWSTG);
  if (!isWSTG) scheduleVulnSave(id);
}

function renderEvidenceList(id, isWSTG) {
  const container = document.getElementById(`evid-list-${id}`);
  if (!container) return;
  const evid = getEdit(id).evidence;
  container.innerHTML = evid.length
    ? evid.map((img, i) => `
        <div class="exp-evidence-row">
          <img src="${img.data}" class="exp-evidence-thumb">
          <span class="exp-evidence-name">${esc(img.name||'image')}</span>
          <button class="btn-remove" onclick="removeEvidence('${id}',${i},${isWSTG})">✕</button>
        </div>`).join('')
    : `<div style="font-family:var(--mono);font-size:10px;color:var(--t3)">No images</div>`;
  buildReport();
}

// ── AI: Executive Summary ─────────────────────────────────────────
async function aiExecSummary(secId) {
  const btn = document.getElementById('ai-exec-btn');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const vulns = state.customVulns || [];
    const bySeverity = {};
    ['critical','high','medium','low','info'].forEach(s => {
      const n = vulns.filter(v => (v.severity || 'medium') === s).length;
      if (n) bySeverity[s] = n;
    });
    const highlights = vulns
      .filter(v => v.severity === 'critical' || v.severity === 'high')
      .slice(0, 8)
      .map(v => ({ name: v.name, severity: v.severity, target_host: v.target_host || '' }));

    const proj    = state.currentProject || {};
    const targets = (state.targets || []).filter(t => t.scope === 'in').map(t => t.host);
    const wstgMap = state.wstgProgress || {};
    const done    = Object.values(wstgMap).filter(t => t.status === 'pass').length;
    const fail    = Object.values(wstgMap).filter(t => t.status === 'fail').length;
    const total   = Object.keys(wstgMap).length;
    const pct     = total ? Math.round((done + fail) / total * 100) : 0;

    const context = {
      projectName: proj.name || '',
      scope:       proj.description || '',
      targets,
      totalVulns:  vulns.length,
      bySeverity,
      highlights,
      wstg: total ? { done, fail, pending: total - done - fail, pct } : null,
    };

    const apiBase = window.FLOWDIT_API || 'http://localhost:4000/api';
    const res = await fetch(`${apiBase}/projects/${state.currentProject.id}/ai/generate`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${tokens.access}`,
      },
      body: JSON.stringify({ type: 'exec-summary', context }),
    });
    if (!res.ok) throw new Error((await res.json()).error || 'AI error');
    const result = await res.json();

    if (result.description) {
      const d = getReportData();
      const sec = d.sections.find(s => s.id === secId);
      if (sec) {
        sec.description = result.description;
        saveReportData(d, true);
        const el = document.getElementById(`rich-desc-${secId}`);
        if (el) el.innerHTML = _secContentHtml(result.description);
      }
    }
  } catch(e) {
    alert('AI error: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '✦ Generate'; }
  }
}

async function aiBusinessImpact(vulnId) {
  const btn = document.getElementById(`ai-biz-${vulnId}`);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const v = (state.customVulns || []).find(x => x.id === vulnId);
    if (!v) throw new Error('Finding not found');
    const edit = getEdit(vulnId);
    const context = {
      name:        v.name,
      severity:    v.severity,
      category:    v.category || '',
      target:      v.target_host || '',
      description: (edit.description || v.description || '').replace(/<[^>]+>/g, ' '),
    };

    const apiBase = window.FLOWDIT_API || 'http://localhost:4000/api';
    const res = await fetch(`${apiBase}/projects/${state.currentProject.id}/ai/generate`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${tokens.access}`,
      },
      body: JSON.stringify({ type: 'business-impact', context }),
    });
    if (!res.ok) throw new Error((await res.json()).error || 'AI error');
    const result = await res.json();

    if (result.businessImpact) {
      saveVulnBizImpact(vulnId, result.businessImpact);
      const el = document.getElementById(`ebiz-${vulnId}`);
      if (el) el.value = result.businessImpact;
      buildReport();
    }
  } catch(e) {
    alert('AI error: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '✦ Generate'; }
  }
}

async function _fetchRemediationAction(v, edit) {
  const context = {
    name:        v.name,
    severity:    v.severity,
    category:    v.category || '',
    remediation: (edit.remediation || v.remediation || '').replace(/<[^>]+>/g, ' '),
  };
  const apiBase = window.FLOWDIT_API || 'http://localhost:4000/api';
  const res = await fetch(`${apiBase}/projects/${state.currentProject.id}/ai/generate`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${tokens.access}`,
    },
    body: JSON.stringify({ type: 'remediation-action', context }),
  });
  if (!res.ok) throw new Error((await res.json()).error || 'AI error');
  const result = await res.json();
  return result.execAction || '';
}

async function aiRemediationAction(vulnId) {
  const btn = document.getElementById(`ai-action-${vulnId}`);
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const v = (state.customVulns || []).find(x => x.id === vulnId);
    if (!v) throw new Error('Finding not found');
    const action = await _fetchRemediationAction(v, getEdit(vulnId));
    if (action) {
      saveVulnExecAction(vulnId, action);
      const el = document.getElementById(`eaction-${vulnId}`);
      if (el) el.value = action;
      buildReport();
    }
  } catch(e) {
    alert('AI error: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '✦ Generate'; }
  }
}

// Generates the "Acción Recomendada" for every finding still missing one (does not overwrite existing text)
async function aiRoadmapActions(secId) {
  const btn = document.getElementById('ai-roadmap-btn');
  const vulns = (state.customVulns || []).filter(v => !getEdit(v.id).execAction);
  if (!vulns.length) { if (btn) btn.textContent = 'Nothing to generate'; setTimeout(() => { if (btn) btn.textContent = '✦ Generate All'; }, 1500); return; }
  if (btn) btn.disabled = true;
  let done = 0;
  for (const v of vulns) {
    if (btn) btn.textContent = `${done}/${vulns.length}…`;
    try {
      const action = await _fetchRemediationAction(v, getEdit(v.id));
      if (action) {
        saveVulnExecAction(v.id, action);
        const el = document.getElementById(`eaction-${v.id}`);
        if (el) el.value = action;
      }
    } catch(e) {
      console.error('[ai roadmap action]', v.id, e);
    }
    done++;
  }
  if (btn) { btn.disabled = false; btn.textContent = '✦ Generate All'; }
  buildReport();
}

// ── Build editor panel ────────────────────────────────────────────
function buildEditor() {
  const scope  = document.getElementById('export-scope')?.value || 'all';
  const vulns  = state.customVulns || [];
  const bySev  = {};
  SEV_ORDER.forEach(s => bySev[s] = vulns.filter(v => (v.severity||'medium') === s));

  const failedTests = [];
  if (scope !== 'vulns') {
    WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
      if (state.wstgProgress[t.id]?.status === 'fail')
        failedTests.push({ cat: cat.name, test: t, prog: state.wstgProgress[t.id] });
    }));
  }

  let html = buildSectionList();

  // ── Custom vulns section ──────────────────────────────────────
  if (scope !== 'wstg' && vulns.length) {
    html += editorSection('custom-vulns', 'Vulnerabilidades', true, () => {
      const d = getReportData();
      let inner = '';
      SEV_ORDER.forEach(sev => {
        bySev[sev].forEach(v => {
          if (!_localEdits[v.id]) {
            const saved = d.vulnEdits?.[v.id];
            const base = {
              description:    v.description ? renderMd(v.description) : '',
              remediation:    v.remediation ? renderMd(v.remediation) : '',
              notes:          v.notes    || '',
              businessImpact: '',
              execAction:     '',
              evidence:       v.evidence || [],
              _richHtml:      true,
            };
            _localEdits[v.id] = saved ? { ...base, ...saved, notes: base.notes, evidence: base.evidence } : base;
            if (_localEdits[v.id].probability == null)
              _localEdits[v.id].probability = d.vulnEdits?.[v.id]?.probability ?? 3;
            if (_localEdits[v.id].remediationPriority == null)
              _localEdits[v.id].remediationPriority = d.vulnEdits?.[v.id]?.remediationPriority ?? defaultPriority(sev);
          }
          inner += findingEditorRich(v.id, v);
        });
      });
      return inner;
    });
  }

  // ── WSTG vulns found ─────────────────────────────────────────
  if (scope !== 'vulns' && failedTests.length) {
    html += editorSection('wstg-vulns', 'WSTG — Vulns Found', true, () => {
      let inner = '';
      failedTests.forEach(({ test, prog }) => {
        const id = test.id;
        if (!_localEdits[id]) {
          _localEdits[id] = {
            description: prog?.description || '',
            remediation: prog?.remediation || '',
            evidence:    [],
          };
        }
        inner += findingEditor(id, `${id} — ${test.name}`, null, true);
      });
      return inner;
    });
  }

  if (!html) html = `<div style="padding:20px 14px;font-family:var(--mono);font-size:11px;color:var(--t3)">No findings to edit for this scope.</div>`;

  document.getElementById('editor-panel').innerHTML = html;
  // Restore evidence lists
  vulns.forEach(v => renderEvidenceList(v.id, false));
  failedTests.forEach(({ test }) => renderEvidenceList(test.id, true));
}
