// ── Server-side persistence of the report configuration ───────────
// This whole object (cover metadata, section layout, the per-finding
// editorial data — risk-matrix probability, remediation priority, business
// impact, executive action, rewritten description/remediation — and the
// free markdown edit) used to live only in this browser's localStorage, so
// a different machine or a cleared profile silently threw the work away.
// localStorage stays as the synchronous working copy — buildReport() reads
// it on every keystroke and the PDF exporter replays it inside headless
// Chromium — but the server is the source of truth on load.
let _rptSyncTimer   = null;
let _rptSyncReady   = false;  // the server copy has been pulled; pushes allowed
let _rptSyncBlocked = false;  // viewer/pentester role or unreachable API: work locally
// updated_at of the server copy this tab builds on (null = nothing saved
// yet). Sent with every push: the server refuses the write with 409 if the
// stored copy changed since (another tab, or an approved Claude Code
// proposal), instead of letting this tab silently overwrite it.
let _rptServerUpdatedAt = null;
// PUTs run one after another, so each carries the stamp the previous one got.
let _rptSaving = Promise.resolve();

const RPT_CONFLICT_MSG = 'El informe se modificó en otro lado (por ejemplo, una propuesta de Claude Code aprobada). Se cargó la versión del servidor: los cambios sin guardar de esta ventana se perdieron, revisalos.';
const RPT_REMOTE_MSG   = 'El informe se actualizó en otro lado (por ejemplo, una propuesta de Claude Code aprobada). Se cargó la versión nueva.';

function saveReportToServer(pid) {
  _rptSaving = _rptSaving.then(async () => {
    if (_rptSyncBlocked || pid !== state.currentProject?.id) return;
    _setSaveState('saving');
    try {
      // Read at send time: the latest local copy, not the one when queued.
      const row = await api.reportConfig.save(pid, getReportData(), _rptServerUpdatedAt);
      _rptServerUpdatedAt = row?.updated_at ?? _rptServerUpdatedAt;
      _setSaveState(_rptSyncTimer ? 'pending' : 'saved');
    } catch (e) {
      // 403 = viewer/pentester, it will never succeed; anything else may be transient.
      if (e?.status === 403) { _rptSyncBlocked = true; _setSaveState('local'); }
      else if (e?.status === 409 && e.data?.current) { adoptServerReport(e.data.current, RPT_CONFLICT_MSG, 'error'); _setSaveState('saved'); }
      else { console.warn('[export] report config sync failed:', e?.message || e); _setSaveState('error'); }
    }
  });
  return _rptSaving;
}

// ── Save status (page head) ───────────────────────────────────────
// Reflects the real push state: pending debounce, PUT in flight, last
// successful save, or a failed push (click to retry).
let _saveState = 'idle';      // idle | pending | saving | saved | error | local
let _savedAt   = null;        // Date of the last confirmed server copy

function _setSaveState(st) {
  _saveState = st;
  if (st === 'saved') _savedAt = new Date();
  renderSaveStatus();
}

function _agoShort(date) {
  const s = Math.max(0, (Date.now() - date.getTime()) / 1000);
  if (s < 60) return 'ahora';
  if (s < 3600) return `hace ${Math.floor(s / 60)} min`;
  if (s < 86400) return `hace ${Math.floor(s / 3600)} h`;
  return date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
}

function renderSaveStatus() {
  const el = document.getElementById('rpt-save-status');
  const tx = document.getElementById('rpt-save-text');
  if (!el || !tx) return;
  let cls = '', text, title = '';
  if (_rptSyncBlocked) {
    cls = 'is-local';
    text = canActForClient() ? 'sin conexión · solo en este navegador' : 'sin sincronizar · solo en este navegador';
    title = canActForClient() ? 'No se pudo conectar con el servidor: los cambios quedan en este navegador. Recargá la página.'
      : 'Tu rol no guarda el informe en el servidor';
  } else if (_saveState === 'error') {
    cls = 'is-error'; text = 'error al guardar ·'; title = 'No se pudo guardar en el servidor: los cambios siguen en este navegador.';
  } else if (_saveState === 'pending' || _saveState === 'saving') {
    cls = 'is-pending'; text = 'guardando…';
  } else if (_savedAt) {
    text = `guardado · ${_agoShort(_savedAt)}`; title = _savedAt.toLocaleString('es-ES');
  } else {
    text = _rptSyncReady ? 'sin cambios guardados' : 'cargando…';
  }
  el.className = 'exp-save' + (cls ? ' ' + cls : '');
  el.title = title;
  tx.textContent = text;
  if (cls === 'is-error') tx.insertAdjacentHTML('beforeend', ' <button type="button" class="insp-link" onclick="retryReportSave()">reintentar</button>');
}
setInterval(renderSaveStatus, 30000);

function retryReportSave() {
  if (_saveState !== 'error' || _rptSyncBlocked) return;
  const pid = state.currentProject?.id;
  if (pid) saveReportToServer(pid);
}

// Replaces the local working copy with the server one and re-renders.
// Whatever this tab had not saved yet is discarded: it was built on a copy
// that no longer exists.
function adoptServerReport(row, message, type = 'info') {
  const pid = state.currentProject?.id;
  if (!pid || !row?.data || typeof row.data !== 'object') return;
  clearTimeout(_rptSyncTimer);
  _rptSyncTimer = null;
  _rptServerUpdatedAt = row.updated_at ?? null;
  if (row.updated_at) _savedAt = new Date(row.updated_at);
  localStorage.setItem(`fd_rpt_${pid}`, JSON.stringify(row.data));
  _afterReportDataReplaced();
  if (message) showToast(message, type);
}

function pushReportConfig() {
  if (window.FLOWDIT_SNAPSHOT) return;   // headless PDF render — never writes back
  if (!_rptSyncReady || _rptSyncBlocked) return;
  const pid = state.currentProject?.id;
  if (!pid) return;
  clearTimeout(_rptSyncTimer);
  _setSaveState('pending');
  _rptSyncTimer = setTimeout(() => {
    _rptSyncTimer = null;
    saveReportToServer(pid);
  }, 800);
}

// Fire the pending debounced write now. Without this, edits made in the last
// 800ms before the tab is hidden or closed would never reach the server —
// exactly the kind of silent loss this whole change exists to stop.
function flushReportConfig() {
  if (!_rptSyncTimer) return;
  clearTimeout(_rptSyncTimer);
  _rptSyncTimer = null;
  if (!_rptSyncReady || _rptSyncBlocked || window.FLOWDIT_SNAPSHOT) return;
  const pid = state.currentProject?.id;
  if (!pid) return;
  saveReportToServer(pid);
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushReportConfig();
});
window.addEventListener('pagehide', flushReportConfig);

// The server wrote the report (an approved Claude Code report_section
// proposal, see services/mcp/proposals.js): adopt it now instead of waiting
// for the next autosave to bounce with a 409.
wsClient.on('report_config:changed', (msg) => {
  if (window.FLOWDIT_SNAPSHOT || !_rptSyncReady || _rptSyncBlocked) return;
  // This tab is approving a proposal: approveReportProposal() pulls and
  // adopts the new copy itself, with its own message.
  if (_rptpApproving) return;
  if (msg?.updated_at && msg.updated_at === _rptServerUpdatedAt) return;
  // Local edits still waiting to be saved: that save gets the 409 and the
  // adopt-with-loss notice, which is what actually happened to them.
  if (_rptSyncTimer) { flushReportConfig(); return; }
  const pid = state.currentProject?.id;
  if (!pid) return;
  _rptSaving = _rptSaving.then(async () => {
    try {
      const row = await api.reportConfig.get(pid);
      if (pid === state.currentProject?.id && row?.updated_at !== _rptServerUpdatedAt) {
        adoptServerReport(row, RPT_REMOTE_MSG, 'info');
      }
    } catch (e) {
      console.warn('[export] could not refresh report config:', e?.message || e);
    }
  });
});

// ── Claude Code report proposals (report_section) ─────────────────
// Claude Code proposes the HTML of one prose field (a section's content, or
// the intro text of a built-in section like exec-summary). They are reviewed
// here, next to the report, not in the Findings inbox. Approving writes only
// that field server-side (lead roles only, same rule as PUT /report-config);
// this tab then pulls and adopts the new copy.
let _rptProposals   = [];     // pending report_section proposals
let _rptpOpenId     = null;   // proposal shown in the review modal
let _rptpBusy       = false;  // approve/reject in flight
let _rptpApproving  = false;  // see the report_config:changed handler
let _rptpLoadSeq    = 0;      // drops stale list responses

const RPTP_LEAD_ONLY = 'Solo un Owner o Editor puede aprobar contenido del informe';

function _rptpCanReview() {
  return ['owner', 'editor', 'pentester'].includes(state.currentProject?.member_role);
}

async function loadReportProposals() {
  if (window.FLOWDIT_SNAPSHOT) return;
  const pid = state.currentProject?.id;
  if (!pid) return;
  const seq = ++_rptpLoadSeq;
  let list;
  try {
    list = await api.mcpProposals.list(pid, 'pending', { kind: 'report_section' });
  } catch (e) {
    // A viewer gets 403 (proposals are internal): simply nothing to show.
    if (e?.status !== 403) console.warn('[export] could not load report proposals:', e?.message || e);
    list = [];
  }
  if (seq !== _rptpLoadSeq || pid !== state.currentProject?.id) return;
  _rptProposals = Array.isArray(list) ? list : [];
  // Reviewed elsewhere (another tab, another lead) while shown here.
  if (_rptpOpenId && !_rptpBusy && !_rptProposals.some(p => p.id === _rptpOpenId)) {
    closeReportProposal();
    showToast('Esa propuesta ya fue revisada', 'info');
  }
  rptpPaintBadges();
}

function _rptpFor(secId, subId) {
  return _rptProposals.find(p => p.payload?.section_id === secId && (p.payload?.subsection_id || '') === (subId || ''));
}

// Proposals are reviewed in the inspector of the section they target. This
// repaints the markers and the card in place: no inspector rebuild, so an open
// inline editor keeps its caret. The preview is rebuilt only when the
// "Con propuesta" overlay it shows changed.
function rptpPaintBadges() {
  if (window.FLOWDIT_SNAPSHOT) return;
  renderOutline();
  renderProposalSlot();
  renderPreviewBar();
  if (_previewKey() !== _lastPreviewKey) buildReport();
}

// HTML is sanitized server-side (services/mcp/report.js) and again here
// before it touches the DOM. Fails closed: without DOMPurify the markup is
// shown escaped instead of rendered.
function rptpSafeHtml(html) {
  if (!html) return `<span class="ccp-muted">(vacío)</span>`;
  if (!window.DOMPurify) return `<pre class="drw-code ccp-pre">${esc(html)}</pre>`;
  return `<div class="rpt"><div class="rpt-prose rptp-content">${window.DOMPurify.sanitize(_secContentHtml(html))}</div></div>`;
}

function _rptpWhere(pl) {
  return esc(pl.section_title || pl.section_id || 'sección') + (pl.subsection_id ? ` › ${esc(pl.subsection_title || pl.subsection_id)}` : '');
}

// The field as it stands in THIS tab's working copy (what approving replaces),
// or undefined when the section/subsection is no longer in the report.
function _rptpCurrent(pl) {
  const sec = getReportData().sections?.find(s => s.id === pl.section_id);
  if (!sec) return undefined;
  const holder = pl.subsection_id ? sec.children?.find(c => c.id === pl.subsection_id) : sec;
  if (!holder) return undefined;
  return holder[pl.field === 'description' ? 'description' : 'content'] || '';
}

// Outline node a proposal belongs to; 'prop:<id>' when its target is gone
// (it can then only be rejected).
function _nodeForProposal(pr) {
  const pl = pr?.payload || {};
  if (_rptpCurrent(pl) === undefined) return `prop:${pr.id}`;
  return pl.subsection_id ? `sub:${pl.section_id}:${pl.subsection_id}` : `sec:${pl.section_id}`;
}

function _proposalsForNode(nodeId) {
  if (!nodeId) return [];
  if (nodeId.startsWith('prop:')) return _rptProposals.filter(p => p.id === nodeId.slice(5));
  return _rptProposals.filter(p => _nodeForProposal(p) === nodeId);
}

// The proposal shown for the selected node (the one navigated to, else the first).
function _activeProposal() {
  const list = _proposalsForNode(_sel);
  return list.find(p => p.id === _rptpOpenId) || list[0] || null;
}

function openReportProposal(id) {
  const pr = _rptProposals.find(p => p.id === id);
  if (!pr) return;
  selectNode(_nodeForProposal(pr), { proposalId: id });
}

function stepReportProposal(delta) {
  const idx = _rptProposals.findIndex(p => p.id === _rptpOpenId);
  const next = _rptProposals[idx + delta];
  if (idx >= 0 && next && !_rptpBusy) openReportProposal(next.id);
}

function closeReportProposal() {
  _rptpOpenId = null;
}

function renderProposalSlot() {
  const slot = document.getElementById('insp-prop');
  if (!slot) return;
  const pr = _activeProposal();
  _rptpOpenId = pr?.id || null;
  if (!pr) { slot.innerHTML = ''; slot.hidden = true; return; }
  slot.hidden = false;
  const pl = pr.payload || {};
  const current = _rptpCurrent(pl);
  const gone = current === undefined;
  const drifted = !gone && (pl.base_content || '') !== current;
  const idx = _rptProposals.indexOf(pr);
  const n = _rptProposals.length;
  const id = _ja(pr.id);
  const canApprove = canActForClient() && !_rptSyncBlocked && !gone;
  const why = !canActForClient() ? RPTP_LEAD_ONLY
    : gone ? 'La sección ya no está en el informe'
    : _rptSyncBlocked ? 'El informe no se puede sincronizar con el servidor: recargá la página' : '';
  const busy = _rptpBusy ? 'disabled' : '';
  slot.innerHTML = `
    <section class="insp-prop" aria-label="Propuesta de Claude">
      <div class="insp-prop-head">
        ${icon('sparkles', { size: 13 })}<span>Propuesta de Claude</span>
        <span class="pos">${idx + 1} / ${n}</span>
        <button type="button" class="btn btn-ghost btn-icon" onclick="stepReportProposal(-1)" ${idx <= 0 ? 'disabled' : ''} aria-label="Propuesta anterior">‹</button>
        <button type="button" class="btn btn-ghost btn-icon" onclick="stepReportProposal(1)" ${idx >= n - 1 ? 'disabled' : ''} aria-label="Propuesta siguiente">›</button>
      </div>
      <div class="insp-prop-body">
        <div class="insp-help">Claude Code · vía MCP · ${esc(displayName(pr, 'proposed_by_'))} · ${esc(timeAgo(pr.created_at))}</div>
        <div class="insp-help">Reemplaza ${pl.field === 'description' ? 'el texto introductorio' : 'el contenido'} de <span style="color:var(--t1)">${_rptpWhere(pl)}</span>.</div>
        ${pl.rationale ? `<div><div class="form-label">Motivo</div><div class="md-body">${renderMd(pl.rationale)}</div></div>` : ''}
        ${gone ? `<div class="insp-prop-note is-bad">${icon('triangle-alert', { size: 12 })} Esta sección ya no está en el informe: la propuesta no se puede aprobar. Rechazala o pedile a Claude Code que la proponga de nuevo.</div>
          <div><div class="form-label">Contenido propuesto</div>${rptpSafeHtml(pl.content)}</div>` : ''}
        ${drifted ? `<div class="insp-prop-note">${icon('info', { size: 12 })} El contenido cambió desde que Claude hizo la propuesta: al aprobar se reemplaza el actual.</div>` : ''}
        ${gone ? '' : `<div class="insp-help">Compará en la vista previa con <span style="color:var(--t1)">Con propuesta / Actual</span>.</div>`}
        ${_rptpCanReview() ? `
          ${why ? `<div class="insp-help">${icon('info', { size: 12 })} ${esc(why)}</div>` : ''}
          <div class="insp-prop-actions">
            <button type="button" class="btn btn-prim" style="flex:1 1 90px" ${canApprove ? busy : 'disabled'} title="${esc(why || 'Escribe este contenido en el informe')}" onclick="approveReportProposal(${id})">${_rptpBusy ? 'Aplicando…' : 'Aprobar'}</button>
            <button type="button" class="btn btn-danger" ${busy} onclick="rejectReportProposal(${id})">Rechazar</button>
          </div>` : `<div class="insp-help">Solo un Owner, Editor o Pentester puede revisar propuestas</div>`}
      </div>
    </section>`;
}

// Kept for older callers: the footer is now part of the inspector card.
function _rptpRenderFoot() { renderProposalSlot(); }

// Server-side error → a message the reviewer can act on.
function _rptpErrorMsg(e) {
  const msg = e?.message || '';
  if (e?.status === 403) return RPTP_LEAD_ONLY;
  if (e?.status === 404) return 'La propuesta ya no existe';
  if (e?.status === 413) return 'El informe quedaría demasiado grande con este contenido';
  if (e?.status === 409 && /no longer available/i.test(msg))
    return 'La sección de esta propuesta ya no está en el informe guardado. Rechazala o pedile a Claude Code que la proponga de nuevo.';
  if (e?.status === 409) return 'La propuesta ya fue revisada (aprobada, rechazada o retirada)';
  return msg || 'No se pudo completar la acción';
}

// Pull the server copy and adopt it, on the same queue as the autosave so a
// PUT in flight finishes first. Never rejects: a rejected _rptSaving would
// stop every later autosave.
function _rptpPullReport(pid) {
  _rptSaving = _rptSaving.then(async () => {
    try {
      const row = await api.reportConfig.get(pid);
      if (pid === state.currentProject?.id) adoptServerReport(row, null);
      return true;
    } catch (e) {
      console.warn('[export] could not refresh report config:', e?.message || e);
      return false;
    }
  });
  return _rptSaving;
}

async function approveReportProposal(id) {
  const pr = _rptProposals.find(p => p.id === id);
  const pid = state.currentProject?.id;
  if (!pr || !pid || _rptpBusy) return;
  if (!canActForClient()) { showToast(RPTP_LEAD_ONLY, 'error'); return; }
  _rptpBusy = true;
  _rptpApproving = true;
  _rptpRenderFoot();
  let approved = false;
  try {
    // 1. Edits still waiting for the debounce reach the server first: the
    //    approval bumps updated_at, so a save sent after it would bounce with
    //    a 409 and those edits would be lost. If this flush itself conflicts,
    //    saveReportToServer() already adopted the server copy and said so.
    flushReportConfig();
    await _rptSaving;
    // 2. The server writes only the proposed field.
    await api.mcpProposals.approve(pid, id);
    approved = true;
    // 3. Adopt the new server copy (re-renders editor and preview).
    const pulled = await _rptpPullReport(pid);
    _rptProposals = _rptProposals.filter(p => p.id !== id);
    closeReportProposal();
    rptpPaintBadges();
    showToast(pulled ? 'Propuesta aprobada: la sección del informe se actualizó'
      : 'Propuesta aprobada, pero no se pudo cargar el informe actualizado: recargá la página antes de seguir editando',
      pulled ? 'success' : 'error');
  } catch (e) {
    showToast(_rptpErrorMsg(e), 'error');
  } finally {
    _rptpBusy = false;
    _rptpApproving = false;
    if (!approved) _rptpRenderFoot();
  }
  // The real state, whatever happened (someone else may have reviewed it).
  await loadReportProposals();
}

async function rejectReportProposal(id) {
  const pr = _rptProposals.find(p => p.id === id);
  const pid = state.currentProject?.id;
  if (!pr || !pid || _rptpBusy) return;
  if (!confirm('¿Rechazar esta propuesta?')) return;
  _rptpBusy = true;
  _rptpRenderFoot();
  try {
    await api.mcpProposals.reject(pid, id);
    _rptProposals = _rptProposals.filter(p => p.id !== id);
    closeReportProposal();
    rptpPaintBadges();
    showToast('Propuesta rechazada', 'success');
  } catch (e) {
    showToast(_rptpErrorMsg(e), 'error');
  } finally {
    _rptpBusy = false;
    _rptpRenderFoot();
  }
  await loadReportProposals();
}

// Live: every proposal status change (created, edited, withdrawn, reviewed
// here or elsewhere) broadcasts mcp_proposals:changed. Coalesced, since a
// review also fires report_config:changed.
let _rptpReloadTimer = null;
function _rptpScheduleReload() {
  clearTimeout(_rptpReloadTimer);
  _rptpReloadTimer = setTimeout(loadReportProposals, 150);
}
wsClient.on('mcp_proposals:changed', (msg) => {
  if (window.FLOWDIT_SNAPSHOT) return;
  // report_pending is the server's count: skip the request when both agree
  // there is nothing to show.
  if (Number(msg?.report_pending) === 0 && !_rptProposals.length) return;
  _rptpScheduleReload();
});
wsClient.on('report_config:changed', () => { if (!window.FLOWDIT_SNAPSHOT) _rptpScheduleReload(); });
// Missed WS messages (sleep, dropped socket): catch up when the tab returns.
window.addEventListener('focus', () => { if (!window.FLOWDIT_SNAPSHOT && state.currentProject) _rptpScheduleReload(); });

async function pullReportConfig() {
  // The headless PDF render gets the originating tab's exact snapshot injected
  // into localStorage; overwriting it with the server copy would print whatever
  // was last synced instead of what the user is looking at.
  if (window.FLOWDIT_SNAPSHOT) return;
  const pid = state.currentProject?.id;
  if (!pid) return;
  try {
    const row    = await api.reportConfig.get(pid);
    const remote = row?.data;
    _rptSyncReady = true;
    _rptServerUpdatedAt = row?.updated_at ?? null;
    if (row?.updated_at) _savedAt = new Date(row.updated_at);
    if (remote && typeof remote === 'object' && (remote.meta || remote.sections)) {
      localStorage.setItem(`fd_rpt_${pid}`, JSON.stringify(remote));
      return;
    }
    // Nothing stored server-side yet — first load after this upgrade. Adopt
    // whatever this browser already had instead of wiping existing work.
    if (localStorage.getItem(`fd_rpt_${pid}`)) pushReportConfig();
  } catch (e) {
    // Degrade to the local copy rather than losing the page.
    _rptSyncBlocked = true;
    console.warn('[export] could not load report config:', e?.message || e);
  }
}

// ── Report data (localStorage working copy, keyed by project) ─────
function getReportData() {
  const pid = state.currentProject?.id;
  if (!pid) return { meta:{}, sections: DEFAULT_SECTIONS.map(s=>({...s})) };
  try {
    const raw = JSON.parse(localStorage.getItem(`fd_rpt_${pid}`) || '{}');
    // Migrate from old flat format
    if (!raw.sections) {
      const sections = DEFAULT_SECTIONS.map(s => {
        const sec = { ...s };
        if (s.id === 'risk-table') sec.visible = !!raw.showRiskTable;
        return sec;
      });
      const meta = {
        preparedBy:     raw.preparedBy     || '',
        organization:   raw.organization   || '',
        version:        raw.version        || '',
        classification: raw.classification || 'Confidential',
        showToc:        !!raw.showToc,
        coverFields: { date:true, target:true, preparedBy:true, organization:true, scope:true, version:true, totalFindings:true, wstgCoverage:true },
      };
      const migrated = { meta, sections };
      localStorage.setItem(`fd_rpt_${pid}`, JSON.stringify(migrated));
      return migrated;
    }
    if (!raw.meta) raw.meta = {};
    if (!raw.meta.coverFields) raw.meta.coverFields = { date:true, target:true, preparedBy:true, organization:true, scope:true, version:true, totalFindings:true, wstgCoverage:true };
    // Remove deprecated section types
    const REMOVED_IDS = new Set(['intro','scope','methodology','disclaimer','contact']);
    if (raw.sections) raw.sections = raw.sections.filter(s => !REMOVED_IDS.has(s.id) && !REMOVED_IDS.has(s.type));
    // Inject any new built-in sections that are missing (added in later versions)
    if (raw.sections) {
      const existingIds = new Set(raw.sections.map(s => s.id));
      DEFAULT_SECTIONS.forEach((def, idx) => {
        if (!existingIds.has(def.id)) {
          // Insert at the same relative position as in DEFAULT_SECTIONS
          const prevDef = DEFAULT_SECTIONS[idx - 1];
          const insertAfter = prevDef ? raw.sections.findIndex(s => s.id === prevDef.id) : -1;
          raw.sections.splice(insertAfter + 1, 0, { ...def });
        }
      });
    }
    return raw;
  } catch { return { meta:{}, sections: DEFAULT_SECTIONS.map(s=>({...s})) }; }
}

const REPORT_FONTS = [
  { key:'',         label:'Inter (default)',  css:"'Inter',system-ui,sans-serif" },
  { key:'georgia',  label:'Georgia',          css:"Georgia,'Times New Roman',serif" },
  { key:'times',    label:'Times New Roman',  css:"'Times New Roman',Times,serif" },
  { key:'arial',    label:'Arial',            css:"Arial,Helvetica,sans-serif" },
  { key:'mono',     label:'Typewriter',       css:"'Courier New',Courier,monospace" },
];

function applyReportFont(key) {
  const f = REPORT_FONTS.find(f => f.key === (key||'')) || REPORT_FONTS[0];
  document.documentElement.style.setProperty('--rpt-font', f.css);
}

function applyBaseFontSize(size) {
  document.documentElement.style.setProperty('--rpt-base-size', `${size || 13}px`);
}

function setRptBaseFontSize(size) {
  const d = getReportData();
  d.meta.baseFontSize = +size;
  saveReportData(d);
}

function setRptAccent(color) {
  const d = getReportData();
  d.meta.accentColor = color;
  saveReportData(d);
  buildEditor(); // refresh swatches outline
}


// Build the diagonal mark on a canvas and use the resulting PNG as a background
// image. An SVG background is NOT enough here: Chrome keeps <text> inside an SVG
// image as real text when it writes the PDF, so "CONFIDENTIAL" still landed in
// the text layer and came along whenever the reader selected a paragraph. A
// canvas bitmap has no glyphs at all — verified by extracting the PDF text.
// applyWatermark() runs on every saveReportData(), i.e. on every keystroke in
// the report editor, and rasterising 1600x1600 is not free — memoise it.
const _wmCache = new Map();

function watermarkPngUri(text, color) {
  const raw = String(text || 'DRAFT').replace(/[\u0000-\u001f]/g, '').trim().toUpperCase() || 'DRAFT';
  const cacheKey = `${color}|${raw}`;
  if (_wmCache.has(cacheKey)) return _wmCache.get(cacheKey);
  const BOX = 1600;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = BOX;
  const ctx = canvas.getContext('2d');
  if (!ctx) return '';

  const setFont = px => {
    ctx.font = `900 ${px}px "Courier New", Courier, monospace`;
    // Chrome resets letterSpacing whenever `font` is assigned, so it goes after.
    try { ctx.letterSpacing = `${Math.round(px * 0.15)}px`; } catch { /* older engines */ }
  };

  ctx.translate(BOX / 2, BOX / 2);
  ctx.rotate(-Math.PI / 4);
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Measure rather than guess, so a long custom word shrinks to fit instead of
  // running off the page.
  const MAX_W = BOX * 0.92;
  let size = 240;
  setFont(size);
  const w = ctx.measureText(raw).width;
  if (w > MAX_W) { size = Math.max(24, Math.floor(size * MAX_W / w)); setFont(size); }

  ctx.fillText(raw, 0, 0);
  const uri = `url("${canvas.toDataURL('image/png')}")`;
  // Bounded: a user typing a watermark generates one entry per intermediate
  // string, and there is no reason to hold on to any of them.
  if (_wmCache.size > 24) _wmCache.clear();
  _wmCache.set(cacheKey, uri);
  return uri;
}

function applyWatermark(meta) {
  const el = document.getElementById('rpt-watermark');
  if (!el) return;
  const wm = meta?.watermark || {};
  const on = !!wm.enabled;
  el.textContent = '';                    // never a text node again
  el.setAttribute('aria-hidden', 'true');
  el.classList.toggle('wm-on', on);
  if (!on) {
    el.style.removeProperty('--wm-screen');
    el.style.removeProperty('--wm-print');
    return;
  }
  // Neutral gray reads on both the light and dark preview themes; paper gets
  // near-black, which is what the PDF is actually printed against.
  el.style.setProperty('--wm-screen', watermarkPngUri(wm.text, '#808080'));
  el.style.setProperty('--wm-print',  watermarkPngUri(wm.text, '#111111'));
}

function applyReportAccent(color) {
  let tag = document.getElementById('rpt-accent-style');
  if (!tag) {
    tag = document.createElement('style');
    tag.id = 'rpt-accent-style';
    document.head.appendChild(tag);
  }
  if (!color) { tag.textContent = ''; return; }
  // Build explicit rules — JS string concatenation avoids the CSS `var(--x)44` invalid-token bug
  const c44 = color + '44'; // ~27% opacity hex suffix
  const c33 = color + '33'; // ~20% opacity hex suffix
  const c18 = color + '18'; //  ~9% opacity hex suffix
  const c88 = color + '88'; // ~53% opacity hex suffix
  tag.textContent = `
    /* accent override — screen */
    #report-preview .rpt h2::before { background:${color}!important; }
    #report-preview .rpt-sub-title::before { background:${color}!important; }
    #report-preview .rpt-cover-bar,
    #report-preview .rpt-cover-page-bar { background:linear-gradient(90deg,${color},${c88})!important; }
    #report-preview .rpt-cover-type { color:${color}!important;border-color:${c44}!important; }
    #report-preview .rpt-cover-page-type { color:${color}!important;border-color:${c44}!important; }
    #report-preview .rpt-cover-logo-ph { color:${color}!important;background:${c18}!important;border-color:${c33}!important; }
    #report-preview .rpt-toc-item a:hover { color:${color}!important;border-bottom-color:${c44}!important; }
    #report-preview .rpt-prose a { color:${color}!important; }
    #report-preview .rpt-prose blockquote { border-left-color:${color}!important; }
    /* accent override — print (Puppeteer PDF) */
    @media print {
      :root { --accent:${color}!important; }
      .rpt h2::before { background:${color}!important; }
      .rpt-sub-title::before { background:${color}!important; }
      .rpt-cover-bar,.rpt-cover-page-bar { background:linear-gradient(90deg,${color},${c88})!important; }
      .rpt-cover-type,.rpt-cover-page-type { color:${color}!important;border-color:${c44}!important; }
      .rpt-cover-logo-ph { color:${color}!important;background:${c18}!important;border-color:${c33}!important; }
      .rpt-prose a { color:${color}!important; }
      .rpt-prose blockquote { border-left-color:${color}!important; }
    }
  `;
}

function saveReportData(data, rebuild = true) {
  const pid = state.currentProject?.id;
  if (!pid) return;
  const key  = `fd_rpt_${pid}`;
  const next = JSON.stringify(data);
  _recordHistory(localStorage.getItem(key), next);
  localStorage.setItem(key, next);
  pushReportConfig();
  applyReportFont(data.meta?.font);
  applyBaseFontSize(data.meta?.baseFontSize);
  applyReportAccent(data.meta?.accentColor);
  applyWatermark(data.meta);
  applyTitleSizes(data.meta?.h2Size, data.meta?.h3Size);
  if (rebuild) buildReport();
}

function applyTitleSizes(h2size, h3size) {
  let tag = document.getElementById('rpt-title-size-style');
  if (!tag) { tag = document.createElement('style'); tag.id = 'rpt-title-size-style'; document.head.appendChild(tag); }
  const h2 = h2size || '13px';
  const h3 = h3size || '11px';
  tag.textContent = `:root { --rpt-h2-size:${h2}; --rpt-h3-size:${h3}; }`;
}

function setTitleSize(key, val) {
  const d = getReportData();
  if (key === 'h2') d.meta.h2Size = val;
  else d.meta.h3Size = val;
  saveReportData(d, false);
  applyTitleSizes(d.meta.h2Size, d.meta.h3Size);
}

// ── Page Layout (header / footer) ────────────────────────────────
// Zone data structure:
// { enabled, cols: { left, center, right } }
// Each col: { mode: 'text'|'image', text: '', img: '' }
// Footer cols may also have mode: 'pagenum'

function _defaultCol() { return { mode:'text', text:'', img:'' }; }
function _getZone(meta, zone) {
  if (!meta[zone]) meta[zone] = { enabled:false, cols:{ left:_defaultCol(), center:_defaultCol(), right:_defaultCol() } };
  const z = meta[zone];
  if (!z.cols) z.cols = { left:_defaultCol(), center:_defaultCol(), right:_defaultCol() };
  ['left','center','right'].forEach(k => { if (!z.cols[k]) z.cols[k] = _defaultCol(); });
  return z;
}

function setPageLayoutEnabled(zone, val) {
  const d = getReportData();
  _getZone(d.meta, zone).enabled = val;
  saveReportData(d, false);
  buildPageLayout();
  buildEditor();
}

function setPageLayoutColMode(zone, col, mode) {
  const d = getReportData();
  _getZone(d.meta, zone).cols[col].mode = mode;
  saveReportData(d, false);
  buildPageLayout();
  buildEditor();
}

function setPageLayoutColText(zone, col, val) {
  const d = getReportData();
  _getZone(d.meta, zone).cols[col].text = val;
  saveReportData(d, false);
  buildPageLayout();
}

function setPageLayoutColImg(zone, col, val) {
  const d = getReportData();
  _getZone(d.meta, zone).cols[col].img = val;
  saveReportData(d, false);
  buildPageLayout();
  buildEditor();
}

function uploadColLogo(zone, col, input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => setPageLayoutColImg(zone, col, e.target.result);
  reader.readAsDataURL(file);
}

function setPageLayoutColShadow(zone, col, val) {
  const d = getReportData();
  _getZone(d.meta, zone).cols[col].imgShadow = val;
  saveReportData(d, false);
  buildPageLayout();
}

function _renderZoneCol(col, align) {
  const cls = `rpt-ph-${align[0]}`; // l/c/r
  if (!col || col.mode === 'text') {
    return `<span class="${cls}">${esc(col?.text||'')}</span>`;
  }
  if (col.mode === 'image') {
    const shadow = col.imgShadow ? ' style="filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))"' : '';
    return `<span class="${cls}">${col.img ? `<img src="${col.img}" class="rpt-ph-logo"${shadow}>` : ''}</span>`;
  }
  if (col.mode === 'pagenum') {
    const pre = col.text ? col.text + ' ' : 'Page ';
    return `<span class="${cls}"><span class="rpt-pf-pgnum-wrap" data-pre="${esc(pre)}"><span class="rpt-pf-pgnum-screen">${esc(pre)}1</span></span></span>`;
  }
  return `<span class="${cls}"></span>`;
}

function buildPageLayout() {
  const m = getReportData().meta;
  ['header','footer'].forEach(zone => {
    const el = document.getElementById(`rpt-p${zone==='header'?'h':'f'}`);
    if (!el) return;
    const z = _getZone(m, zone);
    el.classList.toggle('enabled', !!z.enabled);
    if (z.enabled) {
      el.innerHTML =
        _renderZoneCol(z.cols.left,   'left') +
        _renderZoneCol(z.cols.center, 'center') +
        _renderZoneCol(z.cols.right,  'right');
    }
  });

  // Toggle table-layout classes for repeating header/footer in print
  const wrap = document.getElementById('rpt-ph-wrap');
  if (wrap) {
    wrap.classList.toggle('ph-active', !!_getZone(m,'header').enabled);
    wrap.classList.toggle('pf-active', !!_getZone(m,'footer').enabled);
  }
}

function setRptFont(key) {

  d.meta.font = key;

// Compatibility shims for template selector and other callers
function getRptMeta() { return getReportData().meta; }

// Every change goes through saveReportData, so it lands in the undo history,
// the localStorage working copy and the server push.

function secToggleVisible(id) {

function secUpdateDesc(id, val) {

function secUpdateTitle(id, val) {

function secDelete(id) {

function moveSection(id, dir) {
  const d = getReportData();

  const j = i + dir;

  [d.sections[i], d.sections[j]] = [d.sections[j], d.sections[i]];
  saveReportData(d);

  _scrollPreviewTo(`sec:${id}`);

// ── Drag-and-drop of top-level sections in the outline ───────────
let _dragId = null;

function secDragStart(e, id) {
  _dragId = id;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', id); } catch {}
}

function secDragEnd() {
  _dragId = null;
  document.querySelectorAll('.ol-row.drag-over').forEach(el => el.classList.remove('drag-over'));
}

function secDragOver(e, id) {
  if (!_dragId || _dragId === id) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.ol-row.drag-over').forEach(el => el.classList.remove('drag-over'));
  e.currentTarget?.classList?.add('drag-over');
}

function secDrop(e, id) {
  e.preventDefault();
  const from = _dragId;
  secDragEnd();
  if (!from || from === id) return;
  const d = getReportData();
  const fi = d.sections.findIndex(s => s.id === from);
  const ti = d.sections.findIndex(s => s.id === id);
  if (fi < 0 || ti < 0) return;
  const [moved] = d.sections.splice(fi, 1);
  d.sections.splice(ti, 0, moved);
  saveReportData(d);
  buildEditor();
}

// ── Rich text editor helpers ──────────────────────────────────────
const _RICH_FG = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f9a8d4','#fde68a','#a7f3d0','#bfdbfe','#94a3b8','#475569','#1e293b','#ffffff'];
const _RICH_HI = ['#fef08a','#bbf7d0','#bfdbfe','#fecaca','#fed7aa','#e9d5ff','#f0f9ff','transparent'];

// palId = element id of the palette div
function richTogglePalette(palId) {
  const pal = document.getElementById(palId);
  if (!pal) return;
  document.querySelectorAll('.rich-color-palette').forEach(el => { if (el !== pal) el.classList.remove('open'); });
  const open = !pal.classList.contains('open');
  pal.classList.toggle('open', open);
  if (open) _positionPalette(pal);
}

/* Palettes are position:fixed so they escape the overflow:hidden of the
   full-editor modal (.fe-modal-inner / .fe-body). Coordinates are viewport
   based, then corrected by the containing block's own offset — the modal
   creates one through backdrop-filter. */
function _positionPalette(pal) {
  const btn = pal.previousElementSibling;
  if (!btn) return;
  const MARGIN = 8;

  pal.style.left = '0px';
  pal.style.top  = '0px';
  const origin = pal.getBoundingClientRect();
  const rect   = btn.getBoundingClientRect();

  let left = rect.left;
  if (left + origin.width > window.innerWidth - MARGIN)
    left = window.innerWidth - origin.width - MARGIN;
  if (left < MARGIN) left = MARGIN;

  // Prefer below the button; flip above when it would overflow the viewport.
  let top = rect.bottom + 3;
  if (top + origin.height > window.innerHeight - MARGIN) {
    const above = rect.top - origin.height - 3;
    top = above >= MARGIN ? above : Math.max(MARGIN, window.innerHeight - origin.height - MARGIN);
  }

  pal.style.left = (left - origin.left) + 'px';
  pal.style.top  = (top  - origin.top)  + 'px';
}

function _repositionOpenPalettes() {
  document.querySelectorAll('.rich-color-palette.open').forEach(_positionPalette);
}

// editorId = id of the contenteditable div
function richApplyColor(editorId, color, type) {
  document.querySelectorAll('.rich-color-palette').forEach(el => el.classList.remove('open'));
  document.getElementById(editorId)?.focus();
  document.execCommand(type === 'fg' ? 'foreColor' : 'hiliteColor', false, color);
}

function richInsertLink(editorId) {
  const sel = window.getSelection();
  const range = sel.rangeCount > 0 ? sel.getRangeAt(0).cloneRange() : null;
  const selectedText = sel.toString();
  const url = prompt('URL:');
  if (!url) return;
  if (range) { sel.removeAllRanges(); sel.addRange(range); }
  document.getElementById(editorId)?.focus();
  document.execCommand('insertHTML', false,
    `<a href="${esc(url)}" style="color:#7c3aed;text-decoration:underline">${esc(selectedText || url)}</a>`);
}

// ── Table picker helpers ───────────────────────────────────────────
function richTableHover(palPfx, row, col) {
  for (let r = 1; r <= 8; r++)
    for (let c = 1; c <= 8; c++)
      document.getElementById(`${palPfx}-tc-${r}-${c}`)?.classList.toggle('active', r <= row && c <= col);
  const lbl = document.getElementById(`${palPfx}-tl`);
  if (lbl) lbl.textContent = `${row} × ${col} table`;
  const ri = document.getElementById(`${palPfx}-trows`);
  const ci = document.getElementById(`${palPfx}-tcols`);
  if (ri) ri.value = row;
  if (ci) ci.value = col;
}

function richTableHoverReset(palPfx) {
  for (let r = 1; r <= 8; r++)
    for (let c = 1; c <= 8; c++)
      document.getElementById(`${palPfx}-tc-${r}-${c}`)?.classList.remove('active');
  const lbl = document.getElementById(`${palPfx}-tl`);
  if (lbl) lbl.textContent = 'hover to select size';
}

function richTableInsert(editorId, palPfx, rows, cols) {
  document.querySelectorAll('.rich-color-palette').forEach(el => el.classList.remove('open'));
  _insertTable(editorId, rows, cols);
}

function richTableCustom(editorId, palPfx) {
  const rows = Math.max(1, parseInt(document.getElementById(`${palPfx}-trows`)?.value) || 3);
  const cols = Math.max(1, parseInt(document.getElementById(`${palPfx}-tcols`)?.value) || 3);
  document.querySelectorAll('.rich-color-palette').forEach(el => el.classList.remove('open'));
  _insertTable(editorId, rows, cols);
}

function _insertTable(editorId, rows, cols) {
  document.getElementById(editorId)?.focus();
  const th = n => `<th style="border:1px solid var(--b2,#555);padding:6px 10px;background:var(--bg3,#2a2a2a);font-weight:600;font-size:11px;text-align:left">Header ${n}</th>`;
  const td = ()  => `<td style="border:1px solid var(--b2,#555);padding:6px 10px;font-size:12px"> </td>`;
  const headerRow = Array.from({length:cols},(_,i)=>th(i+1)).join('');
  const bodyRows  = Array.from({length:rows},()=>`<tr>${Array.from({length:cols},td).join('')}</tr>`).join('');
  const html = `<table class="rpt-table" style="border-collapse:collapse;width:100%;margin:8px 0">
    <thead><tr>${headerRow}</tr></thead>
    <tbody>${bodyRows}</tbody>
  </table><p></p>`;
  document.execCommand('insertHTML', false, html);
}

// ── Font size ─────────────────────────────────────────────────────
function richSetFontSize(editorId, size) {
  if (!size) return;
  document.getElementById(editorId)?.focus();
  document.execCommand('fontSize', false, '7');
  document.getElementById(editorId)?.querySelectorAll('font[size="7"]').forEach(f => {
    const span = document.createElement('span');
    span.style.fontSize = size + 'px';
    while (f.firstChild) span.appendChild(f.firstChild);
    f.replaceWith(span);
  });
}

// ── Image insertion ───────────────────────────────────────────────
function richInsertImage(editorId) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById(editorId)?.focus();
      document.execCommand('insertHTML', false,
        `<img src="${e.target.result}" style="max-width:100%;border-radius:4px;margin:4px 0;display:block" alt="${esc(file.name)}">`);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function richInsertHR(editorId) {
  document.getElementById(editorId)?.focus();
  document.execCommand('insertHTML', false,
    '<hr style="border:none;border-top:1px solid var(--b1);margin:12px 0"><p></p>');
}

// ── Context toolbar state ─────────────────────────────────────────
let _rctxCell = null, _rctxImg = null, _rctxEditorId = null;

// anchor: an element, or a plain {top,bottom,left} viewport rect
function _positionCtxTb(tbId, anchor) {
  const tb = document.getElementById(tbId);
  if (!tb || !anchor) return;
  tb.style.display = 'flex';
  const r  = anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : anchor;
  const tw = tb.offsetWidth, th = tb.offsetHeight;   // measure, never assume
  const M  = 6;
  const top = r.top > th + M * 2 ? r.top - th - M : r.bottom + M;
  tb.style.top  = Math.max(M, Math.min(top, window.innerHeight - th - M)) + 'px';
  tb.style.left = Math.max(M, Math.min(r.left, window.innerWidth - tw - M)) + 'px';
}

/* ── Active cell: the whole point is knowing what you're about to change ──
   The toolbar anchors to the CELL you clicked (not the table's top-left) and
   two overlay bands light up the row and column it will act on. The bands are
   siblings of <body>, never nodes inside the editor, so nothing about this
   feedback can end up in the saved report HTML. */
function _cellRect(cells) {
  let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity;
  cells.forEach(c => {
    const k = c.getBoundingClientRect();
    l = Math.min(l, k.left); t = Math.min(t, k.top);
    r = Math.max(r, k.right); b = Math.max(b, k.bottom);
  });
  return { left: l, top: t, right: r, bottom: b };
}

function _placeBand(el, rect, clip) {
  const left   = Math.max(rect.left, clip.left);
  const top    = Math.max(rect.top, clip.top);
  const width  = Math.min(rect.right, clip.right) - left;
  const height = Math.min(rect.bottom, clip.bottom) - top;
  if (width <= 0 || height <= 0) { el.style.display = 'none'; return; }
  el.style.cssText = `display:block;left:${left}px;top:${top}px;width:${width}px;height:${height}px`;
}

function _hideBands() {
  const row = document.getElementById('rich-tbl-hl-row');
  const col = document.getElementById('rich-tbl-hl-col');
  if (row) row.style.display = 'none';
  if (col) col.style.display = 'none';
}

function _paintTableUi() {
  const cell = _tblCell();
  if (!cell) { _hideBands(); _hideCtxTb('rich-ctx-table'); return; }

  const editor = cell.closest('.rich-editor');
  const table  = cell.closest('table');
  if (!editor || !table) { _hideBands(); _hideCtxTb('rich-ctx-table'); return; }

  // Scrolled out of its own editor? Then the toolbar has nothing to point at.
  const clip = editor.getBoundingClientRect();
  const cr   = cell.getBoundingClientRect();
  if (cr.bottom < clip.top || cr.top > clip.bottom) { _hideBands(); _hideCtxTb('rich-ctx-table'); return; }

  const idx  = cell.cellIndex;
  const rows = Array.from(table.rows);
  _placeBand(document.getElementById('rich-tbl-hl-row'),
             _cellRect(Array.from(cell.parentNode.cells)), clip);
  _placeBand(document.getElementById('rich-tbl-hl-col'),
             _cellRect(rows.map(r => r.cells[idx]).filter(Boolean)), clip);

  // Body rows count from 1; the header is named, not numbered.
  const pos     = document.getElementById('rich-tbl-pos');
  const inHead  = !!cell.closest('thead');
  const bodyIdx = Array.from(table.querySelectorAll('tbody tr')).indexOf(cell.parentNode) + 1;
  if (pos) pos.textContent = `${inHead ? 'HEAD' : 'R' + bodyIdx}·C${idx + 1}`;

  // Say what can't be done instead of no-oping on click
  const delRow = document.getElementById('rich-tbl-delrow');
  const delCol = document.getElementById('rich-tbl-delcol');
  if (delRow) delRow.disabled = table.querySelectorAll('tbody tr').length <= 1 || !!cell.closest('thead');
  if (delCol) delCol.disabled = (rows[0]?.cells.length || 0) <= 1;

  /* Anchor to the table's visible edge, not the cell: the bands and the R·C
     readout already identify the target, so the toolbar's job is to stay put
     and stop covering the header row you're reading the columns from. */
  const tr = table.getBoundingClientRect();
  _positionCtxTb('rich-ctx-table', {
    top:    Math.max(tr.top, clip.top),
    bottom: Math.min(tr.bottom, clip.bottom),
    left:   tr.left,
  });
}

/* A re-render (buildEditor) detaches the old node — acting on it would mutate
   a tree nobody can see. Always re-check before using the reference. */
function _tblCell() {
  if (_rctxCell && !_rctxCell.isConnected) _rctxCell = null;
  return _rctxCell;
}

function _setTblCell(cell) {
  _rctxCell     = cell || null;
  _rctxEditorId = cell?.closest('.rich-editor')?.id || _rctxEditorId;
  _paintTableUi();
}

function _focusCell(cell) {
  if (!cell) return;
  const range = document.createRange();
  range.selectNodeContents(cell);
  range.collapse(true);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  cell.closest('.rich-editor')?.focus();
}

function _hideCtxTb(tbId) {
  const tb = document.getElementById(tbId);
  if (tb) tb.style.display = 'none';
}

function _hideAllCtxTb() {
  _hideCtxTb('rich-ctx-table');
  _hideCtxTb('rich-ctx-img');
  _hideBands();
  _rctxCell = null; _rctxImg = null;
}

/* Toolbars are fixed, content scrolls — so follow the anchor rather than
   dumping the selection. Losing the toolbar on every scroll was the reason
   editing a table meant re-clicking a cell constantly. */
document.addEventListener('scroll', e => {
  if (e.target.closest?.('.rich-color-palette, .rich-ctx-tb')) return;
  if (_tblCell()) _paintTableUi();
  if (_rctxImg?.isConnected) _positionCtxTb('rich-ctx-img', _rctxImg);
  else if (_rctxImg) { _rctxImg = null; _hideCtxTb('rich-ctx-img'); }
}, true);

window.addEventListener('resize', () => {
  if (_tblCell()) _paintTableUi();
  if (_rctxImg?.isConnected) _positionCtxTb('rich-ctx-img', _rctxImg);
});

// Global click handler — show/hide context toolbars
document.addEventListener('click', e => {
  if (e.target.closest('#rich-ctx-table, #rich-ctx-img')) return; // toolbar itself

  const cell = e.target.closest('td, th');
  const img  = e.target.tagName === 'IMG' ? e.target : null;

  // Table cell inside a rich editor?
  if (cell?.closest('.rich-editor')) {
    _setTblCell(cell);
    _hideCtxTb('rich-ctx-img');
    return;
  }

  // Image inside a rich editor?
  if (img?.closest('.rich-editor')) {
    _rctxImg      = img;
    _rctxEditorId = img.closest('.rich-editor').id;
    const pxInput = document.getElementById('rich-img-w-input');
    if (pxInput) pxInput.value = Math.round(img.getBoundingClientRect().width) || '';
    _positionCtxTb('rich-ctx-img', img);
    _hideCtxTb('rich-ctx-table');
    return;
  }

  _hideAllCtxTb();
});

/* Arrow keys and typing move the caret between cells without a click — keep
   the highlight on whatever cell the caret is actually in. */
// Typing reflows the row — the bands have to follow the cell they outline.
document.addEventListener('input', () => { if (_tblCell()) _paintTableUi(); });

document.addEventListener('selectionchange', () => {
  let node = window.getSelection()?.anchorNode;
  if (!node) return;
  if (node.nodeType === 3) node = node.parentNode;
  const cell = node.closest?.('td, th');
  if (!cell || !cell.closest('.rich-editor')) return;
  if (cell !== _rctxCell) _setTblCell(cell);
});

/* Tab / Shift+Tab across cells, and Tab out of the last cell appends a row —
   the behaviour every other editor has trained people to expect. */
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  let node = window.getSelection()?.anchorNode;
  if (!node) return;
  if (node.nodeType === 3) node = node.parentNode;
  const cell = node.closest?.('td, th');
  if (!cell || !cell.closest('.rich-editor')) return;

  e.preventDefault();
  const table = cell.closest('table');
  const cells = Array.from(table.querySelectorAll('td, th'));
  const next  = cells.indexOf(cell) + (e.shiftKey ? -1 : 1);

  if (next < 0) return;
  if (next >= cells.length) {
    _setTblCell(cell);
    richTableAddRow('below');
    const added = _tblCell()?.parentNode?.cells[0];
    _focusCell(added);
    _setTblCell(added);
    return;
  }
  _focusCell(cells[next]);
  _setTblCell(cells[next]);
});

// ── Table operations ──────────────────────────────────────────────
function _richEditorInputEvent() {
  const ed = document.getElementById(_rctxEditorId);
  ed?.dispatchEvent(new Event('input', { bubbles: true }));
}

const _TD_CSS = 'border:1px solid var(--b2,#555);padding:6px 10px;font-size:12px';
const _TH_CSS = 'border:1px solid var(--b2,#555);padding:6px 10px;background:var(--bg3,#2a2a2a);font-weight:600;font-size:11px;text-align:left';

function _newCell(isHead) {
  const cell = document.createElement(isHead ? 'th' : 'td');
  cell.style.cssText = isHead ? _TH_CSS : _TD_CSS;
  cell.innerHTML = isHead ? 'Header' : '<br>';
  return cell;
}

// where: 'above' | 'below'
function richTableAddRow(where = 'below') {
  const cell  = _tblCell();
  const row   = cell?.closest('tr');
  const table = row?.closest('table');
  if (!row || !table) return;

  const cols = table.rows[0]?.cells.length || 1;
  const tr   = document.createElement('tr');
  for (let i = 0; i < cols; i++) tr.appendChild(_newCell(false));

  const tbody = table.querySelector('tbody') || table.createTBody();
  if (row.closest('thead')) {
    // A header row has no "above" — both directions mean the first body row.
    tbody.insertBefore(tr, tbody.firstChild);
  } else {
    row.parentNode.insertBefore(tr, where === 'above' ? row : row.nextSibling);
  }

  _setTblCell(tr.cells[Math.min(cell.cellIndex, tr.cells.length - 1)]);
  _richEditorInputEvent();
}

// where: 'left' | 'right'
function richTableAddCol(where = 'right') {
  const cell  = _tblCell();
  const table = cell?.closest('table');
  if (!table) return;

  const colIdx = cell.cellIndex;
  const at     = where === 'left' ? colIdx : colIdx + 1;
  Array.from(table.rows).forEach(row => {
    row.insertBefore(_newCell(!!row.closest('thead')), row.cells[at] || null);
  });

  _setTblCell(cell.parentNode.cells[at]);
  _richEditorInputEvent();
}

function richTableDelRow() {
  const cell  = _tblCell();
  const row   = cell?.closest('tr');
  const table = row?.closest('table');
  if (!row || !table) return;
  if (row.closest('thead')) return;                                  // header defines the columns
  if (table.querySelectorAll('tbody tr').length <= 1) return;        // keep at least one body row

  // Keep working where the user was: fall to the next row, else the previous.
  const rows = Array.from(table.rows);
  const i    = rows.indexOf(row);
  const heir = rows[i + 1] || rows[i - 1];
  const idx  = cell.cellIndex;
  row.remove();

  _setTblCell(heir?.cells[Math.min(idx, heir.cells.length - 1)] || null);
  _richEditorInputEvent();
}

function richTableDelCol() {
  const cell  = _tblCell();
  const table = cell?.closest('table');
  if (!table) return;
  const colIdx = cell.cellIndex;
  if ((table.rows[0]?.cells.length || 0) <= 1) return;               // keep at least one column

  const row = cell.parentNode;
  Array.from(table.rows).forEach(r => r.cells[colIdx]?.remove());

  _setTblCell(row.cells[Math.min(colIdx, row.cells.length - 1)] || null);
  _richEditorInputEvent();
}

function richTableDelete() {
  const cell  = _tblCell();
  const table = cell?.closest('table');
  if (!table) return;
  // Unlike a row or a column, this one throws away everything and there is no undo path back.
  if (!confirm('Delete the entire table? This cannot be undone.')) return;
  table.remove();
  _setTblCell(null);
  _hideAllCtxTb();
  _richEditorInputEvent();
}

// ── Image operations ──────────────────────────────────────────────
function richImgWidth(pct) {
  if (!_rctxImg) return;
  _rctxImg.style.width    = pct + '%';
  _rctxImg.style.maxWidth = '100%';
  _rctxImg.removeAttribute('width');
  _positionCtxTb('rich-ctx-img', _rctxImg);
  _richEditorInputEvent();
}

function richImgWidthPx(val) {
  const px = parseInt(val);
  if (!_rctxImg || !px || px < 20) return;
  _rctxImg.style.width    = Math.min(px, 2000) + 'px';
  _rctxImg.style.maxWidth = '100%';
  _rctxImg.removeAttribute('width');
  _positionCtxTb('rich-ctx-img', _rctxImg);
  _richEditorInputEvent();
}

function richImgAlign(align) {
  if (!_rctxImg) return;
  if (align === 'left')   { _rctxImg.style.float = 'left';  _rctxImg.style.margin = '4px 12px 4px 0'; }
  if (align === 'right')  { _rctxImg.style.float = 'right'; _rctxImg.style.margin = '4px 0 4px 12px'; }
  if (align === 'center') { _rctxImg.style.float = 'none';  _rctxImg.style.margin = '8px auto'; _rctxImg.style.display = 'block'; }
  _positionCtxTb('rich-ctx-img', _rctxImg);
  _richEditorInputEvent();
}

function richImgDelete() {
  if (!_rctxImg) return;
  _rctxImg.remove();
  _rctxImg = null;
  _hideCtxTb('rich-ctx-img');
  _richEditorInputEvent();
}

// Detect if content is already HTML or plain markdown
function _secContentHtml(content) {
  if (!content) return '';
  return /<[a-zA-Z][\s\S]*?>/.test(content) ? content : renderMd(content);
}

// ── Rich editor expanded modal ────────────────────────────────────
function openRichModal(secId, defaultSplit = false, field = 'content') {
  if (document.getElementById('rich-modal')) return;
  const d = getReportData();
  const sec = d.sections.find(s => s.id === secId);
  if (!sec) return;
  const title = sec.title;
  const content = _secContentHtml(field === 'description' ? sec.description : sec.content);

  const modal = document.createElement('div');
  modal.id = 'rich-modal';
  modal.className = 'fe-modal no-print';
  // Which field this modal edits: closeRichModal must write back to the same one.
  modal.dataset.field = field === 'description' ? 'description' : 'content';
  modal.innerHTML = `
    <div class="fe-modal-inner" id="rich-modal-inner">
      <div style="padding:8px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--bg3)">
        <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--t2)">${esc(title)}${field === 'description' ? ' — texto introductorio' : ''}</span>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button id="rich-modal-split-btn" class="btn-secondary" style="padding:4px 11px;font-size:11px" onclick="richModalToggleSplit('${secId}')">${icon('columns-2',{size:11})} Split</button>
          <button class="btn-accent" style="padding:4px 11px;font-size:11px" onclick="closeRichModal('${secId}')">${icon('arrow-left',{size:11})} Close</button>
        </div>
      </div>
      <div class="fe-body">
        <div style="flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden">
          ${_richToolbar(`rich-modal-ed-${secId}`, `rpal-modal-${secId}`)}
          <div class="rich-editor" contenteditable="true" id="rich-modal-ed-${secId}"
            style="flex:1;max-height:none;border-radius:0;border-left:none;border-right:none;border-bottom:none;border-top:1px solid var(--b1)"
            oninput="richModalInput('${secId}',this.innerHTML,'${field}')">${content}</div>
        </div>
        <div id="rich-modal-preview-${secId}" style="flex:1;overflow-y:auto;padding:32px 40px;border-left:1px solid var(--b1);background:var(--bg);display:none">
          <div class="rpt" style="max-width:640px;margin:0 auto">
            <div class="rpt-prose" id="rich-modal-pv-content-${secId}">${content}</div>
          </div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById(`rich-modal-ed-${secId}`)?.focus();
  if (defaultSplit) setTimeout(() => richModalToggleSplit(secId), 50);
}

function richModalInput(secId, html, field = 'content') {
  if (field === 'description') secUpdateDesc(secId, html);
  else secUpdateContent(secId, html);
  // sync inline editor
  const inline = document.getElementById(field === 'description' ? `rich-desc-${secId}` : `rich-${secId}`);
  if (inline) inline.innerHTML = html;
  // sync split preview
  const pv = document.getElementById(`rich-modal-pv-content-${secId}`);
  if (pv && document.getElementById(`rich-modal-preview-${secId}`)?.style.display !== 'none') pv.innerHTML = html;
}

function richModalToggleSplit(secId) {
  const pane  = document.getElementById(`rich-modal-preview-${secId}`);
  const inner = document.getElementById('rich-modal-inner');
  const btn   = document.getElementById('rich-modal-split-btn');
  if (!pane) return;
  const open = pane.style.display === 'none' || pane.style.display === '';
  pane.style.display = open ? 'block' : 'none';
  inner.classList.toggle('split', open);
  btn.innerHTML = open ? `${icon('square',{size:11})} Editor only` : `${icon('columns-2',{size:11})} Split`;
  if (open) {
    const html = document.getElementById(`rich-modal-ed-${secId}`)?.innerHTML || '';
    const pv = document.getElementById(`rich-modal-pv-content-${secId}`);
    if (pv) pv.innerHTML = html;
  }
}

function closeRichModal(secId) {
  // Sync modal content back to the field it was opened for. (It used to
  // always write `content`, so closing a built-in section's intro editor also
  // copied the intro into its content.)
  const modal = document.getElementById('rich-modal');
  const field = modal?.dataset.field === 'description' ? 'description' : 'content';
  const modalHtml = document.getElementById(`rich-modal-ed-${secId}`)?.innerHTML;
  if (modalHtml !== undefined) {
    const inline = document.getElementById(field === 'description' ? `rich-desc-${secId}` : `rich-${secId}`);
    if (inline) inline.innerHTML = modalHtml;
    if (field === 'description') secUpdateDesc(secId, modalHtml);
    else secUpdateContent(secId, modalHtml);
  }
  modal?.remove();
  renderInspector();
}

// ── Subsection full-view modal ────────────────────────────────────
function openRichModalSub(secId, subId) {
  if (document.getElementById('rich-modal')) return;
  const d   = getReportData();
  const sec = d.sections.find(s => s.id === secId);
  const sub = sec?.children?.find(c => c.id === subId);
  if (!sub) return;
  const content = _secContentHtml(sub.content);
  const modal = document.createElement('div');
  modal.id = 'rich-modal';
  modal.className = 'fe-modal no-print';
  modal.innerHTML = `
    <div class="fe-modal-inner" id="rich-modal-inner">
      <div style="padding:8px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--bg3)">
        <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--t2)">${esc(sub.title)}</span>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button id="rich-modal-split-btn" class="btn-secondary" style="padding:4px 11px;font-size:11px" onclick="richSubModalToggleSplit('${subId}')">${icon('columns-2',{size:11})} Split</button>
          <button class="btn-accent" style="padding:4px 11px;font-size:11px" onclick="closeRichModalSub('${secId}','${subId}')">${icon('arrow-left',{size:11})} Close</button>
        </div>
      </div>
      <div class="fe-body">
        <div style="flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden">
          ${_richToolbar(`rich-modal-sub-ed-${subId}`, `rpal-sub-modal-${subId}`)}
          <div class="rich-editor" contenteditable="true" id="rich-modal-sub-ed-${subId}"
            style="flex:1;max-height:none;border-radius:0;border-left:none;border-right:none;border-bottom:none;border-top:1px solid var(--b1)"
            oninput="richSubModalInput('${secId}','${subId}',this.innerHTML)">${content}</div>
        </div>
        <div id="rich-sub-modal-preview-${subId}" style="flex:1;overflow-y:auto;padding:32px 40px;border-left:1px solid var(--b1);background:var(--bg);display:none">
          <div class="rpt" style="max-width:640px;margin:0 auto">
            <div class="rpt-prose" id="rich-sub-modal-pv-${subId}">${content}</div>
          </div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById(`rich-modal-sub-ed-${subId}`)?.focus();
}

function richSubModalInput(secId, subId, html) {
  secUpdateSubContent(secId, subId, html);
  const inline = document.getElementById(`rich-${subId}`);
  if (inline) inline.innerHTML = html;
  const pv = document.getElementById(`rich-sub-modal-pv-${subId}`);
  if (pv && document.getElementById(`rich-sub-modal-preview-${subId}`)?.style.display !== 'none') pv.innerHTML = html;
}

function richSubModalToggleSplit(subId) {
  const pane  = document.getElementById(`rich-sub-modal-preview-${subId}`);
  const inner = document.getElementById('rich-modal-inner');
  const btn   = document.getElementById('rich-modal-split-btn');
  if (!pane) return;
  const open = pane.style.display === 'none' || pane.style.display === '';
  pane.style.display = open ? 'block' : 'none';
  inner.classList.toggle('split', open);
  btn.innerHTML = open ? `${icon('square',{size:11})} Editor only` : `${icon('columns-2',{size:11})} Split`;
  if (open) {
    const el = document.querySelector(`#rich-modal-inner .rich-editor`);
    const pv = document.getElementById(`rich-sub-modal-pv-${subId}`);
    if (pv && el) pv.innerHTML = el.innerHTML;
  }
}

function closeRichModalSub(secId, subId) {
  const modalHtml = document.getElementById(`rich-modal-sub-ed-${subId}`)?.innerHTML;
  if (modalHtml !== undefined) {
    secUpdateSubContent(secId, subId, modalHtml);
    const inline = document.getElementById(`rich-${subId}`);
    if (inline) inline.innerHTML = modalHtml;
  }
  document.getElementById('rich-modal')?.remove();
  renderInspector();
}

// Close color palettes when clicking outside
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.rich-color-wrap'))
    document.querySelectorAll('.rich-color-palette').forEach(el => el.classList.remove('open'));
});

// Fixed palettes don't follow their button on their own
window.addEventListener('resize', _repositionOpenPalettes);
document.addEventListener('scroll', _repositionOpenPalettes, true);

// AI buttons rewrite their own label when a run finishes — build it in one
// place so the icon survives the round trip (innerHTML, never textContent).
const _aiLabel = (all = false) => `${icon('sparkles', { size: 11 })} Generate${all ? ' All' : ''}`;

// ── Report Templates ──────────────────────────────────────────────
// Templates are per-user and stored server-side, so they follow the person
// across browsers and machines. `_templates` is a cache of the server list
// kept in memory because the editor renders synchronously; the legacy
// localStorage key is only read once, to migrate what a user saved before
// this became a server feature.
const TPL_KEY = 'fd_report_templates';

let _templates  = [];
let _tplRemote  = false;   // false = offline fallback, edits stay local

function getTemplates() { return _templates; }

function _readLocalTemplates() {
  try {
    const list = JSON.parse(localStorage.getItem(TPL_KEY) || '[]');
    return Array.isArray(list) ? list : [];
  } catch { return []; }
}
function _saveLocalTemplates(list) { localStorage.setItem(TPL_KEY, JSON.stringify(list)); }

function _fromRow(row) {
  return {
    id:       row.id,
    name:     row.name,
    created:  (row.created_at || '').slice(0, 10),
    meta:     row.data?.meta || {},
    sections: Array.isArray(row.data?.sections) ? row.data.sections : [],
  };
}

async function loadTemplates() {
  if (window.FLOWDIT_SNAPSHOT) return;   // headless PDF render — templates unused
  try {
    const rows = await api.reportTemplates.list();
    _templates = rows.map(_fromRow);
    _tplRemote = true;
    await _migrateLocalTemplates();
  } catch (e) {
    // Older backend or no connectivity — keep the browser copy usable.
    _tplRemote = false;
    _templates = _readLocalTemplates();
    console.warn('[export] could not load report templates:', e?.message || e);
  }
}

// One-time upload of templates saved before server storage existed. The
// local key is only cleared when every entry made it across, so a partial
// failure never loses a template.
async function _migrateLocalTemplates() {
  const legacy = _readLocalTemplates();
  if (!legacy.length) return;
  const failed = [];
  for (const tpl of legacy) {
    if (!tpl?.meta || !Array.isArray(tpl.sections)) continue;
    try {
      const row = await api.reportTemplates.create(tpl.name || 'Untitled', { meta: tpl.meta, sections: tpl.sections });
      _templates.unshift(_fromRow(row));
    } catch { failed.push(tpl); }
  }
  if (failed.length) _saveLocalTemplates(failed);
  else localStorage.removeItem(TPL_KEY);
}

async function saveTemplate() {
  const input = document.getElementById('tpl-name-input');
  const name  = input?.value.trim();
  if (!name) { input?.focus(); return; }
  const d       = getReportData();
  // The archived Free Edit markdown belongs to this report, not to a template.
  const { freeEditMdArchive: _archived, ...meta } = d.meta || {};
  const payload = { meta, sections: d.sections };

  if (_tplRemote) {
    try {
      const row = await api.reportTemplates.create(name, payload);
      _templates.unshift(_fromRow(row));
    } catch (e) { showToast(e?.message || 'Could not save template', 'error'); return; }
  } else {
    _templates.unshift({ name, created: new Date().toISOString().slice(0,10), ...payload });
    _saveLocalTemplates(_templates);
  }
  if (input) input.value = '';
  buildEditor();
  showToast('Template saved', 'success');
}

function loadTemplate(idx) {
  const tpl = _templates[idx];
  if (!tpl) return;
  if (!confirm(`¿Cargar la plantilla "${tpl.name}"? Reemplaza el estilo, la portada y las secciones del informe (se puede deshacer).`)) return;
  const d = getReportData();
  const archived = d.meta?.freeEditMdArchive;
  d.meta = { ...tpl.meta };
  delete d.meta.freeEditMdArchive;
  if (archived) d.meta.freeEditMdArchive = archived;
  d.sections = tpl.sections.map(s => ({ ...s }));
  saveReportData(d, false);
  closeTemplatesModal();
  _afterReportDataReplaced();
  showToast(`Plantilla "${tpl.name}" cargada. Podés deshacerlo.`, 'success');
}

async function deleteTemplate(idx) {
  const tpl = _templates[idx];
  if (!tpl) return;
  if (!confirm(`Delete template "${tpl.name}"?`)) return;
  if (_tplRemote && tpl.id) {
    try { await api.reportTemplates.delete(tpl.id); }
    catch (e) { showToast(e?.message || 'Could not delete template', 'error'); return; }
    _templates.splice(idx, 1);
  } else {
    _templates.splice(idx, 1);
    _saveLocalTemplates(_templates);
  }
  buildEditor();
}

function exportTemplate(idx) {
  const tpl = _templates[idx];
  if (!tpl) return;
  const blob = new Blob([JSON.stringify({ name: tpl.name, created: tpl.created, meta: tpl.meta, sections: tpl.sections }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${tpl.name.replace(/\s+/g,'-').toLowerCase()}-template.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importTemplateFile(input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    let tpl;
    try { tpl = JSON.parse(e.target.result); }
    catch { alert('Could not parse template file.'); return; }
    if (!tpl?.meta || !Array.isArray(tpl.sections)) { alert('Invalid template file.'); return; }
    const name = tpl.name || file.name.replace(/\.json$/i, '');
    if (_tplRemote) {
      try {
        const row = await api.reportTemplates.create(name, { meta: tpl.meta, sections: tpl.sections });
        _templates.unshift(_fromRow(row));
      } catch (err) { showToast(err?.message || 'Could not import template', 'error'); return; }
    } else {
      _templates.unshift({ name, created: tpl.created || new Date().toISOString().slice(0,10), meta: tpl.meta, sections: tpl.sections });
      _saveLocalTemplates(_templates);
    }
    buildEditor();
  };
  reader.readAsText(file);
  input.value = '';
}

function pickEvidence(id, isWSTG) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.onchange = () => {
    const files = Array.from(input.files);
    let done = 0;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        getEdit(id).evidence.push({ name: file.name, data: e.target.result });
        done++;
        if (done === files.length) {
          renderEvidenceList(id, isWSTG);
          if (!isWSTG) scheduleVulnSave(id);
        }
      };
      reader.readAsDataURL(file);
    });
  };
  input.click();
}

function removeEvidence(id, idx, isWSTG) {
  getEdit(id).evidence.splice(idx, 1);
  renderEvidenceList(id, isWSTG);
  if (!isWSTG) scheduleVulnSave(id);

// ── AI: Executive Summary ─────────────────────────────────────────
async function aiExecSummary(secId) {
  const btn = document.getElementById('ai-exec-btn');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  try {
    const vulns = state.customVulns || [];
    const bySeverity = {};
    ['critical','high','medium','low','info'].forEach(s => {
      const n = vulns.filter(v => (v.severity || 'medium') === s).length;
      if (n) bySeverity[s] = n;
    });
    const highlights = vulns
      .filter(v => v.severity === 'critical' || v.severity === 'high')
      .slice(0, 8)
      .map(v => ({ name: v.name, severity: v.severity, target_host: v.target_host || '' }));

    const proj    = state.currentProject || {};
    const targets = (state.targets || []).filter(t => t.scope === 'in').map(t => t.host);
    const wstgMap = state.wstgProgress || {};
    const done    = Object.values(wstgMap).filter(t => t.status === 'pass').length;
    const fail    = Object.values(wstgMap).filter(t => t.status === 'fail').length;
    const total   = Object.keys(wstgMap).length;
    const pct     = total ? Math.round((done + fail) / total * 100) : 0;

    const context = {
      projectName: proj.name || '',
      scope:       proj.description || '',
      targets,
      totalVulns:  vulns.length,
      bySeverity,
      highlights,
      wstg: total ? { done, fail, pending: total - done - fail, pct } : null,
    };

    const apiBase = window.FLOWDIT_API || 'http://localhost:4000/api';
    const res = await fetch(`${apiBase}/projects/${state.currentProject.id}/ai/generate`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${tokens.access}`,
      },
      body: JSON.stringify({ type: 'exec-summary', context }),
    });
    if (!res.ok) throw new Error((await res.json()).error || 'AI error');
    const result = await res.json();

    if (result.description) {
      const d = getReportData();
      const sec = d.sections.find(s => s.id === secId);
      if (sec) {
        sec.description = result.description;
        saveReportData(d, true);
        const el = document.getElementById(`rich-desc-${secId}`);
        if (el) el.innerHTML = _secContentHtml(result.description);
      }
    }
  } catch(e) {
    alert('AI error: ' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = _aiLabel(); }
  }
}

// Generates the "Acción Recomendada" for every finding still missing one (does not overwrite existing text)
async function aiRoadmapActions(secId) {
  const btn = document.getElementById('ai-roadmap-btn');
  const vulns = (state.customVulns || []).filter(v => !getEdit(v.id).execAction);
  if (!vulns.length) { if (btn) btn.textContent = 'Nothing to generate'; setTimeout(() => { if (btn) btn.innerHTML = _aiLabel(true); }, 1500); return; }
  if (btn) btn.disabled = true;
  let done = 0;
  for (const v of vulns) {
    if (btn) btn.textContent = `${done}/${vulns.length}…`;
    try {
      const action = await _fetchRemediationAction(v, getEdit(v.id));
      if (action) {
        saveVulnExecAction(v.id, action);
        const el = document.getElementById(`eaction-${v.id}`);
        if (el) el.value = action;
      }
    } catch(e) {
      console.error('[ai roadmap action]', v.id, e);
    }
    done++;
  }
  if (btn) { btn.disabled = false; btn.innerHTML = _aiLabel(true); }
  buildReport();
}

// ── Report editor: outline · preview · inspector ──────────────────
// Left: the document outline (cover, TOC, sections, subsections and the
// findings of the findings section). Right: an inspector for the selected
// node. Center: the existing preview, whose blocks carry the same node id in
// data-node-id (see buildReport). Node ids:
//   style | cover | toc | sec:<sectionId> | sub:<sectionId>:<subId>
//   vuln:<findingId> | prop:<proposalId> (a proposal whose target is gone)
let _sel = 'cover';
let _hoverNode = null;
let _olQuery = '';
let _pvView = 'proposed';     // pending proposal shown in the preview: 'proposed' | 'current'
let _pvSuspend = 0;           // >0: render without screen-only overlays (print, markdown)
let _lastPreviewKey = '';
const _textMode = {};         // nodeId -> 'rich' | 'md'   (UI state, not persisted)
const _mdDrafts = {};         // nodeId -> unsaved markdown of that node

// A value as a JS string literal, safe inside a double-quoted HTML attribute.
function _ja(v) { return esc(JSON.stringify(String(v ?? ''))); }

function _withoutPreviewOverlays(fn) {
  _pvSuspend++;
  try { return fn(); } finally { _pvSuspend--; }
}

// ── Scope / type (persisted in meta, mirrored in the two selects) ─
// #export-scope and #report-type stay the source buildReport and the exports
// read, because the headless PDF render sets them directly.

const REPORT_TYPES  = ['technical', 'executive', 'retest'];
function _metaScope(m) { return REPORT_SCOPES.includes(m?.reportScope) ? m.reportScope : 'all'; }
function _metaType(m)  { return REPORT_TYPES.includes(m?.reportType) ? m.reportType : 'technical'; }
function _curScope()   { return document.getElementById('export-scope')?.value || 'all'; }
