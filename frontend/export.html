<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowdit — Export Report</title>
<link rel="stylesheet" href="css/main.css">
<script>window.FLOWDIT_API='http://localhost:4000/api'; window.FLOWDIT_WS='ws://localhost:4000/ws';</script>
<style>
.rpt { font-family:'Inter',system-ui,sans-serif; color:var(--text); line-height:1.7; }
.rpt h1 { font-size:26px;font-weight:800;margin:0 0 4px;color:var(--text); }
.rpt h2 { font-size:15px;font-weight:700;margin:36px 0 12px;color:var(--accent);
          text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--border);padding-bottom:6px; }
.rpt h3 { font-size:13px;font-weight:700;margin:20px 0 8px;color:var(--text); }
.rpt p  { margin:4px 0 8px;color:var(--text2);font-size:13px; }
.rpt-meta { display:flex;gap:20px;margin:8px 0 24px;flex-wrap:wrap; }
.rpt-meta-item { font-size:12px;color:var(--text3);font-family:var(--mono); }
.rpt-meta-item strong { color:var(--text2); }

.rpt-summary { display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 20px; }
.rpt-summary-card { flex:1;min-width:90px;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px; }
.rpt-summary-card .rpt-count { font-size:26px;font-weight:800; }
.rpt-summary-card .rpt-label { font-size:9px;text-transform:uppercase;letter-spacing:.1em;opacity:.7;font-family:var(--mono); }
.card-critical{background:#ef444418;border:1px solid #ef444440;color:#ef4444;}
.card-high    {background:#f9731618;border:1px solid #f9731640;color:#f97316;}
.card-medium  {background:#eab30818;border:1px solid #eab30840;color:#eab308;}
.card-low     {background:#3b82f618;border:1px solid #3b82f640;color:#3b82f6;}
.card-info    {background:#6b728018;border:1px solid #6b728040;color:#9ca3af;}
.card-wstg    {background:var(--bg3);border:1px solid var(--border);color:var(--green);}
.card-ps      {background:var(--bg3);border:1px solid var(--border);color:var(--blue);}

.rpt-table { width:100%;border-collapse:collapse;font-size:12px;margin:10px 0; }
.rpt-table th { text-align:left;padding:8px 12px;background:var(--bg3);font-family:var(--mono);
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);border-bottom:1px solid var(--border); }
.rpt-table td { padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text2); }
.rpt-table tr:last-child td { border-bottom:none; }
.rpt-table td.num { text-align:center;font-family:var(--mono);font-weight:600; }
.rpt-table td.vuln-found { color:var(--red);font-weight:700; }
.rpt-progress-cell { display:flex;align-items:center;gap:8px; }
.rpt-mini-bar { flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden; }
.rpt-mini-fill { height:100%;background:var(--green);border-radius:2px; }

.rpt-vuln { border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden;page-break-inside:avoid; }
.rpt-vuln-header { display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2); }
.rpt-vuln-name { font-weight:600;font-size:13px;flex:1; }
.rpt-vuln-cat  { font-family:var(--mono);font-size:10px;color:var(--text3); }
.rpt-vuln-body { padding:0; }
.rpt-field { padding:10px 14px;border-top:1px solid var(--border); }
.rpt-field-label { font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:4px; }
.rpt-field-val  { font-size:12px;color:var(--text2);white-space:pre-wrap;line-height:1.6; }
.rpt-field-rem  { font-size:12px;color:var(--green);white-space:pre-wrap;line-height:1.6; }
.rpt-code { background:var(--bg);border-radius:5px;padding:8px 10px;font-family:var(--mono);font-size:11px;color:var(--text2);line-height:1.6;border:1px solid var(--border); }
.rpt-divider { border:none;border-top:1px solid var(--border);margin:28px 0; }
.rpt-wstg-vuln { padding:10px 14px;border:1px solid #ef444430;border-radius:6px;margin-bottom:8px;background:#ef444408; }
.rpt-evidence-grid { display:flex;flex-wrap:wrap;gap:8px;margin-top:6px; }
.rpt-evidence-img { max-width:280px;max-height:200px;border-radius:6px;border:1px solid var(--border);object-fit:contain; }
.rpt-evidence-caption { font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:3px; }

/* Export options panel */
.export-opt { display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--text2);cursor:pointer; }
.export-opt input[type=checkbox] { accent-color:var(--accent);width:13px;height:13px;cursor:pointer; }

@media print {
  * { -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important; }
  body { background:#fff!important; }
  .topbar,.sidebar,.export-controls,.no-print,.toast-container { display:none!important; }
  .print-area { display:block!important;position:static!important;overflow:visible!important; }
  .rpt { padding:0!important;max-width:100%!important; }
  .rpt h2 { color:#555!important;border-color:#ccc!important; }
  .rpt-table th { background:#f5f5f5!important;color:#666!important; }
  .rpt-table td { color:#333!important;border-color:#ddd!important; }
  .rpt-vuln { border-color:#ddd!important;page-break-inside:avoid; }
  .rpt-vuln-header { background:#f9f9f9!important; }
  .rpt-code { background:#f4f4f4!important;color:#333!important; }
  .rpt-field-rem { color:#155724!important; }
  .card-critical,.card-high,.card-medium,.card-low,.card-info,.card-wstg,.card-ps {
    border:1px solid #ccc!important;background:#f5f5f5!important;color:#333!important; }
  .rpt-mini-fill { background:#555!important; }
  .rpt-mini-bar  { background:#ddd!important; }
  .rpt-evidence-img { max-width:240px;max-height:180px; }
}
</style>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh">

<div id="loading-overlay"><div class="spinner"></div><div class="spinner-text">// generating report...</div></div>
<div class="topbar" id="topbar"></div>

<div style="display:flex;flex:1;overflow:hidden">
  <div class="sidebar no-print" id="sidebar"></div>

  <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">

    <!-- Controls -->
    <div class="export-controls no-print"
      style="padding:14px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;background:var(--bg2);flex-shrink:0;flex-wrap:wrap">
      <div>
        <div class="page-title" style="font-size:17px">Export Report</div>
        <div class="page-subtitle">// <span id="export-project-name">—</span></div>
      </div>

      <!-- Scope -->
      <select id="export-scope" class="form-input" style="width:170px;cursor:pointer" onchange="buildReport()">
        <option value="all">Full Report</option>
        <option value="vulns">Custom Vulns Only</option>
        <option value="wstg">WSTG Only</option>
      </select>

      <!-- Field toggles -->
      <div style="display:flex;gap:12px;flex-wrap:wrap;padding:6px 10px;background:var(--bg3);border-radius:8px;border:1px solid var(--border)">
        <label class="export-opt"><input type="checkbox" id="opt-desc"  checked onchange="buildReport()"> Description</label>
        <label class="export-opt"><input type="checkbox" id="opt-rem"   checked onchange="buildReport()"> Remediation</label>
        <label class="export-opt"><input type="checkbox" id="opt-pay"   checked onchange="buildReport()"> Payloads</label>
        <label class="export-opt"><input type="checkbox" id="opt-notes"        onchange="buildReport()"> Notes</label>
        <label class="export-opt"><input type="checkbox" id="opt-evid"  checked onchange="buildReport()"> Evidence</label>
      </div>

      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn-secondary" onclick="copyMarkdown()" style="padding:8px 14px">📋 Markdown</button>
        <button class="btn-accent"    onclick="window.print()"  style="padding:8px 14px">🖨 Export PDF</button>
      </div>
    </div>

    <!-- Report -->
    <div class="print-area" style="flex:1;overflow-y:auto;padding:40px 48px">
      <div id="report-preview" class="rpt" style="max-width:760px;margin:0 auto"></div>
    </div>

  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/services/state.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/ws.js"></script>
<script src="js/services/utils.js"></script>
<script src="js/components/activity.js"></script>
<script src="js/page.js"></script>
<script>
const SEV_ORDER  = ['critical','high','medium','low','info'];
const SEV_LABEL  = { critical:'Critical', high:'High', medium:'Medium', low:'Low', info:'Info' };
const SEV_EMOJI  = { critical:'🔴', high:'🟠', medium:'🟡', low:'🔵', info:'⚪' };
let _mdLines = [];

function opt(id) { return document.getElementById(id)?.checked ?? true; }

function buildReport() {
  const p     = state.currentProject;
  const scope = document.getElementById('export-scope')?.value || 'all';
  if (!p) return;
  _mdLines = [];

  const showDesc  = opt('opt-desc');
  const showRem   = opt('opt-rem');
  const showPay   = opt('opt-pay');
  const showNotes = opt('opt-notes');
  const showEvid  = opt('opt-evid');

  const date  = new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'long', year:'numeric' });
  const vulns = state.customVulns || [];
  const bySev = {};
  SEV_ORDER.forEach(s => bySev[s] = vulns.filter(v => (v.severity||'medium') === s));

  let wDone=0, wFail=0, wTotal=0;
  WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
    wTotal++;
    const s = state.wstgProgress[t.id]?.status;
    if (s === 'done') wDone++;
    if (s === 'fail') wFail++;
  }));
  const wTested = wDone + wFail;
  const wPct    = wTotal ? Math.round(wTested/wTotal*100) : 0;

  let psDone=0, psTotal=0;
  PS_DATA.forEach(cat => cat.labs.forEach((_,i) => {
    psTotal++;
    const v = state.psProgress[`${cat.id}_${i}`];
    if (v === true || v?.done) psDone++;
  }));

  let html = '';
  const md = (...a) => _mdLines.push(a.join(' '));

  // ── Header ────────────────────────────────────────────────
  md(`# ${p.name} — Pentest Report`);
  md(`**Date:** ${date}  **Target:** ${p.target||'—'}`); md('');
  html += `<h1>${esc(p.name)} — Pentest Report</h1>
    <div class="rpt-meta">
      <div class="rpt-meta-item"><strong>Date:</strong> ${date}</div>
      ${p.target ? `<div class="rpt-meta-item"><strong>Target:</strong> ${esc(p.target)}</div>` : ''}
      ${p.description ? `<div class="rpt-meta-item"><strong>Scope:</strong> ${esc(p.description)}</div>` : ''}
    </div>`;

  // ── Summary cards ─────────────────────────────────────────
  if (scope === 'all' || scope === 'vulns') {
    md('## Executive Summary');
    md('| Severity | Count |'); md('|----------|-------|');
    SEV_ORDER.forEach(s => { if(bySev[s].length) md(`| ${SEV_EMOJI[s]} ${SEV_LABEL[s]} | ${bySev[s].length} |`); });
    md('');
    html += `<h2>Executive Summary</h2><div class="rpt-summary">`;
    SEV_ORDER.forEach(s => {
      if (!bySev[s].length) return;
      html += `<div class="rpt-summary-card card-${s}">
        <div class="rpt-count">${bySev[s].length}</div>
        <div class="rpt-label">${SEV_EMOJI[s]} ${SEV_LABEL[s]}</div>
      </div>`;
    });
    if (scope === 'all') html += `
      <div class="rpt-summary-card card-wstg"><div class="rpt-count">${wPct}%</div><div class="rpt-label">WSTG Done</div></div>
      <div class="rpt-summary-card card-ps"><div class="rpt-count">${psDone}</div><div class="rpt-label">PS Labs</div></div>`;
    html += '</div>';
  }

  // ── WSTG ─────────────────────────────────────────────────
  if (scope === 'all' || scope === 'wstg') {
    md('## OWASP WSTG Progress');
    md(`**Overall:** ${wTested}/${wTotal} (${wPct}%) · **Passed:** ${wDone} · **Vuln Found:** ${wFail}`); md('');
    md('| Category | Tested | Total | Vulns |'); md('|----------|--------|-------|-------|');

    html += `<h2>OWASP WSTG Progress</h2>
      <p><strong>${wTested}/${wTotal}</strong> tests completed &nbsp;·&nbsp;
         <strong style="color:var(--green)">${wDone} passed</strong> &nbsp;·&nbsp;
         <strong style="color:var(--red)">${wFail} vuln found</strong></p>
      <table class="rpt-table"><thead><tr>
        <th>Category</th><th style="text-align:center">Tested</th>
        <th style="text-align:center">Total</th><th style="text-align:center">Vulns</th>
        <th style="min-width:100px">Progress</th>
      </tr></thead><tbody>`;

    WSTG_DATA.forEach(cat => {
      const t = cat.tests.length;
      const d = cat.tests.filter(x => state.wstgProgress[x.id]?.status === 'done').length;
      const f = cat.tests.filter(x => state.wstgProgress[x.id]?.status === 'fail').length;
      const tested = d + f;
      if (!tested) return;
      const pct = t ? Math.round(tested/t*100) : 0;
      md(`| ${cat.name} | ${tested} | ${t} | ${f} |`);
      html += `<tr>
        <td>${esc(cat.name)}</td>
        <td class="num">${tested}</td><td class="num">${t}</td>
        <td class="num ${f>0?'vuln-found':''}">${f||'—'}</td>
        <td><div class="rpt-progress-cell">
          <div class="rpt-mini-bar"><div class="rpt-mini-fill" style="width:${pct}%"></div></div>
          <span style="font-family:var(--mono);font-size:10px;color:var(--text3);min-width:30px">${pct}%</span>
        </div></td>
      </tr>`;
    });
    html += '</tbody></table>';

    const failedTests = [];
    WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
      if (state.wstgProgress[t.id]?.status === 'fail')
        failedTests.push({ cat: cat.name, test: t, prog: state.wstgProgress[t.id] });
    }));
    if (failedTests.length) {
      html += `<h3 style="margin-top:24px;color:var(--red)">⚠ Vulnerabilities Found in WSTG</h3>`;
      failedTests.forEach(({ cat, test, prog }) => {
        html += `<div class="rpt-wstg-vuln">
          <div style="font-weight:600;font-size:13px;margin-bottom:2px">✕ ${esc(test.id)} — ${esc(test.name)}</div>
          <div style="font-size:11px;color:var(--text3);font-family:var(--mono)">Category: ${esc(cat)}</div>
          ${prog.note && showNotes ? `<div style="margin-top:6px;font-size:12px;color:var(--text2)">${esc(prog.note)}</div>` : ''}
        </div>`;
      });
    }
    html += '<hr class="rpt-divider">';
  }

  // ── Custom vulns ──────────────────────────────────────────
  if ((scope === 'all' || scope === 'vulns') && vulns.length) {
    md('## Custom Vulnerabilities'); md('');
    html += `<h2>Custom Vulnerabilities</h2>`;

    SEV_ORDER.forEach(sev => {
      if (!bySev[sev].length) return;
      md(`### ${SEV_EMOJI[sev]} ${SEV_LABEL[sev]}`); md('');
      html += `<h3 style="margin-top:20px;margin-bottom:10px;display:flex;align-items:center;gap:8px">
        <span class="sev-badge sev-${sev}">${SEV_LABEL[sev]}</span>
        <span style="font-family:var(--mono);font-size:11px;color:var(--text3);font-weight:400">${bySev[sev].length} finding${bySev[sev].length>1?'s':''}</span>
      </h3>`;

      bySev[sev].forEach(v => {
        const statusLabel = v.status==='done'?'✓ Confirmed':v.status==='fail'?'✕ Reproduced':'○ Pending';
        const statusColor = v.status==='done'?'var(--green)':v.status==='fail'?'var(--red)':'var(--text3)';

        md(`#### ${v.name}`);
        md(`**Severity:** ${SEV_LABEL[sev]} · **Status:** ${statusLabel}`); md('');

        html += `<div class="rpt-vuln">
          <div class="rpt-vuln-header">
            <div class="rpt-vuln-name">${esc(v.name)}</div>
            <span class="rpt-vuln-cat">${esc(v.category||'Custom')}</span>
            <span style="font-family:var(--mono);font-size:11px;color:${statusColor};font-weight:600">${statusLabel}</span>
          </div>
          <div class="rpt-vuln-body">`;

        // Description
        if (showDesc && v.description) {
          md('**Description:**'); md(v.description); md('');
          html += `<div class="rpt-field">
            <div class="rpt-field-label">Description</div>
            <div class="rpt-field-val">${esc(v.description)}</div>
          </div>`;
        }

        // Payloads
        if (showPay && (v.payloads||[]).length) {
          md('**Payloads:**'); md('```'); v.payloads.forEach(p => md(p)); md('```'); md('');
          html += `<div class="rpt-field">
            <div class="rpt-field-label">Payloads</div>
            <div class="rpt-code">${v.payloads.map(p=>esc(p)).join('\n')}</div>
          </div>`;
        }

        // Checklist
        if ((v.items||[]).length) {
          html += `<div class="rpt-field">
            <div class="rpt-field-label">Checklist</div>
            <div>${v.items.map((item,i) => {
              const chk = v.checked_items?.[i];
              return `<div style="font-size:12px;color:var(--text2);padding:2px 0">${chk?'✅':'☐'} ${esc(item)}</div>`;
            }).join('')}</div>
          </div>`;
        }

        // Notes
        if (showNotes && v.notes) {
          md('**Notes:**'); md(v.notes); md('');
          html += `<div class="rpt-field">
            <div class="rpt-field-label">Notes</div>
            <div class="rpt-field-val">${esc(v.notes)}</div>
          </div>`;
        }

        // Remediation
        if (showRem && v.remediation) {
          md('**Remediation:**'); md(v.remediation); md('');
          html += `<div class="rpt-field">
            <div class="rpt-field-label">Remediation</div>
            <div class="rpt-field-rem">${esc(v.remediation)}</div>
          </div>`;
        }

        // Evidence
        if (showEvid && (v.evidence||[]).length) {
          html += `<div class="rpt-field">
            <div class="rpt-field-label">Evidence (${v.evidence.length} image${v.evidence.length>1?'s':''})</div>
            <div class="rpt-evidence-grid">`;
          v.evidence.forEach(img => {
            html += `<div>
              <img src="${img.data}" class="rpt-evidence-img" alt="${esc(img.name||'evidence')}">
              <div class="rpt-evidence-caption">${esc(img.name||'')}</div>
            </div>`;
          });
          html += `</div></div>`;
        }

        html += '</div></div>'; // close rpt-vuln-body + rpt-vuln
        md('---'); md('');
      });
    });
  }

  // ── PortSwigger ───────────────────────────────────────────
  if (scope === 'all' && psDone > 0) {
    html += `<hr class="rpt-divider"><h2>PortSwigger Academy</h2>
      <p><strong>${psDone}</strong> of <strong>${psTotal}</strong> labs completed</p>`;
    md('## PortSwigger Academy');
    md(`**Completed:** ${psDone} / ${psTotal} labs`);
  }

  document.getElementById('report-preview').innerHTML = html;
  document.getElementById('export-project-name').textContent = p.name;
}

function copyMarkdown() {
  if (!_mdLines.length) return;
  navigator.clipboard.writeText(_mdLines.join('\n'))
    .then(() => showToast('📋 Markdown copied!', 'success'));
}

function pageInit() {
  let html = '<div class="sidebar-section-label">Projects</div>';
  state.projects.forEach(p => {
    const active = p.id === state.currentProject?.id;
    html += `<div class="sidebar-item ${active?'active':''}" onclick="switchProject('${p.id}')">
      <span class="sidebar-item-text">${esc(p.name)}</span>
      <span class="sidebar-item-badge">${p.member_role}</span>
    </div>`;
  });
  document.getElementById('sidebar').innerHTML = html;
  buildReport();
}

bootPage('export');
</script>
</body>
</html>
