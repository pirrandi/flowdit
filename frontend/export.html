          <button class="ai-btn" id="ai-action-${id}" onclick="aiRemediationAction('${id}')" title="Generate a short, non-technical action item">✦ Generate</button>
        </div>
        <textarea class="exp-textarea" id="eaction-${id}" placeholder="Acción de alto nivel, sin jerga técnica..."
          oninput="saveVulnExecAction('${id}',this.value)"
        >${esc(execAction)}</textarea>
      </div>
      <div>
        <div class="exp-field-label">Evidencia</div>
        <div id="evid-list-${id}"></div>
        <button class="btn-add-row" style="margin-top:5px;font-size:10px" onclick="pickEvidence('${id}',false)">+ Adjuntar imagen</button>
      </div>
    </div>
  </div>`;
}

function toggleSectionPanel(id, header) {
  header.classList.toggle('open');
  document.getElementById(`esec-${id}`)?.classList.toggle('open');
}

function toggleFinding(id) {
  document.getElementById(`fbody-${id}`)?.classList.toggle('open');
}

// ── Build preview ─────────────────────────────────────────────────
let _mdLines = [];
function opt(id) { return document.getElementById(id)?.checked ?? true; }

function buildReport() {
  const p          = state.currentProject;
  const scope      = document.getElementById('export-scope')?.value || 'all';
  const reportType = document.getElementById('report-type')?.value || 'technical';
  if (!p) return;

  if (_freeEditMd !== null) {
    document.getElementById('report-preview').innerHTML = renderMdStyled(_freeEditMd);
    document.getElementById('export-project-name').textContent = p.name;
    return;
  }

  _mdLines = [];
  const showDesc  = opt('opt-desc');
  const showRem   = opt('opt-rem');
  const showPay   = opt('opt-pay');
  const showNotes = opt('opt-notes');
  const showEvid  = opt('opt-evid');

  const data     = getReportData();
  const m        = data.meta;
  const cf       = m.coverFields || {};
  const sections = data.sections || DEFAULT_SECTIONS.map(s=>({...s}));

  const date  = new Date().toLocaleDateString('es-ES', { day:'2-digit', month:'long', year:'numeric' });
  const vulns = state.customVulns || [];
  const bySev = {};
  SEV_ORDER.forEach(s => bySev[s] = vulns.filter(v => (v.severity||'medium') === s));

  // Sequential numbering per severity: C1, C2 / H1, H2 / M1, M2 / L1, L2 / I1, I2
  const SEV_PREFIX = { critical:'C', high:'A', medium:'M', low:'B', info:'I' };
  const vulnNumMap = {};
  SEV_ORDER.forEach(sev => {
    bySev[sev].forEach((v, i) => { vulnNumMap[v.id] = `${SEV_PREFIX[sev]}${i+1}`; });
  });

  let wDone=0, wFail=0, wTotal=0;
  WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
    wTotal++;
    const s = state.wstgProgress[t.id]?.status;
    if (s==='done') wDone++;
    if (s==='fail') wFail++;
  }));
  const wTested = wDone + wFail;
  const wPct    = wTotal ? Math.round(wTested/wTotal*100) : 0;

  const md = (...a) => _mdLines.push(a.join(' '));
  let html = '';

  // ── Cover (always rendered) ───────────────────────────────────────
  md(`# ${p.name} — Informe de Seguridad`);
  md(`**Fecha:** ${date}${p.target ? `  ·  **Objetivo:** ${p.target}` : ''}`);
  if (m.preparedBy)   md(`**Preparado por:** ${m.preparedBy}`);
  if (m.organization) md(`**Organización:** ${m.organization}`);
  if (m.version)      md(`**Versión:** ${m.version}`);
  md(`**Clasificación:** ${m.classification||'Confidencial'}`);
  md('');

  const _coverMeta = [];
  if (cf.date          !== false)                      _coverMeta.push({ label:'Fecha',              val:date });
  if (cf.target        !== false && p.target)          _coverMeta.push({ label:'Objetivo',           val:p.target });
  if (cf.preparedBy    !== false && m.preparedBy)      _coverMeta.push({ label:'Preparado por',      val:m.preparedBy });
  if (cf.organization  !== false && m.organization)    _coverMeta.push({ label:'Organización',       val:m.organization });
  if (cf.scope         !== false && p.description)     _coverMeta.push({ label:'Alcance',            val:p.description });
  if (cf.version       !== false && m.version)         _coverMeta.push({ label:'Versión',            val:m.version });
  if (cf.totalFindings !== false && scope!=='wstg')    _coverMeta.push({ label:'Total hallazgos',    val:String(vulns.length) });
  if (cf.wstgCoverage  !== false && scope!=='vulns')   _coverMeta.push({ label:'Cobertura WSTG',     val:`${wPct}% (${wTested}/${wTotal})` });

  let _metaHtml = '<div class="rpt-cover-meta">';
  for (let i = 0; i < _coverMeta.length; i += 2) {
    _metaHtml += '<div class="rpt-cover-meta-row">';
    [_coverMeta[i], _coverMeta[i+1]].forEach(item => {
      if (!item) { _metaHtml += '<div class="rpt-cover-meta-cell"></div>'; return; }
      _metaHtml += `<div class="rpt-cover-meta-cell"><span class="rpt-cover-meta-label">${item.label}</span><span class="rpt-cover-meta-val">${esc(item.val)}</span></div>`;
    });
    _metaHtml += '</div>';
  }
  _metaHtml += '</div>';

  const _logoUrl = m.coverLogoBase64 || m.clientLogoUrl || p.logo_url || null;
  const _logoBg  = m.coverLogoBg || p.logo_bg || 'light';
  const _coverTitle    = m.coverTitle    || p.name || '';
  const _coverSubtitle = m.coverSubtitle || '';
  const _coverType     = m.coverTypeLabel || 'Informe de Evaluación de Seguridad';
  html += `<div class="rpt-cover-page">
    <div class="rpt-cover-page-bar"></div>
    <div class="rpt-cover-page-body">
      <div class="rpt-cover-logo-wrap">
        ${_logoUrl
          ? (() => {
              const lbg   = _logoBg === 'dark' ? '#1e1e1e' : _logoBg === 'transparent' ? 'transparent' : '#fff';
              const lbord = _logoBg === 'transparent' ? 'none' : `1px solid ${_logoBg === 'dark' ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.09)'}`;
              const lpad  = _logoBg === 'transparent' ? '0' : '24px 40px';
              return `<div style="background:${lbg};border:${lbord};border-radius:${_logoBg==='transparent'?'0':'14px'};padding:${lpad};display:flex;align-items:center;justify-content:center"><img src="${esc(_logoUrl)}" style="height:100px;max-width:300px;object-fit:contain" alt="Logo"></div>`;
            })()
          : `<div class="rpt-cover-logo-ph">${esc((_coverTitle||'?')[0].toUpperCase())}</div>`}
      </div>
      <div class="rpt-cover-title-block">
        <span class="rpt-cover-page-type">${esc(_coverType)}</span>
        <h1 class="rpt-cover-page-h1">${esc(_coverTitle)}</h1>
        ${_coverSubtitle ? `<div class="rpt-cover-page-client" style="font-style:normal;font-size:16px;color:var(--t2)">${esc(_coverSubtitle)}</div>` : ''}
        ${m.clientName ? `<div class="rpt-cover-page-client">${esc(m.clientName)}</div>` : ''}
        <span class="rpt-cover-conf">${esc(m.classification||'Confidencial')}</span>
      </div>
    </div>
    <div class="rpt-cover-page-footer">${_metaHtml}</div>
  </div>`;

  // ── TOC (derived from visible sections) ───────────────────────────
  const FORCE_EXEC_TYPES = new Set(['risk-matrix', 'remediation-roadmap']);
  const visibleSections = sections.filter(s => s.visible || (reportType === 'executive' && FORCE_EXEC_TYPES.has(s.type)));
  const _tocItems = [];
  const PROSE_TYPES = new Set(['custom']);
  let _tocSecNum = 0;
  const _tocSubs = sec => (sec.children||[]).filter(c=>c.visible!==false);
  const _tocPush = (sec, sid) => { _tocSecNum++; _tocItems.push({ title:sec.title, id:sid, num:_tocSecNum, subs:_tocSubs(sec) }); };
  visibleSections.forEach(sec => {
    const sid = `rpt-sec-${sec.id}`;
    if (PROSE_TYPES.has(sec.type)) {
      if (sec.content || _tocSubs(sec).length) _tocPush(sec, sid);
    } else if (sec.type === 'exec-summary' && scope !== 'wstg') {
      _tocPush(sec, sid);
    } else if (sec.type === 'findings-index' && scope !== 'wstg' && vulns.length) {
      _tocPush(sec, sid);
    } else if (sec.type === 'wstg' && scope !== 'vulns') {
      _tocPush(sec, sid);
    } else if (sec.type === 'detailed-findings' && scope !== 'wstg' && vulns.length && reportType === 'technical') {
      _tocPush(sec, sid);
    } else if (sec.type === 'risk-matrix' && scope !== 'wstg' && vulns.length) {
      _tocPush(sec, sid);
    } else if (sec.type === 'remediation-roadmap' && scope !== 'wstg' && vulns.length) {
      _tocPush(sec, sid);
    } else if (sec.type === 'targets' && state.targets?.length) {
      _tocPush(sec, sid);
    } else if (sec.type === 'risk-table') {
      _tocPush(sec, sid);
    }
  });

  if (m.showToc && _tocItems.length) {
    md('## Índice de Contenidos');
    _tocItems.forEach((t, i) => md(`${i+1}. ${t.title}`));
    md('');
    html += `<div class="rpt-toc">
      <div class="rpt-toc-title">Índice de Contenidos</div>
      ${_tocItems.map((t, i) => {
        const sn = m.numbering ? t.num : (i+1);
        let row = `<div class="rpt-toc-item"><span class="rpt-toc-num">${sn}.</span><a href="#${t.id}">${esc(t.title)}</a></div>`;
        t.subs.forEach((sub, si) => {
          row += `<div class="rpt-toc-item rpt-toc-sub"><span class="rpt-toc-num">${sn}.${si+1}.</span><a href="#sub-${sub.id}">${esc(sub.title)}</a></div>`;
        });
        return row;
      }).join('')}
    </div>`;
  }

  // ── Subsections helper ─────────────────────────────────────────────
  function _subsHtml(sec, secNum) {
    const subs = (sec.children || []).filter(c => c.visible !== false);
    if (!subs.length) return '';
    let out = '';
    subs.forEach((sub, si) => {
      const numPfx = m.numbering ? `<span class="sec-num-prefix">${secNum}.${si+1}</span>` : '';
      out += `<h3 class="rpt-sub-title" id="sub-${sub.id}">${numPfx}${esc(sub.title)}</h3>`;
      if (sub.content) out += `<div class="rpt-prose">${_secContentHtml(sub.content)}</div>`;
    });
    return out;
  }

  // ── Sections in user-defined order ────────────────────────────────
  let _secNum = 0;
  for (const sec of visibleSections) {
    const secId = `rpt-sec-${sec.id}`;
    const _pb   = sec.pageBreak ? 'page-break-before:always;break-before:page;' : '';
    const _fs   = sec.fontSize  ? `font-size:${sec.fontSize}px;` : '';
    const _cw   = _fs ? `<div style="${_fs}">` : '';
    const _ce   = _fs ? `</div>` : '';
    const _desc = sec.description ? `<div class="rpt-prose rpt-sec-desc">${_secContentHtml(sec.description)}</div>` : '';

    // ── Prose / custom ────────────────────────────────────────────
    if (PROSE_TYPES.has(sec.type)) {
      if (!sec.content && !(sec.children||[]).filter(c=>c.visible!==false).length) continue;
      _secNum++;
      const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
      md(`## ${sec.title}`); md(sec.content||''); md('');
      html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>`;
      if (sec.content) html += `<div class="rpt-prose"${_fs ? ` style="${_fs}"` : ''}>${_secContentHtml(sec.content)}</div>`;
      html += _subsHtml(sec, _secNum);
      continue;
    }

    // ── Executive Summary ─────────────────────────────────────────
    if (sec.type === 'exec-summary' && scope !== 'wstg') {
      _secNum++;
      const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
      if (vulns.length) {
        const riskLevel = overallRiskLevel(bySev);
        md('## Resumen Ejecutivo');
        if (reportType === 'executive' && riskLevel) md(`**Riesgo General: ${RISK_LEVEL_LABEL[riskLevel]}** — ${RISK_BANNER_TEXT[riskLevel]}`);
        md('|Severidad|Cantidad|'); md('|---------|--------|');
        SEV_ORDER.forEach(s => { if(bySev[s].length) md(`|${SEV_LABEL[s]}|${bySev[s].length}|`); });
        md('');
        html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}`;
        if (reportType === 'executive' && riskLevel) {
          html += `<div class="rpt-risk-banner card-${riskLevel}">
            <div><div class="rpt-risk-banner-label">Riesgo General</div><div class="rpt-risk-banner-level">${RISK_LEVEL_LABEL[riskLevel]}</div></div>
            <div class="rpt-risk-banner-text">${RISK_BANNER_TEXT[riskLevel]}</div>
          </div>`;
        }
        html += `<div class="rpt-summary">`;
        SEV_ORDER.forEach(s => {
          if (!bySev[s].length) return;
          html += `<div class="rpt-summary-card card-${s}"><div class="rpt-count">${bySev[s].length}</div><div class="rpt-label">${SEV_LABEL[s]}</div></div>`;
        });
        html += '</div>';
        html += `<div class="rpt-risk-wrap"><div class="rpt-risk-bar">`;
        SEV_ORDER.forEach(s => {
          if (!bySev[s].length) return;
          html += `<div class="rpt-risk-seg rpt-risk-${s}" style="width:${Math.round(bySev[s].length/vulns.length*100)}%" title="${SEV_LABEL[s]}: ${bySev[s].length}"></div>`;
        });
        html += `</div><div class="rpt-risk-legend">`;
        SEV_ORDER.forEach(s => {
          if (!bySev[s].length) return;
          const colors = {critical:'#ef4444',high:'#f97316',medium:'#eab308',low:'#059669',info:'#6b7280'};
          html += `<div class="rpt-risk-legend-item"><div class="rpt-risk-legend-dot" style="background:${colors[s]}"></div>${SEV_LABEL[s]} (${bySev[s].length})</div>`;
        });
        html += `</div></div>`;
        if (reportType === 'executive') {
          const criticalHigh = [...bySev.critical, ...bySev.high];
          if (criticalHigh.length) {
            md('### Hallazgos Críticos y de Alto Riesgo');
            html += `<h3 style="margin-top:22px">Hallazgos Críticos y de Alto Riesgo</h3>`;
            criticalHigh.forEach(v => {
              const edit   = _localEdits[v.id] || {};
              const impact = edit.businessImpact || data.vulnEdits?.[v.id]?.businessImpact || '';
              const num    = vulnNumMap[v.id];
              md(`**${num} — ${v.name}** (${SEV_LABEL[v.severity]})`);
              md(impact || '_Impacto de negocio pendiente de completar._');
              md('');
              html += `<div class="rpt-vuln" style="border-left:4px solid ${v.severity==='critical'?'#ef4444':'#f97316'};margin-bottom:10px">
                <div class="rpt-vuln-header">
                  <span class="sev-badge sev-${v.severity}">${SEV_LABEL[v.severity]}</span>
                  <span style="font-family:var(--mono);font-size:11px;color:var(--t3)">${num}</span>
                  <span style="font-weight:600;font-size:13px">${esc(v.name)}</span>
                </div>
                <div class="rpt-field-val" style="padding:10px 14px;white-space:pre-wrap">${impact ? esc(impact) : '<em style="color:var(--t3)">Impacto de negocio pendiente de completar.</em>'}</div>
              </div>`;
            });
          }
        }
        html += _ce;
      } else {
        html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}<p style="color:var(--t3);font-style:italic">Sin hallazgos registrados para este proyecto.</p>${_ce}`;
      }
      html += _subsHtml(sec, _secNum);
      continue;
    }

    // ── Findings Index ────────────────────────────────────────────
    if (sec.type === 'findings-index' && scope !== 'wstg' && vulns.length) {
      _secNum++;
      const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
      const REM_LABEL = { open:'Abierto', remediated:'Remediado', verified_closed:'Verificado' };
      md('## Índice de Hallazgos'); md('| ID | Severidad | Vulnerabilidad | Categoría | Estado | Remediación |'); md('|----|-----------|----------------|-----------|--------|-------------|');
      html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}
        <table class="rpt-table" style="table-layout:fixed;width:100%"><thead><tr>
          <th style="width:45px">ID</th><th style="width:80px">Severidad</th>
          <th>Vulnerabilidad</th><th style="width:18%">Categoría</th><th style="width:85px">Estado</th><th style="width:90px">Remediación</th>
        </tr></thead><tbody>`;
      SEV_ORDER.forEach(sev => {
        bySev[sev].forEach(v => {
          const sl   = v.status==='done'?'Confirmado':v.status==='fail'?'Reproducido':'Pendiente';
          const rs   = v.remediation_status || 'open';
          const rl   = REM_LABEL[rs] || rs;
          const num  = vulnNumMap[v.id];
          md(`| ${num} | ${SEV_LABEL[sev]} | ${v.name} | ${v.category||'Custom'} | ${sl} | ${rl} |`);
          html += `<tr>
            <td class="num"><div class="rpt-cell" style="font-family:var(--mono);font-weight:700;color:var(--t2);white-space:nowrap">${num}</div></td>
            <td><div class="rpt-cell"><span class="sev-badge sev-${sev}">${SEV_LABEL[sev]}</span></div></td>
            <td style="font-weight:600;color:var(--t1);word-break:break-word"><div class="rpt-cell">${esc(v.name)}</div></td>
            <td style="font-family:var(--mono);font-size:11px"><div class="rpt-cell">${esc(v.category||'Custom')}</div></td>
            <td><div class="rpt-cell"><span class="rpt-vuln-status rpt-status-${v.status||'pending'}">${sl}</span></div></td>
            <td><div class="rpt-cell"><span class="rpt-vuln-status rpt-status-${rs}">${rl}</span></div></td>
          </tr>`;
        });
      });
      md('');
      html += `</tbody></table>${_ce}`;
      html += _subsHtml(sec, _secNum);
      continue;
    }

    // ── OWASP WSTG ───────────────────────────────────────────────
    if (sec.type === 'wstg' && scope !== 'vulns') {
      _secNum++;
      const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
      md('## Cobertura OWASP WSTG');
      md(`**Total:** ${wTested}/${wTotal} (${wPct}%) · **Aprobadas:** ${wDone} · **Hallazgos:** ${wFail}`); md('');
      html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}
        <p><strong>${wTested}/${wTotal}</strong> pruebas completadas &nbsp;·&nbsp;
          <strong style="color:var(--c-low)">${wDone} aprobadas</strong> &nbsp;·&nbsp;
          <strong style="color:var(--c-crit)">${wFail} hallazgos</strong></p>
        <table class="rpt-table"><thead><tr>
          <th>Categoría</th><th style="text-align:center">Realizadas</th>
          <th style="text-align:center">Total</th><th style="text-align:center">Hallazgos</th>
          <th style="min-width:100px">Progreso</th>
        </tr></thead><tbody>`;
      WSTG_DATA.forEach(cat => {
        const t = cat.tests.length;
        const d = cat.tests.filter(x=>state.wstgProgress[x.id]?.status==='done').length;
        const f = cat.tests.filter(x=>state.wstgProgress[x.id]?.status==='fail').length;
        if (!d&&!f) return;
        const pct = t?Math.round((d+f)/t*100):0;
        html += `<tr><td>${esc(cat.name)}</td><td class="num">${d+f}</td><td class="num">${t}</td>
          <td class="num ${f?'vuln-found':''}">${f||'—'}</td>
          <td><div class="rpt-progress-cell"><div class="rpt-mini-bar"><div class="rpt-mini-fill" style="width:${pct}%"></div></div>
            <span style="font-family:var(--mono);font-size:10px;color:var(--t3);min-width:30px">${pct}%</span></div></td></tr>`;
      });
      html += '</tbody></table>';
      const failedWSTG = [];
      WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
        if (state.wstgProgress[t.id]?.status==='fail') failedWSTG.push({ cat:cat.name, test:t, prog:state.wstgProgress[t.id] });
      }));
      if (failedWSTG.length && reportType === 'technical') {
        md(`### Hallazgos Encontrados (${failedWSTG.length})`);
        html += `<h3 style="margin-top:24px">Hallazgos Encontrados <span style="font-family:var(--mono);font-size:11px;font-weight:400;color:var(--c-crit);margin-left:6px">${failedWSTG.length}</span></h3>`;
        failedWSTG.forEach(({ cat, test, prog }) => {
          const edit = _localEdits[test.id] || {};
          const desc = edit.description || prog?.description || '';
          const rem  = edit.remediation || prog?.remediation || '';
          const targetHost = prog?.target_id ? (state.targets||[]).find(t=>t.id===prog.target_id)?.host : null;
          const linkedVuln = prog?.linked_vuln_id ? (state.customVulns||[]).find(v=>v.id===prog.linked_vuln_id) : null;
          md(`#### ${test.id} — ${test.name}`);
          md(`**Categoría:** ${cat}${targetHost ? `  ·  **Objetivo:** ${targetHost}` : ''}${linkedVuln ? `  ·  **Hallazgo:** ${linkedVuln.name}` : ''}`);
          if (showDesc && desc) { md('**Descripción**'); md(desc); }
          if (showRem  && rem)  { md('**Remediación**'); md(rem); }
          if (showNotes && prog?.note) { md('**Notas**'); md(prog.note); }
          md('');
          html += `<div class="rpt-wstg-vuln">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
              <span style="font-family:var(--mono);font-size:10px;font-weight:700;color:var(--c-crit);background:var(--c-crit)18;border:1px solid var(--c-crit)30;border-radius:3px;padding:2px 6px">${esc(test.id)}</span>
              <span style="font-weight:600;font-size:13px;color:var(--t1)">${esc(test.name)}</span>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:${desc||rem?'8px':'0'}">
              <span style="font-family:var(--mono);font-size:10px;color:var(--t3)">${esc(cat)}</span>
              ${targetHost ? `<span style="font-family:var(--mono);font-size:10px;color:var(--a)">${esc(targetHost)}</span>` : ''}
              ${linkedVuln ? `<span style="font-family:var(--mono);font-size:10px;color:var(--a);background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);border-radius:3px;padding:1px 6px">→ ${esc(linkedVuln.name)}</span>` : ''}
            </div>
            ${showDesc&&desc?`<div class="rpt-field-label" style="margin-top:4px">Descripción</div><div class="rpt-field-val">${renderMd(desc)}</div>`:''}
            ${showRem&&rem?`<div class="rpt-field-label">Remediación</div><div class="rpt-field-rem">${renderMd(rem)}</div>`:''}
            ${showNotes&&prog?.note?`<div style="margin-top:6px;font-size:11px;color:var(--t3);font-style:italic">${esc(prog.note)}</div>`:''}
          </div>`;
        });
      }
      html += `<hr class="rpt-divider">${_ce}`;
      html += _subsHtml(sec, _secNum);
      continue;
    }

    // ── Detailed Findings ─────────────────────────────────────────
    if (sec.type === 'detailed-findings' && scope !== 'wstg' && vulns.length && reportType === 'technical') {
      _secNum++;
      const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
      md('## Hallazgos Detallados');
      html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}`;
      // Build reverse map: vulnId → [testId, ...]
      const wstgForVuln = {};
      WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
        const lvid = state.wstgProgress[t.id]?.linked_vuln_id;
        if (lvid) { if (!wstgForVuln[lvid]) wstgForVuln[lvid] = []; wstgForVuln[lvid].push(t.id); }
      }));
      SEV_ORDER.forEach(sev => {
        if (!bySev[sev].length) return;
        html += `<div style="display:flex;align-items:center;gap:8px;margin:22px 0 10px;page-break-after:avoid;break-after:avoid">
          <span class="sev-badge sev-${sev}" style="font-size:11px;padding:3px 10px;width:auto;white-space:nowrap">${SEV_LABEL[sev]}</span>
          <span style="font-family:var(--mono);font-size:11px;color:var(--t3)">${bySev[sev].length} hallazgo${bySev[sev].length>1?'s':''}</span>
          <div style="flex:1;height:1px;background:var(--b1);margin-left:4px"></div>
        </div>`;
        bySev[sev].forEach(v => {
          const edit    = _localEdits[v.id] || {};
          const isRich  = !!edit._richHtml;
          const desc    = edit.description || v.description || '';
          const rem     = edit.remediation || v.remediation || '';
          const evid    = edit.evidence    || v.evidence    || [];
          const notesVal= (edit.notes != null ? edit.notes : v.notes) || '';
          const sl      = v.status==='done'?'Confirmado':v.status==='fail'?'Reproducido':'Pendiente';
          const wstgLinks = wstgForVuln[v.id] || [];
          const num = vulnNumMap[v.id];
          md(`### ${num} — ${v.name}`);
          md(`**Severidad:** ${SEV_LABEL[sev]}`);
          if (v.category)    md(`**Categoría:** ${v.category}`);
          if (v.cwe)         md(`**CWE:** ${v.cwe}`);
          if (v.target_host) md(`**Objetivo:** ${v.target_host}`);
          if (v.cvss_score != null) md(`**CVSS:** ${(+v.cvss_score).toFixed(1)}`);
          if ((v.compliance_tags||[]).length) md(`**PCI-DSS:** ${v.compliance_tags.map(t=>t.control_id).join(', ')}`);
          md(`**Estado:** ${sl}`);
          if (wstgLinks.length) md(`**WSTG:** ${wstgLinks.join(', ')}`);
          if (showDesc && desc) { md(''); md('**Descripción**'); md(isRich && edit.description ? edit.description.replace(/<[^>]+>/g,' ') : desc); }
          if (showPay  && (v.payloads||[]).length) { md(''); md('**Payloads**'); v.payloads.forEach(p => md('```\n' + p + '\n```')); }
          if (showNotes && notesVal) { md(''); md('**Notas**'); md(notesVal); }
          if (showRem  && rem)  { md(''); md('**Remediación**'); md(isRich && edit.remediation ? edit.remediation.replace(/<[^>]+>/g,' ') : rem); }
          md('');
          const _cvssColor = {critical:'#dc2626',high:'#f97316',medium:'#f59e0b',low:'#059669',info:'#64748b'}[sev]||'#64748b';
          const _meta = [
            v.cvss_score != null ? `<span style="font-family:var(--mono);font-size:10px;font-weight:700;color:${_cvssColor}">CVSS ${(+v.cvss_score).toFixed(1)}</span>` : '',
            v.cwe        ? `<span style="font-family:var(--mono);font-size:10px;color:var(--t3)">${esc(v.cwe)}</span>` : '',
            (v.compliance_tags||[]).length ? `<span style="font-family:var(--mono);font-size:10px;color:var(--a)">PCI-DSS: ${v.compliance_tags.map(t=>esc(t.control_id)).join(', ')}</span>` : '',
            v.category   ? `<span style="font-family:var(--mono);font-size:10px;color:var(--t3)">${esc(v.category)}</span>` : '',
            v.target_host? `<span style="font-family:var(--mono);font-size:10px;color:var(--a)">${esc(v.target_host)}</span>` : '',
            wstgLinks.length ? `<span style="font-family:var(--mono);font-size:10px;color:var(--a)">WSTG: ${wstgLinks.join(', ')}</span>` : '',
          ].filter(Boolean).join(`<span style="color:var(--b2);margin:0 4px">·</span>`);
          html += `<div class="rpt-vuln rpt-vuln-${sev}">
            <div class="rpt-vuln-header" style="flex-direction:column;align-items:stretch;gap:5px">
              <div style="display:flex;align-items:center;gap:8px">
                <span class="sev-badge sev-${sev}" style="flex-shrink:0">${SEV_LABEL[sev]}</span>
                <span style="font-family:var(--mono);font-size:11px;font-weight:800;color:var(--t3);flex-shrink:0">${num}</span>
                <div class="rpt-vuln-name">${esc(v.name)}</div>
              </div>
              ${_meta ? `<div style="padding-left:2px;display:flex;align-items:center;flex-wrap:wrap;gap:2px">${_meta}</div>` : ''}
            </div><div>`;
          if (showDesc && desc) html += `<div class="rpt-field"><div class="rpt-field-label">Descripción</div><div class="rpt-field-val">${isRich && edit.description ? edit.description : renderMd(desc)}</div></div>`;
          if (showPay  && (v.payloads||[]).length) html += `<div class="rpt-field"><div class="rpt-field-label">Payloads</div>${v.payloads.map(p=>`<div class="rpt-code" style="margin-bottom:4px">${esc(p)}</div>`).join('')}</div>`;
          if ((v.items||[]).length) html += `<div class="rpt-field"><div class="rpt-field-label">Lista de verificación</div><div>${v.items.map((item,i)=>`<div style="font-size:12px;color:var(--t2);padding:2px 0">${v.checked_items?.[i]?'[x]':'[ ]'} ${esc(item)}</div>`).join('')}</div></div>`;
          if ((v.compliance_tags||[]).length) html += `<div class="rpt-field"><div class="rpt-field-label">Cobertura PCI-DSS</div><div>${v.compliance_tags.map(t=>`<div style="font-size:12px;color:var(--t2);padding:2px 0"><span style="font-family:var(--mono);font-weight:700;color:var(--a)">${esc(t.control_id)}</span> — ${esc(t.title)}</div>`).join('')}</div></div>`;
          if (showNotes && notesVal) html += `<div class="rpt-field"><div class="rpt-field-label">Notas</div><div class="rpt-field-val">${esc(notesVal)}</div></div>`;
          if (showRem && rem) html += `<div class="rpt-field"><div class="rpt-field-label">Remediación</div><div class="rpt-field-rem">${isRich && edit.remediation ? edit.remediation : renderMd(rem)}</div></div>`;
          if (showEvid && evid.length) {
            html += `<div class="rpt-field"><div class="rpt-field-label">Evidencia</div><div class="rpt-evidence-grid">`;
            evid.forEach(img => { html += `<div style="break-inside:avoid;page-break-inside:avoid"><img src="${img.data}" class="rpt-evidence-img"></div>`; });
            html += '</div></div>';
          }
          const httpProofs = (Array.isArray(v.http_proofs) ? v.http_proofs : []).filter(p => p.include !== false);
          if (httpProofs.length) {
            html += `<div class="rpt-field"><div class="rpt-field-label">HTTP Proofs (${httpProofs.length})</div>`;
            httpProofs.forEach((proof, idx) => {
              const label = proof.method ? `${esc(proof.method)} — Proof #${idx+1}` : `Proof #${idx+1}`;
              html += `<div style="margin-bottom:10px;page-break-inside:avoid;break-inside:avoid">
                <div style="font-family:var(--mono);font-size:10px;font-weight:700;color:var(--t3);margin-bottom:4px">${label}</div>`;
              const _numCode = t => { const ls=t.split('\n'),p=String(ls.length).length; return ls.map((l,i)=>`<span style="display:block;white-space:pre-wrap;word-break:break-all"><span style="display:inline-block;min-width:${p+1}ch;padding-right:8px;margin-right:8px;border-right:1px solid #ddd;color:#999;user-select:none;text-align:right">${i+1}</span>${esc(l)}</span>`).join(''); };
              if (proof.request?.trim()) html += `<div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">Request</div><pre class="rpt-code" style="font-size:10px;line-height:1.6;padding:8px 0;white-space:normal">${_numCode(proof.request)}</pre>`;
              if (proof.response?.trim()) html += `<div style="font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin:6px 0 3px">Response</div><pre class="rpt-code" style="font-size:10px;line-height:1.6;padding:8px 0;white-space:normal">${_numCode(proof.response)}</pre>`;
              if (proof.annotation?.trim()) html += `<div style="margin-top:8px;padding:6px 10px;background:rgba(124,58,237,.06);border-left:2px solid var(--a);border-radius:0 4px 4px 0;font-size:11px;line-height:1.6">${renderMd(proof.annotation)}</div>`;
              html += `</div>`;
            });
            html += '</div>';
          }
          html += '</div></div>';
        });
      });
      html += _ce;
      html += _subsHtml(sec, _secNum);
      continue;
    }

    // ── Matriz de Riesgo ──────────────────────────────────────────
    if (sec.type === 'risk-matrix' && scope !== 'wstg' && vulns.length) {
      _secNum++;
      const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
      md('## Matriz de Riesgo');

      // Build cell map: [impact][prob] = [numId, ...] — exclude info severity
      const matrixVulns = vulns.filter(v => (v.severity||'medium') !== 'info');
      const cellVulns  = {};
      const riskCounts = { bajo:0, medio:0, alto:0, critico:0 };
      matrixVulns.forEach(v => {
        const impact = IMPACT_MAP[v.severity||'medium'];
        const prob   = getEdit(v.id).probability ?? 3;
        const risk   = RISK_CELL[impact-1][prob-1];
        const key    = `${impact}_${prob}`;
        if (!cellVulns[key]) cellVulns[key] = [];
        cellVulns[key].push(vulnNumMap[v.id]);
        riskCounts[risk]++;
      });

      const totalV = matrixVulns.length;
      md(`Se identificaron ${totalV} hallazgo${totalV!==1?'s':''} representados en la matriz según probabilidad e impacto.`);
      md('');

      _tocPush(sec, `rpt-sec-${sec.id}`);
      html += `<h2 id="rpt-sec-${sec.id}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}`;
      html += `<p style="font-size:12px;color:var(--t2);margin:0 0 20px">Se identificaron <strong>${totalV}</strong> hallazgo${totalV!==1?'s':''} representados en la matriz según probabilidad e impacto.</p>`;

      // Matrix table
      const LB = '1px solid var(--b1)'; // light border
      html += `<div style="display:flex;align-items:stretch;gap:0;margin-bottom:24px;max-width:600px">`;
      // Vertical "Impacto" label
      html += `<div style="display:flex;align-items:center;justify-content:center;width:24px;flex-shrink:0;background:var(--bg2);border:${LB};border-right:none">
        <span style="writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;font-weight:700;color:var(--t1);letter-spacing:.1em">IMPACTO</span></div>`;
      html += `<table style="border-collapse:collapse;flex:1">`;

      // Rows: Crítico(4), Alto(3), Medio(2), Bajo(1)
      [4,3,2,1].forEach(impact => {
        const impactName = IMPACT_NAMES[impact];
        const rowVulns   = matrixVulns.filter(v => IMPACT_MAP[v.severity||'medium'] === impact);
        html += `<tr style="height:52px">`;
        // Impact label cell
        html += `<td style="border:${LB};padding:4px 10px;font-size:11px;font-weight:700;color:var(--t1);white-space:nowrap;width:64px;text-align:center;background:var(--bg2);vertical-align:middle">${impactName}</td>`;
        // Count cell
        html += `<td style="border:${LB};padding:4px 8px;font-family:monospace;font-size:13px;font-weight:700;color:var(--t2);text-align:center;width:28px;background:var(--bg3);vertical-align:middle">${rowVulns.length||''}</td>`;
        // 5 probability cells — ALL colored, text only when vulns present
        for (let prob = 1; prob <= 5; prob++) {
          const risk  = RISK_CELL[impact-1][prob-1];
          const color = RISK_COLORS[risk];
          const ids   = (cellVulns[`${impact}_${prob}`] || []).join(' ');
          html += `<td style="border:2px solid var(--bg);background:${color};padding:4px;text-align:center;vertical-align:middle;width:72px;font-family:monospace;font-size:11px;font-weight:800;color:#fff;line-height:1.4">
            ${ids||'&nbsp;'}
          </td>`;
        }
        // Right risk label
        const rowRisk = RISK_CELL[impact-1][4];
        html += `<td style="border:${LB};background:${RISK_COLORS[rowRisk]};padding:4px 10px;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;text-align:center;vertical-align:middle;width:76px;line-height:1.5">Riesgo<br>${RISK_LABELS[rowRisk]}</td>`;
        html += `</tr>`;
      });

      // Probability number row
      html += `<tr><td colspan="2" style="border:none;background:var(--bg)"></td>`;
      for (let i=1;i<=5;i++) html += `<td style="border:${LB};padding:4px 6px;text-align:center;font-family:monospace;font-size:11px;font-weight:700;color:var(--t1);background:var(--bg2)">${i}</td>`;
      html += `<td style="border:none"></td></tr>`;
      // Probability label row
      html += `<tr><td colspan="2" style="border:none;background:var(--bg)"></td>`;
      PROB_LABELS.forEach(l => html += `<td style="border:${LB};padding:4px 6px;text-align:center;font-size:10px;color:var(--t2);background:var(--bg3)">${l}</td>`);
      html += `<td style="border:none"></td></tr>`;
      // "Probabilidad" header row
      html += `<tr><td colspan="2" style="border:none;background:var(--bg)"></td>`;
      html += `<td colspan="5" style="border:${LB};padding:5px;text-align:center;font-size:11px;font-weight:700;color:var(--t1);background:var(--bg2);letter-spacing:.06em">PROBABILIDAD</td>`;
      html += `<td style="border:none"></td></tr>`;
      html += `</table></div>`;

      // Summary table
      html += `<table style="border-collapse:collapse;font-size:12px;margin-top:8px">
        <thead>
          <tr><th colspan="4" style="border:${LB};padding:7px 12px;text-align:left;background:var(--bg2);color:var(--t1);font-weight:700;font-size:12px">Hallazgos por Valoración de Riesgo</th></tr>
          <tr>${['bajo','medio','alto','critico'].map(r=>`<th style="border:${LB};padding:6px 20px;background:${RISK_COLORS[r]};color:#fff;font-weight:700;text-align:center">${RISK_LABELS[r]}</th>`).join('')}</tr>
        </thead>
        <tbody>
          <tr>${['bajo','medio','alto','critico'].map(r=>`<td style="border:${LB};padding:10px 20px;background:${RISK_COLORS[r]};font-family:monospace;font-size:16px;font-weight:800;text-align:center;color:#fff">${riskCounts[r]||0}</td>`).join('')}</tr>
        </tbody></table>`;

      md('| Riesgo | Hallazgos |'); md('|--------|-----------|');
      ['bajo','medio','alto','critico'].forEach(r => { if(riskCounts[r]) md(`| ${RISK_LABELS[r]} | ${riskCounts[r]} |`); });
      md('');
      html += _ce;
      html += _subsHtml(sec, _secNum);
      continue;
    }

    // ── Remediation Roadmap ──────────────────────────────────────
    if (sec.type === 'remediation-roadmap' && scope !== 'wstg' && vulns.length) {
      _secNum++;
      const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
      md('## Hoja de Ruta de Remediación');
      html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}`;

      const buckets = {};
      PRIORITY_ORDER.forEach(p => buckets[p] = []);
      vulns.forEach(v => {
        const p = getEdit(v.id).remediationPriority || defaultPriority(v.severity||'medium');
        buckets[p].push(v);
      });

      PRIORITY_ORDER.forEach(p => {
        const list = buckets[p];
        if (!list.length) return;
        md(`### ${PRIORITY_LABEL[p]}`); md('| ID | Severidad | Hallazgo | Acción Recomendada |'); md('|----|-----------|----------|---------------------|');
        html += `<div style="margin-bottom:16px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="width:9px;height:9px;border-radius:50%;background:${PRIORITY_COLOR[p]};flex-shrink:0"></span>
            <span style="font-weight:700;font-size:13px">${PRIORITY_LABEL[p]}</span>
            <span style="font-family:var(--mono);font-size:10px;color:var(--t3)">${list.length} hallazgo${list.length>1?'s':''}</span>
          </div>
          <table class="rpt-table"><thead><tr>
            <th style="width:52px">ID</th><th style="width:90px">Severidad</th><th>Hallazgo</th><th>Acción Recomendada</th>
          </tr></thead><tbody>`;
        list.forEach(v => {
          const sev    = v.severity || 'medium';
          const edit   = getEdit(v.id);
          const action = edit.execAction || 'Acción recomendada pendiente de generar.';
          const num    = vulnNumMap[v.id];
          md(`| ${num} | ${SEV_LABEL[sev]} | ${v.name} | ${action} |`);
          html += `<tr>
            <td class="num"><div class="rpt-cell" style="font-family:var(--mono);font-weight:700;color:var(--t2);white-space:nowrap">${num}</div></td>
            <td><div class="rpt-cell"><span class="sev-badge sev-${sev}">${SEV_LABEL[sev]}</span></div></td>
            <td style="font-weight:600;color:var(--t1)"><div class="rpt-cell">${esc(v.name)}</div></td>
            <td style="font-size:12px;color:var(--t2)"><div class="rpt-cell">${esc(action)}</div></td>
          </tr>`;
        });
        html += '</tbody></table></div>';
        md('');
      });

      html += _ce;
      html += _subsHtml(sec, _secNum);
      continue;
    }

    // ── Targets ───────────────────────────────────────────────────
    if (sec.type === 'targets' && state.targets?.length) {
      _secNum++;
      const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
      md('## Alcance — Objetivos'); md('| Host | Tipo | Estado | Notas |'); md('|------|------|--------|-------|');
      state.targets.forEach(t => {
        md(`| ${t.host} | ${t.type||'—'} | ${t.status||'pending'} | ${t.notes||''} |`);
        const td = _targetFull[t.id] || {};
        if (td.ports?.length) md(`**Puertos abiertos:** ${td.ports.map(p => `${p.port}/${p.protocol||'tcp'} (${p.service||'?'})`).join(', ')}`);
      });
      md('');
      html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}`;
      if (reportType === 'executive') {
        html += `<table class="rpt-table"><thead><tr><th>Host</th><th>Tipo</th><th>Estado</th><th>Notas</th></tr></thead><tbody>`;
        state.targets.forEach(t => {
          html += `<tr>
            <td style="font-family:var(--mono);font-weight:600"><div class="rpt-cell">${esc(t.host)}</div></td>
            <td style="font-family:var(--mono);font-size:11px;color:var(--t3)"><div class="rpt-cell">${esc(t.type||'—')}</div></td>
            <td><div class="rpt-cell"><span class="rpt-vuln-status rpt-status-${t.status||'pending'}">${esc(t.status||'pending')}</span></div></td>
            <td style="font-size:12px;color:var(--t3);white-space:pre-wrap"><div class="rpt-cell">${esc(t.notes||'')}</div></td>
          </tr>`;
        });
        html += '</tbody></table>';
      } else {
        state.targets.forEach(t => {
          const td = _targetFull[t.id] || {};
          const ports = td.ports || [], endpoints = td.endpoints || [];
          html += `<div class="rpt-vuln" style="margin-bottom:12px">
            <div class="rpt-vuln-header">
              <span style="font-family:var(--mono);font-size:12px;font-weight:700">${esc(t.host)}</span>
              ${t.type ? `<span style="font-family:var(--mono);font-size:10px;color:var(--t3)">${esc(t.type)}</span>` : ''}
              <span style="margin-left:auto"><span class="rpt-vuln-status rpt-status-${t.status||'pending'}">${esc(t.status||'pending')}</span></span>
            </div>`;
          if (t.notes) html += `<div class="rpt-field"><div class="rpt-field-label">Notas</div><div class="rpt-field-val" style="white-space:pre-wrap">${esc(t.notes)}</div></div>`;
          if (ports.length) {
            html += `<div class="rpt-field"><div class="rpt-field-label">Puertos abiertos (${ports.length})</div>
              <table class="rpt-table" style="margin:6px 0"><thead><tr><th>Puerto</th><th>Protocolo</th><th>Estado</th><th>Servicio</th><th>Versión</th></tr></thead><tbody>`;
            ports.forEach(port => {
              html += `<tr>
                <td class="num" style="font-weight:700">${port.port}</td>
                <td style="font-family:var(--mono);font-size:11px">${esc(port.protocol||'tcp')}</td>
                <td style="font-family:var(--mono);font-size:11px">${esc(port.state||'open')}</td>
                <td>${esc(port.service||'—')}</td>
                <td style="font-family:var(--mono);font-size:10px;color:var(--t3)">${esc(port.version||'')}</td>
              </tr>`;
            });
            html += '</tbody></table></div>';
          }
          if (endpoints.length) {
            html += `<div class="rpt-field"><div class="rpt-field-label">Endpoints (${endpoints.length})</div>
              <table class="rpt-table" style="margin:6px 0"><thead><tr><th>Método</th><th>Ruta</th><th>Estado</th><th>Notas</th></tr></thead><tbody>`;
            endpoints.forEach(ep => {
              html += `<tr>
                <td style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--a)">${esc(ep.method||'GET')}</td>
                <td style="font-family:var(--mono);font-size:11px">${esc(ep.path||'')}</td>
                <td style="font-family:var(--mono);font-size:10px;color:var(--t3)">${esc(ep.status_code||'')}</td>
                <td style="font-size:11px;color:var(--t3);white-space:pre-wrap">${esc(ep.notes||'')}</td>
              </tr>`;
            });
            html += '</tbody></table></div>';
          }
          html += '</div>';
        });
      }
      html += _ce;
      html += _subsHtml(sec, _secNum);
      continue;
    }

    // ── Risk Classification ───────────────────────────────────────
    if (sec.type === 'risk-table') {
      _secNum++;
      const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
      md('## Clasificación de Riesgo'); md('| Nivel | Puntuación CVSS | Descripción |'); md('|-------|----------------|-------------|');
      md('| Critical | 9.0 – 10.0 | Riesgo inmediato de explotación... |'); md('| High | 7.0 – 8.9 | Vulnerabilidad significativa... |');
      md('| Medium | 4.0 – 6.9 | Riesgo moderado... |'); md('| Low | 0.1 – 3.9 | Impacto limitado... |');
      md('| Info | N/A | Hallazgo informativo... |'); md('');
      html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}
        <table class="rpt-risk-class">
          <thead><tr><th>Nivel</th><th>Puntuación CVSS</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><div class="rpt-cell"><span class="sev-badge sev-critical">Critical</span></div></td><td style="font-family:var(--mono)"><div class="rpt-cell">9.0 – 10.0</div></td><td><div class="rpt-cell">Riesgo inmediato de explotación con potencial de compromiso total del sistema o fuga significativa de datos. Requiere remediación urgente.</div></td></tr>
            <tr><td><div class="rpt-cell"><span class="sev-badge sev-high">High</span></div></td><td style="font-family:var(--mono)"><div class="rpt-cell">7.0 – 8.9</div></td><td><div class="rpt-cell">Vulnerabilidad significativa que podría permitir acceso no autorizado o interrupción grave del servicio. Debe tratarse de forma prioritaria.</div></td></tr>
            <tr><td><div class="rpt-cell"><span class="sev-badge sev-medium">Medium</span></div></td><td style="font-family:var(--mono)"><div class="rpt-cell">4.0 – 6.9</div></td><td><div class="rpt-cell">Riesgo moderado que puede ser explotado bajo ciertas condiciones. Se recomienda remediación a corto plazo.</div></td></tr>
            <tr><td><div class="rpt-cell"><span class="sev-badge sev-low">Low</span></div></td><td style="font-family:var(--mono)"><div class="rpt-cell">0.1 – 3.9</div></td><td><div class="rpt-cell">Problemas de impacto limitado. Deben abordarse dentro del mantenimiento rutinario de seguridad.</div></td></tr>
            <tr><td><div class="rpt-cell"><span class="sev-badge sev-info">Info</span></div></td><td style="font-family:var(--mono)"><div class="rpt-cell">N/A</div></td><td><div class="rpt-cell">Hallazgos informativos sin impacto directo en seguridad. Útiles para el endurecimiento y alineación con buenas prácticas.</div></td></tr>
          </tbody>
        </table>${_ce}`;
      html += _subsHtml(sec, _secNum);
      continue;
    }
  }

  // ── Methodology Progress (always appended; technical detail gated) ─
  if (scope !== 'wstg') {
    const activeMethods = Object.entries(state.activeMethodProgress || {});
    if (activeMethods.length) {
      html += `<h2>Progreso de Metodología</h2>`;
      activeMethods.forEach(([, meth]) => {
        const tests = meth.tests || [];
        html += `<div style="border:1px solid var(--b1);border-radius:8px;margin-bottom:12px;overflow:hidden">
          <div style="display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg2)">
            <div style="font-weight:600;font-size:13px;flex:1">${esc(meth.name)}</div>
            <div style="font-family:var(--mono);font-size:11px;color:var(--c-low)">${meth.done} completados</div>
            ${meth.fail ? `<div style="font-family:var(--mono);font-size:11px;color:var(--c-crit)">${meth.fail} fallidos</div>` : ''}
            <div style="font-family:var(--mono);font-size:11px;color:var(--t3)">${meth.total} total</div>
          </div>
          <div style="padding:10px 14px">
            <div style="display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--b1);gap:2px;margin-bottom:8px">
              ${meth.done ? `<div style="width:${Math.round(meth.done/meth.total*100)}%;background:var(--c-low);border-radius:2px"></div>` : ''}
              ${meth.fail ? `<div style="width:${Math.round(meth.fail/meth.total*100)}%;background:var(--c-crit);border-radius:2px"></div>` : ''}
            </div>
            ${reportType === 'technical' && tests.filter(t => t.status === 'fail').length ? `
              <div style="font-family:var(--mono);font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Verificaciones fallidas (${tests.filter(t=>t.status==='fail').length})</div>
              <div style="display:flex;flex-wrap:wrap;gap:4px">
                ${tests.map((t,i) => t.status==='fail' ? `<span style="font-family:var(--mono);font-size:10px;background:var(--c-crit)18;border:1px solid var(--c-crit)30;color:var(--c-crit);border-radius:3px;padding:2px 6px">#${i+1}</span>` : '').filter(Boolean).join('')}
              </div>` : ''}
          </div>
        </div>`;
      });
    }
  }

  document.getElementById('report-preview').innerHTML = html;
  document.getElementById('export-project-name').textContent = p.name;
  buildPageLayout();
  document.getElementById('report-preview').dataset.rendered = 'true';
}

// Print layout helpers — flag prevents double-execution when both manual call and beforeprint fire
const _printSaved = [];
let _printActive = false;

function _prepareForPrint() {
  if (_printActive) return;
  _printActive = true;
  _printSaved.length = 0;
  ['.sidenav','#sidenav','.topbar','#topbar','.exp-editor','.export-controls','.no-print','.toast-container','#loading-overlay']
    .forEach(sel => document.querySelectorAll(sel).forEach(el => {
      _printSaved.push([el, el.getAttribute('style') || '']);
      el.style.setProperty('display', 'none', 'important');
    }));
  _printSaved.push([document.body, document.body.getAttribute('style') || '']);
  ['display','margin','padding','overflow'].forEach(p =>
    document.body.style.setProperty(p, p==='display'?'block':p==='overflow'?'visible':'0', 'important'));
  ['.app-main','.exp-outer','.exp-inner','.exp-layout'].forEach(sel => {
    const el = document.querySelector(sel); if (!el) return;
    _printSaved.push([el, el.getAttribute('style') || '']);
    ['display','margin','padding','overflow','height'].forEach(p =>
      el.style.setProperty(p, p==='display'?'block':p==='overflow'?'visible':p==='height'?'auto':'0', 'important'));
    el.style.setProperty('width', '100%', 'important');
  });
  const prev = document.querySelector('.exp-preview');
  if (prev) {
    _printSaved.push([prev, prev.getAttribute('style') || '']);
    ['display','padding','overflow','height'].forEach(p =>
      prev.style.setProperty(p, p==='display'?'block':p==='overflow'?'visible':p==='height'?'auto':'0', 'important'));
    prev.style.setProperty('width', '100%', 'important');
  }
}

function _restoreAfterPrint() {
  if (!_printActive) return;
  _printActive = false;
  _printSaved.forEach(([el, style]) => el.setAttribute('style', style));
  _printSaved.length = 0;
}

// Ctrl+P fallback
window.addEventListener('beforeprint', _prepareForPrint);
window.addEventListener('afterprint', _restoreAfterPrint);

async function exportPdf() {
  const m = getReportData().meta;
  const password = m.pdfPassword?.trim();

  const btn = document.querySelector('[onclick="exportPdf()"]');
  const origText = btn.textContent;
  btn.textContent = 'Generating…';
  btn.disabled = true;

  try {
    const token      = localStorage.getItem('fd_access');
    const filename   = m.coverTitle || state.currentProject?.name || 'report';
    const pid        = state.currentProject?.id;
    const rptKey     = `fd_rpt_${pid}`;
    const rptData    = localStorage.getItem(rptKey);
    const pageUrl    = window.location.href;
    const scope      = document.getElementById('export-scope')?.value || 'all';
    const reportType = document.getElementById('report-type')?.value || 'technical';

    const res = await fetch(`${window.FLOWDIT_API || '/api'}/export/pdf`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
      body: JSON.stringify({ pageUrl, token, rptKey, rptData, password, filename, scope, reportType }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast(err.error || 'PDF generation failed', 'error');
      return;
    }

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url;
    a.download = `${filename}.pdf`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('PDF downloaded', 'success');
  } catch (e) {
    showToast('PDF generation failed: ' + e.message, 'error');
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
}

async function exportDocx() {
  const btn = document.querySelector('[onclick="exportDocx()"]');
  const origText = btn.textContent;
  btn.textContent = 'Generating…';
  btn.disabled = true;
  try {
    const token    = localStorage.getItem('fd_access');
    const pid      = state.currentProject?.id;
    if (!pid) { showToast('No project loaded', 'error'); return; }
    const rptKey   = `fd_rpt_${pid}`;
    const rptData  = localStorage.getItem(rptKey);
    const meta     = getReportData().meta;
    const filename = meta.coverTitle || state.currentProject?.name || 'report';

    const type = document.getElementById('report-type')?.value || 'technical';
    const res = await fetch(`${window.FLOWDIT_API || '/api'}/export/docx`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) },
      body: JSON.stringify({ projectId: pid, type, rptData, filename }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showToast(err.error || 'DOCX generation failed', 'error');
      return;
    }
    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = `${filename}.docx`; a.click();
    URL.revokeObjectURL(url);
    showToast('DOCX downloaded', 'success');
  } catch (e) {
    showToast('DOCX generation failed: ' + e.message, 'error');
  } finally {
    btn.textContent = origText;
    btn.disabled = false;
  }
}

function copyMarkdown() {
  const text = _freeEditMd ?? (_mdLines.join('\n') || (buildReport(), _mdLines.join('\n')));
  if (!text) return;
  navigator.clipboard.writeText(text).then(() => showToast('Markdown copied!', 'success'));
}

async function pageInit() {
  await loadAllTargetDetails();
  const d = getReportData();
  applyReportFont(d.meta?.font);
  applyBaseFontSize(d.meta?.baseFontSize);
  applyReportAccent(d.meta?.accentColor);
  applyWatermark(d.meta);
  if (d.freeEditMd) _freeEditMd = d.freeEditMd; // restore persisted free edit
  try { buildEditor(); } catch(e) { console.warn('[export] buildEditor error:', e); }
  try { buildPageLayout(); } catch(e) {}
  try { buildReport(); } catch(e) { console.warn('[export] buildReport error:', e); }
  setTimeout(() => { try { buildReport(); } catch(e) {} }, 0);
}
