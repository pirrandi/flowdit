// ── "Incluir en cada hallazgo" (persisted in meta.findingInclude) ─
const FINDING_INCLUDE_DEFAULTS = { desc: true, rem: true, pay: true, notes: false, evid: true, retest: true };
const FINDING_INCLUDE_LABELS = [['desc', 'Descripción'], ['rem', 'Remediación'], ['pay', 'Payloads'], ['notes', 'Notas'], ['evid', 'Evidencia'], ['retest', 'Retest']];

function findingIncludeOf(meta) {
  const fi = meta?.findingInclude || {};
  const out = {};
  for (const k in FINDING_INCLUDE_DEFAULTS) out[k] = typeof fi[k] === 'boolean' ? fi[k] : FINDING_INCLUDE_DEFAULTS[k];
  return out;
}

function setFindingInclude(key, val) {
  if (!(key in FINDING_INCLUDE_DEFAULTS)) return;
  const d = getReportData();
  d.meta.findingInclude = { ...findingIncludeOf(d.meta), [key]: !!val };
  saveReportData(d);
}

// ── Section state: the SAME gating buildReport applies ────────────
// Which types force a section in, which scope leaves it out, which types
// render it at all and what data it needs. buildReport's TOC uses this too.
const FORCE_BY_TYPE = {
  executive: new Set(['risk-matrix', 'remediation-roadmap']),
  retest:    new Set(['retest-summary', 'retest-findings']),
};
const SCOPE_EXCLUDES = {
  wstg:  new Set(['exec-summary', 'retest-summary', 'findings-index', 'detailed-findings', 'retest-findings', 'risk-matrix', 'remediation-roadmap']),
  vulns: new Set(['wstg']),
};
const TYPE_ALLOWS = {
  'exec-summary':      t => t !== 'retest',
  'retest-summary':    t => t === 'retest',
  'detailed-findings': t => t === 'technical',
  'retest-findings':   t => t === 'retest',
};
const NEEDS_FINDINGS = new Set(['findings-index', 'detailed-findings', 'retest-findings', 'risk-matrix', 'remediation-roadmap']);
const RENDERED_TYPES = new Set(['custom', 'exec-summary', 'retest-summary', 'findings-index', 'wstg', 'detailed-findings', 'retest-findings', 'risk-matrix', 'remediation-roadmap', 'targets', 'risk-table']);

// st: 'on' | 'preset' (forced in by the type) | 'hidden' | 'excluded' (by the
// type) | 'scope' (out of the scope) | 'empty' (nothing to show)
function sectionState(sec, scope, type, nVulns, nTargets) {
  const forced   = !!FORCE_BY_TYPE[type]?.has(sec.type);
  const shown    = !!sec.visible || forced;
  const scopeOff = !!SCOPE_EXCLUDES[scope]?.has(sec.type);
  const typeOff  = TYPE_ALLOWS[sec.type] ? !TYPE_ALLOWS[sec.type](type) : false;
  let hasData = RENDERED_TYPES.has(sec.type);
  if (NEEDS_FINDINGS.has(sec.type)) hasData = nVulns > 0;
  else if (sec.type === 'targets') hasData = nTargets > 0;
  else if (sec.type === 'custom') hasData = !!sec.content || (sec.children || []).some(c => c.visible !== false);
  const included = shown && !scopeOff && !typeOff && hasData;
  const st = scopeOff ? 'scope'
    : forced ? (hasData ? 'preset' : 'empty')
    : !sec.visible ? 'hidden'
    : typeOff ? 'excluded'
    : !hasData ? 'empty' : 'on';
  return { st, included, forced };
}

function _stateInfo(st, sec) {
  const emptyHelp = !sec ? 'No aparece en el PDF'
    : sec.type === 'custom' ? 'Sin texto ni subsecciones visibles: no aparece en el PDF'
    : sec.type === 'targets' ? 'No hay objetivos cargados en el proyecto'
    : NEEDS_FINDINGS.has(sec.type) ? 'No hay hallazgos en el proyecto'
    : 'Este tipo de sección no se muestra';
  return ({
    on:       { label: 'INCLUIDA',          help: 'Aparece en el PDF',                    cls: 'is-on' },
    preset:   { label: 'INCLUIDA POR TIPO', help: 'El tipo de informe la agrega',         cls: 'is-preset' },
    hidden:   { label: 'OCULTA',            help: 'No aparece en el PDF',                 cls: '' },
    excluded: { label: 'EXCLUIDA POR TIPO', help: 'Este tipo de informe no la incluye',   cls: '' },
    scope:    { label: 'FUERA DEL ALCANCE', help: 'El alcance elegido no la incluye',     cls: '' },
    empty:    { label: 'SIN CONTENIDO',     help: emptyHelp,                              cls: '' },
  })[st] || { label: '', help: '', cls: '' };
}

const SEV_PREFIX_MAP = { critical: 'C', high: 'A', medium: 'M', low: 'B', info: 'I' };
const SEV_DOT = { critical: '#ef4444', high: '#f97316', medium: '#eab308', low: '#059669', info: '#6b7280' };

// Findings in report order with their report code (C1, A1, M1…), as buildReport numbers them.
function _sortedFindings() {
  const vulns = state.customVulns || [];
  const out = [];
  SEV_ORDER.forEach(sev => vulns.filter(v => (v.severity || 'medium') === sev)
    .forEach((v, i) => out.push({ v, sev, code: `${SEV_PREFIX_MAP[sev]}${i + 1}` })));
  return out;
}

// ── Outline model ─────────────────────────────────────────────────
function _outlineModel() {
  const d = getReportData();
  const m = d.meta;
  const scope = _curScope(), type = _curType();
  const nV = (state.customVulns || []).length, nT = (state.targets || []).length;
  const states = {};
  d.sections.forEach(sec => { states[sec.id] = sectionState(sec, scope, type, nV, nT); });
  const nIncluded = d.sections.filter(s => states[s.id].included).length;
  const nodes = [];
  nodes.push({ id: 'cover', depth: 0, kind: 'cover', label: 'Portada', included: true, st: 'on' });
  nodes.push({ id: 'toc', depth: 0, kind: 'toc', label: 'Índice', included: !!m.showToc && nIncluded > 0,
    st: !m.showToc ? 'hidden' : nIncluded ? 'on' : 'empty', eye: true, eyeOn: !!m.showToc });
  // Findings hang from the section that shows their cards.
  const findingsParent = d.sections.find(s => s.type === 'retest-findings' && states[s.id].included)
    || d.sections.find(s => s.type === 'detailed-findings');
  let n = 0;
  d.sections.forEach((sec, idx) => {
    const st = states[sec.id];
    const num = st.included ? String(++n) : '';
    const secNode = `sec:${sec.id}`;
    nodes.push({ id: secNode, depth: 0, kind: sec.type === 'custom' ? 'custom' : 'generated', sec, idx,
      label: sec.title || 'Sin título', included: st.included, st: st.st, num, pageBreak: !!sec.pageBreak,
      eye: true, eyeOn: !!sec.visible, movable: true, last: idx === d.sections.length - 1 });
    if (sec === findingsParent) {
      _sortedFindings().forEach(f => nodes.push({ id: `vuln:${f.v.id}`, depth: 1, kind: 'finding', v: f.v, sev: f.sev,
        sec, parent: secNode, label: f.v.name || 'Hallazgo', included: st.included, st: st.st, num: f.code }));
    }
    let si = 0;
    (sec.children || []).forEach(sub => {
      const vis = sub.visible !== false;
      const inc = st.included && vis;
      nodes.push({ id: `sub:${sec.id}:${sub.id}`, depth: 1, kind: 'sub', sec, sub, parent: secNode,
        label: sub.title || 'Subsection', included: inc, st: vis ? st.st : 'hidden', num: inc ? `${num}.${++si}` : '' });
    });
  });
  return { d, m, scope, type, states, nodes };
}

function _resolveNode(id, model) {
  return (model || _outlineModel()).nodes.find(nd => nd.id === id) || null;
}

// ── Outline ───────────────────────────────────────────────────────
function setOutlineQuery(q) { _olQuery = q || ''; renderOutline(); }

function renderOutline() {
  const ul = document.getElementById('ol-list');
  if (!ul || window.FLOWDIT_SNAPSHOT) return;
  const { nodes } = _outlineModel();
  const q = _olQuery.trim().toLowerCase();
  const shown = q ? nodes.filter(nd => nd.label.toLowerCase().includes(q) || (nd.num || '').toLowerCase() === q) : nodes;
  const propNodes = new Set(_rptProposals.map(_nodeForProposal));
  const TAGS = { preset: 'POR TIPO', excluded: 'EXCLUIDA', scope: 'FUERA' };
  ul.classList.toggle('is-free', _freeEditMd !== null);
  ul.innerHTML = shown.map(nd => {
    const selected = nd.id === _sel;
    const cls = ['ol-row', nd.depth ? 'is-child' : '', selected ? 'is-sel' : '', nd.id === _hoverNode ? 'is-hover' : '', nd.included ? '' : 'is-off'].filter(Boolean).join(' ');
    const tag = nd.depth === 0 ? TAGS[nd.st] : '';
    const info = _stateInfo(nd.st, nd.sec);
    const dnd = nd.movable && !q
      ? `draggable="true" ondragstart="secDragStart(event,${_ja(nd.sec.id)})" ondragend="secDragEnd()" ondragover="secDragOver(event,${_ja(nd.sec.id)})" ondrop="secDrop(event,${_ja(nd.sec.id)})"`
      : '';
    const move = selected && nd.movable ? `
      <button type="button" class="ol-ib" data-act="up" ${nd.idx === 0 ? 'disabled' : ''} aria-label="Subir ${esc(nd.label)}" title="Subir">${icon('chevron-up', { size: 12 })}</button>
      <button type="button" class="ol-ib" data-act="down" ${nd.last ? 'disabled' : ''} aria-label="Bajar ${esc(nd.label)}" title="Bajar">${icon('chevron-down', { size: 12 })}</button>` : '';
    const eye = nd.eye ? `
      <button type="button" class="ol-ib is-eye" data-act="eye" aria-pressed="${nd.eyeOn ? 'true' : 'false'}"
        aria-label="${nd.eyeOn ? 'Ocultar' : 'Mostrar'} ${esc(nd.label)}" title="${nd.eyeOn ? 'Ocultar' : 'Mostrar'}">${icon(nd.eyeOn ? 'eye' : 'eye-off', { size: 13 })}</button>` : '';
    return `<li class="${cls}" data-node="${esc(nd.id)}" style="--d:${nd.depth}" ${dnd}>
      <button type="button" class="ol-sel" data-act="select" aria-current="${selected ? 'true' : 'false'}" title="${esc(nd.included ? (nd.st === 'preset' ? info.help : '') : info.help)}">
        ${nd.kind === 'finding' ? `<span class="ol-dot" style="background:${SEV_DOT[nd.sev] || SEV_DOT.info}" aria-hidden="true"></span>` : ''}
        ${nd.num ? `<span class="ol-num">${esc(nd.num)}</span>` : ''}
        <span class="ol-label">${esc(nd.label)}</span>
        ${nd.pageBreak && nd.included ? `<span class="ol-pb" title="Empieza en página nueva" aria-label="Salto de página">↵</span>` : ''}
        ${propNodes.has(nd.id) ? `<span class="ol-tag is-claude" title="Propuesta de Claude pendiente">CLAUDE</span>` : ''}
        ${tag ? `<span class="ol-tag${nd.st === 'preset' ? ' is-preset' : ''}" title="${esc(info.help)}">${tag}</span>` : ''}
      </button>${move}${eye}
    </li>`;
  }).join('') || `<li class="ol-empty">Nada coincide con “${esc(_olQuery.trim())}”.</li>`;
  _renderOutlineBanners();
  const sb = document.getElementById('ol-style-btn');
  if (sb) { sb.classList.toggle('active', _sel === 'style'); sb.setAttribute('aria-current', _sel === 'style' ? 'true' : 'false'); }
}

function _renderOutlineBanners() {
  const el = document.getElementById('ol-banners');
  if (!el) return;
  let html = '';
  if (_freeEditMd !== null) {
    html += `<div class="ol-banner is-free" role="status">
      <span>Edición libre activa: el PDF sale del Markdown, no de estas secciones.</span>
      <div class="ol-grid2">
        <button type="button" class="btn" onclick="enterFreeEdit()">Editar Markdown</button>
        <button type="button" class="btn" onclick="exitFreeEdit()" title="Tu Markdown queda guardado">Volver al generado</button>
      </div>
    </div>`;
  }
  const n = _rptProposals.length;
  if (n) {
    html += `<button type="button" class="ol-banner" onclick="openReportProposal(${_ja(_rptProposals[0].id)})">
      ${icon('sparkles', { size: 13 })}<span style="flex:1 1 auto">${n} propuesta${n > 1 ? 's' : ''} por revisar</span><span aria-hidden="true">→</span>
    </button>`;
  }
  el.innerHTML = html;
}

function toggleToc() {
  const d = getReportData();
  d.meta.showToc = !d.meta.showToc;
  saveReportData(d);
  buildEditor();
}

// ── Selection, hover, scrolling ───────────────────────────────────
function selectNode(id, opts = {}) {
  if (!id) return;
  if (id !== _sel) { _pvView = 'proposed'; _rptpOpenId = null; }
  if (opts.proposalId) _rptpOpenId = opts.proposalId;
  const changed = id !== _sel;
  _sel = id;
  renderOutline();
  renderInspector();
  if (changed) { const box = document.getElementById('exp-inspector'); if (box) box.scrollTop = 0; }
  renderPreviewBar();
  if (_previewKey() !== _lastPreviewKey) buildReport();
  else _paintPreviewMarks();
  if (!opts.fromPreview) _scrollPreviewTo(id);
  _scrollOutlineTo(id);
}

function _nodeSelector(attr, id) { return `[${attr}="${CSS.escape(id)}"]`; }

function _setHover(id) {
  if (id === _hoverNode) return;
  _hoverNode = id;
  document.querySelectorAll('#ol-list .ol-row.is-hover').forEach(r => r.classList.remove('is-hover'));
  document.querySelectorAll('#report-preview .rpt-is-hover').forEach(b => b.classList.remove('rpt-is-hover'));
  if (!id) return;
  document.querySelectorAll(`#ol-list .ol-row${_nodeSelector('data-node', id)}`).forEach(r => r.classList.add('is-hover'));
  document.querySelectorAll(`#report-preview ${_nodeSelector('data-node-id', id)}`).forEach(b => b.classList.add('rpt-is-hover'));
}

// Selected / hovered outline on the preview blocks. Classes only; the CSS
// that draws them is @media screen, so nothing reaches print or the PDF.
function _paintPreviewMarks() {
  const root = document.getElementById('report-preview');
  if (!root || window.FLOWDIT_SNAPSHOT) return;
  root.querySelectorAll('.rpt-is-sel').forEach(el => el.classList.remove('rpt-is-sel'));
  root.querySelectorAll('.rpt-is-hover').forEach(el => el.classList.remove('rpt-is-hover'));
  if (_sel && _sel !== 'style') root.querySelectorAll(_nodeSelector('data-node-id', _sel)).forEach(el => el.classList.add('rpt-is-sel'));
  if (_hoverNode) root.querySelectorAll(_nodeSelector('data-node-id', _hoverNode)).forEach(el => el.classList.add('rpt-is-hover'));
}

// Scroll inside the pane only (never the page: on narrow screens the panes stack).
function _scrollWithin(box, el, always) {
  if (!box || !el || box.scrollHeight <= box.clientHeight + 4) return;
  const b = box.getBoundingClientRect(), r = el.getBoundingClientRect();
  if (!always && r.top >= b.top && r.bottom <= b.bottom) return;
  const top = r.top - b.top + box.scrollTop - (always ? 16 : b.height / 3);
  // Smooth for short hops; a long jump across the report is instant.
  const far = Math.abs(top - box.scrollTop) > box.clientHeight * 2;
  box.scrollTo({ top: Math.max(0, top), behavior: far ? 'auto' : 'smooth' });
}

function _scrollPreviewTo(id) {
  if (!id || id === 'style') return;
  const el = document.querySelector(`#report-preview ${_nodeSelector('data-node-id', id)}`);
  _scrollWithin(document.querySelector('.exp-preview'), el, true);
}

function _scrollOutlineTo(id) {
  const el = document.querySelector(`#ol-list ${_nodeSelector('data-node', id)}`);
  _scrollWithin(document.getElementById('ol-scroll'), el, false);
}

function stepPreviewNode(delta) {
  const model = _outlineModel();
  const top = model.nodes.filter(nd => nd.depth === 0 && nd.included);
  const cur = _resolveNode(_sel, model);
  const curTop = cur?.parent || _sel;
  let i = top.findIndex(nd => nd.id === curTop);
  if (i < 0) i = delta > 0 ? -1 : top.length;
  const next = top[i + delta];
  if (next) selectNode(next.id);
}

// ── Preview overlays (screen only) ────────────────────────────────
// "Con propuesta": the selected node's pending proposal, rendered in place of
// its current content, with a band saying it is not part of the report yet.
function _previewOverride() {
  if (window.FLOWDIT_SNAPSHOT || _pvSuspend || _freeEditMd !== null || _pvView !== 'proposed') return null;
  if (!window.DOMPurify) return null;   // fail closed: no sanitizer, no proposed markup
  const pr = _activeProposal();
  if (!pr) return null;
  const pl = pr.payload || {};
  if (_rptpCurrent(pl) === undefined) return null;
  let html = window.DOMPurify.sanitize(_secContentHtml(pl.content || ''));
  if (html && !/<[a-zA-Z][\s\S]*?>/.test(html)) html = `<p>${html}</p>`;
  return { id: pr.id, stamp: pr.updated_at || pr.created_at || '', sec: pl.section_id, sub: pl.subsection_id || '',
    field: pl.field === 'description' ? 'description' : 'content', html };
}

function _applyPreviewOverride(data, ov) {
  if (!ov) return data;
  const copy = JSON.parse(JSON.stringify(data));
  const sec = copy.sections?.find(s => s.id === ov.sec);
  const holder = ov.sub ? sec?.children?.find(c => c.id === ov.sub) : sec;
  if (holder) holder[ov.field] = ov.html;
  return copy;
}

// The selected section when it does not reach the PDF: a placeholder says why.
function _ghostSection() {
  if (window.FLOWDIT_SNAPSHOT || _pvSuspend || _freeEditMd !== null || !_sel.startsWith('sec:')) return null;
  const sec = getReportData().sections.find(s => `sec:${s.id}` === _sel);
  if (!sec) return null;
  const st = sectionState(sec, _curScope(), _curType(), (state.customVulns || []).length, (state.targets || []).length);
  if (st.included) return null;
  const why = { hidden: 'está oculta', excluded: 'el tipo de informe la excluye', scope: 'el alcance elegido la excluye' }[st.st]
    || _stateInfo('empty', sec).help.toLowerCase();
  return { id: sec.id, html: `<div class="rpt-ghost no-print" data-node-id="${esc('sec:' + sec.id)}">“${esc(sec.title || 'Sin título')}” no aparece en el PDF · ${esc(why)}</div>` };
}

function _previewKey() {
  const ov = _previewOverride();
  const gh = _ghostSection();
  return `${ov ? `${ov.id}:${ov.stamp}:${ov.html.length}` : ''}|${gh ? gh.id : ''}`;
}

function renderPreviewBar() {
  const bar = document.getElementById('exp-pv-bar');
  if (!bar || window.FLOWDIT_SNAPSHOT) return;
  const pr = _freeEditMd === null ? _activeProposal() : null;
  const canCompare = !!pr && !!window.DOMPurify && _rptpCurrent(pr.payload || {}) !== undefined;
  bar.innerHTML = `
    <span class="exp-pv-label">Vista previa</span>
    <div style="flex:1 1 0"></div>
    ${_freeEditMd !== null ? `<span class="exp-pv-chip">Edición libre · el PDF sale del Markdown</span>` : ''}
    ${canCompare ? `<div class="tab-row is-prop" role="group" aria-label="Vista de la propuesta">
      <button type="button" class="tab-btn ${_pvView === 'proposed' ? 'active' : ''}" aria-pressed="${_pvView === 'proposed'}" onclick="setPreviewView('proposed')">Con propuesta</button>
      <button type="button" class="tab-btn ${_pvView === 'current' ? 'active' : ''}" aria-pressed="${_pvView === 'current'}" onclick="setPreviewView('current')">Actual</button>
    </div>` : ''}
    <button type="button" class="btn btn-icon" onclick="stepPreviewNode(-1)" aria-label="Sección anterior" title="Sección anterior">‹</button>
    <button type="button" class="btn btn-icon" onclick="stepPreviewNode(1)" aria-label="Sección siguiente" title="Sección siguiente">›</button>`;
}

function setPreviewView(v) {
  _pvView = v === 'current' ? 'current' : 'proposed';
  renderPreviewBar();
  buildReport();
}

// ── Inspector ─────────────────────────────────────────────────────
function _inspHead(kicker, title, st) {
  return `<div class="insp-head">
    <div class="insp-kicker">${esc(kicker)}</div>
    <div class="insp-title" id="insp-title">${esc(title)}</div>
    ${st && st.label ? `<div class="insp-state"><span class="insp-chip ${st.cls}">${st.label}</span><span>${esc(st.help)}</span></div>` : ''}
  </div>`;
}

function renderInspector() {
  const box = document.getElementById('exp-inspector');
  if (!box || window.FLOWDIT_SNAPSHOT) return;
  const model = _outlineModel();
  let nd = null;
  if (_sel.startsWith('prop:') && !_rptProposals.some(p => `prop:${p.id}` === _sel)) _sel = 'cover';
  if (_sel !== 'style' && !_sel.startsWith('prop:')) {
    nd = _resolveNode(_sel, model);
    if (!nd) { _sel = 'cover'; nd = model.nodes[0]; }
  }
  let head = '', body = '';
  if (_sel === 'style') {
    head = _inspHead('Documento', 'Estilo y página');
    body = _inspStyle(model.m);
  } else if (_sel.startsWith('prop:')) {
    const pr = _rptProposals.find(p => `prop:${p.id}` === _sel);
    head = _inspHead('Propuesta de Claude', (pr?.payload?.section_title || pr?.payload?.section_id || 'Sección'),
      { label: 'SIN DESTINO', help: 'La sección ya no está en el informe', cls: '' });
  } else if (nd.kind === 'cover') {
    head = _inspHead('Portada', 'Portada');
    body = _inspCover(model.m);
  } else if (nd.kind === 'toc') {
    head = _inspHead('Índice', 'Índice de contenidos', _stateInfo(nd.st));
    body = _inspToc(model.m);
  } else if (nd.kind === 'custom' || nd.kind === 'generated') {
    head = _inspHead(nd.kind === 'custom' ? 'Sección de texto' : 'Sección generada', nd.sec.title || 'Sin título', _stateInfo(nd.st, nd.sec));
    body = _inspSection(nd);
  } else if (nd.kind === 'sub') {
    head = _inspHead('Subsección', nd.sub.title || 'Subsection', _stateInfo(nd.st, nd.sec));
    body = _inspSub(nd);
  } else if (nd.kind === 'finding') {
    head = _inspHead(`Hallazgo · ${nd.num} · ${SEV_LABEL[nd.sev] || ''}`, nd.v.name || 'Hallazgo', _stateInfo(nd.st, nd.sec));
    body = _inspFinding(nd);
  }
  box.innerHTML = `${head}<div class="insp-body"><div id="insp-prop" hidden></div>${body}</div>`;
  renderProposalSlot();
  if (nd?.kind === 'finding') renderEvidenceList(nd.v.id, false, false);
}

}

function _inspZone(m, zone) {
  const z = _getZone(m, zone);   // fills defaults on this local copy only
  const isFooter = zone === 'footer';
  const title = isFooter ? 'Pie de página' : 'Encabezado';
  const col = (key, label) => {
    const c = z.cols[key];
    const mode = c.mode || 'text';
    const modes = [['text', 'T', 'Texto'], ['image', 'img', 'Imagen'], ...(isFooter ? [['pagenum', '#', 'Número de página']] : [])];
    const where = `${title} · ${label}`;
    const call = (fn, extra) => `${fn}('${zone}','${key}'${extra})`;
    return `<div class="insp-zone-col">
      <span class="form-label" style="margin:0">${label}</span>
      <div class="tab-row" role="group" aria-label="${where}">
        ${modes.map(([v, l, a]) => `<button type="button" class="tab-btn ${mode === v ? 'active' : ''}" aria-pressed="${mode === v}" aria-label="${a}" title="${a}" onclick="${call('setPageLayoutColMode', `,'${v}'`)}">${l}</button>`).join('')}
      </div>
      ${mode === 'image' ? `
        ${c.img ? `<img src="${esc(c.img)}" alt="" style="${c.imgShadow ? 'filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))' : ''}">` : ''}
        <label class="btn-add-row" style="padding:4px;font-size:10px;cursor:pointer">${c.img ? 'Cambiar' : 'Subir'}<input type="file" accept="image/*" hidden onchange="${call('uploadColLogo', ',this')}"></label>
        ${c.img ? `<button type="button" class="btn btn-danger" style="height:22px;font-size:10px;justify-content:center" onclick="${call('setPageLayoutColImg', ",''")}">Quitar</button>
          <label class="insp-chk" style="min-height:0;font-size:10px"><input type="checkbox" ${c.imgShadow ? 'checked' : ''} onchange="${call('setPageLayoutColShadow', ',this.checked')}"> Sombra</label>` : ''}`
      : `<input class="form-input" value="${esc(c.text || '')}" placeholder="${mode === 'pagenum' ? 'Prefijo (Page)' : 'Texto'}" aria-label="${where} · ${mode === 'pagenum' ? 'prefijo' : 'texto'}" oninput="${call('setPageLayoutColText', ',this.value')}">`}
    </div>`;
  };
  return `<section aria-label="${title}">
    <div class="insp-sh"><label class="insp-chk" style="min-height:0;font-size:10px;color:var(--t3)"><input type="checkbox" ${z.enabled ? 'checked' : ''} onchange="setPageLayoutEnabled('${zone}',this.checked)"> ${title}</label></div>
    ${z.enabled ? `<div class="insp-zone">${col('left', 'Izq.')}${col('center', 'Centro')}${col('right', 'Der.')}</div>` : `<div class="insp-help">Desactivado.</div>`}
  </section>`;
}

// Text body of a custom section or a subsection: rich text or Markdown,
// both writing the same `content` HTML.
function _inspTextBody(nodeId, o) {
  const mode = _textMode[nodeId] || 'rich';
  const nid = _ja(nodeId);
  const save = o.subId
    ? `secUpdateSubContent(${_ja(o.secId)},${_ja(o.subId)},this.innerHTML)`
    : `secUpdateContent(${_ja(o.secId)},this.innerHTML)`;
  const full = `flushMdDraft(${nid});` + (o.subId
    ? `openRichModalSub(${_ja(o.secId)},${_ja(o.subId)})`
    : `openRichModal(${_ja(o.secId)},true,'content')`);
  let body;
  if (mode === 'md') {
    const draft = _mdDrafts[nodeId];
    const lossy = _mdLossy(o.html || '');
    body = `${lossy ? `<div class="insp-md-warn">Este contenido tiene formato que Markdown no conserva (${esc(lossy)}). Si guardás desde MD, ese formato se pierde.</div>` : ''}
      <textarea id="insp-md" class="form-input" style="min-height:220px" aria-label="Contenido en Markdown" spellcheck="false" oninput="mdDraftInput(${nid},this.value)">${esc(draft ?? _htmlToMd(o.html || ''))}</textarea>
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
        <span class="insp-help" style="flex:1 1 auto">Markdown solo para esta sección.</span>
        <button type="button" class="btn btn-prim" id="insp-md-save" ${draft === undefined ? 'disabled' : ''} onclick="saveMdDraft(${nid})">Guardar</button>
      </div>`;
  } else {
    body = `${_richToolbar(o.editorId, 'pal-' + o.editorId)}
      <div class="rich-editor" contenteditable="true" id="${esc(o.editorId)}" aria-label="Contenido" oninput="${save}">${_secContentHtml(o.html)}</div>`;
  }
  return `<section aria-label="Contenido">
    <div class="insp-sh"><span>Contenido</span>
      <div class="insp-tools">
        <div class="tab-row" role="group" aria-label="Modo de edición de esta sección">
          <button type="button" class="tab-btn ${mode === 'rich' ? 'active' : ''}" aria-pressed="${mode === 'rich'}" onclick="setTextMode(${nid},'rich')">Texto</button>
          <button type="button" class="tab-btn ${mode === 'md' ? 'active' : ''}" aria-pressed="${mode === 'md'}" onclick="setTextMode(${nid},'md')">MD</button>
        </div>
        <button type="button" class="btn btn-icon" aria-label="Abrir editor completo" title="Editor completo" onclick="${full}">${icon('maximize-2', { size: 12 })}</button>
      </div>
    </div>
    ${body}
  </section>`;
}

function setTextMode(nodeId, mode) {
  if ((_textMode[nodeId] || 'rich') === mode) return;
  if (_mdDrafts[nodeId] !== undefined) saveMdDraft(nodeId, true);
  _textMode[nodeId] = mode;
  renderInspector();
}

function mdDraftInput(nodeId, val) {
  _mdDrafts[nodeId] = val;
  const b = document.getElementById('insp-md-save');
  if (b) b.disabled = false;
}

function saveMdDraft(nodeId, silent) {
  const md = _mdDrafts[nodeId];
  delete _mdDrafts[nodeId];
  if (md === undefined) return;
  const nd = _resolveNode(nodeId);
  if (!nd) return;
  const html = _mdToHtml(md);
  if (nd.kind === 'sub') secUpdateSubContent(nd.sec.id, nd.sub.id, html);
  else secUpdateContent(nd.sec.id, html);
  if (!silent) renderInspector();
}

function flushMdDraft(nodeId) {
  if (_mdDrafts[nodeId] !== undefined) saveMdDraft(nodeId, true);
}

// Sección (custom or generated)
function _inspSection(nd) {
  const sec = nd.sec;
  const sid = _ja(sec.id);
  const isCustom = sec.type === 'custom';
  let h = isCustom ? '' : `<div class="insp-text">Sección generada desde los datos del proyecto. Se actualiza sola cuando cambian los hallazgos.</div>`;
  h += `<section aria-label="Sección">
    <div class="insp-sh">Sección</div>
    <div class="insp-grid-ts">
      <div><label class="form-label" for="insp-sec-title">Título</label>
        <input id="insp-sec-title" class="form-input" value="${esc(sec.title || '')}" oninput="secUpdateTitle(${sid},this.value)"></div>
      <div><label class="form-label" for="insp-sec-size">Tamaño</label>
        <select id="insp-sec-size" class="form-input" onchange="secUpdateFontSize(${sid},this.value)">
          ${['', '11', '12', '13', '14', '15', '16'].map(s => `<option value="${s}" ${String(sec.fontSize || '') === s ? 'selected' : ''}>${s ? s + ' px' : 'Auto'}</option>`).join('')}
        </select></div>
    </div>
    <label class="insp-chk" style="margin-top:6px"><input type="checkbox" ${sec.pageBreak ? 'checked' : ''} onchange="secTogglePageBreak(${sid});renderOutline()"> Empezar en una página nueva</label>
    <label class="insp-chk"><input type="checkbox" ${sec.visible ? 'checked' : ''} onchange="secToggleVisible(${sid})"> Mostrar en el informe</label>
  </section>`;

  if (isCustom) {
    h += _inspTextBody(nd.id, { secId: sec.id, html: sec.content, editorId: `rich-${sec.id}` });
  } else {
    const ai = sec.type === 'exec-summary'
      ? `<button type="button" class="ai-btn" id="ai-exec-btn" onclick="aiExecSummary(${sid})" title="Generar el resumen ejecutivo a partir de los hallazgos">${_aiLabel()}</button>` : '';
    h += `<section aria-label="Texto introductorio">
      <div class="insp-sh"><span>Texto introductorio</span>
        <div class="insp-tools">${ai}
          <button type="button" class="btn btn-icon" aria-label="Abrir editor completo del texto introductorio" title="Editor completo" onclick="openRichModal(${sid},true,'description')">${icon('maximize-2', { size: 12 })}</button>
        </div>
      </div>
      ${_richToolbar(`rich-desc-${sec.id}`, `pal-desc-${sec.id}`)}
      <div class="rich-editor" contenteditable="true" id="rich-desc-${esc(sec.id)}" aria-label="Texto introductorio" oninput="secUpdateDesc(${sid},this.innerHTML)">${_secContentHtml(sec.description)}</div>
      <div class="insp-help" style="margin-top:4px">Opcional · aparece antes del contenido generado.</div>
    </section>`;
    if (sec.type === 'detailed-findings') {
      const inc = findingIncludeOf(getReportData().meta);
      h += `<section aria-label="Incluir en cada hallazgo">
        <div class="insp-sh">Incluir en cada hallazgo</div>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px">
          ${FINDING_INCLUDE_LABELS.map(([k, l]) => `<label class="insp-chk"><input type="checkbox" ${inc[k] ? 'checked' : ''} onchange="setFindingInclude('${k}',this.checked)"> ${l}</label>`).join('')}
        </div>
        <div class="insp-help" style="margin-top:4px">Se guarda con el informe y llega igual al PDF. Descripción, remediación y notas también aplican a las pruebas WSTG con hallazgos.</div>
      </section>`;
    }
    if (sec.type === 'remediation-roadmap') {
      h += `<section aria-label="Acciones recomendadas">
        <div class="insp-sh">Acciones recomendadas</div>
        <button type="button" class="ai-btn" id="ai-roadmap-btn" style="height:28px;width:100%;justify-content:center" onclick="aiRoadmapActions(${sid})" title="Generar la acción de cada hallazgo que todavía no tiene una">${_aiLabel(true)}</button>
        <div class="insp-help" style="margin-top:6px">Genera la acción de cada hallazgo que todavía no tiene una; las existentes no se tocan. Cada acción se edita en su hallazgo.</div>
      </section>`;
    }
    if (sec.type === 'wstg') h += _inspWstgVulns();
  }
  h += _inspSubList(sec);
  if (isCustom) h += `<button type="button" class="btn btn-danger" style="align-self:flex-start" onclick="secDelete(${sid})">Eliminar sección</button>`;
  return h;
}

function _inspWstgVulns() {
  const failed = [];
  WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
    if (state.wstgProgress[t.id]?.status === 'fail') failed.push(t);
  }));
  const head = `<div class="insp-sh"><span>WSTG — hallazgos</span><span class="insp-sh-note">cambia la prueba en el proyecto</span></div>`;
  if (!failed.length) return `<section aria-label="Pruebas WSTG con hallazgos">${head}<div class="insp-help">Ninguna prueba WSTG está marcada con hallazgo.</div></section>`;
  return `<section aria-label="Pruebas WSTG con hallazgos">${head}
    <div style="display:flex;flex-direction:column;gap:8px">
      ${failed.map(test => {

// ── Markdown ↔ HTML for one section (MD mode) ─────────────────────
function _mdInline(t) {
  let s = esc(t);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, txt, url) =>
    /^(https?:|mailto:)/i.test(url.replace(/&amp;/g, '&')) ? `<a href="${url}">${txt}</a>` : m);
  return s;
}

function _mdToHtml(md) {
  const lines = String(md || '').replace(/\r\n?/g, '\n').split('\n');
  const out = [];
  let para = [], list = null, quote = [], code = null, table = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${para.map(_mdInline).join('<br>')}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map(i => `<li>${_mdInline(i)}</li>`).join('')}</${list.tag}>`); list = null; } };
  const flushQuote = () => { if (quote.length) { out.push(`<blockquote>${quote.map(_mdInline).join('<br>')}</blockquote>`); quote = []; } };
  const flushTable = () => {
    if (!table.length) return;
    const cells = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
    const [head, sep, ...rows] = table;
    if (!sep || !/^[\s|:-]+$/.test(sep)) { table.forEach(r => para.push(r)); table = []; flushPara(); return; }
    out.push(`<table style="border-collapse:collapse;width:100%;margin:6px 0"><thead><tr>${cells(head).map(c => `<th style="${_TH_CSS}">${_mdInline(c)}</th>`).join('')}</tr></thead><tbody>${
      rows.map(r => `<tr>${cells(r).map(c => `<td style="${_TD_CSS}">${_mdInline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
    table = [];
  };
  const flushAll = () => { flushPara(); flushList(); flushQuote(); flushTable(); };
  for (const line of lines) {
    if (code) {
      if (/^```/.test(line)) { out.push(`<pre>${esc(code.join('\n'))}</pre>`); code = null; }
      else code.push(line);
      continue;
    }
    if (/^```/.test(line)) { flushAll(); code = []; continue; }
    if (/^\s*\|.*\|\s*$/.test(line)) { flushPara(); flushList(); flushQuote(); table.push(line); continue; }
    flushTable();
    let mm;
    if ((mm = line.match(/^(#{1,4})\s+(.*)$/))) { flushAll(); const lv = Math.max(2, mm[1].length); out.push(`<h${lv}>${_mdInline(mm[2])}</h${lv}>`); continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { flushAll(); out.push('<hr>'); continue; }
    if ((mm = line.match(/^\s*>\s?(.*)$/))) { flushPara(); flushList(); quote.push(mm[1]); continue; }
    if ((mm = line.match(/^\s*([-*+]|\d+[.)])\s+(.*)$/))) {
      flushPara(); flushQuote();
      const tag = /\d/.test(mm[1]) ? 'ol' : 'ul';
      if (list && list.tag !== tag) flushList();
      if (!list) list = { tag, items: [] };
      list.items.push(mm[2]);
      continue;
    }
    if (!line.trim()) { flushAll(); continue; }
    flushList(); flushQuote();
    para.push(line);
  }
  if (code) out.push(`<pre>${esc(code.join('\n'))}</pre>`);
  flushAll();
  return out.join('');
}

// What in this HTML has no Markdown equivalent (empty string = nothing lost).
function _mdLossy(html) {
  if (!html) return '';
  const tpl = document.createElement('template');
  tpl.innerHTML = _secContentHtml(html);
  const f = tpl.content;
  const lost = [];
  if (f.querySelector('img')) lost.push('imágenes');
  if (f.querySelector('font,[style*="color"],[style*="background"]')) lost.push('colores');
  if (f.querySelector('[style*="font-size"],font[size]')) lost.push('tamaños de letra');
  if (f.querySelector('[style*="text-align"],[align]')) lost.push('alineación');
  if (f.querySelector('u,s,strike,sub,sup')) lost.push('subrayado/tachado/índices');
  if (f.querySelector('td[colspan],td[rowspan],th[colspan],th[rowspan],table table,li ul,li ol')) lost.push('tablas o listas anidadas');
  return lost.join(', ');
}

function _htmlToMd(html) {
  if (!html) return '';
  const tpl = document.createElement('template');
  tpl.innerHTML = _secContentHtml(html);
  const inline = node => Array.from(node.childNodes).map(n => {
    if (n.nodeType === 3) return n.nodeValue.replace(/\s+/g, ' ');
    if (n.nodeType !== 1) return '';
    const tag = n.tagName.toLowerCase();
    const inner = inline(n);
    if (tag === 'br') return '\n';
    if (tag === 'strong' || tag === 'b') return inner.trim() ? `**${inner.trim()}**` : '';
    if (tag === 'em' || tag === 'i') return inner.trim() ? `*${inner.trim()}*` : '';
    if (tag === 'code') return `\`${n.textContent}\``;
    if (tag === 'a') return n.getAttribute('href') ? `[${inner.trim() || n.getAttribute('href')}](${n.getAttribute('href')})` : inner;
    if (tag === 'img') return '';
    return inner;
  }).join('');
  const blocks = [];
  const walk = parent => Array.from(parent.childNodes).forEach(n => {
    if (n.nodeType === 3) { const t = n.nodeValue.trim(); if (t) blocks.push(t.replace(/\s+/g, ' ')); return; }
    if (n.nodeType !== 1) return;
    const tag = n.tagName.toLowerCase();
    const text = () => inline(n).replace(/[ \t]+\n/g, '\n').trim();
    if (/^h[1-6]$/.test(tag)) { const lv = Math.min(4, Math.max(2, +tag[1])); const t = text(); if (t) blocks.push(`${'#'.repeat(lv)} ${t.replace(/\n/g, ' ')}`); }
    else if (tag === 'ul' || tag === 'ol') {
      const items = Array.from(n.children).filter(c => c.tagName === 'LI');
      blocks.push(items.map((li, i) => `${tag === 'ol' ? `${i + 1}.` : '-'} ${inline(li).trim().replace(/\n+/g, ' ')}`).join('\n'));
    }
    else if (tag === 'blockquote') { const t = text(); if (t) blocks.push(t.split('\n').map(l => `> ${l}`).join('\n')); }
    else if (tag === 'pre') blocks.push('```\n' + n.textContent.replace(/\n$/, '') + '\n```');
    else if (tag === 'hr') blocks.push('---');
    else if (tag === 'table') {
      const rows = Array.from(n.querySelectorAll('tr')).map(tr => Array.from(tr.children).map(c => inline(c).trim().replace(/\n+/g, ' ').replace(/\|/g, '\\|')));
      if (rows.length) {
        const w = Math.max(...rows.map(r => r.length));
        const fill = r => { while (r.length < w) r.push(''); return `| ${r.join(' | ')} |`; };
        blocks.push([fill(rows[0]), `|${' --- |'.repeat(w)}`, ...rows.slice(1).map(fill)].join('\n'));
      }
    }
    else if (tag === 'div' && n.querySelector('p,div,ul,ol,h1,h2,h3,h4,table,pre,blockquote')) walk(n);
    else if (tag === 'img') { /* lossy, see _mdLossy */ }
    else { const t = text(); if (t) blocks.push(t); }
  });
  walk(tpl.content);
  return blocks.join('\n\n');
}

// ── Finding edits hydration (report-only fields from vulnEdits) ───
// `force` re-reads the report copy (undo/redo, adopting the server copy) but
// keeps notes/evidence, which belong to the finding itself.
function _hydrateFindingEdits(force) {
  const d = getReportData();
  (state.customVulns || []).forEach(v => {
    const sev = v.severity || 'medium';
    if (!SEV_ORDER.includes(sev)) return;
    const prev = _localEdits[v.id];
    if (prev && !force) return;
    const saved = d.vulnEdits?.[v.id];
    const base = {
      description:    v.description ? renderMd(v.description) : '',
      remediation:    v.remediation ? renderMd(v.remediation) : '',
      notes:          v.notes    || '',
      businessImpact: '',
      execAction:     '',
      evidence:       v.evidence || [],
      _richHtml:      true,
    };
    const e = saved ? { ...base, ...saved, notes: base.notes, evidence: base.evidence } : base;
    if (prev) { e.notes = prev.notes; e.evidence = prev.evidence; }
    if (e.probability == null) e.probability = saved?.probability ?? 3;
    if (e.remediationPriority == null) e.remediationPriority = saved?.remediationPriority ?? defaultPriority(sev);
    _localEdits[v.id] = e;
  });
  WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
    const prog = state.wstgProgress?.[t.id];
    if (prog?.status !== 'fail' || _localEdits[t.id]) return;
    _localEdits[t.id] = { description: prog?.description || '', remediation: prog?.remediation || '', evidence: [] };
  }));
}

// ── Undo / redo (this session) ────────────────────────────────────
// In-memory stack of report-data snapshots taken by saveReportData. A typing
// burst is one step. Undo/redo restore the snapshot through saveReportData,
// so it reaches localStorage and the server like any other edit.
const HISTORY_MAX = 50;
const HISTORY_MAX_CHARS = 40e6;   // logos are base64: bound the memory too
let _histUndo = [], _histRedo = [];
let _histLastAt = 0;
let _histRestoring = false;

function _recordHistory(prevJson, nextJson) {
  if (_histRestoring || window.FLOWDIT_SNAPSHOT || prevJson == null || prevJson === nextJson) return;
  const now = Date.now();
  if (!_histUndo.length || now - _histLastAt > 1000) {
    _histUndo.push(prevJson);
    let size = _histUndo.reduce((n, s) => n + s.length, 0);
    while (_histUndo.length > HISTORY_MAX || (size > HISTORY_MAX_CHARS && _histUndo.length > 1)) size -= _histUndo.shift().length;
  }
  _histLastAt = now;
  _histRedo = [];
  _updateHistoryButtons();
}

function _histStep(from, to) {
  const pid = state.currentProject?.id;
  if (!from.length || !pid) return;
  const cur = localStorage.getItem(`fd_rpt_${pid}`);
  const snap = from.pop();
  if (cur != null) to.push(cur);
  _histLastAt = 0;
  _histRestoring = true;
  try { saveReportData(JSON.parse(snap), false); } finally { _histRestoring = false; }
  _afterReportDataReplaced();
  _updateHistoryButtons();
}

function rptUndo() { _histStep(_histUndo, _histRedo); }
function rptRedo() { _histStep(_histRedo, _histUndo); }

function _updateHistoryButtons() {
  const u = document.getElementById('btn-undo'), r = document.getElementById('btn-redo');
  if (u) { u.disabled = !_histUndo.length; u.title = _histUndo.length ? `Deshacer (${_histUndo.length}) · Ctrl+Z` : 'Nada para deshacer'; }
  if (r) { r.disabled = !_histRedo.length; r.title = _histRedo.length ? `Rehacer (${_histRedo.length}) · Ctrl+Shift+Z` : 'Nada para rehacer'; }
}

        <button type="button" class="btn" onclick="loadTemplate(${i})">Cargar</button>
        <button type="button" class="btn" onclick="exportTemplate(${i})" title="Exportar como .json">.json</button>
        <button type="button" class="btn btn-danger btn-icon" aria-label="Eliminar la plantilla ${esc(tpl.name)}" title="Eliminar" onclick="deleteTemplate(${i})">×</button>
      </li>`).join('')}</ul>`
      : `<div class="insp-help">No hay plantillas guardadas.</div>`}`;
}

// ── One-time event wiring ─────────────────────────────────────────
function _initEditorEvents() {
  if (window.FLOWDIT_SNAPSHOT) return;
  const ul = document.getElementById('ol-list');
  ul?.addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    const row = e.target.closest('[data-node]');
    if (!btn || !row) return;
    const nd = _resolveNode(row.dataset.node);
    if (!nd) return;
    const act = btn.dataset.act;
    if (act === 'select') selectNode(nd.id);
    else if (act === 'up' || act === 'down') moveSection(nd.sec.id, act === 'up' ? -1 : 1);
    else if (act === 'eye') { if (nd.kind === 'toc') toggleToc(); else if (nd.sec) secToggleVisible(nd.sec.id); }
  });
  ul?.addEventListener('mouseover', e => { const row = e.target.closest('[data-node]'); if (row) _setHover(row.dataset.node); });
  ul?.addEventListener('mouseleave', () => _setHover(null));

  const pv = document.getElementById('report-preview');
  pv?.addEventListener('click', e => {
    if (_freeEditMd !== null) return;
    const toc = e.target.closest('.rpt-toc a[href^="#"]');
    if (toc) {
      e.preventDefault();
      const h = toc.getAttribute('href').slice(1);
      let node = null;
      if (h.startsWith('rpt-sec-')) node = `sec:${h.slice(8)}`;
      else if (h.startsWith('sub-')) {
        const subId = h.slice(4);
        const sec = getReportData().sections.find(s => (s.children || []).some(c => c.id === subId));
        if (sec) node = `sub:${sec.id}:${subId}`;
      }
      if (node) selectNode(node);
      return;
    }
    if (e.target.closest('a')) return;
    if (String(window.getSelection?.() || '').trim()) return;   // selecting text, not a click
    const blk = e.target.closest('[data-node-id]');
    if (blk) selectNode(blk.dataset.nodeId, { fromPreview: true });
  });
  pv?.addEventListener('mouseover', e => {
    if (_freeEditMd !== null) return;
    _setHover(e.target.closest('[data-node-id]')?.dataset.nodeId || null);
  });
  pv?.addEventListener('mouseleave', () => _setHover(null));

  document.addEventListener('mousedown', e => { if (!e.target.closest('.exp-menu-wrap')) closeExpMenus(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (document.querySelector('.exp-menu.open')) { closeExpMenus(); return; }
      if (document.getElementById('tpl-modal')) { closeTemplatesModal(); return; }
    }
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k !== 'z' && k !== 'y') return;
    // Inside a field the browser's own undo applies.
    if (e.target.closest?.('input,textarea,select,[contenteditable="true"]') || document.querySelector('.fe-modal')) return;
    e.preventDefault();
    if (k === 'y' || e.shiftKey) rptRedo(); else rptUndo();
  });
}

// ── Build preview ─────────────────────────────────────────────────
let _mdLines = [];

function buildReport() {
  const p          = state.currentProject;
  const scope      = document.getElementById('export-scope')?.value || 'all';
  const reportType = document.getElementById('report-type')?.value || 'technical';
  if (!p) return;

  if (_freeEditMd !== null) {
    document.getElementById('report-preview').innerHTML = renderMdStyled(_freeEditMd);
    document.getElementById('export-project-name').textContent = p.name;
    _afterPreviewRender();
    return;
  }

  _mdLines = [];
  // Screen-only overlays: a pending Claude proposal shown in place of the
  // current content ("Con propuesta"), and a placeholder for the selected
  // section when it does not reach the PDF. Never in print / headless.
  const _ov    = _previewOverride();
  const _ghost = _ghostSection();
  _lastPreviewKey = _previewKey();
  const _band  = '<div class="rpt-pv-band no-print">Vista previa con la propuesta de Claude aplicada · todavía no forma parte del informe</div>';

  const data     = _applyPreviewOverride(getReportData(), _ov);
  const m        = data.meta;
  // "Incluir en cada hallazgo" lives in the report data (meta.findingInclude),
  // so the headless PDF render applies the same choice as this tab.
  const _inc      = findingIncludeOf(m);
  const showDesc  = _inc.desc;
  const showRem   = _inc.rem;
  const showPay   = _inc.pay;
  const showNotes = _inc.notes;
  const showEvid  = _inc.evid;
  const showRetest= _inc.retest;
  const cf       = m.coverFields || {};
  const sections = data.sections || DEFAULT_SECTIONS.map(s=>({...s}));

  const date  = new Date().toLocaleDateString('es-ES', { day:'2-digit', month:'long', year:'numeric' });
  const vulns = state.customVulns || [];
  const bySev = {};
  SEV_ORDER.forEach(s => bySev[s] = vulns.filter(v => (v.severity||'medium') === s));

  // Sequential numbering per severity: C1, C2 / H1, H2 / M1, M2 / L1, L2 / I1, I2
  const SEV_PREFIX = { critical:'C', high:'A', medium:'M', low:'B', info:'I' };
  const vulnNumMap = {};
  SEV_ORDER.forEach(sev => {
    bySev[sev].forEach((v, i) => { vulnNumMap[v.id] = `${SEV_PREFIX[sev]}${i+1}`; });
  });

  let wDone=0, wFail=0, wTotal=0;
  WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
    wTotal++;
    const s = state.wstgProgress[t.id]?.status;
    if (s==='done') wDone++;
    if (s==='fail') wFail++;
  }));
  const wTested = wDone + wFail;
  const wPct    = wTotal ? Math.round(wTested/wTotal*100) : 0;

  const md = (...a) => _mdLines.push(a.join(' '));
  let html = '';

  // ── Cover (always rendered) ───────────────────────────────────────
  md(`# ${p.name} — Informe de Seguridad`);
  md(`**Fecha:** ${date}${p.target ? `  ·  **Objetivo:** ${p.target}` : ''}`);
  if (m.preparedBy)   md(`**Preparado por:** ${m.preparedBy}`);
  if (m.organization) md(`**Organización:** ${m.organization}`);
  if (m.version)      md(`**Versión:** ${m.version}`);
  md(`**Clasificación:** ${m.classification||'Confidencial'}`);
  md('');

  const _coverMeta = [];
  if (cf.date          !== false)                      _coverMeta.push({ label:'Fecha',              val:date });
  if (cf.target        !== false && p.target)          _coverMeta.push({ label:'Objetivo',           val:p.target });
  if (cf.preparedBy    !== false && m.preparedBy)      _coverMeta.push({ label:'Preparado por',      val:m.preparedBy });
  if (cf.organization  !== false && m.organization)    _coverMeta.push({ label:'Organización',       val:m.organization });
  if (cf.scope         !== false && p.description)     _coverMeta.push({ label:'Alcance',            val:p.description });
  if (cf.version       !== false && m.version)         _coverMeta.push({ label:'Versión',            val:m.version });
  if (cf.totalFindings !== false && scope!=='wstg')    _coverMeta.push({ label:'Total hallazgos',    val:String(vulns.length) });
  if (cf.wstgCoverage  !== false && scope!=='vulns')   _coverMeta.push({ label:'Cobertura WSTG',     val:`${wPct}% (${wTested}/${wTotal})` });

  let _metaHtml = '<div class="rpt-cover-meta">';
  for (let i = 0; i < _coverMeta.length; i += 2) {
    _metaHtml += '<div class="rpt-cover-meta-row">';
    [_coverMeta[i], _coverMeta[i+1]].forEach(item => {
      if (!item) { _metaHtml += '<div class="rpt-cover-meta-cell"></div>'; return; }
      _metaHtml += `<div class="rpt-cover-meta-cell"><span class="rpt-cover-meta-label">${item.label}</span><span class="rpt-cover-meta-val">${esc(item.val)}</span></div>`;
    });
    _metaHtml += '</div>';
  }
  _metaHtml += '</div>';

  const _logoUrl = m.coverLogoBase64 || m.clientLogoUrl || p.logo_url || null;
  const _logoBg  = m.coverLogoBg || p.logo_bg || 'light';
  const _coverTitle    = m.coverTitle    || p.name || '';
  const _coverSubtitle = m.coverSubtitle || '';
  const _coverType     = m.coverTypeLabel || 'Informe de Evaluación de Seguridad';
  html += `<div class="rpt-cover-page" data-node-id="cover">
    <div class="rpt-cover-page-bar"></div>
    <div class="rpt-cover-page-body">
      <div class="rpt-cover-logo-wrap">
        ${_logoUrl
          ? (() => {
              const lbg   = _logoBg === 'dark' ? '#1e1e1e' : _logoBg === 'transparent' ? 'transparent' : '#fff';
              const lbord = _logoBg === 'transparent' ? 'none' : `1px solid ${_logoBg === 'dark' ? 'rgba(255,255,255,.08)' : 'rgba(0,0,0,.09)'}`;
              const lpad  = _logoBg === 'transparent' ? '0' : '24px 40px';
              return `<div style="background:${lbg};border:${lbord};border-radius:${_logoBg==='transparent'?'0':'14px'};padding:${lpad};display:flex;align-items:center;justify-content:center"><img src="${esc(_logoUrl)}" style="height:100px;max-width:300px;object-fit:contain" alt="Logo"></div>`;
            })()
          : `<div class="rpt-cover-logo-ph">${esc((_coverTitle||'?')[0].toUpperCase())}</div>`}
      </div>
      <div class="rpt-cover-title-block">
        <span class="rpt-cover-page-type">${esc(_coverType)}</span>
        <h1 class="rpt-cover-page-h1">${esc(_coverTitle)}</h1>
        ${_coverSubtitle ? `<div class="rpt-cover-page-client" style="font-style:normal;font-size:16px;color:var(--t2)">${esc(_coverSubtitle)}</div>` : ''}
        ${m.clientName ? `<div class="rpt-cover-page-client">${esc(m.clientName)}</div>` : ''}
        <span class="rpt-cover-conf">${esc(m.classification||'Confidencial')}</span>
      </div>
    </div>
    <div class="rpt-cover-page-footer">${_metaHtml}</div>
  </div>`;

  // ── TOC (derived from visible sections) ───────────────────────────
  const FORCE_EXEC_TYPES   = new Set(['risk-matrix', 'remediation-roadmap']);
  const FORCE_RETEST_TYPES = new Set(['retest-summary', 'retest-findings']);
  const visibleSections = sections.filter(s => s.visible
    || (reportType === 'executive' && FORCE_EXEC_TYPES.has(s.type))
    || (reportType === 'retest'    && FORCE_RETEST_TYPES.has(s.type)));
  const _tocItems = [];
  const PROSE_TYPES = new Set(['custom']);
  let _tocSecNum = 0;
  const _tocSubs = sec => (sec.children||[]).filter(c=>c.visible!==false);
  const _tocPush = (sec, sid) => { _tocSecNum++; _tocItems.push({ title:sec.title, id:sid, num:_tocSecNum, subs:_tocSubs(sec) }); };
  // sectionState() is the single definition of "this section is rendered"
  // (the same gating as the branches below); the outline tags use it too.
  const _nTargets = (state.targets || []).length;
  visibleSections.forEach(sec => {
    if (sectionState(sec, scope, reportType, vulns.length, _nTargets).included) _tocPush(sec, `rpt-sec-${sec.id}`);
  });

  if (m.showToc && _tocItems.length) {
    md('## Índice de Contenidos');
    _tocItems.forEach((t, i) => md(`${i+1}. ${t.title}`));
    md('');
    html += `<div class="rpt-toc" data-node-id="toc">
      <div class="rpt-toc-title">Índice de Contenidos</div>
      ${_tocItems.map((t, i) => {
        const sn = m.numbering ? t.num : (i+1);
        let row = `<div class="rpt-toc-item"><span class="rpt-toc-num">${sn}.</span><a href="#${t.id}">${esc(t.title)}</a></div>`;
        t.subs.forEach((sub, si) => {
          row += `<div class="rpt-toc-item rpt-toc-sub"><span class="rpt-toc-num">${sn}.${si+1}.</span><a href="#sub-${sub.id}">${esc(sub.title)}</a></div>`;
        });
        return row;
      }).join('')}
    </div>`;
  }
  if (_ghost) html += _ghost.html;

  // ── Subsections helper ─────────────────────────────────────────────
  function _subsHtml(sec, secNum) {
    const subs = (sec.children || []).filter(c => c.visible !== false);
    if (!subs.length) return '';
    let out = '';
    subs.forEach((sub, si) => {
      const numPfx = m.numbering ? `<span class="sec-num-prefix">${secNum}.${si+1}</span>` : '';
      // Wrapper carries the outline node id; it adds no box of its own.
      out += `<div class="rpt-blk" data-node-id="${esc(`sub:${sec.id}:${sub.id}`)}">`;
      out += `<h3 class="rpt-sub-title" id="sub-${sub.id}">${numPfx}${esc(sub.title)}</h3>`;
      if (_ov && _ov.sec === sec.id && _ov.sub === sub.id) out += _band;
      if (sub.content) out += `<div class="rpt-prose">${_secContentHtml(sub.content)}</div>`;
      out += '</div>';
    });
    return out;
  }

  // ── Sections in user-defined order ────────────────────────────────
  let _secNum = 0;
  for (const sec of visibleSections) {
    // Each rendered section is wrapped in a block that carries its outline node
    // id (preview ↔ outline sync). The wrapper has no box: margins collapse
    // through it and forced page breaks propagate, so print is unchanged.
    const _blkStart = html.length;
    sectionBody: {
      const secId = `rpt-sec-${sec.id}`;
      const _pb   = sec.pageBreak ? 'page-break-before:always;break-before:page;' : '';
      const _fs   = sec.fontSize  ? `font-size:${sec.fontSize}px;` : '';
      const _cw   = _fs ? `<div style="${_fs}">` : '';
      const _ce   = _fs ? `</div>` : '';
      const _desc = sec.description ? `<div class="rpt-prose rpt-sec-desc">${_secContentHtml(sec.description)}</div>` : '';

      // ── Prose / custom ────────────────────────────────────────────
      if (PROSE_TYPES.has(sec.type)) {
        if (!sec.content && !(sec.children||[]).filter(c=>c.visible!==false).length) break sectionBody;
        _secNum++;
        const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
        md(`## ${sec.title}`); md(sec.content||''); md('');
        html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>`;
        if (sec.content) html += `<div class="rpt-prose"${_fs ? ` style="${_fs}"` : ''}>${_secContentHtml(sec.content)}</div>`;
        html += _subsHtml(sec, _secNum);
        break sectionBody;
      }

      // ── Executive Summary ─────────────────────────────────────────
      if (sec.type === 'exec-summary' && scope !== 'wstg' && reportType !== 'retest') {
        _secNum++;
        const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
        if (vulns.length) {
          const riskLevel = overallRiskLevel(bySev);
          md('## Resumen Ejecutivo');
          if (reportType === 'executive' && riskLevel) md(`**Riesgo General: ${RISK_LEVEL_LABEL[riskLevel]}** — ${RISK_BANNER_TEXT[riskLevel]}`);
          md('|Severidad|Cantidad|'); md('|---------|--------|');
          SEV_ORDER.forEach(s => { if(bySev[s].length) md(`|${SEV_LABEL[s]}|${bySev[s].length}|`); });
          md('');
          html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}`;
          if (reportType === 'executive' && riskLevel) {
            html += `<div class="rpt-risk-banner card-${riskLevel}">
              <div><div class="rpt-risk-banner-label">Riesgo General</div><div class="rpt-risk-banner-level">${RISK_LEVEL_LABEL[riskLevel]}</div></div>
              <div class="rpt-risk-banner-text">${RISK_BANNER_TEXT[riskLevel]}</div>
            </div>`;
          }
          html += `<div class="rpt-summary">`;
          SEV_ORDER.forEach(s => {
            if (!bySev[s].length) return;
            html += `<div class="rpt-summary-card card-${s}"><div class="rpt-count">${bySev[s].length}</div><div class="rpt-label">${SEV_LABEL[s]}</div></div>`;
          });
          html += '</div>';
          html += `<div class="rpt-risk-wrap"><div class="rpt-risk-bar">`;
          SEV_ORDER.forEach(s => {
            if (!bySev[s].length) return;
            html += `<div class="rpt-risk-seg rpt-risk-${s}" style="width:${Math.round(bySev[s].length/vulns.length*100)}%" title="${SEV_LABEL[s]}: ${bySev[s].length}"></div>`;
          });
          html += `</div><div class="rpt-risk-legend">`;
          SEV_ORDER.forEach(s => {
            if (!bySev[s].length) return;
            const colors = {critical:'#ef4444',high:'#f97316',medium:'#eab308',low:'#059669',info:'#6b7280'};
            html += `<div class="rpt-risk-legend-item"><div class="rpt-risk-legend-dot" style="background:${colors[s]}"></div>${SEV_LABEL[s]} (${bySev[s].length})</div>`;
          });
          html += `</div></div>`;
          if (reportType === 'executive') {
            const criticalHigh = [...bySev.critical, ...bySev.high];
            if (criticalHigh.length) {
              md('### Hallazgos Críticos y de Alto Riesgo');
              html += `<h3 style="margin-top:22px">Hallazgos Críticos y de Alto Riesgo</h3>`;
              criticalHigh.forEach(v => {
                const edit   = _localEdits[v.id] || {};
                const impact = edit.businessImpact || data.vulnEdits?.[v.id]?.businessImpact || '';
                const num    = vulnNumMap[v.id];
                md(`**${num} — ${v.name}** (${SEV_LABEL[v.severity]})`);
                md(impact || '_Impacto de negocio pendiente de completar._');
                md('');
                html += `<div class="rpt-vuln" data-node-id="${esc(`vuln:${v.id}`)}" style="border-left:4px solid ${v.severity==='critical'?'#ef4444':'#f97316'};margin-bottom:10px">
                  <div class="rpt-vuln-header">
                    <span class="sev-badge sev-${v.severity}">${SEV_LABEL[v.severity]}</span>
                    <span style="font-family:var(--mono);font-size:11px;color:var(--t3)">${num}</span>
                    <span style="font-weight:600;font-size:13px">${esc(v.name)}</span>
                  </div>
                  <div class="rpt-field-val" style="padding:10px 14px;white-space:pre-wrap">${impact ? esc(impact) : '<em style="color:var(--t3)">Impacto de negocio pendiente de completar.</em>'}</div>
                </div>`;
              });
            }
          }
          html += _ce;
        } else {
          html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}<p style="color:var(--t3);font-style:italic">Sin hallazgos registrados para este proyecto.</p>${_ce}`;
        }
        html += _subsHtml(sec, _secNum);
        break sectionBody;
      }

      // ── Retest Summary ─────────────────────────────────────────────
      if (sec.type === 'retest-summary' && scope !== 'wstg' && reportType === 'retest') {
        _secNum++;
        const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
        if (vulns.length) {
          const remCount = { open:0, remediated:0, not_remediated:0, verified_closed:0 };
          vulns.forEach(v => { const s = v.remediation_status||'open'; if (remCount[s]!==undefined) remCount[s]++; });
          const remPct = Math.round((remCount.remediated + remCount.verified_closed) / vulns.length * 100);
          const REM_CARD = [
            ['verified_closed', 'Verificado',     'low'],
            ['remediated',      'Remediado',      'medium'],
            ['not_remediated',  'No Remediado',   'critical'],
            ['open',            'Abierto',        'info'],
          ];
          const REM_BAR_COLOR = { verified_closed:'#059669', remediated:'#eab308', not_remediated:'#ef4444', open:'#6b7280' };
          md('## Resumen de Retest');
          md(`**Progreso de remediación: ${remPct}%**`);
          md('|Estado|Cantidad|'); md('|------|--------|');
          REM_CARD.forEach(([k, label]) => { if (remCount[k]) md(`|${label}|${remCount[k]}|`); });
          md('');
          html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}
            <div class="rpt-summary">
              ${REM_CARD.map(([k, label, card]) => remCount[k]
                ? `<div class="rpt-summary-card card-${card}"><div class="rpt-count">${remCount[k]}</div><div class="rpt-label">${label}</div></div>`
                : '').join('')}
            </div>
            <div class="rpt-risk-wrap"><div class="rpt-risk-bar">
              ${REM_CARD.map(([k, label]) => remCount[k]
                ? `<div class="rpt-risk-seg" style="width:${Math.round(remCount[k]/vulns.length*100)}%;background:${REM_BAR_COLOR[k]}" title="${label}: ${remCount[k]}"></div>`
                : '').join('')}
            </div></div>${_ce}`;
        } else {
          html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}<p style="color:var(--t3);font-style:italic">Sin hallazgos registrados para este proyecto.</p>${_ce}`;
        }
        html += _subsHtml(sec, _secNum);
        break sectionBody;
      }

      // ── Findings Index ────────────────────────────────────────────
      if (sec.type === 'findings-index' && scope !== 'wstg' && vulns.length) {
        _secNum++;
        const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
        md('## Índice de Hallazgos'); md('| ID | Severidad | Vulnerabilidad | Categoría | Remediación |'); md('|----|-----------|----------------|-----------|-------------|');
        html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}
          <table class="rpt-table" style="table-layout:fixed;width:100%"><thead><tr>
            <th style="width:45px">ID</th><th style="width:80px">Severidad</th>
            <th>Vulnerabilidad</th><th style="width:18%">Categoría</th><th style="width:90px">Remediación</th>
          </tr></thead><tbody>`;
        SEV_ORDER.forEach(sev => {
          bySev[sev].forEach(v => {
            const rs   = v.remediation_status || 'open';
            const rl   = REM_LABEL[rs] || rs;
            const num  = vulnNumMap[v.id];
            md(`| ${num} | ${SEV_LABEL[sev]} | ${v.name} | ${v.category||'Custom'} | ${rl} |`);
            html += `<tr>
              <td class="num"><div class="rpt-cell" style="font-family:var(--mono);font-weight:700;color:var(--t2);white-space:nowrap">${num}</div></td>
              <td><div class="rpt-cell"><span class="sev-badge sev-${sev}">${SEV_LABEL[sev]}</span></div></td>
              <td style="font-weight:600;color:var(--t1);word-break:break-word"><div class="rpt-cell">${esc(v.name)}</div></td>
              <td style="font-family:var(--mono);font-size:11px"><div class="rpt-cell">${esc(v.category||'Custom')}</div></td>
              <td><div class="rpt-cell"><span class="rpt-vuln-status rpt-status-${rs}">${rl}</span></div></td>

      }

      // ── OWASP WSTG ───────────────────────────────────────────────
      if (sec.type === 'wstg' && scope !== 'vulns') {

        });
        html += '</tbody></table>';
        const failedWSTG = [];
        WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
          if (state.wstgProgress[t.id]?.status==='fail') failedWSTG.push({ cat:cat.name, test:t, prog:state.wstgProgress[t.id] });
        }));
        if (failedWSTG.length && reportType === 'technical') {
          md(`### Hallazgos Encontrados (${failedWSTG.length})`);
          html += `<h3 style="margin-top:24px">Hallazgos Encontrados <span style="font-family:var(--mono);font-size:11px;font-weight:400;color:var(--c-crit);margin-left:6px">${failedWSTG.length}</span></h3>`;
          failedWSTG.forEach(({ cat, test, prog }) => {
            const edit = _localEdits[test.id] || {};
            const desc = edit.description || prog?.description || '';
            const rem  = edit.remediation || prog?.remediation || '';
            const targetHost = prog?.target_id ? (state.targets||[]).find(t=>t.id===prog.target_id)?.host : null;
            const linkedVuln = prog?.linked_vuln_id ? (state.customVulns||[]).find(v=>v.id===prog.linked_vuln_id) : null;
            md(`#### ${test.id} — ${test.name}`);
            md(`**Categoría:** ${cat}${targetHost ? `  ·  **Objetivo:** ${targetHost}` : ''}${linkedVuln ? `  ·  **Hallazgo:** ${linkedVuln.name}` : ''}`);
            if (showDesc && desc) { md('**Descripción**'); md(desc); }
            if (showRem  && rem)  { md('**Remediación**'); md(rem); }
            if (showNotes && prog?.note) { md('**Notas**'); md(prog.note); }
            md('');
            html += `<div class="rpt-wstg-vuln">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                <span style="font-family:var(--mono);font-size:10px;font-weight:700;color:var(--c-crit);background:var(--c-crit)18;border:1px solid var(--c-crit)30;border-radius:3px;padding:2px 6px">${esc(test.id)}</span>
                <span style="font-weight:600;font-size:13px;color:var(--t1)">${esc(test.name)}</span>
              </div>
              <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:${desc||rem?'8px':'0'}">
                <span style="font-family:var(--mono);font-size:10px;color:var(--t3)">${esc(cat)}</span>
                ${targetHost ? `<span style="font-family:var(--mono);font-size:10px;color:var(--a)">${esc(targetHost)}</span>` : ''}
                ${linkedVuln ? `<span style="font-family:var(--mono);font-size:10px;color:var(--a);background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);border-radius:3px;padding:1px 6px">→ ${esc(linkedVuln.name)}</span>` : ''}
              </div>
              ${showDesc&&desc?`<div class="rpt-field-label" style="margin-top:4px">Descripción</div><div class="rpt-field-val">${renderMd(desc)}</div>`:''}
              ${showRem&&rem?`<div class="rpt-field-label">Remediación</div><div class="rpt-field-rem">${renderMd(rem)}</div>`:''}
              ${showNotes&&prog?.note?`<div style="margin-top:6px;font-size:11px;color:var(--t3);font-style:italic">${esc(prog.note)}</div>`:''}
            </div>`;

        }
        html += `<hr class="rpt-divider">${_ce}`;
        html += _subsHtml(sec, _secNum);

      }

      // ── Detailed Findings ─────────────────────────────────────────
      if (sec.type === 'detailed-findings' && scope !== 'wstg' && vulns.length && reportType === 'technical') {
        _secNum++;
        const _np = m.numbering ? `<span class="sec-num-prefix">${_secNum}.</span>` : '';
        md('## Hallazgos Detallados');
        html += `<h2 id="${secId}" style="${_pb}">${_np}${esc(sec.title)}</h2>${_cw}${_desc}`;
        // Build reverse map: vulnId → [testId, ...]
        const wstgForVuln = {};
        WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
          const lvid = state.wstgProgress[t.id]?.linked_vuln_id;
          if (lvid) { if (!wstgForVuln[lvid]) wstgForVuln[lvid] = []; wstgForVuln[lvid].push(t.id); }
        }));
        SEV_ORDER.forEach(sev => {
          if (!bySev[sev].length) return;
          html += `<div style="display:flex;align-items:center;gap:8px;margin:22px 0 10px;page-break-after:avoid;break-after:avoid">
            <span class="sev-badge sev-${sev}" style="font-size:11px;padding:3px 10px;width:auto;white-space:nowrap">${SEV_LABEL[sev]}</span>

          </div>`;
          bySev[sev].forEach(v => {
            const edit    = _localEdits[v.id] || {};

            const evid    = edit.evidence    || v.evidence    || [];
            const notesVal= (edit.notes != null ? edit.notes : v.notes) || '';
            const sl      = v.status==='done'?'Confirmado':v.status==='fail'?'Reproducido':'Pendiente';
            const remStatus  = v.remediation_status || 'open';
            const remLabel   = REM_LABEL[remStatus] || remStatus;
            const hasRetest  = showRetest && remStatus !== 'open' && (v.retest_date || v.retest_notes);
            const wstgLinks = wstgForVuln[v.id] || [];
            const num = vulnNumMap[v.id];
            md(`### ${num} — ${v.name}`);
            md(`**Severidad:** ${SEV_LABEL[sev]}`);
            if (v.category)    md(`**Categoría:** ${v.category}`);
            if (v.cwe)         md(`**CWE:** ${v.cwe}`);
            if (v.target_host) md(`**Objetivo:** ${v.target_host}`);
            if (v.cvss_score != null) md(`**CVSS:** ${(+v.cvss_score).toFixed(1)}`);
            if ((v.compliance_tags||[]).length) md(`**PCI-DSS:** ${v.compliance_tags.map(t=>t.control_id).join(', ')}`);
            md(`**Estado:** ${sl}`);
            if (showRetest && remStatus !== 'open') md(`**Remediación:** ${remLabel}${v.retest_date ? `  ·  **Fecha de retest:** ${v.retest_date}` : ''}`);
            if (wstgLinks.length) md(`**WSTG:** ${wstgLinks.join(', ')}`);
            if (showDesc && desc) { md(''); md('**Descripción**'); md(isRich && edit.description ? edit.description.replace(/<[^>]+>/g,' ') : desc); }
            if (showPay  && (v.payloads||[]).length) { md(''); md('**Payloads**'); v.payloads.forEach(p => md('```\n' + p + '\n```')); }
            if (showNotes && notesVal) { md(''); md('**Notas**'); md(notesVal); }
            if (showRem  && rem)  { md(''); md('**Remediación**'); md(isRich && edit.remediation ? edit.remediation.replace(/<[^>]+>/g,' ') : rem); }
            if (hasRetest && v.retest_notes) { md(''); md('**Notas de Retest**'); md(v.retest_notes); }
            md('');
            const _cvssColor = {critical:'#dc2626',high:'#f97316',medium:'#f59e0b',low:'#059669',info:'#64748b'}[sev]||'#64748b';
            const _meta = [
              v.cvss_score != null ? `<span style="font-family:var(--mono);font-size:10px;font-weight:700;color:${_cvssColor}">CVSS ${(+v.cvss_score).toFixed(1)}</span>` : '',
              v.cwe        ? `<span style="font-family:var(--mono);font-size:10px;color:var(--t3)">${esc(v.cwe)}</span>` : '',
              (v.compliance_tags||[]).length ? `<span style="font-family:var(--mono);font-size:10px;color:var(--a)">PCI-DSS: ${v.compliance_tags.map(t=>esc(t.control_id)).join(', ')}</span>` : '',
              v.category   ? `<span style="font-family:var(--mono);font-size:10px;color:var(--t3)">${esc(v.category)}</span>` : '',
              v.target_host? `<span style="font-family:var(--mono);font-size:10px;color:var(--a)">${esc(v.target_host)}</span>` : '',
              wstgLinks.length ? `<span style="font-family:var(--mono);font-size:10px;color:var(--a)">WSTG: ${wstgLinks.join(', ')}</span>` : '',
            ].filter(Boolean).join(`<span style="color:var(--b2);margin:0 4px">·</span>`);
            html += `<div class="rpt-vuln rpt-vuln-${sev}" data-node-id="${esc(`vuln:${v.id}`)}">
              <div class="rpt-vuln-header" style="flex-direction:column;align-items:stretch;gap:5px">
                <div style="display:flex;align-items:center;gap:8px">
                  <span class="sev-badge sev-${sev}" style="flex-shrink:0">${SEV_LABEL[sev]}</span>
                  <span style="font-family:var(--mono);font-size:11px;font-weight:800;color:var(--t3);flex-shrink:0">${num}</span>
                  <div class="rpt-vuln-name">${esc(v.name)}</div>
                </div>
                ${_meta ? `<div style="padding-left:2px;display:flex;align-items:center;flex-wrap:wrap;gap:2px">${_meta}</div>` : ''}
              </div><div>`;
            if (showDesc && desc) html += `<div class="rpt-field"><div class="rpt-field-label">Descripción</div><div class="rpt-field-val">${isRich && edit.description ? edit.description : renderMd(desc)}</div></div>`;
            if (showPay  && (v.payloads||[]).length) html += `<div class="rpt-field"><div class="rpt-field-label">Payloads</div>${v.payloads.map(p=>`<div class="rpt-code" style="margin-bottom:4px">${esc(p)}</div>`).join('')}</div>`;
            if ((v.items||[]).length) html += `<div class="rpt-field"><div class="rpt-field-label">Lista de verificación</div><div>${v.items.map((item,i)=>`<div style="font-size:12px;color:var(--t2);padding:2px 0">${v.checked_items?.[i]?'[x]':'[ ]'} ${esc(item)}</div>`).join('')}</div></div>`;
            if ((v.compliance_tags||[]).length) html += `<div class="rpt-field"><div class="rpt-field-label">Cobertura PCI-DSS</div><div>${v.compliance_tags.map(t=>`<div style="font-size:12px;color:var(--t2);padding:2px 0"><span style="font-family:var(--mono);font-weight:700;color:var(--a)">${esc(t.control_id)}</span> — ${esc(t.title)}</div>`).join('')}</div></div>`;
            if (showNotes && notesVal) html += `<div class="rpt-field"><div class="rpt-field-label">Notas</div><div class="rpt-field-val">${esc(notesVal)}</div></div>`;
