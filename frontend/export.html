<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowdit — Export Report</title>
<link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js"></script>
<style>
/* ── Two-panel layout ────────────────────────────────────────────── */
.exp-layout { display:flex;flex:1;overflow:hidden;min-height:0; }
.exp-editor { width:380px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow-y:auto;background:var(--bg2); }
.exp-preview { flex:1;overflow-y:auto;padding:40px 48px; }

/* Editor panel sections */
.exp-section { border-bottom:1px solid var(--border); }
.exp-section-header {
  display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text2);
  user-select:none;
}
.exp-section-header:hover { background:var(--bg3); }
.exp-section-header .chevron { margin-left:auto;font-size:9px;transition:transform .2s; }
.exp-section-header.open .chevron { transform:rotate(90deg); }
.exp-section-body { display:none;padding:10px 14px 14px; }
.exp-section-body.open { display:block; }

/* Finding editor cards */
.exp-finding { border:1px solid var(--border);border-radius:7px;margin-bottom:8px;overflow:hidden; }
.exp-finding-header {
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--bg3);cursor:pointer;font-size:12px;font-weight:600;
}
.exp-finding-header:hover { background:var(--bg); }
.exp-finding-body { display:none;padding:10px; }
.exp-finding-body.open { display:flex;flex-direction:column;gap:8px; }
.exp-field-label { font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:3px; }
.exp-textarea {
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-size:11px;font-family:inherit;padding:7px 9px;
  resize:vertical;min-height:60px;line-height:1.5;box-sizing:border-box;
}
.exp-textarea:focus { outline:none;border-color:var(--accent); }
.exp-textarea.rem { border-color:var(--green)44; }
.exp-textarea.rem:focus { border-color:var(--green); }
.exp-saved-dot { width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:auto;opacity:0;transition:opacity .3s; }
.exp-saved-dot.show { opacity:1; }

/* Evidence picker in editor */
.exp-evidence-row { display:flex;align-items:center;gap:6px;margin-bottom:4px;padding:5px 7px;
  background:var(--bg);border:1px solid var(--border);border-radius:5px; }
.exp-evidence-thumb { width:36px;height:28px;object-fit:cover;border-radius:3px;flex-shrink:0; }
.exp-evidence-name { flex:1;font-family:var(--mono);font-size:10px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }

/* Toggle checkboxes */
.exp-opt { display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--text2);cursor:pointer;padding:3px 0; }
.exp-opt input { accent-color:var(--accent);width:13px;height:13px;cursor:pointer; }

/* ── Report base ─────────────────────────────────────────────────── */
.rpt { font-family:'Inter',system-ui,sans-serif;color:var(--text);line-height:1.7; }
.rpt h1 { font-size:28px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em; }
.rpt h2 { font-size:11px;font-weight:700;margin:40px 0 14px;color:var(--text3);
          text-transform:uppercase;letter-spacing:.12em;
          border-bottom:1px solid var(--border);padding-bottom:8px;display:flex;align-items:center;gap:8px; }
.rpt h2::before { content:'';display:inline-block;width:3px;height:12px;border-radius:2px;background:var(--accent);flex-shrink:0; }
.rpt h3 { font-size:13px;font-weight:700;margin:22px 0 10px; }
.rpt p  { margin:4px 0 10px;color:var(--text2);font-size:13px; }

/* ── Cover / header ──────────────────────────────────────────────── */
.rpt-cover { margin-bottom:36px; }
.rpt-cover-bar { height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent),#8b5cf6 60%,var(--blue));margin-bottom:28px; }
.rpt-cover-labels { display:flex;align-items:center;gap:10px;margin-bottom:14px; }
.rpt-cover-type { font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);border:1px solid var(--accent)44;border-radius:3px;padding:3px 9px; }
.rpt-cover-conf { font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--red);border:1px solid var(--red)44;border-radius:3px;padding:3px 9px; }
.rpt-cover-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:22px; }
.rpt-cover-cell { background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:11px 14px; }
.rpt-cover-cell-label { font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:4px; }
.rpt-cover-cell-val   { font-size:13px;font-weight:600;color:var(--text); }

/* ── Summary cards ───────────────────────────────────────────────── */
.rpt-summary { display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 16px; }
.rpt-summary-card { flex:1;min-width:80px;border-radius:9px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden; }
.rpt-summary-card::after { content:'';position:absolute;right:-8px;bottom:-8px;width:50px;height:50px;border-radius:50%;opacity:.12;background:currentColor; }
.rpt-summary-card .rpt-count { font-size:28px;font-weight:800;line-height:1; }
.rpt-summary-card .rpt-label { font-size:9px;text-transform:uppercase;letter-spacing:.1em;opacity:.75;font-family:var(--mono);margin-top:2px; }
.card-critical{background:#ef444418;border:1px solid #ef444440;color:#ef4444;}
.card-high    {background:#f9731618;border:1px solid #f9731640;color:#f97316;}
.card-medium  {background:#eab30818;border:1px solid #eab30840;color:#eab308;}
.card-low     {background:#05966918;border:1px solid #05966940;color:#059669;}
.card-info    {background:#6b728018;border:1px solid #6b728040;color:#9ca3af;}
.card-wstg    {background:var(--bg3);border:1px solid var(--border);color:var(--green);}

/* ── Risk distribution bar ───────────────────────────────────────── */
.rpt-risk-wrap { margin:4px 0 24px; }
.rpt-risk-bar  { display:flex;height:7px;border-radius:4px;overflow:hidden;gap:2px; }
.rpt-risk-seg  { height:100%;border-radius:2px;transition:width .3s; }
.rpt-risk-critical { background:#ef4444; }
.rpt-risk-high     { background:#f97316; }
.rpt-risk-medium   { background:#eab308; }
.rpt-risk-low      { background:#059669; }
.rpt-risk-info     { background:#6b7280; }
.rpt-risk-legend   { display:flex;gap:14px;margin-top:8px;flex-wrap:wrap; }
.rpt-risk-legend-item { display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--text3); }
.rpt-risk-legend-dot { width:7px;height:7px;border-radius:50%;flex-shrink:0; }

/* ── Findings overview table ─────────────────────────────────────── */
.rpt-table { width:100%;border-collapse:collapse;font-size:12px;margin:10px 0; }
.rpt-table th { text-align:left;padding:9px 12px;background:var(--bg3);font-family:var(--mono);
  font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);border-bottom:1px solid var(--border); }
.rpt-table td { padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text2); }
.rpt-table tr:last-child td { border-bottom:none; }
.rpt-table tr:hover td { background:var(--bg2); }
.rpt-table td.num { text-align:center;font-family:var(--mono);font-weight:600; }
.rpt-table td.vuln-found { color:var(--red);font-weight:700; }
.rpt-progress-cell { display:flex;align-items:center;gap:8px; }
.rpt-mini-bar { flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden; }
.rpt-mini-fill { height:100%;background:var(--green);border-radius:2px; }

/* ── Vulnerability cards ─────────────────────────────────────────── */
.rpt-vuln { border:1px solid var(--border);border-radius:8px;margin-bottom:14px;overflow:hidden;page-break-inside:avoid; }
.rpt-vuln-critical { border-left:4px solid #ef4444!important; }
.rpt-vuln-high     { border-left:4px solid #f97316!important; }
.rpt-vuln-medium   { border-left:4px solid #eab308!important; }
.rpt-vuln-low      { border-left:4px solid #059669!important; }
.rpt-vuln-info     { border-left:4px solid #6b7280!important; }
.rpt-vuln-header { display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg2); }
.rpt-vuln-name { font-weight:600;font-size:13px;flex:1; }
.rpt-vuln-cat  { font-family:var(--mono);font-size:10px;color:var(--text3); }
.rpt-vuln-status { font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px; }
.rpt-status-done { color:var(--green);background:var(--green)18;border:1px solid var(--green)30; }
.rpt-status-fail { color:var(--red);background:var(--red)18;border:1px solid var(--red)30; }
.rpt-status-pending { color:var(--text3);background:var(--bg3);border:1px solid var(--border); }
.rpt-field { padding:10px 14px;border-top:1px solid var(--border); }
.rpt-field-label { font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:5px; }
.rpt-field-val  { font-size:12px;color:var(--text2);white-space:pre-wrap;line-height:1.6; }
.rpt-field-rem  { font-size:12px;color:var(--green);white-space:pre-wrap;line-height:1.6; }
.rpt-code { background:var(--bg);border-radius:5px;padding:8px 10px;font-family:var(--mono);font-size:11px;color:var(--text2);line-height:1.6;border:1px solid var(--border); }
.rpt-divider { border:none;border-top:1px solid var(--border);margin:32px 0; }

/* ── WSTG vuln items ─────────────────────────────────────────────── */
.rpt-wstg-vuln { padding:11px 14px;border:1px solid var(--border);border-left:4px solid var(--red);border-radius:6px;margin-bottom:8px;background:var(--bg2); }

/* ── Evidence ────────────────────────────────────────────────────── */
.rpt-evidence-grid { display:flex;flex-wrap:wrap;gap:8px;margin-top:6px; }
.rpt-evidence-img { max-width:260px;max-height:190px;border-radius:6px;border:1px solid var(--border);object-fit:contain; }
.rpt-evidence-cap { font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:3px; }

/* ── Findings index table (before details) ───────────────────────── */
.rpt-idx-num  { width:32px;font-family:var(--mono);color:var(--text3); }
.rpt-idx-sev  { width:90px; }
.rpt-idx-status { width:100px; }

@page { margin:1.8cm 2cm; }

@media print {
  :root {
    --text:    #111111;
    --text2:   #333333;
    --text3:   #666666;
    --bg:      #ffffff;
    --bg2:     #f7f7f7;
    --bg3:     #eeeeee;
    --surface: #f9f9f9;
    --border:  #e0e0e0;
    --border2: #d0d0d0;
    --green:   #15803d;
    --red:     #b91c1c;
    --accent:  #6d28d9;
    --accent2: #22d3a3;
    --blue:    #1d4ed8;
    --mono:    'JetBrains Mono', monospace;
  }
  * { -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important; }

  /* ── Hide UI chrome ─────────────────────────────────── */
  .topbar,.sidenav,.sidebar,.exp-editor,.export-controls,
  .no-print,.toast-container,#loading-overlay { display:none!important; }

  /* ── Reset layout — prevent clipping ────────────────── */
  html,body { display:block!important;background:#fff!important;margin:0!important;padding:0!important;height:auto!important;overflow:visible!important; }
  .app-main  { display:block!important;margin:0!important;padding:0!important;width:100%!important;height:auto!important;overflow:visible!important; }
  .exp-outer,.exp-inner { display:block!important;overflow:visible!important;height:auto!important;min-height:0!important; }
  .exp-layout  { display:block!important;overflow:visible!important;height:auto!important; }
  .exp-preview { display:block!important;overflow:visible!important;padding:0!important;width:100%!important;height:auto!important; }
  #report-preview { max-width:100%!important;margin:0!important; }

  /* ── URL / long text wrapping ───────────────────────── */
  .rpt-cover-cell-val, .rpt-field-val, .rpt-code, .rpt-table td {
    word-break:break-all!important;overflow-wrap:break-word!important;
  }

  /* ── Page-break rules ───────────────────────────────── */
  .rpt-vuln      { page-break-inside:avoid;break-inside:avoid; }
  .rpt-wstg-vuln { page-break-inside:avoid;break-inside:avoid; }
  .rpt-summary   { page-break-inside:avoid;break-inside:avoid; }
  .rpt-cover-grid{ page-break-inside:avoid;break-inside:avoid; }
  .rpt h2 { page-break-after:avoid;break-after:avoid; }
  .rpt h3 { page-break-after:avoid;break-after:avoid; }
  .rpt-table { page-break-inside:auto; }
  .rpt-table tr { page-break-inside:avoid;break-inside:avoid; }

  /* ── Base text ──────────────────────────────────────── */
  .rpt p, .rpt-field-val  { color:#333!important; }
  .rpt h2 { color:#444!important;border-color:#ccc!important; }
  .rpt h2::before { background:#666!important; }
  .rpt h3 { color:#222!important; }
  .rpt-cover-cell { background:#f7f7f7!important;border-color:#ddd!important; }
  .rpt-cover-cell-label { color:#888!important; }
  .rpt-cover-cell-val   { color:#111!important; }
  .rpt-cover-type { color:#3b82f6!important;border-color:#3b82f644!important; }
  .rpt-cover-conf { color:#ef4444!important;border-color:#ef444444!important; }
  .rpt-cover-bar  { background:linear-gradient(90deg,#3b82f6,#8b5cf6)!important; }

  /* ── Severity colours (keep in print) ───────────────── */
  .sev-critical,.sev-badge.sev-critical { background:#fef2f2!important;color:#b91c1c!important;border-color:#fca5a5!important; }
  .sev-high,    .sev-badge.sev-high     { background:#fff7ed!important;color:#c2410c!important;border-color:#fdba74!important; }
  .sev-medium,  .sev-badge.sev-medium   { background:#fefce8!important;color:#92400e!important;border-color:#fde68a!important; }
  .sev-low,     .sev-badge.sev-low      { background:#f0fdf4!important;color:#15803d!important;border-color:#86efac!important; }
  .sev-info,    .sev-badge.sev-info     { background:#f9fafb!important;color:#374151!important;border-color:#d1d5db!important; }

  .card-critical { background:#fef2f2!important;border-color:#fca5a5!important;color:#b91c1c!important; }
  .card-high     { background:#fff7ed!important;border-color:#fdba74!important;color:#c2410c!important; }
  .card-medium   { background:#fefce8!important;border-color:#fde68a!important;color:#92400e!important; }
  .card-low      { background:#f0fdf4!important;border-color:#86efac!important;color:#15803d!important; }
  .card-info     { background:#f9fafb!important;border-color:#d1d5db!important;color:#374151!important; }
  .card-wstg     { background:#f0fdf4!important;border-color:#86efac!important;color:#15803d!important; }

  /* ── Vuln card coloured borders (keep in print) ──────── */
  .rpt-vuln          { border-color:#ddd!important;overflow:visible!important; }
  .rpt-vuln-critical { border-left:4px solid #ef4444!important; }
  .rpt-vuln-high     { border-left:4px solid #f97316!important; }
  .rpt-vuln-medium   { border-left:4px solid #eab308!important; }
  .rpt-vuln-low      { border-left:4px solid #059669!important; }
  .rpt-vuln-info     { border-left:4px solid #6b7280!important; }
  .rpt-vuln-header   { background:#f9f9f9!important; }
  .rpt-vuln-name     { color:#111!important; }
  .rpt-vuln-cat      { color:#666!important; }
  .rpt-vuln-status   { background:#f0f0f0!important;border-color:#ddd!important;color:#444!important; }

  /* ── Other elements ─────────────────────────────────── */
  .rpt-field-label { color:#888!important; }
  .rpt-field-rem   { color:#155724!important; }
  .rpt-field-val   { color:#333!important; }
  .rpt-code        { background:#f4f4f4!important;color:#333!important;border-color:#ddd!important; }
  .rpt-wstg-vuln   { background:#fafafa!important;border-color:#ddd!important;border-left-color:#ef4444!important; }
  .rpt-table th    { background:#f5f5f5!important;color:#666!important;border-color:#ddd!important; }
  .rpt-table td    { color:#333!important;border-color:#eee!important; }
  .rpt-table tr:hover td { background:transparent!important; }
  .rpt-mini-fill   { background:#555!important; }
  .rpt-mini-bar    { background:#ddd!important; }
  .rpt-divider     { border-color:#ddd!important; }
  .rpt-risk-bar    { gap:2px; }
  .rpt-risk-legend-item { color:#555!important; }
  .rpt-status-done { background:#f0fdf4!important;color:#15803d!important;border-color:#86efac!important; }
  .rpt-status-fail { background:#fef2f2!important;color:#b91c1c!important;border-color:#fca5a5!important; }
}
</style>
</head>
<body style="display:flex;flex-direction:column;min-height:100vh">

<div id="loading-overlay"><div class="spinner"></div><div class="spinner-text">// loading report...</div></div>
<div class="sidenav" id="sidenav"></div>
<div class="app-main">
<div class="topbar slim" id="topbar"></div>

<div class="exp-outer" style="display:flex;flex:1;overflow:hidden;min-height:0">
  <div class="exp-inner" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0">

    <!-- Topbar controls -->
    <div class="export-controls no-print"
      style="padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg2);flex-shrink:0;flex-wrap:wrap">
      <div>
        <div class="page-title" style="font-size:16px">Export Report</div>
        <div class="page-subtitle">// <span id="export-project-name">—</span></div>
      </div>
      <select id="export-scope" class="form-input" style="width:165px;cursor:pointer" onchange="buildReport()">
        <option value="all">Full Report</option>
        <option value="vulns">Custom Vulns Only</option>
        <option value="wstg">WSTG Only</option>
      </select>
      <select id="report-type" class="form-input" style="width:145px;cursor:pointer" onchange="buildReport()">
        <option value="technical">Technical</option>
        <option value="executive">Executive</option>
      </select>
      <div style="display:flex;gap:10px;flex-wrap:wrap;padding:5px 10px;background:var(--bg3);border-radius:7px;border:1px solid var(--border)">
        <label class="exp-opt"><input type="checkbox" id="opt-desc"  checked onchange="buildReport()"> Description</label>
        <label class="exp-opt"><input type="checkbox" id="opt-rem"   checked onchange="buildReport()"> Remediation</label>
        <label class="exp-opt"><input type="checkbox" id="opt-pay"   checked onchange="buildReport()"> Payloads</label>
        <label class="exp-opt"><input type="checkbox" id="opt-notes"        onchange="buildReport()"> Notes</label>
        <label class="exp-opt"><input type="checkbox" id="opt-evid"  checked onchange="buildReport()"> Evidence</label>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px">
        <button class="btn-secondary" onclick="copyMarkdown()" style="padding:7px 13px;font-size:12px">📋 Markdown</button>
        <button class="btn-accent"    onclick="window.print()"  style="padding:7px 13px;font-size:12px">🖨 Export PDF</button>
      </div>
    </div>

    <!-- Two-panel: editor left, preview right -->
    <div class="exp-layout">

      <!-- LEFT: editor panel -->
      <div class="exp-editor no-print">
        <div style="padding:12px 14px;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--text3);letter-spacing:.08em">
          REPORT EDITOR
        </div>
        <div id="editor-panel"></div>
      </div>

      <!-- RIGHT: live preview -->
      <div class="exp-preview">
        <div id="report-preview" class="rpt" style="max-width:720px;margin:0 auto"></div>
      </div>

    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/services/state.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/ws.js"></script>
<script src="js/services/utils.js"></script>
<script src="js/components/activity.js"></script>
<script src="js/page.js"></script>
<script>
const SEV_ORDER = ['critical','high','medium','low','info'];
const SEV_LABEL = { critical:'Critical', high:'High', medium:'Medium', low:'Low', info:'Info' };
const SEV_EMOJI = { critical:'🔴', high:'🟠', medium:'🟡', low:'🔵', info:'⚪' };

// Local overrides for desc/rem/evidence (keyed by vuln id or test id)
// These are pre-populated from state and saved back on blur
const _localEdits = {}; // { [id]: { description, remediation, evidence: [] } }

// Target detail cache (ports + endpoints fetched for report)
const _targetFull = {};

async function loadAllTargetDetails() {
  const pid = state.currentProject?.id;
  if (!pid || !state.targets?.length) return;
  await Promise.all(state.targets.map(async t => {
    try {
      const [ports, endpoints] = await Promise.all([
        api.targets.listPorts(pid, t.id).catch(() => []),
        api.targets.listEndpoints(pid, t.id).catch(() => []),
      ]);
      _targetFull[t.id] = { ports, endpoints };
    } catch {}
  }));
}

function getEdit(id) {
  if (!_localEdits[id]) _localEdits[id] = { description:'', remediation:'', evidence:[] };
  return _localEdits[id];
}

// ── Autosave timers ───────────────────────────────────────────────
const _saveTimers = {};

function scheduleVulnSave(vulnId) {
  clearTimeout(_saveTimers[vulnId]);
  _saveTimers[vulnId] = setTimeout(async () => {
    const e = _localEdits[vulnId] || {};
    try {
      const updated = await api.vulns.update(state.currentProject.id, vulnId, {
        description: e.description || '',
        remediation: e.remediation || '',
        evidence:    e.evidence    || [],
      });
      const v = state.customVulns.find(x => x.id === vulnId);
      if (v) Object.assign(v, updated);
      flashSaved(vulnId);
      buildReport();
    } catch {}
  }, 900);
}

function scheduleWSTGSave(testId) {
  clearTimeout(_saveTimers[testId]);
  _saveTimers[testId] = setTimeout(async () => {
    const e = _localEdits[testId] || {};
    try {
      await api.wstg.saveReport(state.currentProject.id, testId, e.description||'', e.remediation||'');
      if (state.wstgProgress[testId]) {
        state.wstgProgress[testId].description = e.description||'';
        state.wstgProgress[testId].remediation = e.remediation||'';
      }
      flashSaved(testId);
      buildReport();
    } catch {}
  }, 900);
}

function flashSaved(id) {
  const dot = document.getElementById(`saved-${id}`);
  if (!dot) return;
  dot.classList.add('show');
  setTimeout(() => dot.classList.remove('show'), 1500);
}

// ── Evidence handling ─────────────────────────────────────────────
function pickEvidence(id, isWSTG) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.onchange = () => {
    const files = Array.from(input.files);
    let done = 0;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        getEdit(id).evidence.push({ name: file.name, data: e.target.result });
        done++;
        if (done === files.length) {
          renderEvidenceList(id, isWSTG);
          if (!isWSTG) scheduleVulnSave(id);
        }
      };
      reader.readAsDataURL(file);
    });
  };
  input.click();
}

function removeEvidence(id, idx, isWSTG) {
  getEdit(id).evidence.splice(idx, 1);
  renderEvidenceList(id, isWSTG);
  if (!isWSTG) scheduleVulnSave(id);
}

function renderEvidenceList(id, isWSTG) {
  const container = document.getElementById(`evid-list-${id}`);
  if (!container) return;
  const evid = getEdit(id).evidence;
  container.innerHTML = evid.length
    ? evid.map((img, i) => `
        <div class="exp-evidence-row">
          <img src="${img.data}" class="exp-evidence-thumb">
          <span class="exp-evidence-name">${esc(img.name||'image')}</span>
          <button class="btn-remove" onclick="removeEvidence('${id}',${i},${isWSTG})">✕</button>
        </div>`).join('')
    : `<div style="font-family:var(--mono);font-size:10px;color:var(--text3)">No images</div>`;
  buildReport();
}

// ── Build editor panel ────────────────────────────────────────────
function buildEditor() {
  const scope  = document.getElementById('export-scope')?.value || 'all';
  const vulns  = state.customVulns || [];
  const bySev  = {};
  SEV_ORDER.forEach(s => bySev[s] = vulns.filter(v => (v.severity||'medium') === s));

  // Gather WSTG tests that have fail status
  const failedTests = [];
  if (scope !== 'vulns') {
    WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
      if (state.wstgProgress[t.id]?.status === 'fail')
        failedTests.push({ cat: cat.name, test: t, prog: state.wstgProgress[t.id] });
    }));
  }

  let html = '';

  // ── Custom vulns section ──────────────────────────────────────
  if (scope !== 'wstg' && vulns.length) {
    html += editorSection('custom-vulns', '🛠 Custom Vulnerabilities', true, () => {
      let inner = '';
      SEV_ORDER.forEach(sev => {
        bySev[sev].forEach(v => {
          // Prime local edits from saved state
          if (!_localEdits[v.id]) {
            _localEdits[v.id] = {
              description: v.description || '',
              remediation: v.remediation || '',
              evidence:    v.evidence    || [],
            };
          }
          inner += findingEditor(v.id, v.name, v.severity, false);
        });
      });
      return inner;
    });
  }

  // ── WSTG vulns found ─────────────────────────────────────────
  if (scope !== 'vulns' && failedTests.length) {
    html += editorSection('wstg-vulns', '⚠ WSTG — Vulns Found', true, () => {
      let inner = '';
      failedTests.forEach(({ test, prog }) => {
        const id = test.id;
        if (!_localEdits[id]) {
          _localEdits[id] = {
            description: prog?.description || '',
            remediation: prog?.remediation || '',
            evidence:    [],
          };
        }
        inner += findingEditor(id, `${id} — ${test.name}`, null, true);
      });
      return inner;
    });
  }

  if (!html) html = `<div style="padding:20px 14px;font-family:var(--mono);font-size:11px;color:var(--text3)">No findings to edit for this scope.</div>`;

  document.getElementById('editor-panel').innerHTML = html;
  // Restore evidence lists
  vulns.forEach(v => renderEvidenceList(v.id, false));
  failedTests.forEach(({ test }) => renderEvidenceList(test.id, true));
}

function editorSection(id, title, startOpen, contentFn) {
  return `<div class="exp-section">
    <div class="exp-section-header ${startOpen?'open':''}" onclick="toggleEditorSection('${id}',this)">
      <span>${title}</span>
      <span class="chevron">▶</span>
    </div>
    <div class="exp-section-body ${startOpen?'open':''}" id="esec-${id}">
      ${contentFn()}
    </div>
  </div>`;
}

function findingEditor(id, name, sev, isWSTG) {
  const sevBadge = sev ? `<span class="sev-badge sev-${sev}" style="font-size:9px;padding:1px 5px">${SEV_LABEL[sev]}</span>` : '';
  return `<div class="exp-finding">
    <div class="exp-finding-header" onclick="toggleFinding('${id}')">
      ${sevBadge}
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px" title="${esc(name)}">${esc(name)}</span>
      <div class="exp-saved-dot" id="saved-${id}"></div>
    </div>
    <div class="exp-finding-body" id="fbody-${id}">
      <div>
        <div class="exp-field-label">Description</div>
        <textarea class="exp-textarea" id="edesc-${id}" placeholder="What is this vulnerability and why does it matter..."
          oninput="getEdit('${id}').description=this.value;${isWSTG?`scheduleWSTGSave('${id}')`:`scheduleVulnSave('${id}')`}"
        >${esc(getEdit(id).description)}</textarea>
      </div>
      <div>
        <div class="exp-field-label">Remediation</div>
        <textarea class="exp-textarea rem" id="erem-${id}" placeholder="How to fix or mitigate this vulnerability..."
          oninput="getEdit('${id}').remediation=this.value;${isWSTG?`scheduleWSTGSave('${id}')`:`scheduleVulnSave('${id}')`}"
        >${esc(getEdit(id).remediation)}</textarea>
      </div>
      ${!isWSTG ? `<div>
        <div class="exp-field-label">Evidence</div>
        <div id="evid-list-${id}"></div>
        <button class="btn-add-row" style="margin-top:5px;font-size:10px" onclick="pickEvidence('${id}',false)">+ Attach image</button>
      </div>` : ''}
    </div>
  </div>`;
}

function toggleEditorSection(id, header) {
  header.classList.toggle('open');
  document.getElementById(`esec-${id}`)?.classList.toggle('open');
}

function toggleFinding(id) {
  document.getElementById(`fbody-${id}`)?.classList.toggle('open');
}

// ── Build preview ─────────────────────────────────────────────────
let _mdLines = [];
function opt(id) { return document.getElementById(id)?.checked ?? true; }

function buildReport() {
  const p          = state.currentProject;
  const scope      = document.getElementById('export-scope')?.value || 'all';
  const reportType = document.getElementById('report-type')?.value || 'technical';
  if (!p) return;

  _mdLines = [];
  const showDesc  = opt('opt-desc');
  const showRem   = opt('opt-rem');
  const showPay   = opt('opt-pay');
  const showNotes = opt('opt-notes');
  const showEvid  = opt('opt-evid');

  const date  = new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'long', year:'numeric' });
  const vulns = state.customVulns || [];
  const bySev = {};
  SEV_ORDER.forEach(s => bySev[s] = vulns.filter(v => (v.severity||'medium') === s));

  let wDone=0, wFail=0, wTotal=0;
  WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
    wTotal++;
    const s = state.wstgProgress[t.id]?.status;
    if (s==='done') wDone++;
    if (s==='fail') wFail++;
  }));
  const wTested = wDone + wFail;
  const wPct    = wTotal ? Math.round(wTested/wTotal*100) : 0;

  const md = (...a) => _mdLines.push(a.join(' '));
  let html = '';

  // ── Cover / Header ────────────────────────────────────────────────
  md(`# ${p.name} — Security Assessment Report`);
  md(`**Date:** ${date}  **Target:** ${p.target||'—'}`); md('');

  html += `<div class="rpt-cover">
    <div class="rpt-cover-bar"></div>
    <div style="display:flex;align-items:flex-start;gap:24px;margin-bottom:18px">
      ${p.logo_url ? `<div style="background:${p.logo_bg==='dark'?'#1e1e1e':'#fff'};border:1px solid ${p.logo_bg==='dark'?'rgba(255,255,255,.08)':'rgba(0,0,0,.09)'};border-radius:8px;padding:8px 14px;display:flex;align-items:center;flex-shrink:0;margin-top:2px"><img src="${p.logo_url}" style="height:48px;max-width:160px;object-fit:contain" alt="Project logo"></div>` : ''}
      <div style="flex:1">
        <div class="rpt-cover-labels">
          <span class="rpt-cover-type">Security Assessment Report</span>
          <span class="rpt-cover-conf">Confidential</span>
        </div>
        <h1 style="margin:0">${esc(p.name)}</h1>
      </div>
    </div>
    <div class="rpt-cover-grid">
      <div class="rpt-cover-cell"><div class="rpt-cover-cell-label">Date</div><div class="rpt-cover-cell-val">${date}</div></div>
      ${p.target?`<div class="rpt-cover-cell"><div class="rpt-cover-cell-label">Target</div><div class="rpt-cover-cell-val">${esc(p.target)}</div></div>`:''}
      ${p.description?`<div class="rpt-cover-cell"><div class="rpt-cover-cell-label">Scope</div><div class="rpt-cover-cell-val">${esc(p.description)}</div></div>`:''}
      ${scope!=='wstg'?`<div class="rpt-cover-cell"><div class="rpt-cover-cell-label">Total Findings</div><div class="rpt-cover-cell-val">${vulns.length}</div></div>`:''}
      ${scope!=='vulns'?`<div class="rpt-cover-cell"><div class="rpt-cover-cell-label">WSTG Coverage</div><div class="rpt-cover-cell-val">${wPct}% (${wTested}/${wTotal})</div></div>`:''}
    </div>
  </div>`;

  // ── Executive Summary ─────────────────────────────────────────────
  if (scope!=='wstg' && vulns.length) {
    md('## Executive Summary'); md('|Severity|Count|'); md('|--------|-----|');
    SEV_ORDER.forEach(s => { if(bySev[s].length) md(`|${SEV_EMOJI[s]} ${SEV_LABEL[s]}|${bySev[s].length}|`); });
    md('');

    html += `<h2>Executive Summary</h2><div class="rpt-summary">`;
    SEV_ORDER.forEach(s => {
      if (!bySev[s].length) return;
      html += `<div class="rpt-summary-card card-${s}"><div class="rpt-count">${bySev[s].length}</div><div class="rpt-label">${SEV_LABEL[s]}</div></div>`;
    });
    if (scope==='all') html += `
      <div class="rpt-summary-card card-wstg"><div class="rpt-count">${wPct}%</div><div class="rpt-label">WSTG</div></div>`;
    html += '</div>';

    // Risk distribution bar
    if (vulns.length) {
      html += `<div class="rpt-risk-wrap"><div class="rpt-risk-bar">`;
      SEV_ORDER.forEach(s => {
        if (!bySev[s].length) return;
        const pct = Math.round(bySev[s].length / vulns.length * 100);
        html += `<div class="rpt-risk-seg rpt-risk-${s}" style="width:${pct}%" title="${SEV_LABEL[s]}: ${bySev[s].length}"></div>`;
      });
      html += `</div><div class="rpt-risk-legend">`;
      SEV_ORDER.forEach(s => {
        if (!bySev[s].length) return;
        const colors = {critical:'#ef4444',high:'#f97316',medium:'#eab308',low:'#059669',info:'#6b7280'};
        html += `<div class="rpt-risk-legend-item"><div class="rpt-risk-legend-dot" style="background:${colors[s]}"></div>${SEV_LABEL[s]} (${bySev[s].length})</div>`;
      });
      html += `</div></div>`;
    }

    // Findings index table
    html += `<h2>Findings Index</h2>
      <table class="rpt-table"><thead><tr>
        <th class="rpt-idx-num">#</th>
        <th class="rpt-idx-sev">Severity</th>
        <th>Vulnerability</th>
        <th>Category</th>
        <th class="rpt-idx-status">Status</th>
      </tr></thead><tbody>`;
    let idx = 1;
    SEV_ORDER.forEach(sev => {
      bySev[sev].forEach(v => {
        const statusLabel = v.status==='done'?'Confirmed':v.status==='fail'?'Reproduced':'Pending';
        html += `<tr>
          <td class="num" style="color:var(--text3)">${idx++}</td>
          <td><span class="sev-badge sev-${sev}">${SEV_LABEL[sev]}</span></td>
          <td style="font-weight:600;color:var(--text)">${esc(v.name)}</td>
          <td style="font-family:var(--mono);font-size:11px">${esc(v.category||'Custom')}</td>
          <td><span class="rpt-vuln-status rpt-status-${v.status||'pending'}">${statusLabel}</span></td>
        </tr>`;
      });
    });
    html += '</tbody></table>';
  } else if (scope!=='wstg') {
    html += `<h2>Executive Summary</h2><p style="color:var(--text3);font-style:italic">No custom findings recorded for this project.</p>`;
  }

  // WSTG
  if (scope!=='vulns') {
    md('## OWASP WSTG Progress');
    md(`**Overall:** ${wTested}/${wTotal} (${wPct}%) · **Passed:** ${wDone} · **Vuln Found:** ${wFail}`); md('');
    html += `<h2>OWASP WSTG Progress</h2>
      <p><strong>${wTested}/${wTotal}</strong> tests completed &nbsp;·&nbsp;
        <strong style="color:var(--green)">${wDone} passed</strong> &nbsp;·&nbsp;
        <strong style="color:var(--red)">${wFail} vuln found</strong></p>
      <table class="rpt-table"><thead><tr>
        <th>Category</th><th style="text-align:center">Tested</th>
        <th style="text-align:center">Total</th><th style="text-align:center">Vulns</th>
        <th style="min-width:100px">Progress</th>
      </tr></thead><tbody>`;
    WSTG_DATA.forEach(cat => {
      const t = cat.tests.length;
      const d = cat.tests.filter(x=>state.wstgProgress[x.id]?.status==='done').length;
      const f = cat.tests.filter(x=>state.wstgProgress[x.id]?.status==='fail').length;
      if (!d&&!f) return;
      const pct = t?Math.round((d+f)/t*100):0;
      html += `<tr><td>${esc(cat.name)}</td><td class="num">${d+f}</td><td class="num">${t}</td>
        <td class="num ${f?'vuln-found':''}">${f||'—'}</td>
        <td><div class="rpt-progress-cell"><div class="rpt-mini-bar"><div class="rpt-mini-fill" style="width:${pct}%"></div></div>
          <span style="font-family:var(--mono);font-size:10px;color:var(--text3);min-width:30px">${pct}%</span></div></td></tr>`;
    });
    html += '</tbody></table>';

    const failedTests = [];
    WSTG_DATA.forEach(cat => cat.tests.forEach(t => {
      if (state.wstgProgress[t.id]?.status==='fail')
        failedTests.push({ cat:cat.name, test:t, prog:state.wstgProgress[t.id] });
    }));
    if (failedTests.length && reportType === 'technical') {
      html += `<h3 style="margin-top:24px">Vulnerabilities Found <span style="font-family:var(--mono);font-size:11px;font-weight:400;color:var(--red);margin-left:6px">${failedTests.length} issue${failedTests.length>1?'s':''}</span></h3>`;
      failedTests.forEach(({ cat, test, prog }) => {
        const edit = _localEdits[test.id] || {};
        const desc = edit.description || prog?.description || '';
        const rem  = edit.remediation || prog?.remediation || '';
        const targetHost = prog?.target_id ? (state.targets||[]).find(t=>t.id===prog.target_id)?.host : null;
        html += `<div class="rpt-wstg-vuln">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
            <span style="font-family:var(--mono);font-size:10px;font-weight:700;color:var(--red);background:var(--red)18;border:1px solid var(--red)30;border-radius:3px;padding:2px 6px">${esc(test.id)}</span>
            <span style="font-weight:600;font-size:13px;color:var(--text)">${esc(test.name)}</span>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:${desc||rem?'8px':'0'}">
            <span style="font-family:var(--mono);font-size:10px;color:var(--text3)">📁 ${esc(cat)}</span>
            ${targetHost ? `<span style="font-family:var(--mono);font-size:10px;color:var(--accent)">🎯 ${esc(targetHost)}</span>` : ''}
          </div>
          ${showDesc&&desc?`<div class="rpt-field-label" style="margin-top:4px">Description</div><div style="font-size:12px;color:var(--text2);margin-bottom:6px;white-space:pre-wrap;line-height:1.6">${esc(desc)}</div>`:''}
          ${showRem&&rem?`<div class="rpt-field-label">Remediation</div><div style="font-size:12px;color:var(--green);white-space:pre-wrap;line-height:1.6">${esc(rem)}</div>`:''}
          ${showNotes&&prog?.note?`<div style="margin-top:6px;font-size:11px;color:var(--text3);font-style:italic">${esc(prog.note)}</div>`:''}
        </div>`;
      });
    }
    html += '<hr class="rpt-divider">';
  }

  // Custom vulns — technical only
  if (scope!=='wstg' && vulns.length && reportType === 'technical') {
    html += `<h2>Detailed Findings</h2>`;
    SEV_ORDER.forEach(sev => {
      if (!bySev[sev].length) return;
      html += `<div style="display:flex;align-items:center;gap:8px;margin:22px 0 10px">
        <span class="sev-badge sev-${sev}" style="font-size:11px;padding:3px 10px">${SEV_LABEL[sev]}</span>
        <span style="font-family:var(--mono);font-size:11px;color:var(--text3)">${bySev[sev].length} finding${bySev[sev].length>1?'s':''}</span>
        <div style="flex:1;height:1px;background:var(--border);margin-left:4px"></div>
      </div>`;
      bySev[sev].forEach(v => {
        const edit = _localEdits[v.id] || {};
        const desc = edit.description || v.description || '';
        const rem  = edit.remediation || v.remediation || '';
        const evid = edit.evidence    || v.evidence    || [];
        const statusLabel = v.status==='done'?'Confirmed':v.status==='fail'?'Reproduced':'Pending';

        html += `<div class="rpt-vuln rpt-vuln-${sev}">
          <div class="rpt-vuln-header">
            <span class="sev-badge sev-${sev}">${SEV_LABEL[sev]}</span>
            ${v.cvss_score != null ? (()=>{ const sc={critical:'#dc2626',high:'#f97316',medium:'#f59e0b',low:'#059669',info:'#64748b'}[sev]||'#64748b'; return `<span style="font-family:var(--mono);font-size:11px;font-weight:700;color:${sc};background:${sc}18;border:1px solid ${sc}33;border-radius:4px;padding:2px 7px;flex-shrink:0">CVSS ${(+v.cvss_score).toFixed(1)}</span>`; })() : ''}
            <div class="rpt-vuln-name">${esc(v.name)}</div>
            ${v.category ? `<span class="rpt-vuln-cat">${esc(v.category)}</span>` : ''}
            ${v.target_host ? `<span style="font-family:var(--mono);font-size:10px;color:var(--accent)">🎯 ${esc(v.target_host)}</span>` : ''}
            <span class="rpt-vuln-status rpt-status-${v.status||'pending'}">${statusLabel}</span>
          </div>
          <div>`;

        if (showDesc && desc) html += `<div class="rpt-field"><div class="rpt-field-label">Description</div><div class="rpt-field-val">${esc(desc)}</div></div>`;
        if (showPay  && (v.payloads||[]).length) html += `<div class="rpt-field"><div class="rpt-field-label">Payloads</div><div class="rpt-code">${v.payloads.map(p=>esc(p)).join('\n')}</div></div>`;
        if ((v.items||[]).length) html += `<div class="rpt-field"><div class="rpt-field-label">Checklist</div><div>${v.items.map((item,i)=>`<div style="font-size:12px;color:var(--text2);padding:2px 0">${v.checked_items?.[i]?'✅':'☐'} ${esc(item)}</div>`).join('')}</div></div>`;
        if (showNotes && v.notes) html += `<div class="rpt-field"><div class="rpt-field-label">Notes</div><div class="rpt-field-val">${esc(v.notes)}</div></div>`;
        if (showRem && rem) html += `<div class="rpt-field"><div class="rpt-field-label">Remediation</div><div class="rpt-field-rem">${esc(rem)}</div></div>`;
        if (showEvid && evid.length) {
          html += `<div class="rpt-field"><div class="rpt-field-label">Evidence</div><div class="rpt-evidence-grid">`;
          evid.forEach(img => { html += `<div><img src="${img.data}" class="rpt-evidence-img"><div class="rpt-evidence-cap">${esc(img.name||'')}</div></div>`; });
          html += '</div></div>';
        }
        html += '</div></div>';
      });
    });
  }

  // ── Targets / Scope section ────────────────────────────────────────
  if (scope !== 'wstg' && state.targets?.length) {
    html += `<h2>Scope — Targets</h2>`;

    if (reportType === 'executive') {
      // Executive: simple table
      html += `<table class="rpt-table"><thead><tr>
        <th>Host</th><th>Type</th><th>Status</th><th>Notes</th>
      </tr></thead><tbody>`;
      state.targets.forEach(t => {
        html += `<tr>
          <td style="font-family:var(--mono);font-weight:600">${esc(t.host)}</td>
          <td style="font-family:var(--mono);font-size:11px;color:var(--text3)">${esc(t.type||'—')}</td>
          <td><span class="rpt-vuln-status rpt-status-${t.status||'pending'}">${esc(t.status||'pending')}</span></td>
          <td style="font-size:12px;color:var(--text3)">${esc(t.notes||'')}</td>
        </tr>`;
      });
      html += '</tbody></table>';
    } else {
      // Technical: cards with ports + endpoints
      state.targets.forEach(t => {
        const td = _targetFull[t.id] || {};
        const ports     = td.ports     || [];
        const endpoints = td.endpoints || [];
        html += `<div class="rpt-vuln" style="margin-bottom:12px">
          <div class="rpt-vuln-header">
            <span style="font-family:var(--mono);font-size:12px;font-weight:700">${esc(t.host)}</span>
            ${t.type ? `<span style="font-family:var(--mono);font-size:10px;color:var(--text3)">${esc(t.type)}</span>` : ''}
            <span style="margin-left:auto"><span class="rpt-vuln-status rpt-status-${t.status||'pending'}">${esc(t.status||'pending')}</span></span>
          </div>`;
        if (t.notes) html += `<div class="rpt-field"><div class="rpt-field-label">Notes</div><div class="rpt-field-val">${esc(t.notes)}</div></div>`;
        if (ports.length) {
          html += `<div class="rpt-field"><div class="rpt-field-label">Open Ports (${ports.length})</div>
            <table class="rpt-table" style="margin:6px 0">
              <thead><tr><th>Port</th><th>Protocol</th><th>State</th><th>Service</th><th>Version</th></tr></thead>
              <tbody>`;
          ports.forEach(port => {
            html += `<tr>
              <td class="num" style="font-weight:700">${port.port}</td>
              <td style="font-family:var(--mono);font-size:11px">${esc(port.protocol||'tcp')}</td>
              <td style="font-family:var(--mono);font-size:11px">${esc(port.state||'open')}</td>
              <td>${esc(port.service||'—')}</td>
              <td style="font-family:var(--mono);font-size:10px;color:var(--text3)">${esc(port.version||'')}</td>
            </tr>`;
          });
          html += '</tbody></table></div>';
        }
        if (endpoints.length) {
          html += `<div class="rpt-field"><div class="rpt-field-label">Endpoints (${endpoints.length})</div>
            <table class="rpt-table" style="margin:6px 0">
              <thead><tr><th>Method</th><th>Path</th><th>Status</th><th>Notes</th></tr></thead>
              <tbody>`;
          endpoints.forEach(ep => {
            html += `<tr>
              <td style="font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent)">${esc(ep.method||'GET')}</td>
              <td style="font-family:var(--mono);font-size:11px">${esc(ep.path||'')}</td>
              <td style="font-family:var(--mono);font-size:10px;color:var(--text3)">${esc(ep.status_code||'')}</td>
              <td style="font-size:11px;color:var(--text3)">${esc(ep.notes||'')}</td>
            </tr>`;
          });
          html += '</tbody></table></div>';
        }
        html += '</div>';
      });
    }
  }

  // ── Active Methodologies (technical only) ──────────────────────────
  if (reportType === 'technical' && scope !== 'wstg') {
    const activeMethods = Object.entries(state.activeMethodProgress || {});
    if (activeMethods.length) {
      html += `<h2>Methodology Progress</h2>`;
      activeMethods.forEach(([methodId, m]) => {
        const pct = m.total ? Math.round((m.done + m.fail) / m.total * 100) : 0;
        const tests = m.tests || [];
        html += `<div style="border:1px solid var(--border);border-radius:8px;margin-bottom:12px;overflow:hidden">
          <div style="display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--bg2)">
            <div style="font-weight:600;font-size:13px;flex:1">${esc(m.name)}</div>
            <div style="font-family:var(--mono);font-size:11px;color:var(--green)">${m.done} done</div>
            ${m.fail ? `<div style="font-family:var(--mono);font-size:11px;color:var(--red)">${m.fail} fail</div>` : ''}
            <div style="font-family:var(--mono);font-size:11px;color:var(--text3)">${m.total} total</div>
          </div>
          <div style="padding:10px 14px">
            <div style="display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--border);gap:2px;margin-bottom:8px">
              ${m.done ? `<div style="width:${Math.round(m.done/m.total*100)}%;background:var(--green);border-radius:2px"></div>` : ''}
              ${m.fail ? `<div style="width:${Math.round(m.fail/m.total*100)}%;background:var(--red);border-radius:2px"></div>` : ''}
            </div>
            ${tests.filter(t => t.status === 'fail').length ? `
              <div style="font-family:var(--mono);font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">Failed checks (${tests.filter(t=>t.status==='fail').length})</div>
              <div style="display:flex;flex-wrap:wrap;gap:4px">
                ${tests.map((t,i) => t.status==='fail' ? `<span style="font-family:var(--mono);font-size:10px;background:var(--red)18;border:1px solid var(--red)30;color:var(--red);border-radius:3px;padding:2px 6px">#${i+1}</span>` : '').filter(Boolean).join('')}
              </div>` : ''}
          </div>
        </div>`;
      });
    }
  }

  document.getElementById('report-preview').innerHTML = html;
  document.getElementById('export-project-name').textContent = p.name;
}

function copyMarkdown() {
  if (!_mdLines.length) return;
  navigator.clipboard.writeText(_mdLines.join('\n')).then(() => showToast('📋 Markdown copied!', 'success'));
}

async function pageInit() {
  await loadAllTargetDetails();
  buildEditor();
  buildReport();
}

bootPage('export');
</script>
</div>
</body>
</html>
