<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowdit — Export Report</title>
<link rel="stylesheet" href="css/main.css">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js"></script>
<style>
/* ── Two-panel layout ────────────────────────────────────────────── */
.exp-layout { display:flex;flex:1;overflow:hidden;min-height:0; }
.exp-editor { width:400px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden;background:var(--bg2); }
#editor-panel { flex:1;overflow-y:auto;display:flex;flex-direction:column; }
.exp-preview { flex:1;overflow-y:auto;padding:40px 48px; }

/* Editor panel sections */
.exp-section { border-bottom:1px solid var(--border); }
.exp-section-header {
  display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text2);
  user-select:none;
}
.exp-section-header:hover { background:var(--bg3); }
.exp-section-header .chevron { margin-left:auto;font-size:9px;transition:transform .2s; }
.exp-section-header.open .chevron { transform:rotate(90deg); }
.exp-section-body { display:none;padding:10px 14px 14px; }
.exp-section-body.open { display:block; }

/* Finding editor cards */
.exp-finding { border:1px solid var(--border);border-radius:7px;margin-bottom:8px;overflow:hidden; }
.exp-finding-header {
  display:flex;align-items:center;gap:8px;padding:8px 10px;
  background:var(--bg3);cursor:pointer;font-size:12px;font-weight:600;
}
.exp-finding-header:hover { background:var(--bg); }
.exp-finding-body { display:none;padding:10px; }
.exp-finding-body.open { display:flex;flex-direction:column;gap:8px; }
.exp-field-label { font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:3px; }
.exp-sub-label { font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin:12px 0 6px;padding-top:10px;border-top:1px solid var(--border); }
.exp-textarea {
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;
  color:var(--text);font-size:11px;font-family:inherit;padding:7px 9px;
  resize:vertical;min-height:60px;line-height:1.5;box-sizing:border-box;
}
.exp-textarea:focus { outline:none;border-color:var(--accent); }
.exp-textarea.rem { border-color:var(--green)44; }
.exp-textarea.rem:focus { border-color:var(--green); }
.exp-saved-dot { width:6px;height:6px;border-radius:50%;background:var(--green);margin-left:auto;opacity:0;transition:opacity .3s; }
.exp-saved-dot.show { opacity:1; }

/* Evidence picker in editor */
.exp-evidence-row { display:flex;align-items:center;gap:6px;margin-bottom:4px;padding:5px 7px;
  background:var(--bg);border:1px solid var(--border);border-radius:5px; }
.exp-evidence-thumb { width:36px;height:28px;object-fit:cover;border-radius:3px;flex-shrink:0; }
.exp-evidence-name { flex:1;font-family:var(--mono);font-size:10px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }

/* Toggle checkboxes */
.exp-opt { display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--text2);cursor:pointer;padding:3px 0; }
.exp-opt input[type="checkbox"] {
  appearance:none;-webkit-appearance:none;
  width:13px;height:13px;border:1px solid var(--border2);border-radius:3px;
  background:var(--bg3);cursor:pointer;position:relative;flex-shrink:0;
  transition:background .12s,border-color .12s;
}
.exp-opt input[type="checkbox"]:checked { background:var(--accent);border-color:var(--accent); }
.exp-opt input[type="checkbox"]:checked::after {
  content:'';position:absolute;left:3px;top:1px;width:4px;height:7px;
  border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg);
}
.exp-opt input[type="checkbox"]:hover:not(:checked) { border-color:var(--accent);background:rgba(124,58,237,.1); }
.exp-opt input[type="radio"] {
  appearance:none;-webkit-appearance:none;
  width:13px;height:13px;border:1px solid var(--border2);border-radius:50%;
  background:var(--bg3);cursor:pointer;position:relative;flex-shrink:0;
  transition:background .12s,border-color .12s;
}
.exp-opt input[type="radio"]:checked { border-color:var(--accent); }
.exp-opt input[type="radio"]:checked::after {
  content:'';position:absolute;left:3px;top:3px;width:5px;height:5px;
  border-radius:50%;background:var(--accent);
}
.exp-opt input[type="radio"]:hover:not(:checked) { border-color:var(--accent);background:rgba(124,58,237,.1); }

/* ── Report base ─────────────────────────────────────────────────── */
.rpt { font-family:var(--rpt-font,'Inter',system-ui,sans-serif);color:var(--text);line-height:1.7; }
.rpt h1 { font-size:28px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em; }
.rpt h2 { font-size:11px;font-weight:700;margin:40px 0 14px;color:var(--text3);
          text-transform:uppercase;letter-spacing:.12em;
          border-bottom:1px solid var(--border);padding-bottom:8px;display:flex;align-items:center;gap:8px; }
.rpt h2::before { content:'';display:inline-block;width:3px;height:12px;border-radius:2px;background:var(--accent);flex-shrink:0; }
.rpt h3 { font-size:13px;font-weight:700;margin:22px 0 10px; }
.rpt p  { margin:4px 0 10px;color:var(--text2);font-size:var(--rpt-base-size,13px); }

/* ── Cover / header ──────────────────────────────────────────────── */
.rpt-cover { margin-bottom:40px; }
.rpt-cover-bar { height:3px;border-radius:0;background:var(--accent);margin-bottom:32px; }
.rpt-cover-labels { display:flex;align-items:center;gap:10px;margin-bottom:12px; }
.rpt-cover-type { font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);border:1px solid rgba(124,58,237,.27);border-radius:3px;padding:3px 9px; }
.rpt-cover-conf { font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--red);border:1px solid var(--red)44;border-radius:3px;padding:3px 9px; }
/* ── Cover metadata table (replaces grid of cards) ───────────────── */
.rpt-cover-meta { margin-top:28px;border-top:1px solid var(--border); }
.rpt-cover-meta-row { display:flex;border-bottom:1px solid var(--border)66;padding:10px 0;gap:0; }
.rpt-cover-meta-cell { flex:1;display:flex;gap:14px;align-items:baseline;padding:0 16px 0 0; }
.rpt-cover-meta-cell + .rpt-cover-meta-cell { border-left:1px solid var(--border)44;padding-left:16px;padding-right:0; }
.rpt-cover-meta-label { font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);white-space:nowrap;min-width:100px;flex-shrink:0; }
.rpt-cover-meta-val { font-size:13px;font-weight:500;color:var(--text);line-height:1.4; }
/* ── TOC links ───────────────────────────────────────────────────── */
.rpt-toc-item a { color:var(--text2);text-decoration:none;border-bottom:1px solid transparent;transition:color .15s,border-color .15s; }
.rpt-toc-item a:hover { color:var(--accent);border-bottom-color:rgba(124,58,237,.27); }

/* ── Summary cards ───────────────────────────────────────────────── */
.rpt-summary { display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 16px; }
.rpt-summary-card { flex:1;min-width:80px;border-radius:9px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden; }
.rpt-summary-card::after { content:'';position:absolute;right:-8px;bottom:-8px;width:50px;height:50px;border-radius:50%;opacity:.12;background:currentColor; }
.rpt-summary-card .rpt-count { font-size:28px;font-weight:800;line-height:1; }
.rpt-summary-card .rpt-label { font-size:9px;text-transform:uppercase;letter-spacing:.1em;opacity:.75;font-family:var(--mono);margin-top:2px; }
.card-critical{background:#ef444418;border:1px solid #ef444440;color:#ef4444;}
.card-high    {background:#f9731618;border:1px solid #f9731640;color:#f97316;}
.card-medium  {background:#eab30818;border:1px solid #eab30840;color:#eab308;}
.card-low     {background:#05966918;border:1px solid #05966940;color:#059669;}
.card-info    {background:#6b728018;border:1px solid #6b728040;color:#9ca3af;}
.card-wstg    {background:var(--bg3);border:1px solid var(--border);color:var(--green);}

/* ── Risk distribution bar ───────────────────────────────────────── */
.rpt-risk-wrap { margin:4px 0 24px; }
.rpt-risk-bar  { display:flex;height:7px;border-radius:4px;overflow:hidden;gap:2px; }
.rpt-risk-seg  { height:100%;border-radius:2px;transition:width .3s; }
.rpt-risk-critical { background:#ef4444; }
.rpt-risk-high     { background:#f97316; }
.rpt-risk-medium   { background:#eab308; }
.rpt-risk-low      { background:#059669; }
.rpt-risk-info     { background:#6b7280; }
.rpt-risk-legend   { display:flex;gap:14px;margin-top:8px;flex-wrap:wrap; }
.rpt-risk-legend-item { display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;color:var(--text3); }
.rpt-risk-legend-dot { width:7px;height:7px;border-radius:50%;flex-shrink:0; }

/* ── Findings overview table ─────────────────────────────────────── */
.rpt-cell { display:flex;align-items:center;min-height:20px; }
.rpt-table { width:100%;border-collapse:separate;border-spacing:0;font-size:12px;margin:10px 0; }
.rpt-table th { text-align:left;padding:9px 12px;background:var(--bg3);font-family:var(--mono);
  font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);border-bottom:1px solid var(--border); }
.rpt-table td { padding:7px 12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top; }
.rpt-table tr:last-child td { border-bottom:none; }
.rpt-table tr:hover td { background:var(--bg2); }
.rpt-table td.num { text-align:center;font-family:var(--mono);font-weight:600; }
.rpt-table td.vuln-found { color:var(--red);font-weight:700; }
.rpt-progress-cell { display:flex;align-items:center;gap:8px; }
.rpt-mini-bar { flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden; }
.rpt-mini-fill { height:100%;background:var(--green);border-radius:2px; }

/* ── Vulnerability cards ─────────────────────────────────────────── */
.rpt-vuln { border:1px solid var(--border);border-radius:8px;margin-bottom:14px;overflow:hidden;page-break-inside:avoid; }
.rpt-vuln-critical { border-left:4px solid #ef4444!important; }
.rpt-vuln-high     { border-left:4px solid #f97316!important; }
.rpt-vuln-medium   { border-left:4px solid #eab308!important; }
.rpt-vuln-low      { border-left:4px solid #059669!important; }
.rpt-vuln-info     { border-left:4px solid #6b7280!important; }
.rpt-vuln-header { display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--bg2); }
.rpt-vuln-name { font-weight:600;font-size:13px;flex:1; }
.rpt-vuln-cat  { font-family:var(--mono);font-size:10px;color:var(--text3); }
.rpt-vuln-status { font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px; }
.rpt-status-done { color:var(--green);background:var(--green)18;border:1px solid var(--green)30; }
.rpt-status-fail { color:var(--red);background:var(--red)18;border:1px solid var(--red)30; }
.rpt-status-pending { color:var(--text3);background:var(--bg3);border:1px solid var(--border); }
.rpt-field { padding:10px 14px;border-top:1px solid var(--border); }
.rpt-field-label { font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:5px; }
.rpt-field-val  { font-size:12px;color:var(--text2);line-height:1.6; }
.rpt-field-rem  { font-size:12px;color:var(--green);line-height:1.6; }
.rpt-code { background:var(--bg);border-radius:5px;padding:8px 10px;font-family:var(--mono);font-size:11px;color:var(--text2);line-height:1.6;border:1px solid var(--border);white-space:pre-wrap;word-break:break-all; }
.rpt-divider { border:none;border-top:1px solid var(--border);margin:32px 0; }

/* ── WSTG vuln items ─────────────────────────────────────────────── */
.rpt-wstg-vuln { padding:11px 14px;border:1px solid var(--border);border-left:4px solid var(--red);border-radius:6px;margin-bottom:8px;background:var(--bg2); }

/* ── Evidence ────────────────────────────────────────────────────── */
.rpt-evidence-grid { display:flex;flex-wrap:wrap;gap:8px;margin-top:6px; }
.rpt-evidence-img { max-width:260px;max-height:190px;border-radius:6px;border:1px solid var(--border);object-fit:contain; }
.rpt-evidence-cap { font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:3px; }

/* ── Findings index table (before details) ───────────────────────── */
.rpt-idx-num  { width:32px;font-family:var(--mono);color:var(--text3); }
.rpt-idx-sev  { width:90px; }
.rpt-idx-status { width:100px; }

@page { margin:0; }

@media print {
  :root {
    --text:    #111111;
    --text2:   #333333;
    --text3:   #666666;
    --bg:      #ffffff;
    --bg2:     #f7f7f7;
    --bg3:     #eeeeee;
    --surface: #f9f9f9;
    --border:  #e0e0e0;
    --border2: #d0d0d0;
    --green:   #15803d;
    --red:     #b91c1c;
    --accent:  #6d28d9;
    --accent2: #22d3a3;
    --blue:    #1d4ed8;
    --mono:    'JetBrains Mono', monospace;
  }
  * { -webkit-print-color-adjust:exact!important;print-color-adjust:exact!important; }

  /* ── Hide UI chrome ─────────────────────────────────── */
  .topbar,.sidenav,.sidebar,.exp-editor,.export-controls,
  .no-print,.toast-container,#loading-overlay { display:none!important; }

  /* ── Page header / footer — real thead/tfoot repeating on every page ── */
  .rpt-ph:not(.enabled),.rpt-pf:not(.enabled) { display:none!important; }
  .rpt-ph.enabled,.rpt-pf.enabled {
    position:static!important;max-width:none;margin:0;
    background:#fff!important;border:none!important;border-radius:0!important;
  }
  .rpt-phw-head,.rpt-phw-foot { display:none!important; }
  #rpt-ph-wrap.ph-active .rpt-phw-head { display:table-header-group!important; }
  #rpt-ph-wrap.pf-active .rpt-phw-foot { display:table-footer-group!important; }
  /* Remove top/bottom padding from body cell when header/footer are active */
  #rpt-ph-wrap.ph-active > tbody > tr > td { padding-top:0!important; }
  #rpt-ph-wrap.pf-active > tbody > tr > td { padding-bottom:0!important; }
  .rpt-pf-pgnum-screen { display:none!important; }
  .rpt-pf-pgnum-wrap::after { content:attr(data-pre) counter(page);font-family:monospace;font-size:10px;color:#666; }

  /* ── Reset layout — prevent clipping ────────────────── */
  html,body { display:block!important;background:#fff!important;margin:0!important;padding:0!important;height:auto!important;overflow:visible!important; }
  .app-main  { display:block!important;margin:0!important;padding:0!important;width:100%!important;height:auto!important;overflow:visible!important; }
  .exp-outer,.exp-inner { display:block!important;overflow:visible!important;height:auto!important;min-height:0!important; }
  .exp-layout  { display:block!important;overflow:visible!important;height:auto!important; }
  .exp-preview { display:block!important;overflow:visible!important;padding:0!important;width:100%!important;height:auto!important; }
  #report-preview { max-width:100%!important;margin:0!important; }

  /* ── URL / long text wrapping ───────────────────────── */
  .rpt-cover-cell-val, .rpt-field-val, .rpt-code, .rpt-table td {
    word-break:break-all!important;overflow-wrap:break-word!important;
  }

  /* ── Cover page ────────────────────────────────────────────────── */
  .rpt-cover-page { page-break-after:always;break-after:page;min-height:0;margin-bottom:0; }

  /* ── Page-break rules ───────────────────────────────── */
  .rpt-vuln      { page-break-inside:avoid;break-inside:avoid; }
  .rpt-wstg-vuln { page-break-inside:avoid;break-inside:avoid; }
  .rpt-summary   { page-break-inside:avoid;break-inside:avoid; }
  .rpt-cover-grid{ page-break-inside:avoid;break-inside:avoid; }
  .rpt h2 { page-break-after:avoid;break-after:avoid; }
  .rpt h3 { page-break-after:avoid;break-after:avoid; }
  .rpt-table { page-break-inside:auto;border-collapse:separate!important;border-spacing:0!important; }
  .rpt-table tr { page-break-inside:avoid;break-inside:avoid; }
  .rpt-table, .rpt-risk-class { border-collapse:separate!important;border-spacing:0!important; }
  .rpt-table td, .rpt-table th,
  .rpt-risk-class td, .rpt-risk-class th { display:table-cell!important;vertical-align:top!important;padding:10px 12px!important; }

  /* ── Base text ──────────────────────────────────────── */
  .rpt p, .rpt-field-val  { color:#333!important; }
  .rpt h2 { color:#444!important;border-color:#ccc!important; }
  .rpt h2::before { background:#666!important; }
  .rpt h3 { color:#222!important; }
  .rpt-cover-meta { border-color:#ddd!important; }
  .rpt-cover-meta-row { border-color:#e0e0e0!important; }
  .rpt-cover-meta-cell { border-color:#e0e0e0!important; }
  .rpt-cover-meta-label { color:#888!important; }
  .rpt-cover-meta-val   { color:#111!important; }
  .rpt-cover-type { color:#3b82f6!important;border-color:#3b82f644!important; }
  .rpt-cover-conf { color:#ef4444!important;border-color:#ef444444!important; }
  .rpt-cover-bar  { background:var(--accent)!important; }
  .rpt-cover-page-bar  { background:var(--accent)!important; }
  .rpt-cover-page-type { color:#3b82f6!important;border-color:#3b82f644!important; }
  .rpt-cover-page-h1   { color:#111!important; }
  .rpt-cover-page-client { color:#666!important; }
  .rpt-cover-logo-ph   { color:#6d28d9!important;background:#ede9fe!important;border-color:#c4b5fd!important; }

  /* ── Severity colours (keep in print) ───────────────── */
  .sev-critical,.sev-badge.sev-critical { background:#fef2f2!important;color:#b91c1c!important;border-color:#fca5a5!important; }
  .sev-high,    .sev-badge.sev-high     { background:#fff7ed!important;color:#c2410c!important;border-color:#fdba74!important; }
  .sev-medium,  .sev-badge.sev-medium   { background:#fefce8!important;color:#92400e!important;border-color:#fde68a!important; }
  .sev-low,     .sev-badge.sev-low      { background:#f0fdf4!important;color:#15803d!important;border-color:#86efac!important; }
  .sev-info,    .sev-badge.sev-info     { background:#f9fafb!important;color:#374151!important;border-color:#d1d5db!important; }

  .card-critical { background:#fef2f2!important;border-color:#fca5a5!important;color:#b91c1c!important; }
  .card-high     { background:#fff7ed!important;border-color:#fdba74!important;color:#c2410c!important; }
  .card-medium   { background:#fefce8!important;border-color:#fde68a!important;color:#92400e!important; }
  .card-low      { background:#f0fdf4!important;border-color:#86efac!important;color:#15803d!important; }
  .card-info     { background:#f9fafb!important;border-color:#d1d5db!important;color:#374151!important; }
  .card-wstg     { background:#f0fdf4!important;border-color:#86efac!important;color:#15803d!important; }

  /* ── Vuln card coloured borders (keep in print) ──────── */
  .rpt-vuln          { border-color:#ddd!important;overflow:visible!important; }
  .rpt-vuln-critical { border-left:4px solid #ef4444!important; }
  .rpt-vuln-high     { border-left:4px solid #f97316!important; }
  .rpt-vuln-medium   { border-left:4px solid #eab308!important; }
  .rpt-vuln-low      { border-left:4px solid #059669!important; }
  .rpt-vuln-info     { border-left:4px solid #6b7280!important; }
  .rpt-vuln-header   { background:#f9f9f9!important; }
  .rpt-vuln-name     { color:#111!important; }
  .rpt-vuln-cat      { color:#666!important; }
  .rpt-vuln-status   { background:#f0f0f0!important;border-color:#ddd!important;color:#444!important; }

  /* ── Other elements ─────────────────────────────────── */
  .rpt-field-label { color:#888!important; }
  .rpt-field-rem   { color:#155724!important; }
  .rpt-field-val   { color:#333!important; }
  .rpt-code        { background:#f4f4f4!important;color:#333!important;border-color:#ddd!important; }
  .rpt-wstg-vuln   { background:#fafafa!important;border-color:#ddd!important;border-left-color:#ef4444!important; }
  .rpt-table th    { background:#f5f5f5!important;color:#666!important;border-color:#ddd!important; }
  .rpt-table th    { padding:9px 12px!important; }
  .rpt-table td    { color:#333!important;border-color:#eee!important;vertical-align:middle!important;padding:9px 12px!important; }
  .rpt-table tr:hover td { background:transparent!important; }
  .rpt-mini-fill   { background:#555!important; }
  .rpt-mini-bar    { background:#ddd!important; }
  .rpt-divider     { border-color:#ddd!important; }
  .rpt-risk-bar    { gap:2px; }
  .rpt-risk-legend-item { color:#555!important; }
  .rpt-status-done { background:#f0fdf4!important;color:#15803d!important;border-color:#86efac!important; }
  .rpt-status-fail { background:#fef2f2!important;color:#b91c1c!important;border-color:#fca5a5!important; }
.rpt-toc { background:#f7f7f7!important;border-color:#ddd!important; }
  .rpt-risk-class th { background:#f5f5f5!important;color:#666!important;border-color:#ddd!important; }
  .rpt-risk-class th { padding:9px 12px!important; }

}


/* ── Report meta editor inputs ───────────────────────────────────── */
.exp-input { width:100%;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:11px;font-family:inherit;padding:5px 8px;box-sizing:border-box; }
.exp-input:focus { outline:none;border-color:var(--accent); }
.exp-meta-row { display:flex;flex-direction:column;gap:3px;margin-bottom:8px; }

/* ── TOC ─────────────────────────────────────────────────────────── */
.rpt-toc { background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px 20px;margin:0 0 28px; }
.rpt-toc-title { font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);margin-bottom:10px; }
.rpt-toc-item { font-size:13px;color:var(--text2);padding:3px 0;display:flex;gap:8px; }
.rpt-toc-num { font-family:var(--mono);font-size:11px;color:var(--text3);min-width:22px; }

/* ── Prose sections ──────────────────────────────────────────────── */
.rpt-prose { font-size:var(--rpt-base-size,13px);color:var(--text2);line-height:1.7;margin:6px 0 20px; }
.rpt-prose h2 { font-size:15px;font-weight:700;margin:16px 0 6px;color:var(--text);border:none;text-transform:none;letter-spacing:0;padding:0; }
.rpt-prose h2::before { display:none; }
.rpt-prose h3 { font-size:13px;font-weight:700;margin:12px 0 5px;color:var(--text); }
.rpt-prose ul,.rpt-prose ol { padding-left:20px;margin:5px 0; }
.rpt-prose li { margin:3px 0; }
.rpt-prose a { color:var(--accent);text-decoration:underline; }
.rpt-prose blockquote { border-left:3px solid var(--accent);margin:8px 0;padding:4px 12px;color:var(--text2);font-style:italic; }
.rpt-prose pre { background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:10px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;margin:8px 0; }

/* ── Rich text editor ────────────────────────────────────────────── */
.rich-tb { display:flex;align-items:center;gap:1px;padding:4px 6px;background:var(--bg3);border:1px solid var(--border);border-radius:5px 5px 0 0;flex-wrap:wrap;gap:2px; }
.rich-tb-btn { background:none;border:1px solid transparent;border-radius:3px;cursor:pointer;color:var(--text2);font-size:11px;padding:2px 5px;line-height:1.5;min-width:22px;text-align:center;flex-shrink:0; }
.rich-tb-btn:hover { background:var(--bg);border-color:var(--border); }
.rich-tb-btn.active { background:var(--accent)18;border-color:var(--accent)55;color:var(--accent); }
.rich-tb-sep { width:1px;height:13px;background:var(--border);margin:0 2px;flex-shrink:0; }
.rich-editor { min-height:80px;max-height:280px;overflow-y:auto;padding:8px 10px;background:var(--bg);border:1px solid var(--border);border-top:none;border-radius:0 0 5px 5px;color:var(--text);font-size:13px;line-height:1.7;outline:none;word-break:break-word; }
.rich-editor:focus { border-color:var(--accent); }
.rich-editor h2 { font-size:15px;font-weight:700;margin:10px 0 4px; }
.rich-editor h3 { font-size:13px;font-weight:700;margin:8px 0 3px; }
.rich-editor h4 { font-size:12px;font-weight:700;margin:6px 0 3px;text-transform:uppercase;letter-spacing:.05em;color:var(--text3); }
.rich-editor ul,.rich-editor ol { padding-left:20px;margin:4px 0; }
.rich-editor li { margin:2px 0; }
.rich-editor a { color:#7c3aed;text-decoration:underline; }
.rich-editor blockquote { border-left:3px solid var(--accent);margin:6px 0;padding:3px 10px;color:var(--text3);font-style:italic; }
.rich-editor pre { background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:7px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;margin:5px 0; }
.rich-editor table { border-collapse:collapse;width:100%;margin:6px 0; }
.rich-editor th { background:var(--bg3);font-weight:600;font-size:11px;padding:5px 9px;border:1px solid var(--border2);text-align:left; }
.rich-editor td { padding:5px 9px;border:1px solid var(--border2);font-size:12px;vertical-align:top; }
.rich-editor hr { border:none;border-top:1px solid var(--border);margin:10px 0; }
.rich-editor img { max-width:100%;border-radius:4px;margin:4px 0;display:block; }

/* ── Table grid picker ───────────────────────────────────────────── */
.rich-tg { display:grid;grid-template-columns:repeat(8,16px);gap:2px; }
.rich-tc { width:16px;height:16px;border:1px solid var(--border2);border-radius:2px;cursor:pointer;transition:background .08s,border-color .08s; }
.rich-tc.active { background:var(--accent)55;border-color:var(--accent); }
.rich-tc:hover  { background:var(--accent)33;border-color:var(--accent); }
.rich-tg-label  { font-family:var(--mono);font-size:10px;color:var(--accent);text-align:center;margin-top:6px;min-height:14px;letter-spacing:.04em; }
.rich-tiny-input { width:44px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:3px 5px;color:var(--text);font-family:var(--mono);font-size:11px;outline:none;text-align:center; }
.rich-tiny-input:focus { border-color:var(--accent); }
/* ── Font-size input ─────────────────────────────────────────────── */
.rich-fs-input { width:38px;height:22px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text2);font-family:var(--mono);font-size:10px;padding:1px 4px;outline:none;text-align:center;-moz-appearance:textfield; }
.rich-fs-input:focus { border-color:var(--accent); }
.rich-fs-input::-webkit-inner-spin-button,.rich-fs-input::-webkit-outer-spin-button { -webkit-appearance:none; }
/* ── Context toolbars (table / image) ────────────────────────────── */
.rich-ctx-tb { position:fixed;z-index:9500;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:3px 4px;display:none;align-items:center;gap:2px;box-shadow:0 4px 20px rgba(0,0,0,.4);pointer-events:all; }
/* ── Active section edit button ──────────────────────────────────── */
.sec-btn.active { color:var(--accent)!important;border-color:var(--accent)55!important;background:var(--accent)10!important; }
.rich-color-wrap { position:relative;display:inline-flex; }
.rich-color-palette { position:absolute;top:calc(100% + 3px);left:0;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:7px;display:none;flex-wrap:wrap;gap:3px;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,.25);width:140px; }
.rich-color-palette.open { display:flex; }
.rich-sw { width:18px;height:18px;border-radius:3px;cursor:pointer;border:1px solid rgba(128,128,128,.2);flex-shrink:0;transition:transform .1s; }
.rich-sw:hover { transform:scale(1.25);z-index:1;position:relative; }

/* ── Risk classification table ───────────────────────────────────── */
.rpt-risk-class { width:100%;border-collapse:separate;border-spacing:0;font-size:12px;margin:10px 0 24px; }
.rpt-risk-class th { text-align:left;padding:9px 12px;background:var(--bg3);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);border-bottom:1px solid var(--border); }
.rpt-risk-class td { padding:7px 12px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:top; }
.rpt-risk-class tr:last-child td { border-bottom:none; }


/* ── Cover page (full dedicated first page) ──────────────────────── */
.rpt-cover-page { display:flex;flex-direction:column;min-height:88vh;margin-bottom:60px; }
.rpt-cover-page-bar { height:4px;background:var(--accent);flex-shrink:0; }
.rpt-cover-page-body { flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px 40px;gap:36px;text-align:center; }
.rpt-cover-logo-wrap { display:flex;align-items:center;justify-content:center; }
.rpt-cover-logo-ph { width:96px;height:96px;border-radius:16px;background:rgba(124,58,237,.09);border:2px solid rgba(124,58,237,.2);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:var(--accent); }
.rpt-cover-title-block { display:flex;flex-direction:column;align-items:center;gap:14px; }
.rpt-cover-page-type { font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(124,58,237,.27);border-radius:3px;padding:4px 14px; }
.rpt-cover-page-h1 { font-size:36px;font-weight:800;letter-spacing:-.03em;color:var(--text);margin:0;line-height:1.1; }
.rpt-cover-page-client { font-size:15px;color:var(--text3);font-style:italic; }
.rpt-cover-page-footer { padding:0 40px 40px;flex-shrink:0; }
.sec-pb-btn.sec-pb-on { color:var(--accent)!important;border-color:var(--accent)55!important;background:var(--accent)10!important; }

/* ── Free Edit modal ─────────────────────────────────────────────── */
.fe-modal { position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(3px); }
.fe-modal-inner { background:var(--bg2);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;width:100%;max-width:900px;height:100%;max-height:calc(100vh - 48px);overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.4);transition:max-width .2s ease; }
.fe-modal-inner.split { max-width:1440px; }
.fe-body { flex:1;display:flex;overflow:hidden;min-height:0; }
#fe-preview { flex:1;overflow-y:auto;padding:32px 40px;border-left:1px solid var(--border);background:var(--bg);display:none; }
#fe-preview.open { display:block; }

/* ── Section builder ─────────────────────────────────────────────── */
.sec-list { display:flex;flex-direction:column; }
.sec-item { border-bottom:1px solid var(--border);background:var(--bg2);transition:background .1s; }
.sec-item.drag-over { box-shadow:inset 0 2px 0 var(--accent);background:var(--bg3); }
.sec-item.dragging { opacity:.35;background:var(--bg3); }
.sec-row { display:flex;align-items:center;gap:5px;padding:5px 8px;min-height:32px; }
.sec-drag { cursor:grab;color:var(--text3);font-size:13px;padding:0 3px;user-select:none;flex-shrink:0;line-height:1; }
.sec-drag:active { cursor:grabbing; }
.sec-eye { background:none;border:none;cursor:pointer;font-size:12px;padding:0 2px;flex-shrink:0;line-height:1;transition:opacity .15s; }
.sec-eye.off { opacity:.2; }
.sec-title-wrap { flex:1;min-width:0; }
.sec-title { font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.sec-title.sec-dim { color:var(--text3);text-decoration:line-through;font-weight:400; }
.sec-type-badge { font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.04em; }
.sec-btn { background:none;border:1px solid var(--border);border-radius:3px;cursor:pointer;color:var(--text3);font-size:10px;padding:1px 5px;line-height:1.5;flex-shrink:0; }
.sec-btn:hover { color:var(--text);border-color:var(--text3);background:var(--bg3); }
.sec-btn.del:hover { color:var(--red);border-color:var(--red)55;background:var(--red)08; }
.sec-edit-body { display:none;padding:8px 10px 10px;border-top:1px solid var(--border)44;background:var(--bg); }
.sec-edit-body.open { display:block; }
.sec-meta-header { padding:7px 14px 6px;font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--text2);font-weight:600;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none; }
.sec-meta-header:hover { filter:brightness(1.08); }
.sec-meta-chevron { font-size:8px;transition:transform .18s;margin-left:auto;margin-right:2px; }
.sec-meta-header.collapsed .sec-meta-chevron { transform:rotate(-90deg); }
.cover-fields-grid { display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin:4px 0 6px; }

/* ── Rich editor interaction cursors ─────────────────────────────── */
.rich-editor td,.rich-editor th { cursor:cell; }
.rich-editor td:hover,.rich-editor th:hover { background:var(--accent)0e!important; }
.rich-editor img { cursor:pointer;transition:outline .1s; }
.rich-editor img:hover { outline:2px solid var(--accent)88;border-radius:2px; }

/* ── Watermark ───────────────────────────────────────────────────── */
#rpt-watermark {
  display:none;pointer-events:none;user-select:none;
  font-weight:900;text-transform:uppercase;letter-spacing:.15em;
  font-family:var(--mono);white-space:nowrap;
  z-index:9999;
}
#rpt-watermark.wm-on { display:block; }
/* screen: absolute inside exp-preview so it doesn't cover the editor panel */
@media screen {
  #rpt-watermark.wm-on {
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%) rotate(-45deg);
    font-size:96px;color:var(--text);opacity:.045;
  }
}
/* print: fixed so it repeats on every page */
@media print {
  #rpt-watermark.wm-on {
    position:fixed!important;top:50%!important;left:50%!important;
    transform:translate(-50%,-50%) rotate(-45deg)!important;
    font-size:96px!important;color:#000!important;opacity:.07!important;
  }
}

/* ── Screen-only: proper full-height independent scroll ──────────── */
@media screen {
  body { height:100vh!important;overflow:hidden; }
  .app-main { flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0; }
  /* Reset table wrapper to block so screen preview looks normal */
  #rpt-ph-wrap { display:block;width:100%; }
  #rpt-ph-wrap > thead, #rpt-ph-wrap > tfoot, #rpt-ph-wrap > tbody { display:block;border:none; }
  #rpt-ph-wrap > thead > tr, #rpt-ph-wrap > tfoot > tr, #rpt-ph-wrap > tbody > tr { display:block;border:none; }
  #rpt-ph-wrap > thead > tr > td, #rpt-ph-wrap > tfoot > tr > td, #rpt-ph-wrap > tbody > tr > td { display:block;border:none;padding:0 !important; }
  .exp-preview { padding:40px 48px; }
}

/* ── Page header / footer ────────────────────────────────────────── */
.rpt-ph, .rpt-pf {
  display:none;max-width:720px;margin:0 auto;
  padding:7px 12px;align-items:center;gap:10px;
  background:var(--bg3);border-radius:5px;
  font-size:11px;color:var(--text2);font-family:inherit;
}
.rpt-ph.enabled,.rpt-pf.enabled { display:flex; }
.rpt-ph { margin-bottom:20px; }
.rpt-pf { margin-top:20px; }
.rpt-ph-logo { height:26px;max-width:90px;object-fit:contain;flex-shrink:0;border-radius:3px; }
.rpt-ph-l,.rpt-ph-c,.rpt-ph-r { flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
.rpt-ph-c { text-align:center; }
.rpt-ph-r { text-align:right; }
.rpt-pf-pgnum-screen { font-family:var(--mono);font-size:10px;color:var(--text3); }
</style>
</head>

<script>
// ── Styled markdown renderer (uses .rpt CSS classes) ─────────────
function renderMdStyled(raw) {
  if (!raw) return '';
  const _e = s => typeof s==='string' ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
  function inline(text) {
    const parts = []; const re = /`([^`]+)`/g; let last = 0, m;
    function applyBoldItalic(t) {
      return _e(t).replace(/\*\*([^*<>]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*<>]+)\*/g,'<em>$1</em>');
    }
    while ((m = re.exec(text)) !== null) {
      if (m.index > last) parts.push(applyBoldItalic(text.slice(last, m.index)));
      parts.push(`<code style="font-family:var(--mono);font-size:11px;background:var(--bg3);padding:1px 5px;border-radius:3px">${_e(m[1])}</code>`);
      last = m.index + m[0].length;
    }
    if (last < text.length) parts.push(applyBoldItalic(text.slice(last)));
    return parts.join('');
  }
  function flushTable(rows, out) {
    if (!rows.length) return;
    const [head, , ...body] = rows;
    const cols = head.split('|').slice(1,-1).map(c => c.trim());
    out.push(`<table class="rpt-table" style="margin:10px 0"><thead><tr>${cols.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>`);
    body.forEach(row => {
      const cells = row.split('|').slice(1,-1).map(c => c.trim());
      out.push(`<tr>${cols.map((_,i)=>`<td>${inline(cells[i]||'')}</td>`).join('')}</tr>`);
    });
    out.push('</tbody></table>');
  }
  const lines = raw.split('\n'), out = [];
  let inCode=false, codeLines=[], tableRows=[], inList=false;
  function endList() { if (inList) { out.push('</ul>'); inList=false; } }
  function endTable() { if (tableRows.length) { flushTable(tableRows, out); tableRows=[]; } }
  for (const line of lines) {
    if (!inCode && line.startsWith('```')) { endList(); endTable(); inCode=true; codeLines=[]; continue; }
    if (inCode) {
      if (line.startsWith('```')) { inCode=false; out.push(`<pre class="rpt-code" style="margin:8px 0"><code>${_e(codeLines.join('\n'))}</code></pre>`); codeLines=[]; }
      else codeLines.push(line);
      continue;
    }
    if (/^\|.+\|/.test(line)) { endList(); tableRows.push(line); continue; }
    endTable();
    if (line.startsWith('#### ')) { endList(); out.push(`<h3 style="font-size:12px;font-weight:700;margin:18px 0 8px;color:var(--text)">${inline(line.slice(5))}</h3>`); continue; }
    if (line.startsWith('### '))  { endList(); out.push(`<h3>${inline(line.slice(4))}</h3>`); continue; }
    if (line.startsWith('## '))   { endList(); out.push(`<h2>${inline(line.slice(3))}</h2>`); continue; }
    if (line.startsWith('# '))    { endList(); out.push(`<h1 style="font-size:26px;font-weight:800;margin:0 0 8px;letter-spacing:-.02em">${inline(line.slice(2))}</h1>`); continue; }
    if (/^[-*] /.test(line)) {
      if (!inList) { out.push('<ul style="padding-left:18px;margin:6px 0">'); inList=true; }
      out.push(`<li style="color:var(--text2);font-size:13px;line-height:1.7;margin:2px 0">${inline(line.slice(2))}</li>`);
      continue;
    }
    endList();
    if (line.trim() === '') { out.push('<div style="height:8px"></div>'); continue; }
    out.push(`<p>${inline(line)}</p>`);
  }
  endList(); endTable();
  if (inCode) out.push(`<pre class="rpt-code"><code>${_e(codeLines.join('\n'))}</code></pre>`);
  return out.join('');
}

function onFreeEditInput(val) {
  _freeEditMd = val;
  _updateFePreview();
  clearTimeout(_feSaveTimer);
  _feSaveTimer = setTimeout(_persistFreeEdit, 800);
}

function _updateFePreview() {
  const el = document.getElementById('fe-preview-content');
  if (el) el.innerHTML = renderMdStyled(_freeEditMd || '');
}

function toggleFeSplit() {
  const pane  = document.getElementById('fe-preview');
  const inner = document.querySelector('.fe-modal-inner');
  const btn   = document.getElementById('fe-split-btn');
  if (!pane) return;
  const open = pane.classList.toggle('open');
  inner.classList.toggle('split', open);
  btn.textContent = open ? '▣ Editor Only' : '◫ Split View';
  if (open) _updateFePreview();
}

function _persistFreeEdit() {
  const d = getReportData();
  d.freeEditMd = _freeEditMd;
  saveReportData(d, false);
}

function closeFreeEdit() {
  // Keep _freeEditMd — report will render from it, banner shows in editor
  document.getElementById('fe-modal')?.remove();
  buildEditor();
  buildReport();
}

function discardFreeEdit() {
  _freeEditMd = null;
  clearTimeout(_feSaveTimer);
  const d = getReportData();
  delete d.freeEditMd;
  saveReportData(d, false);
  document.getElementById('fe-modal')?.remove();
  buildEditor();
  buildReport();
}

// ── Default sections ──────────────────────────────────────────────
const DEFAULT_SECTIONS = [
  { id:'exec-summary',      type:'exec-summary',      title:'Executive Summary',   visible:true  },
  { id:'findings-index',    type:'findings-index',    title:'Findings Index',      visible:true  },
  { id:'wstg',              type:'wstg',              title:'OWASP WSTG Progress', visible:true  },
  { id:'detailed-findings', type:'detailed-findings', title:'Detailed Findings',   visible:true  },
  { id:'targets',           type:'targets',           title:'Scope — Targets',     visible:true  },
  { id:'risk-table',        type:'risk-table',        title:'Risk Classification', visible:false },
];

// ── Report data (localStorage, keyed by project) ──────────────────
function getReportData() {
  const pid = state.currentProject?.id;
  if (!pid) return { meta:{}, sections: DEFAULT_SECTIONS.map(s=>({...s})) };
  try {
    const raw = JSON.parse(localStorage.getItem(`fd_rpt_${pid}`) || '{}');
    // Migrate from old flat format
    if (!raw.sections) {
      const sections = DEFAULT_SECTIONS.map(s => {
        const sec = { ...s };
        if (s.id === 'risk-table') sec.visible = !!raw.showRiskTable;
        return sec;
      });
      const meta = {
        preparedBy:     raw.preparedBy     || '',
        organization:   raw.organization   || '',
        version:        raw.version        || '',
        classification: raw.classification || 'Confidential',
        showToc:        !!raw.showToc,
        coverFields: { date:true, target:true, preparedBy:true, organization:true, scope:true, version:true, totalFindings:true, wstgCoverage:true },
      };
      const migrated = { meta, sections };
      localStorage.setItem(`fd_rpt_${pid}`, JSON.stringify(migrated));
      return migrated;
    }
    if (!raw.meta) raw.meta = {};
    if (!raw.meta.coverFields) raw.meta.coverFields = { date:true, target:true, preparedBy:true, organization:true, scope:true, version:true, totalFindings:true, wstgCoverage:true };
    // Remove deprecated section types
    const REMOVED_IDS = new Set(['intro','scope','methodology','disclaimer','contact']);
    if (raw.sections) raw.sections = raw.sections.filter(s => !REMOVED_IDS.has(s.id) && !REMOVED_IDS.has(s.type));
    return raw;
  } catch { return { meta:{}, sections: DEFAULT_SECTIONS.map(s=>({...s})) }; }
}

const REPORT_FONTS = [
  { key:'',         label:'Inter (default)',  css:"'Inter',system-ui,sans-serif" },

  { key:'times',    label:'Times New Roman',  css:"'Times New Roman',Times,serif" },

];

function applyReportFont(key) {
  const f = REPORT_FONTS.find(f => f.key === (key||'')) || REPORT_FONTS[0];

function applyBaseFontSize(size) {

function applyWatermark(meta) {
  const el = document.getElementById('rpt-watermark');
  if (!el) return;
  const wm = meta?.watermark || {};
  el.textContent = wm.text || 'DRAFT';
  el.classList.toggle('wm-on', !!wm.enabled);
}

function applyReportAccent(color) {
  let tag = document.getElementById('rpt-accent-style');
  if (!tag) {
    tag = document.createElement('style');
    tag.id = 'rpt-accent-style';
    document.head.appendChild(tag);
  }
  if (!color) { tag.textContent = ''; return; }
  // Build explicit rules — JS string concatenation avoids the CSS `var(--x)44` invalid-token bug
  const c44 = color + '44'; // ~27% opacity hex suffix
  const c33 = color + '33'; // ~20% opacity hex suffix
  const c18 = color + '18'; //  ~9% opacity hex suffix
  const c88 = color + '88'; // ~53% opacity hex suffix
  tag.textContent = `
    /* accent override — screen */
    #report-preview .rpt h2::before { background:${color}!important; }
    #report-preview .rpt-cover-bar,
    #report-preview .rpt-cover-page-bar { background:linear-gradient(90deg,${color},${c88})!important; }
    #report-preview .rpt-cover-type { color:${color}!important;border-color:${c44}!important; }
    #report-preview .rpt-cover-page-type { color:${color}!important;border-color:${c44}!important; }
    #report-preview .rpt-cover-logo-ph { color:${color}!important;background:${c18}!important;border-color:${c33}!important; }
    #report-preview .rpt-toc-item a:hover { color:${color}!important;border-bottom-color:${c44}!important; }
    #report-preview .rpt-prose a { color:${color}!important; }
    #report-preview .rpt-prose blockquote { border-left-color:${color}!important; }
    /* accent override — print (Puppeteer PDF) */
    @media print {
      :root { --accent:${color}!important; }
      .rpt h2::before { background:${color}!important; }
      .rpt-cover-bar,.rpt-cover-page-bar { background:linear-gradient(90deg,${color},${c88})!important; }
      .rpt-cover-type,.rpt-cover-page-type { color:${color}!important;border-color:${c44}!important; }
      .rpt-cover-logo-ph { color:${color}!important;background:${c18}!important;border-color:${c33}!important; }
      .rpt-prose a { color:${color}!important; }
      .rpt-prose blockquote { border-left-color:${color}!important; }
    }
  `;
}

function saveReportData(data, rebuild = true) {
  const pid = state.currentProject?.id;
  if (!pid) return;
  localStorage.setItem(`fd_rpt_${pid}`, JSON.stringify(data));
  applyReportFont(data.meta?.font);
  applyBaseFontSize(data.meta?.baseFontSize);
  applyReportAccent(data.meta?.accentColor);
  applyWatermark(data.meta);
  if (rebuild) buildReport();
}

// ── Page Layout (header / footer) ────────────────────────────────
// Zone data structure:
// { enabled, cols: { left, center, right } }
// Each col: { mode: 'text'|'image', text: '', img: '' }
// Footer cols may also have mode: 'pagenum'

function _defaultCol() { return { mode:'text', text:'', img:'' }; }
function _getZone(meta, zone) {
  if (!meta[zone]) meta[zone] = { enabled:false, cols:{ left:_defaultCol(), center:_defaultCol(), right:_defaultCol() } };
  const z = meta[zone];
  if (!z.cols) z.cols = { left:_defaultCol(), center:_defaultCol(), right:_defaultCol() };
  ['left','center','right'].forEach(k => { if (!z.cols[k]) z.cols[k] = _defaultCol(); });
  return z;
}

function setPageLayoutEnabled(zone, val) {
  const d = getReportData();
  _getZone(d.meta, zone).enabled = val;
  saveReportData(d, false);
  buildPageLayout();
  buildEditor();
}

function setPageLayoutColMode(zone, col, mode) {
  const d = getReportData();
  _getZone(d.meta, zone).cols[col].mode = mode;
  saveReportData(d, false);
  buildPageLayout();
  buildEditor();
}

function setPageLayoutColText(zone, col, val) {
  const d = getReportData();
  _getZone(d.meta, zone).cols[col].text = val;
  saveReportData(d, false);
  buildPageLayout();
}

function setPageLayoutColImg(zone, col, val) {
  const d = getReportData();
  _getZone(d.meta, zone).cols[col].img = val;
  saveReportData(d, false);
  buildPageLayout();
  buildEditor();
}

function uploadColLogo(zone, col, input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => setPageLayoutColImg(zone, col, e.target.result);
  reader.readAsDataURL(file);
}

function setPageLayoutColShadow(zone, col, val) {
  const d = getReportData();
  _getZone(d.meta, zone).cols[col].imgShadow = val;
  saveReportData(d, false);
  buildPageLayout();
}

function _renderZoneCol(col, align) {
  const cls = `rpt-ph-${align[0]}`; // l/c/r
  if (!col || col.mode === 'text') {
    return `<span class="${cls}">${esc(col?.text||'')}</span>`;
  }
  if (col.mode === 'image') {
    const shadow = col.imgShadow ? ' style="filter:drop-shadow(0 1px 4px rgba(0,0,0,.6))"' : '';
    return `<span class="${cls}">${col.img ? `<img src="${col.img}" class="rpt-ph-logo"${shadow}>` : ''}</span>`;
  }
  if (col.mode === 'pagenum') {
    const pre = col.text ? col.text + ' ' : 'Page ';
    return `<span class="${cls}"><span class="rpt-pf-pgnum-wrap" data-pre="${esc(pre)}"><span class="rpt-pf-pgnum-screen">${esc(pre)}1</span></span></span>`;
  }
  return `<span class="${cls}"></span>`;
}

function buildPageLayout() {
  const m = getReportData().meta;
  ['header','footer'].forEach(zone => {
    const el = document.getElementById(`rpt-p${zone==='header'?'h':'f'}`);
    if (!el) return;
    const z = _getZone(m, zone);
    el.classList.toggle('enabled', !!z.enabled);
    if (z.enabled) {
      el.innerHTML =
        _renderZoneCol(z.cols.left,   'left') +
        _renderZoneCol(z.cols.center, 'center') +
        _renderZoneCol(z.cols.right,  'right');
    }
  });

  // Toggle table-layout classes for repeating header/footer in print
  const wrap = document.getElementById('rpt-ph-wrap');
  if (wrap) {
    wrap.classList.toggle('ph-active', !!_getZone(m,'header').enabled);
    wrap.classList.toggle('pf-active', !!_getZone(m,'footer').enabled);
  }
}

function secToggleVisible(id) {
  const d = getReportData();
  const sec = d.sections.find(s => s.id === id);

  sec.visible = !sec.visible;
  saveReportData(d);
  const eye   = document.getElementById(`sec-eye-${id}`);

    btn.classList.toggle('sec-pb-on', !!sec.pageBreak);

  const sec = d.sections.find(s => s.id === id);

// ── Drag-and-drop ─────────────────────────────────────────────────
let _dragId = null;
let _dragHandleActive = false;

function secDragHandleDown() { _dragHandleActive = true; }

function secDragStart(e, id) {
  if (!_dragHandleActive) { e.preventDefault(); return; }
  _dragHandleActive = false;
  _dragId = id;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => document.getElementById(`sec-item-${id}`)?.classList.add('dragging'), 0);
}

function secDragEnd() {
  _dragHandleActive = false;
  _dragId = null;
  document.querySelectorAll('.sec-item').forEach(el => el.classList.remove('dragging','drag-over'));
}

function secDragOver(e, id) {
  if (!_dragId || _dragId === id) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.sec-item').forEach(el => el.classList.remove('drag-over'));
  document.getElementById(`sec-item-${id}`)?.classList.add('drag-over');
}

function secDrop(e, id) {
  e.preventDefault();
  if (!_dragId || _dragId === id) return;
  const d = getReportData();
  const fi = d.sections.findIndex(s => s.id === _dragId);
  const ti = d.sections.findIndex(s => s.id === id);
  if (fi < 0 || ti < 0) return;
  const [moved] = d.sections.splice(fi, 1);
  d.sections.splice(ti, 0, moved);
  saveReportData(d, false);
  // Update sec-list DOM directly (buildSectionList() only returns HTML, doesn't update DOM)
  const list = document.getElementById('sec-list');
  if (list) list.innerHTML = d.sections.map(sec => buildSecItem(sec)).join('');
  buildReport();
}

// ── Rich text editor helpers ──────────────────────────────────────
const _RICH_FG = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#3b82f6','#8b5cf6','#ec4899','#f9a8d4','#fde68a','#a7f3d0','#bfdbfe','#94a3b8','#475569','#1e293b','#ffffff'];
const _RICH_HI = ['#fef08a','#bbf7d0','#bfdbfe','#fecaca','#fed7aa','#e9d5ff','#f0f9ff','transparent'];

// palId = element id of the palette div
function richTogglePalette(palId) {
  const pal = document.getElementById(palId);
  if (!pal) return;
  document.querySelectorAll('.rich-color-palette').forEach(el => { if (el !== pal) el.classList.remove('open'); });
  pal.classList.toggle('open');
}

// editorId = id of the contenteditable div
function richApplyColor(editorId, color, type) {
  document.querySelectorAll('.rich-color-palette').forEach(el => el.classList.remove('open'));
  document.getElementById(editorId)?.focus();
  document.execCommand(type === 'fg' ? 'foreColor' : 'hiliteColor', false, color);
}

function richInsertLink(editorId) {
  const sel = window.getSelection();
  const range = sel.rangeCount > 0 ? sel.getRangeAt(0).cloneRange() : null;
  const selectedText = sel.toString();
  const url = prompt('URL:');
  if (!url) return;
  if (range) { sel.removeAllRanges(); sel.addRange(range); }
  document.getElementById(editorId)?.focus();
  document.execCommand('insertHTML', false,
    `<a href="${esc(url)}" style="color:#7c3aed;text-decoration:underline">${esc(selectedText || url)}</a>`);
}

// editorId = id of the contenteditable, palPfx = prefix for palette ids

  const TG_ROWS = 8, TG_COLS = 8;

        onmouseover="richTableHover('${palPfx}',${r},${c})"

        onclick="richTableInsert('${editorId}','${palPfx}',${r},${c})"></div>`;

    `<div class="rich-sw" style="background:${c};${c==='#ffffff'?'border:1px solid #ccc':''}" onmousedown="event.preventDefault()" onclick="richApplyColor('${editorId}','${c}','fg')" title="${c}"></div>`
  ).join('');
  const hiSwatches = _RICH_HI.map(c =>
    `<div class="rich-sw" style="background:${c==='transparent'?'repeating-linear-gradient(45deg,#ddd,#ddd 3px,#fff 3px,#fff 6px)':c}" onmousedown="event.preventDefault()" onclick="richApplyColor('${editorId}','${c}','hi')" title="${c==='transparent'?'None':c}"></div>`

  const btn = (action, label, title) =>

  return `<div class="rich-tb">
    ${btn(`document.execCommand('undo')`,'↩','Undo')}
    ${btn(`document.execCommand('redo')`,'↪','Redo')}
    ${sep}
    ${btn(`document.execCommand('bold')`,`<strong>B</strong>`,'Bold')}
    ${btn(`document.execCommand('italic')`,`<em>I</em>`,'Italic')}
    ${btn(`document.execCommand('underline')`,`<u>U</u>`,'Underline')}
    ${btn(`document.execCommand('strikeThrough')`,`<s>S</s>`,'Strikethrough')}
    ${btn(`document.execCommand('superscript')`,'x²','Superscript')}
    ${btn(`document.execCommand('subscript')`,'x₂','Subscript')}
    ${sep}
    <input class="rich-fs-input" type="number" min="8" max="96" placeholder="sz"
      title="Font size (8–96px) — apply to selection"
      onmousedown="event.stopPropagation()"
      onkeydown="if(event.key==='Enter'){richSetFontSize('${editorId}',this.value);this.blur()}"
      onblur="richSetFontSize('${editorId}',this.value)">
    ${sep}
    ${btn(`document.execCommand('formatBlock',false,'h2')`,'H2','Heading 2')}
    ${btn(`document.execCommand('formatBlock',false,'h3')`,'H3','Heading 3')}
    ${btn(`document.execCommand('formatBlock',false,'h4')`,'H4','Heading 4')}
    ${btn(`document.execCommand('formatBlock',false,'p')`,'P','Paragraph')}
    ${btn(`document.execCommand('formatBlock',false,'blockquote')`,'&ldquo;','Blockquote')}
    ${btn(`document.execCommand('formatBlock',false,'pre')`,'{ }','Code block')}
    ${sep}
    ${btn(`document.execCommand('insertUnorderedList')`,'•','Bullet list')}
    ${btn(`document.execCommand('insertOrderedList')`,'1.','Numbered list')}
    ${btn(`document.execCommand('indent')`,'⇥','Indent')}
    ${btn(`document.execCommand('outdent')`,'⇤','Outdent')}
    ${sep}
    <div class="rich-color-wrap">
      <button class="rich-tb-btn" title="Text color" onmousedown="event.preventDefault()" onclick="richTogglePalette('${palPfx}-fg')"><span style="border-bottom:2.5px solid #ef4444;padding-bottom:1px;font-weight:700">A</span> ▾</button>
      <div class="rich-color-palette" id="${palPfx}-fg">${fgSwatches}</div>
    </div>
    <div class="rich-color-wrap">
      <button class="rich-tb-btn" title="Highlight" onmousedown="event.preventDefault()" onclick="richTogglePalette('${palPfx}-hi')"><span style="background:#fef08a;padding:0 2px">A</span> ▾</button>
      <div class="rich-color-palette" id="${palPfx}-hi">${hiSwatches}</div>
    </div>
    ${btn(`document.execCommand('removeFormat')`,'T✕','Clear formatting')}
    ${sep}
    ${btn(`richInsertLink('${editorId}')`,'lnk','Insert link')}
    ${btn(`richInsertImage('${editorId}')`,'🖼','Insert image')}
    ${sep}
    ${btn(`document.execCommand('justifyLeft')`,'←','Left')}
    ${btn(`document.execCommand('justifyCenter')`,'↔','Center')}
    ${btn(`document.execCommand('justifyRight')`,'→','Right')}
    ${btn(`document.execCommand('justifyFull')`,'⇔','Justify')}
    ${sep}
    <div class="rich-color-wrap">
      <button class="rich-tb-btn" title="Insert table" onmousedown="event.preventDefault()" onclick="richTogglePalette('${palPfx}-tp')">⊞ ▾</button>

          <input class="rich-tiny-input" id="${palPfx}-trows" type="number" min="1" max="30" value="3" title="Rows">
          <span style="font-family:var(--mono);font-size:11px;color:var(--text3)">×</span>
          <input class="rich-tiny-input" id="${palPfx}-tcols" type="number" min="1" max="20" value="3" title="Columns">

// ── Table picker helpers ───────────────────────────────────────────
function richTableHover(palPfx, row, col) {
  for (let r = 1; r <= 8; r++)
    for (let c = 1; c <= 8; c++)
      document.getElementById(`${palPfx}-tc-${r}-${c}`)?.classList.toggle('active', r <= row && c <= col);
  const lbl = document.getElementById(`${palPfx}-tl`);
  if (lbl) lbl.textContent = `${row} × ${col} table`;
  const ri = document.getElementById(`${palPfx}-trows`);
  const ci = document.getElementById(`${palPfx}-tcols`);
  if (ri) ri.value = row;
  if (ci) ci.value = col;
}

function richTableHoverReset(palPfx) {
  for (let r = 1; r <= 8; r++)
    for (let c = 1; c <= 8; c++)
      document.getElementById(`${palPfx}-tc-${r}-${c}`)?.classList.remove('active');
  const lbl = document.getElementById(`${palPfx}-tl`);
  if (lbl) lbl.textContent = 'hover to select size';
}

function richTableInsert(editorId, palPfx, rows, cols) {
  document.querySelectorAll('.rich-color-palette').forEach(el => el.classList.remove('open'));
  _insertTable(editorId, rows, cols);
}

function richTableCustom(editorId, palPfx) {
  const rows = Math.max(1, parseInt(document.getElementById(`${palPfx}-trows`)?.value) || 3);
  const cols = Math.max(1, parseInt(document.getElementById(`${palPfx}-tcols`)?.value) || 3);
  document.querySelectorAll('.rich-color-palette').forEach(el => el.classList.remove('open'));
  _insertTable(editorId, rows, cols);
}

function _insertTable(editorId, rows, cols) {
  document.getElementById(editorId)?.focus();
  const th = n => `<th style="border:1px solid var(--border2,#555);padding:6px 10px;background:var(--bg3,#2a2a2a);font-weight:600;font-size:11px;text-align:left">Header ${n}</th>`;
  const td = ()  => `<td style="border:1px solid var(--border2,#555);padding:6px 10px;font-size:12px"> </td>`;
  const headerRow = Array.from({length:cols},(_,i)=>th(i+1)).join('');
  const bodyRows  = Array.from({length:rows},()=>`<tr>${Array.from({length:cols},td).join('')}</tr>`).join('');
  const html = `<table class="rpt-table" style="border-collapse:collapse;width:100%;margin:8px 0">
    <thead><tr>${headerRow}</tr></thead>
    <tbody>${bodyRows}</tbody>
  </table><p></p>`;
  document.execCommand('insertHTML', false, html);
}

// ── Font size ─────────────────────────────────────────────────────
function richSetFontSize(editorId, size) {
  if (!size) return;
  document.getElementById(editorId)?.focus();
  document.execCommand('fontSize', false, '7');
  document.getElementById(editorId)?.querySelectorAll('font[size="7"]').forEach(f => {
    const span = document.createElement('span');
    span.style.fontSize = size + 'px';
    while (f.firstChild) span.appendChild(f.firstChild);
    f.replaceWith(span);
  });
}

// ── Image insertion ───────────────────────────────────────────────
function richInsertImage(editorId) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = () => {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById(editorId)?.focus();
      document.execCommand('insertHTML', false,
        `<img src="${e.target.result}" style="max-width:100%;border-radius:4px;margin:4px 0;display:block" alt="${esc(file.name)}">`);
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function richInsertHR(editorId) {
  document.getElementById(editorId)?.focus();
  document.execCommand('insertHTML', false,
    '<hr style="border:none;border-top:1px solid var(--border);margin:12px 0"><p></p>');
}

// ── Context toolbar state ─────────────────────────────────────────
let _rctxCell = null, _rctxImg = null, _rctxEditorId = null;

function _positionCtxTb(tbId, anchor) {
  const tb = document.getElementById(tbId);
  if (!tb || !anchor) return;
  const r   = anchor.getBoundingClientRect();
  const tbH = 38;
  const top = r.top > tbH + 8 ? r.top - tbH - 4 : r.bottom + 4;
  tb.style.top  = Math.max(4, Math.min(top, window.innerHeight - tbH - 4)) + 'px';
  tb.style.left = Math.max(4, Math.min(r.left, window.innerWidth - 480)) + 'px';
  tb.style.display = 'flex';
}

function _hideCtxTb(tbId) {
  const tb = document.getElementById(tbId);
  if (tb) tb.style.display = 'none';
}

function _hideAllCtxTb() {
  _hideCtxTb('rich-ctx-table');
  _hideCtxTb('rich-ctx-img');
  _rctxCell = null; _rctxImg = null;
}

// Hide context toolbars when any scroll container moves (toolbars are fixed, content moves)
document.addEventListener('scroll', e => {
  if (e.target.closest?.('.rich-color-palette, .rich-ctx-tb')) return;
  _hideAllCtxTb();
}, true);

// Global click handler — show/hide context toolbars
document.addEventListener('click', e => {
  if (e.target.closest('#rich-ctx-table, #rich-ctx-img')) return; // toolbar itself

  const cell = e.target.closest('td, th');
  const img  = e.target.tagName === 'IMG' ? e.target : null;

  // Table cell inside a rich editor?
  if (cell?.closest('.rich-editor')) {
    _rctxCell     = cell;
    _rctxEditorId = cell.closest('.rich-editor').id;
    _positionCtxTb('rich-ctx-table', cell.closest('table'));
    _hideCtxTb('rich-ctx-img');
    // sync custom px input if image toolbar was open
    return;
  }

  // Image inside a rich editor?
  if (img?.closest('.rich-editor')) {
    _rctxImg      = img;
    _rctxEditorId = img.closest('.rich-editor').id;
    const pxInput = document.getElementById('rich-img-w-input');
    if (pxInput) pxInput.value = Math.round(img.getBoundingClientRect().width) || '';
    _positionCtxTb('rich-ctx-img', img);
    _hideCtxTb('rich-ctx-table');
    return;
  }

  _hideCtxTb('rich-ctx-table');
  _hideCtxTb('rich-ctx-img');
  _rctxCell = null; _rctxImg = null;
});

// ── Table operations ──────────────────────────────────────────────
function _richEditorInputEvent() {
  const ed = document.getElementById(_rctxEditorId);
  ed?.dispatchEvent(new Event('input', { bubbles: true }));
}

function richTableAddRow() {
  if (!_rctxCell) return;
  const row   = _rctxCell.closest('tr');
  const table = row?.closest('table');
  if (!row || !table) return;
  const cols = table.querySelector('tr')?.cells.length || 1;
  const tr   = document.createElement('tr');
  for (let i = 0; i < cols; i++) {
    const td = document.createElement('td');
    td.style.cssText = 'border:1px solid var(--border2,#555);padding:6px 10px;font-size:12px';
    td.innerHTML = ' ';
    tr.appendChild(td);
  }
  // If clicked from header row, insert as first body row; otherwise after current row
  if (row.closest('thead')) {
    const tbody = table.querySelector('tbody') || table.createTBody();
    tbody.insertBefore(tr, tbody.firstChild);
  } else {
    row.parentNode.insertBefore(tr, row.nextSibling);
  }
  _positionCtxTb('rich-ctx-table', table);
  _richEditorInputEvent();
}

function richTableAddCol() {
  if (!_rctxCell) return;
  const table   = _rctxCell.closest('table');
  if (!table) return;
  const colIdx  = _rctxCell.cellIndex;
  table.querySelectorAll('tr').forEach(row => {
    const isHead = !!row.closest('thead');
    const cell   = document.createElement(isHead ? 'th' : 'td');
    cell.style.cssText = isHead
      ? 'border:1px solid var(--border2,#555);padding:6px 10px;background:var(--bg3,#2a2a2a);font-weight:600;font-size:11px;text-align:left'
      : 'border:1px solid var(--border2,#555);padding:6px 10px;font-size:12px';
    cell.innerHTML = isHead ? 'Header' : ' ';
    const ref = row.cells[colIdx + 1] || null;
    row.insertBefore(cell, ref);
  });
  _positionCtxTb('rich-ctx-table', table);
  _richEditorInputEvent();
}

function richTableDelRow() {
  if (!_rctxCell) return;
  const row   = _rctxCell.closest('tr');
  const table = row?.closest('table');
  if (!row || !table) return;
  if (table.querySelectorAll('tbody tr').length <= 1) return; // keep at least 1 body row
  row.remove();
  _rctxCell = null;
  _hideCtxTb('rich-ctx-table');
  _richEditorInputEvent();
}

function richTableDelCol() {
  if (!_rctxCell) return;
  const table  = _rctxCell.closest('table');
  if (!table) return;
  const colIdx = _rctxCell.cellIndex;
  if ((table.querySelector('tr')?.cells.length || 0) <= 1) return; // keep at least 1 col
  table.querySelectorAll('tr').forEach(row => { row.cells[colIdx]?.remove(); });
  _rctxCell = null;
  _hideCtxTb('rich-ctx-table');
  _richEditorInputEvent();
}

function richTableDelete() {
  if (!_rctxCell) return;
  _rctxCell.closest('table')?.remove();
  _rctxCell = null;
  _hideCtxTb('rich-ctx-table');
  _richEditorInputEvent();
}

// ── Image operations ──────────────────────────────────────────────
function richImgWidth(pct) {
  if (!_rctxImg) return;
  _rctxImg.style.width    = pct + '%';
  _rctxImg.style.maxWidth = '100%';
  _rctxImg.removeAttribute('width');
  _positionCtxTb('rich-ctx-img', _rctxImg);
  _richEditorInputEvent();
}

function richImgWidthPx(val) {
  const px = parseInt(val);
  if (!_rctxImg || !px || px < 20) return;
  _rctxImg.style.width    = Math.min(px, 2000) + 'px';
  _rctxImg.style.maxWidth = '100%';
  _rctxImg.removeAttribute('width');
  _positionCtxTb('rich-ctx-img', _rctxImg);
  _richEditorInputEvent();
}

function richImgAlign(align) {
  if (!_rctxImg) return;
  if (align === 'left')   { _rctxImg.style.float = 'left';  _rctxImg.style.margin = '4px 12px 4px 0'; }
  if (align === 'right')  { _rctxImg.style.float = 'right'; _rctxImg.style.margin = '4px 0 4px 12px'; }
  if (align === 'center') { _rctxImg.style.float = 'none';  _rctxImg.style.margin = '8px auto'; _rctxImg.style.display = 'block'; }
  _positionCtxTb('rich-ctx-img', _rctxImg);
  _richEditorInputEvent();
}

function richImgDelete() {
  if (!_rctxImg) return;
  _rctxImg.remove();
  _rctxImg = null;
  _hideCtxTb('rich-ctx-img');
  _richEditorInputEvent();
}

// Detect if content is already HTML or plain markdown
function _secContentHtml(content) {
  if (!content) return '';
  return /<[a-zA-Z][\s\S]*?>/.test(content) ? content : renderMd(content);
}

// ── Rich editor expanded modal ────────────────────────────────────
function openRichModal(secId, defaultSplit = false) {
  if (document.getElementById('rich-modal')) return;
  const d = getReportData();
  const sec = d.sections.find(s => s.id === secId);
  if (!sec) return;
  const title = sec.title;
  const content = _secContentHtml(sec.content);

  const modal = document.createElement('div');
  modal.id = 'rich-modal';
  modal.className = 'fe-modal no-print';
  modal.innerHTML = `
    <div class="fe-modal-inner" id="rich-modal-inner">
      <div style="padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;background:var(--bg3)">
        <span style="font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text2)">${esc(title)}</span>
        <div style="margin-left:auto;display:flex;gap:6px">
          <button id="rich-modal-split-btn" class="btn-secondary" style="padding:4px 11px;font-size:11px" onclick="richModalToggleSplit('${secId}')">◫ Split</button>
          <button class="btn-accent" style="padding:4px 11px;font-size:11px" onclick="closeRichModal('${secId}')">← Close</button>
        </div>
      </div>
      <div class="fe-body">
        <div style="flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden">
          ${_richToolbar(`rich-modal-ed-${secId}`, `rpal-modal-${secId}`)}
          <div class="rich-editor" contenteditable="true" id="rich-modal-ed-${secId}"
            style="flex:1;max-height:none;border-radius:0;border-left:none;border-right:none;border-bottom:none;border-top:1px solid var(--border)"
            oninput="richModalInput('${secId}',this.innerHTML)">${content}</div>
        </div>
        <div id="rich-modal-preview-${secId}" style="flex:1;overflow-y:auto;padding:32px 40px;border-left:1px solid var(--border);background:var(--bg);display:none">
          <div class="rpt" style="max-width:640px;margin:0 auto">
            <div class="rpt-prose" id="rich-modal-pv-content-${secId}">${content}</div>
          </div>
        </div>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById(`rich-modal-ed-${secId}`)?.focus();
  if (defaultSplit) setTimeout(() => richModalToggleSplit(secId), 50);
}

function richModalInput(secId, html) {
  secUpdateContent(secId, html);
  // sync inline editor
  const inline = document.getElementById(`rich-${secId}`);
  if (inline) inline.innerHTML = html;
  // sync split preview
  const pv = document.getElementById(`rich-modal-pv-content-${secId}`);
  if (pv && document.getElementById(`rich-modal-preview-${secId}`)?.style.display !== 'none') pv.innerHTML = html;
}

function richModalToggleSplit(secId) {
  const pane  = document.getElementById(`rich-modal-preview-${secId}`);
  const inner = document.getElementById('rich-modal-inner');
  const btn   = document.getElementById('rich-modal-split-btn');
  if (!pane) return;
  const open = pane.style.display === 'none' || pane.style.display === '';
  pane.style.display = open ? 'block' : 'none';
  inner.classList.toggle('split', open);
  btn.textContent = open ? '▣ Editor only' : '◫ Split';
  if (open) {
    const html = document.getElementById(`rich-modal-ed-${secId}`)?.innerHTML || '';
    const pv = document.getElementById(`rich-modal-pv-content-${secId}`);
    if (pv) pv.innerHTML = html;
  }
}

function closeRichModal(secId) {
  // Sync modal content back to inline editor
  const modalHtml = document.getElementById(`rich-modal-ed-${secId}`)?.innerHTML;
  if (modalHtml !== undefined) {
    const inline = document.getElementById(`rich-${secId}`);
    if (inline) inline.innerHTML = modalHtml;
    secUpdateContent(secId, modalHtml);
  }
  document.getElementById('rich-modal')?.remove();
}

// Close color palettes when clicking outside

// ── Build a single section item HTML ─────────────────────────────
function buildSecItem(sec) {
  const PROSE    = new Set(['custom']);
  const isCustom = sec.type === 'custom';
  const hasEditor = PROSE.has(sec.type);

  let html = `<div class="sec-item" id="sec-item-${sec.id}"
    draggable="true"
    ondragstart="secDragStart(event,'${sec.id}')"
    ondragend="secDragEnd()"
    ondragover="secDragOver(event,'${sec.id}')"
    ondrop="secDrop(event,'${sec.id}')">
    <div class="sec-row">
      <span class="sec-drag" title="Drag to reorder" onmousedown="secDragHandleDown()">⠿</span>
      <button class="sec-eye ${sec.visible?'':'off'}" id="sec-eye-${sec.id}"
        onclick="secToggleVisible('${sec.id}')" title="${sec.visible?'Hide':'Show'}">👁</button>
      <div class="sec-title-wrap">
        <div class="sec-title ${sec.visible?'':'sec-dim'}" id="sec-title-${sec.id}">${esc(sec.title)}</div>
      </div>
      <button class="sec-btn sec-pb-btn ${sec.pageBreak?'sec-pb-on':''}" id="sec-pb-${sec.id}"
        title="${sec.pageBreak?'Remove page break':'Start on new page'}"
        onclick="secTogglePageBreak('${sec.id}')">⏎</button>
      ${hasEditor ? `<button class="sec-btn" onclick="openRichModal('${sec.id}',true)" title="Full editor">⤢</button>` : ''}
      <button class="sec-btn" id="sec-edit-btn-${sec.id}" onclick="secToggleEdit('${sec.id}')" title="Inline edit">✎</button>
      ${isCustom ? `<button class="sec-btn del" onclick="secDelete('${sec.id}')">✕</button>` : ''}
    </div>`;

  html += `<div class="sec-edit-body" id="sec-edit-${sec.id}">`;

  if (isCustom) {
    html += `<div class="exp-meta-row" style="margin-bottom:6px">
      <div class="exp-field-label">Section Title</div>
      <input class="exp-input" id="sec-title-input-${sec.id}" value="${esc(sec.title)}"
        oninput="secUpdateTitle('${sec.id}',this.value)">
    </div>`;
  }

  html += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
    <div class="exp-field-label" style="margin:0;min-width:58px">Font Size</div>
    <select class="exp-input" style="width:76px;font-size:10px" onchange="secUpdateFontSize('${sec.id}',this.value)">
      ${['','11','12','13','14','15','16'].map(s=>`<option value="${s}" ${String(sec.fontSize||'')==s?'selected':''}>${s?s+'px':'auto'}</option>`).join('')}
    </select>
  </div>`;

  if (hasEditor) {
    html += _richToolbar(sec.id);
    html += `<div class="rich-editor" contenteditable="true" id="rich-${sec.id}"
      oninput="secUpdateContent('${sec.id}',this.innerHTML)">${_secContentHtml(sec.content)}</div>`;
  }

  html += `</div></div>`;
  return html;
}

// ── Report Templates ──────────────────────────────────────────────
const TPL_KEY = 'fd_report_templates';

function getTemplates() {
  try { return JSON.parse(localStorage.getItem(TPL_KEY) || '[]'); } catch { return []; }
}
function _saveTemplates(list) { localStorage.setItem(TPL_KEY, JSON.stringify(list)); }

function saveTemplate() {
  const input = document.getElementById('tpl-name-input');
  const name = input?.value.trim();
  if (!name) { input?.focus(); return; }
  const d = getReportData();
  const tpl = { name, created: new Date().toISOString().slice(0,10), meta: d.meta, sections: d.sections };
  const list = getTemplates();
  list.unshift(tpl);
  _saveTemplates(list);
  if (input) input.value = '';
  buildEditor();
}

function loadTemplate(idx) {
  const tpl = getTemplates()[idx];
  if (!tpl) return;
  if (!confirm(`Load template "${tpl.name}"? This will overwrite the current report configuration.`)) return;
  const d = getReportData();
  d.meta = { ...tpl.meta };
  d.sections = tpl.sections.map(s => ({ ...s }));
  saveReportData(d);
  buildEditor();
}

function deleteTemplate(idx) {
  const list = getTemplates();
  if (!list[idx]) return;
  if (!confirm(`Delete template "${list[idx].name}"?`)) return;
  list.splice(idx, 1);
  _saveTemplates(list);
  buildEditor();
}

function exportTemplate(idx) {
  const tpl = getTemplates()[idx];
  if (!tpl) return;
  const blob = new Blob([JSON.stringify(tpl, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${tpl.name.replace(/\s+/g,'-').toLowerCase()}-template.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importTemplateFile(input) {
  const file = input.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const tpl = JSON.parse(e.target.result);
      if (!tpl.meta || !tpl.sections) { alert('Invalid template file.'); return; }
      if (!tpl.name) tpl.name = file.name.replace(/\.json$/i,'');
      if (!tpl.created) tpl.created = new Date().toISOString().slice(0,10);
      const list = getTemplates();
      list.unshift(tpl);
      _saveTemplates(list);
      buildEditor();
    } catch { alert('Could not parse template file.'); }
  };
  reader.readAsText(file);
  input.value = '';
}

function _renderTemplatesSection(_sh) {
  const list = getTemplates();
  let inner = `
    <div style="display:flex;gap:5px;margin-bottom:8px">
      <input id="tpl-name-input" class="exp-input" placeholder="Template name…" style="flex:1"
        onkeydown="if(event.key==='Enter')saveTemplate()">
      <button class="sec-btn" onclick="saveTemplate()" style="flex-shrink:0;white-space:nowrap">Save current</button>
    </div>
    <label class="sec-btn" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-bottom:${list.length?'8':'0'}px">
      ↑ Import .json<input type="file" accept=".json,application/json" style="display:none" onchange="importTemplateFile(this)">
    </label>`;

  if (list.length) {
    inner += `<div style="display:flex;flex-direction:column;gap:4px">`;
    list.forEach((tpl, i) => {
      inner += `<div style="display:flex;align-items:center;gap:4px;padding:5px 7px;background:var(--bg);border:1px solid var(--border);border-radius:5px">
        <div style="flex:1;min-width:0">
          <div style="font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(tpl.name)}</div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--text3)">${tpl.created||''} · ${tpl.sections?.length||0} sections</div>
        </div>
        <button class="sec-btn" onclick="loadTemplate(${i})" title="Load">↓ Load</button>
        <button class="sec-btn" onclick="exportTemplate(${i})" title="Export JSON">↓ .json</button>
        <button class="sec-btn del" onclick="deleteTemplate(${i})" title="Delete">✕</button>
      </div>`;
    });
    inner += `</div>`;
  } else {
    inner += `<div style="font-family:var(--mono);font-size:10px;color:var(--text3);padding:4px 0">No saved templates.</div>`;
  }
  return inner;
}
