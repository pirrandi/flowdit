<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flowdit — Client Portal</title>
<link rel="stylesheet" href="css/main.css">
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js"></script>
<style>
  /* Portal — no sidenav: override the 2-column body grid */
  body {
    grid-template-columns: 1fr !important;
  }
  .topbar  { grid-column: 1 !important; }
  .workarea { grid-column: 1 !important; }
</style>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div><div class="spinner-text">// loading...</div></div>

<!-- Topbar — same class as team app, no sidenav column -->
<header class="topbar" id="client-topbar"></header>

<!-- Workarea — same class as team app; .no-activity toggled by JS -->
<div class="workarea no-activity" id="client-workarea">
  <main class="main">
    <div id="client-main"></div>
  </main>

  <!-- Activity sidebar — shown only when show_activity is enabled -->
  <aside class="activity-col" id="client-activity-col">
    <div class="activity-header">
      <span class="activity-title">Activity</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="live-badge" id="client-live" title="Connecting..."></div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--t3)">live</span>
      </div>
    </div>
    <div class="activity-list" id="client-activity-list">
      <div class="activity-empty">No activity yet</div>
    </div>
  </aside>
</div>

<!-- New Query Modal -->
<div class="modal-overlay" id="client-ticket-modal">
  <div class="modal" style="max-width:500px">
    <div class="modal-title">New Query</div>
    <div class="form-group">
      <label class="form-label">Title *</label>
      <input type="text" class="form-input" id="ct-title" placeholder="Brief description of your question">
    </div>
    <div class="form-group">
      <label class="form-label">Related Finding <span style="color:var(--t3);font-weight:400">(optional)</span></label>
      <select class="form-input" id="ct-vuln" style="cursor:pointer"></select>
    </div>
    <div class="form-group">
      <label class="form-label">Description <span style="color:var(--t3);font-weight:400">(optional)</span></label>
      <textarea class="form-input note-textarea" id="ct-desc" placeholder="Provide any additional context..."></textarea>
    </div>
    <div class="form-error" id="ct-error"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeTicketModal()">Cancel</button>
      <button class="btn btn-prim" id="ct-save-btn" onclick="submitTicket()">Submit Query</button>
    </div>
  </div>
</div>

<!-- Ticket Detail Modal -->
<div class="modal-overlay" id="client-ticket-detail">
  <div class="modal" style="max-width:580px;max-height:80vh;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div class="modal-title" style="margin:0">Query Detail</div>
      <button class="btn btn-ghost" style="font-size:11px;padding:5px 10px" onclick="closeTicketDetail()"><svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fd-icon"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg> Close</button>
    </div>
    <div id="ctd-content" style="overflow-y:auto;flex:1"></div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js"></script>
<script src="js/services/state.js"></script>
<script src="js/services/api.js"></script>
<script src="js/services/ws.js"></script>
<script src="js/services/icons.js"></script>
<script src="js/services/utils.js"></script>
<script src="js/components/csel.js"></script>
<script src="js/views/client.js"></script>
<script>initCsel('ct-vuln');</script>
</body>
</html>
