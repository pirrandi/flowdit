<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Targets</title>
<link rel="stylesheet" href="css/main.css?v=7">
<link rel="stylesheet" href="css/transitions.css?v=3">
<link rel="expect" href="#fd-document-end" blocking="render">
  <link rel="icon" type="image/x-icon" href="img/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<script src="js/config.js?v=3"></script>
</head>
<body>

<div id="loading-overlay" class="ovl-shell"><div class="skel-wrap"><div class="skel-stats"><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div><div class="skel-block"></div></div><div class="skel-block skel-tall"></div><div class="skel-block skel-tall"></div></div></div>
<nav class="sidenav" id="sidenav"></nav>
<header class="topbar" id="topbar"></header>

<div class="workarea">
  <main class="main">
    <div class="page-header">
      <div>
        <div class="page-title">Targets & Scope</div>
        <div class="page-subtitle">// hosts, IPs, CIDRs and URLs in scope</div>
      </div>
      <button class="btn btn-prim" onclick="openAddTargetModal()">+ Add Target</button>
    </div>

    <div id="scope-summary" class="ss-grid"></div>
    <div id="targets-content"></div>
  </main>

  <aside class="activity-col">
    <div class="activity-header">
      <span class="activity-title">Activity</span>
      <div style="display:flex;align-items:center;gap:6px">
        <div class="live-badge"></div>
        <span style="font-family:var(--mono);font-size:10px;color:var(--t3)">live</span>
      </div>
    </div>
    <div class="activity-list" id="activity-list"><div class="activity-empty">No activity yet</div></div>
  </aside>
</div>

<!-- Drawer de target: detalle (vd-pane-view, lo arma targets.js) y
     alta/edición (vd-pane-edit). El formulario conserva los ids del viejo
     #target-modal. -->
<div class="drw-backdrop" id="td-backdrop" onclick="closeTargetDetail()"></div>
<div class="drw vd-drw td-drw" id="td-drw" role="dialog" aria-modal="true" aria-labelledby="td-title" tabindex="-1">
  <div class="vd-pane vd-pane-view">
    <div class="drw-head" id="td-head"></div>
    <div class="drw-body" id="td-body"></div>
    <div class="ccp-drw-foot" id="td-foot"></div>
  </div>

  <div class="vd-pane vd-pane-edit" id="td-edit">
    <div class="drw-head">
      <button type="button" class="drw-close" onclick="closeTargetDetail()" title="Cerrar (Esc)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fd-icon"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      <div class="drw-id"><span class="vd-kind" id="td-edit-kind">Nuevo target</span></div>
      <div class="drw-title" id="target-modal-title">Nuevo target</div>
    </div>

    <div class="drw-body" id="td-edit-body">
      <div class="drw-sec">
        <label class="drw-sec-label" for="modal-target-host">Host *</label>
        <div class="vd-field">
          <input type="text" class="form-input" id="modal-target-host"
            placeholder="Ej: example.com / 192.168.1.10 / 10.0.0.0/24 / https://app.example.com"
            autocomplete="off" onkeydown="if(event.key==='Enter'&&!event.ctrlKey&&!event.metaKey){event.preventDefault();saveTarget()}">
        </div>
      </div>

      <div class="drw-sec">
        <div class="drw-sec-label">Clasificación</div>
        <div class="vd-grid vd-grid-3">
          <div class="vd-field">
            <label class="form-label" for="modal-target-type">Tipo</label>
            <select class="form-input" id="modal-target-type">
              <option value="domain">Domain</option>
              <option value="ip">IP</option>
              <option value="cidr">CIDR</option>
              <option value="url">URL</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="vd-field">
            <label class="form-label" for="modal-target-scope">Scope</label>
            <select class="form-input" id="modal-target-scope">
              <option value="in" data-color="var(--a)">In Scope</option>
              <option value="out" data-color="var(--t3)">Out of Scope</option>
            </select>
          </div>
          <div class="vd-field">
            <label class="form-label" for="modal-target-status">Estado</label>
            <select class="form-input" id="modal-target-status">
              <option value="active" data-color="var(--a)">Active</option>
              <option value="completed" data-color="var(--c-low)">Completed</option>
              <option value="out-of-scope" data-color="var(--t3)">Out of Scope</option>
            </select>
          </div>
        </div>
      </div>

      <div class="drw-sec">
        <div class="drw-sec-label">Notas <span class="ccp-sec-hint">· opcional</span></div>
        <textarea class="form-input note-textarea vd-textarea" id="modal-target-notes"
          placeholder="Tecnologías, puertos abiertos, información relevante..."></textarea>
      </div>
    </div>

    <div class="ccp-drw-foot vd-edit-foot">
      <div class="form-error vd-edit-error" id="target-error"></div>
      <span class="vd-hint">Ctrl+Enter guarda</span>
      <div class="ccp-foot-actions">
        <button type="button" class="btn-secondary" onclick="closeTargetModal()">Cancelar</button>
        <button type="button" class="btn-save" id="target-save-btn" onclick="saveTarget()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<script src="js/data.js?v=3"></script>
<script src="js/services/state.js?v=3"></script>
<script src="js/services/api.js?v=3"></script>
<script src="js/services/ws.js?v=3"></script>
<script src="js/services/icons.js?v=3"></script>
<script src="js/services/utils.js?v=3"></script>
<script src="js/components/csel.js?v=3"></script>
<script src="js/components/activity.js?v=3"></script>
<script src="js/views/targets.js?v=4"></script>
<script src="js/components/notifications.js?v=3"></script>
<script src="js/page.js?v=3"></script>

<script>
function renderScopeSummary() {
  const t     = state.targets;
  const inSc  = t.filter(x => x.scope==='in').length;
  const outSc = t.filter(x => x.scope==='out').length;
  const vulns = state.customVulns.length;
  const withFindings = new Set(state.customVulns.filter(v=>v.target_id).map(v=>v.target_id)).size;

  const total = t.length;
  const pct   = (n, d) => d ? Math.round(n / d * 100) : 0;

  // Barra apilada por severidad: de un vistazo se ve si lo encontrado es
  // grave o ruido, sin tener que ir a Findings.
  const sevs = ['critical','high','medium','low','info'];
  const SEV_VAR = { critical:'--c-crit', high:'--c-high', medium:'--c-med', low:'--c-low', info:'--c-info' };
  const bySev = Object.fromEntries(sevs.map(s => [s, state.customVulns.filter(v => v.severity === s).length]));
  const sevBar = vulns
    ? sevs.filter(s => bySev[s]).map(s => `<span style="flex:${bySev[s]};background:var(${SEV_VAR[s]})" title="${s}: ${bySev[s]}"></span>`).join('')
    : '<span style="flex:1;background:var(--b1)"></span>';
  const sevLegend = vulns
    ? sevs.filter(s => bySev[s]).map(s => `<span class="ss-sev"><i style="background:var(${SEV_VAR[s]})"></i>${bySev[s]}</span>`).join('')
    : 'none yet';

  const card = (tone, ic, count, label, foot) => `
    <div class="ss-card" style="--ss-c:var(${tone})">
      <div class="ss-top">
        <span class="ss-icon">${icon(ic, { size: 14 })}</span>
        <span class="ss-label">${label}</span>
      </div>
      <div class="ss-count">${count}</div>
      <div class="ss-foot">${foot}</div>
    </div>`;

  document.getElementById('scope-summary').innerHTML =
    card('--c-low', 'circle-check', inSc, 'In Scope',
      `<div class="ss-bar"><span style="flex:${inSc || 0};background:var(--ss-c)"></span><span style="flex:${total - inSc};background:var(--b1)"></span></div>
       <div class="ss-sub">${pct(inSc, total)}% of ${total} target${total === 1 ? '' : 's'}</div>`) +
    card('--t3', 'circle-x', outSc, 'Out of Scope',
      `<div class="ss-bar"><span style="flex:${outSc || 0};background:var(--ss-c)"></span><span style="flex:${total - outSc};background:var(--b1)"></span></div>
       <div class="ss-sub">excluded from testing</div>`) +
    card('--c-high', 'triangle-alert', vulns, 'Total Findings',
      `<div class="ss-bar">${sevBar}</div><div class="ss-sub ss-legend">${sevLegend}</div>`) +
    card('--a', 'zap', withFindings, 'Targets w/ Findings',
      `<div class="ss-bar"><span style="flex:${withFindings || 0};background:var(--ss-c)"></span><span style="flex:${Math.max(total - withFindings, 0)};background:var(--b1)"></span></div>
       <div class="ss-sub">${pct(withFindings, total)}% of targets affected</div>`);
}

function pageInit() {
  renderTargets();
  renderScopeSummary();
  // ?target=<id> abre directamente el detalle de ese target.
  const tid = new URLSearchParams(window.location.search).get('target');
  if (tid && state.targets.some(t => t.id === tid)) openTargetDetail(tid);
  prefetchTargetCounts(); // no await — conteos de puertos/endpoints en las filas
}

bootPage('targets');
</script>
<!-- End-of-document marker for <link rel="expect" blocking="render"> (see css/transitions.css). -->
<div id="fd-document-end" hidden></div>
</body>
</html>
