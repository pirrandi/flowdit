server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # nginx does NOT merge add_header across levels: a block that declares any
    # add_header of its own drops every one inherited from its parent. The
    # static-asset location below sets Cache-Control, so it has to restate
    # these or JS/CSS would be served with no nosniff at all.
    #
    # 'unsafe-inline' is required for now: the pages carry ~20 inline <script>
    # blocks and over a thousand inline style attributes. The CSP still blocks
    # external script/frame/object sources and pins base-uri and form-action,
    # which is what stops an injected tag from reaching an attacker's host.
    # Removing 'unsafe-inline' means moving that inline code into files first.
    #
    # connect-src allows localhost:4000 because this compose setup serves the
    # frontend on :80 while the API listens separately on :4000 (see
    # frontend/js/config.js). A production deploy proxies /api and /ws through
    # nginx on one origin — see DEPLOY.md, where 'self' alone is enough.
    set $flowdit_csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' http://localhost:4000 ws://localhost:4000; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    add_header X-Frame-Options          "SAMEORIGIN"  always;
    add_header X-Content-Type-Options   "nosniff"     always;
    add_header X-XSS-Protection         "1; mode=block" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy  $flowdit_csp  always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;

    # JS/CSS are served under stable, unhashed names, so they MUST revalidate.
    # "immutable" told browsers never to re-check, which made deploys invisible
    # to anyone who had already loaded the site. ETag/Last-Modified make the
    # revalidation a cheap 304.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";

        # Restated because this block's own add_header discards the inherited set.
        add_header X-Frame-Options          "SAMEORIGIN"  always;
        add_header X-Content-Type-Options   "nosniff"     always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy  $flowdit_csp  always;
    }

    # Images and fonts change rarely; a stale logo is harmless.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";

        add_header X-Frame-Options          "SAMEORIGIN"  always;
        add_header X-Content-Type-Options   "nosniff"     always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy  $flowdit_csp  always;
    }

    # SPA fallback — $uri.html sirve dashboard.html en /dashboard (URLs
    # limpias, sin extensión) sin romper bookmarks viejos con .html
    # explícito, que siguen matcheando por $uri primero.
    location / {
        try_files $uri $uri.html $uri/ /index.html;

        # HTML must revalidate too: without Cache-Control the browser applies
        # heuristic freshness and can reuse a days-old page that references
        # old script URLs and markup.
        add_header Cache-Control "no-cache";

        add_header X-Frame-Options          "SAMEORIGIN"  always;
        add_header X-Content-Type-Options   "nosniff"     always;
        add_header X-XSS-Protection         "1; mode=block" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy  $flowdit_csp  always;
    }
}
