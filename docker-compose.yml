services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pirra
      POSTGRES_PASSWORD: REDACTED
      POSTGRES_DB: flowdit_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pirra -d flowdit_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: flowdit-backend
    profiles: ["full"]
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: flowdit_dev
      DB_USER: pirra
      DB_PASSWORD: REDACTED
      JWT_SECRET: dev_jwt_secret_change_in_production_00000000000000000000000000000000
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGIN: http://localhost
      RATE_LIMIT_MAX: 500
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: flowduit-proxy
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - db

volumes:
  pgdata:
