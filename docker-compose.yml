version: '3.9'

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-hacklist}
      POSTGRES_USER:     ${DB_USER:-hacklist_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hacklist_user} -d ${DB_NAME:-hacklist}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hacklist_net
    deploy:
      resources:
        limits:
          memory: 256M

  # ── API Backend ────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV:         production
      PORT:             4000
      DB_HOST:          db
      DB_PORT:          5432
      DB_NAME:          ${DB_NAME:-hacklist}
      DB_USER:          ${DB_USER:-hacklist_user}
      DB_PASSWORD:      ${DB_PASSWORD}
      JWT_SECRET:       ${JWT_SECRET}
      JWT_EXPIRES_IN:   ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN:      ${CORS_ORIGIN}
      RATE_LIMIT_MAX:   ${RATE_LIMIT_MAX:-200}
    networks:
      - hacklist_net
    deploy:
      resources:
        limits:
          memory: 300M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hacklist-api.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.hacklist-api.entrypoints=websecure"
      - "traefik.http.routers.hacklist-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.hacklist-api.loadbalancer.server.port=4000"

  # ── Frontend (Nginx serving static files) ─────────────────────────
  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hacklist_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hacklist-frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.hacklist-frontend.entrypoints=websecure"
      - "traefik.http.routers.hacklist-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.hacklist-frontend.loadbalancer.server.port=80"

  # ── Traefik (reverse proxy + SSL) ─────────────────────────────────
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - hacklist_net
    deploy:
      resources:
        limits:
          memory: 100M

volumes:
  pg_data:
  letsencrypt:

networks:
  hacklist_net:
    driver: bridge
