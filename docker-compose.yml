services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-flowdit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-flowdit_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: flowdit-backend
    profiles: ["full"]
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-flowdit_dev}
      DB_USER: ${DB_USER:-flowdit}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_00000000000000000000000000000000}
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_EXPIRES_IN: 30d
      # Must include INTERNAL_APP_URL's origin below — Puppeteer's headless
      # render (routes/export.js) calls the API from that origin, and a
      # missing entry here makes every PDF/DOCX export silently time out.
      CORS_ORIGIN: http://localhost,http://nginx
      INTERNAL_APP_URL: http://nginx
      RATE_LIMIT_MAX: 500
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_MODEL: ${KIMI_MODEL:-kimi-k3}
      # "custom" provider: local models (Ollama, LM Studio, vLLM...).
      # CUSTOM_API_URL must be an OpenAI-compatible chat-completions endpoint,
      # e.g. http://host.docker.internal:11434/v1/chat/completions for Ollama on
      # the host (Linux may need `extra_hosts`). CUSTOM_API_KEY is optional;
      # most of these servers don't require one.
      CUSTOM_API_URL: ${CUSTOM_API_URL:-}
      CUSTOM_API_KEY: ${CUSTOM_API_KEY:-}
      CUSTOM_MODEL: ${CUSTOM_MODEL:-}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: flowduit-proxy
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - db

volumes:
  pgdata:
